<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Brick Mother R3.12 · 墙体应用</title><style>html,body{margin:0;width:100%;height:100%;background:#0d120e;color:#e9e5d8;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}#boot{height:100%;display:grid;place-content:center;text-align:center;gap:10px;padding:24px}small{color:#9ca69b;line-height:1.55}</style></head><body><div id="boot"><b>正在打开 Brick Mother R3.12 墙体应用…</b><small>固定 R3.8 砌法 · 四类块材 · 八类岩性 · 内部自适应性能</small></div><script>
(async()=>{try{const root='wall/r3-12/';const files=['R3_12_PAYLOAD_01.txt','R3_12_PAYLOAD_02.txt','R3_12_PAYLOAD_03.txt','R3_12_PAYLOAD_04.txt','R3_12_PAYLOAD_05.txt'];const parts=[];for(const file of files){const response=await fetch(root+file,{cache:'force-cache'});if(!response.ok)throw new Error(`${file} · HTTP ${response.status}`);parts.push((await response.text()).replace(/\s+/g,''));}const b64=parts.join('');if(b64.length!==32484)throw new Error(`R3.12 墙体载荷长度异常：${b64.length}`);const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(!('DecompressionStream' in self))throw new Error('当前浏览器不支持内置 gzip 解压，请使用最新版 Chrome、Edge 或 Safari。');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();if(!html.startsWith('<!doctype html>')||!html.includes('__BRICK_WALL_R3_12__'))throw new Error('R3.12 墙体载荷校验失败');document.open();document.write(html);document.close();}catch(error){document.getElementById('boot').innerHTML='<b>R3.12 墙体打开失败</b><small>'+String(error.message||error)+'</small>';console.error(error);}})();
</script></body></html>
