<canvas id="stage" aria-label="可旋转的程序化瓦片三维工作台" tabindex="0"></canvas>

<aside class="panel" id="panel" hidden><h3>灰瓦色彩</h3><div class="presets"><button data-preset="neutral">灰青</button><button data-preset="dark">深灰</button><button data-preset="weathered">旧灰</button></div><p class="tiny">所有色彩滑条直接作用于当前画面。</p><div class="row"><label for="brightness">瓦色明度</label><output id="brightnessVal">100%</output></div><input id="brightness" type="range" min="0.5" max="1.5" step="0.02" value="1"><div class="row"><label for="temperature">冷灰 / 暖灰</label><output id="temperatureVal">12%</output></div><input id="temperature" type="range" min="-1" max="1" step="0.05" value="0.12"><div class="row"><label for="variation">整片窑色差</label><output id="variationVal">70%</output></div><input id="variation" type="range" min="0" max="1.5" step="0.05" value="0.7"><div class="row"><label for="relief">表面起伏</label><output id="reliefVal">110%</output></div><input id="relief" type="range" min="0" max="1.8" step=".05" value="1.1"><div class="row"><label for="warmth">局部土赭</label><output id="warmthVal">45%</output></div><input id="warmth" type="range" min="0" max="1.5" step=".05" value=".45"><div class="row"><label for="patina">灰化覆盖</label><output id="patinaVal">52%</output></div><input id="patina" type="range" min="0" max="1" step=".05" value=".52"><div class="row"><label for="wet">湿润外观</label><output id="wetVal">0%</output></div><input id="wet" type="range" min="0" max="1" step=".05" value="0"><div class="row"><label for="moss">苔生覆盖</label><output id="mossVal">80%</output></div><input id="moss" type="range" min="0" max="1.5" step=".1" value=".8"><div class="row"><label for="mossHeight">苔层厚度</label><output id="mossHeightVal">100%</output></div><input id="mossHeight" type="range" min="0.3" max="2" step="0.1" value="1"><div class="row"><label for="twist">木纹局部转向</label><output id="twistVal">100%</output></div><input id="twist" type="range" min="0" max="2" step="0.1" value="1"><div class="row"><label for="core">黄土胎色</label><output id="coreVal">50%</output></div><input id="core" type="range" min="0" max="1" step="0.05" value="0.5"><button id="resetColor">恢复本版色彩</button><div class="row"><label for="fracture">断口展开</label><output id="fractureVal">0%</output></div><input id="fracture" type="range" min="0" max="2" step=".2" value="0"><details><summary>种子与核验</summary><div class="row"><label for="seed">材料种子</label><input type="number" id="seed" value="314159" min="1" max="10000000"></div><button id="newSeed">另一块瓦</button> <button id="save">保存参数</button><div class="tiny" id="metrics"></div><p class="tiny">屋面年份是持续失养情景。状态保留上下支承关联；移除构件尚未包含坠落碰撞。断口展开供形体观察。</p><label class="file" for="file">本机参考图 · 不上传</label><input type="file" id="file" accept="image/*"><button id="hideRef" hidden>收起参考图</button></details></aside><img id="reference" class="localref" alt="用户选择的本机参考" hidden>
