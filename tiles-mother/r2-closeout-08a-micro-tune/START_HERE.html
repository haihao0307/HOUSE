<style>

<div id="status">载入 R2-07 冻结候选，并应用 R2-08A 收尾微调层…</div>
<script>
'use strict';
const SOURCE='/haihao0307/HOUSE/dcf4053f69efc031174b7c41bd41e2309dfb13ec/tiles-mother/r2-closeout-07-detail/START_HERE.html';
const oldFinish=`vec4 r2Finish(vec3 p,float seed,float footprint){
 float visible=band(footprint,460.);
 if(visible<=0.)return vec4(0.);
 float identity=tileIdentity(seed+131.);
 vec3 offset=vec3(identity*17.3,seed*.037,identity*9.7);
 float region=n3(p*33.7+offset+vec3(2.1,7.8,4.2));
 float turn=(identity-.5)*1.7+ceramicTurn(p,seed)*2.1+(region-.5)*.42;
 vec2 directed=rot2(turn)*p.xz;
 vec3 q=vec3(directed.x,p.y,directed.y);
 q.x+=(n3(p*61.3+offset+vec3(7.3,1.1,5.2))-.5)*.0026;
 float pressure=n3(q*vec3(41.,67.,32.)+offset);
 float strokeField=n3(q*vec3(571.,217.,47.)+offset+vec3(3.1,9.4,2.7));
 float strokeGate=smoothstep(.53,.78,pressure);
 float groove=smoothstep(.60,.82,strokeField)*strokeGate*band(footprint,640.);
 float shoulder=(smoothstep(.41,.59,strokeField)-smoothstep(.59,.76,strokeField))*strokeGate*band(footprint,640.);
 float patch=n3(p*89.3+offset+vec3(5.7,1.3,8.1));
 float grain=n3(q*733.7+offset+vec3(9.7,3.2,6.3));
 float pore=smoothstep(.70,.88,grain)*smoothstep(.43,.74,patch)*(1.-.65*strokeGate)*band(footprint,820.);
 float pressed=(n3(q*vec3(167.,109.,113.)+offset+vec3(8.1,6.7,1.3))-.5)*strokeGate;
 float relief=(pressed*.00038-groove*.00062+shoulder*.00014-pore*.00048)*visible;
 float roughField=n3(p*211.3+offset+vec3(19.1,4.3,13.7))-.5;
 float roughDelta=(roughField*.042-groove*.055+pore*.070)*visible;
 return vec4(relief,groove*visible,pore*visible,roughDelta);
}`;
const newFinish=`vec4 r2Finish(vec3 p,float seed,float footprint){
 float visible=band(footprint,430.);
 if(visible<=0.)return vec4(0.);
 float identity=tileIdentity(seed+131.);
 vec3 offset=vec3(identity*17.3,seed*.037,identity*9.7);
 float regionA=n3(p*vec3(18.7,12.9,21.3)+offset+vec3(2.1,7.8,4.2));
 float regionB=n3(p*vec3(39.1,27.7,34.9)+offset+vec3(11.2,2.6,8.7));
 float activity=smoothstep(.30,.72,regionA*.68+regionB*.32);
 vec2 warp=vec2(
  n3(p*49.7+offset+vec3(7.3,1.1,5.2))-.5,
  n3(p*57.1+offset+vec3(1.7,8.4,3.6))-.5
 )*mix(.0013,.0040,regionB);
 float turn=(identity-.5)*1.35+ceramicTurn(p+vec3(warp.x,0.,warp.y),seed)*1.65+(regionA-.5)*.72;
 vec2 directed=rot2(turn)*(p.xz+warp);
 vec3 q=vec3(directed.x,p.y,directed.y);
 float pressure=n3(q*vec3(29.,47.,23.)+offset+vec3(4.1,6.3,2.7));
 float segment=n3(q*vec3(12.5,31.,15.7)+offset+vec3(8.2,1.9,5.4));
 float localGate=smoothstep(.44,.71,pressure)*smoothstep(.37,.69,segment)*activity;
 float strokeA=n3(q*vec3(437.,173.,41.)+offset+vec3(3.1,9.4,2.7));
 float strokeB=n3(q*vec3(263.,331.,57.)+offset+vec3(12.7,4.3,9.1));
 float strokeField=max(strokeA*.82+strokeB*.18,strokeB*.72+strokeA*.28);
 float groove=smoothstep(.63,.84,strokeField)*localGate*band(footprint,610.);
 float shoulder=(smoothstep(.43,.60,strokeField)-smoothstep(.60,.76,strokeField))*localGate*band(footprint,610.);
 float pressed=(n3(q*vec3(143.,103.,127.)+offset+vec3(8.1,6.7,1.3))-.5)*localGate;
 float quiet=1.-smoothstep(.42,.72,pressure*.58+segment*.42);
 float cluster=n3(p*vec3(71.3,43.7,79.1)+offset+vec3(5.7,1.3,8.1));
 float poreFine=n3(q*719.7+offset+vec3(9.7,3.2,6.3));
 float poreCoarse=n3(q*383.3+offset+vec3(4.4,11.1,2.2));
 float poreSeed=max(smoothstep(.74,.90,poreFine),smoothstep(.80,.93,poreCoarse)*.75);
 float poreGate=smoothstep(.49,.77,cluster)*(1.-.78*localGate);
 float pore=poreSeed*poreGate*band(footprint,790.);
 float mineral=n3(p*vec3(113.,79.,127.)+offset+vec3(13.2,2.4,5.9));
 float pock=smoothstep(.79,.91,mineral)*smoothstep(.34,.72,regionB)*(1.-.45*activity)*band(footprint,690.);
 float amplitude=mix(.76,1.28,regionA);
 float relief=(pressed*.00031-groove*.00050+shoulder*.00012-pore*.00042-pock*.00015)*visible*amplitude;
 float roughField=n3(p*199.3+offset+vec3(19.1,4.3,13.7))-.5;
 float roughDelta=(roughField*.036-groove*.046+pore*.068+pock*.032+quiet*.010)*visible;
 float cavity=clamp(pore+pock*.58,0.,1.);
 return vec4(relief,groove*visible,cavity*visible,roughDelta);
}`;
function all(s,a,b){return s.split(a).join(b)}
async function boot(){
 const r=await fetch(SOURCE,{cache:'no-store'});
 if(!r.ok)throw new Error(`07 source HTTP ${r.status}`);
 let html=await r.text();
 if(!html.includes(oldFinish))throw new Error('07 shader signature mismatch; refusing to patch an unknown source.');
 html=html.replace(oldFinish,newFinish);
 html=html.replace("const settings={scene:'pan',seed:314159,year:0,care:false,relief:.82,warmth:.36,patina:.38,wet:0,moss:.22,mossHeight:.82,brightness:.96,variation:.62,core:.48,twist:1.15,r2:.38,finish:1,fracture:0,diagnostic:0};","const settings={scene:'pan',seed:314159,year:0,care:false,relief:.76,warmth:.36,patina:.38,wet:0,moss:.22,mossHeight:.82,brightness:.96,variation:.58,core:.48,twist:.92,r2:.24,finish:.72,fracture:0,diagnostic:0};");
 html=all(html,'<output id="variationVal">62%</output>','<output id="variationVal">58%</output>');
 html=all(html,'id="variation" type="range" min="0" max="1.5" step="0.05" value="0.62"','id="variation" type="range" min="0" max="1.5" step="0.05" value="0.58"');
 html=all(html,'<output id="reliefVal">82%</output>','<output id="reliefVal">76%</output>');
 html=all(html,'id="relief" type="range" min="0" max="1.8" step=".05" value="0.82"','id="relief" type="range" min="0" max="1.8" step=".05" value="0.76"');
 html=all(html,'<output id="twistVal">115%</output>','<output id="twistVal">92%</output>');
 html=all(html,'id="twist" type="range" min="0" max="2" step="0.1" value="1.15"','id="twist" type="range" min="0" max="2" step="0.1" value="0.92"');
 html=all(html,'<output id="r2Val">38%</output>','<output id="r2Val">24%</output>');
 html=all(html,'id="r2" type="range" min="0" max="1" step="0.05" value="0.38"','id="r2" type="range" min="0" max="1" step="0.05" value="0.24"');
 html=all(html,'data-r2="0.38">R2 A=38%','data-r2="0.24">R2 A=24%');
 html=all(html,"{brightness:.96,variation:.62,patina:.38,warmth:.36,relief:.82,core:.48,twist:1.15,r2:.38,wet:0,moss:.22,mossHeight:.82}","{brightness:.96,variation:.58,patina:.38,warmth:.36,relief:.76,core:.48,twist:.92,r2:.24,wet:0,moss:.22,mossHeight:.82}");
 html=all(html,'Tiles Mother · R2 收尾候选 07','Tiles Mother · R2 收尾候选 08A');
 html=all(html,'R2 收尾候选 07 · 局部刮抹 / 压实麻面','R2 收尾候选 08A · 仅降低既有表面强度');
 html=all(html,'材质与失养 · R2 收尾 07','材质与失养 · R2 收尾 08A');
 html=all(html,'对照 B · 07','对照 B · 08A');
 html=all(html,'同机位切换最后细节：局部刮抹、压实与稀疏麻面。','同机位只降低既有表面层强度，不新增纹样；主体形体、搭接、种子和场景保持不动。');
 html=all(html,"version:'R2-closeout-07'","version:'R2-closeout-08A-micro-tune'");
 html=all(html,"parent:'R2-closeout-06-handmade'","parent:'R2-closeout-07-detail'");
 document.open();document.write(html);document.close();
}
boot().catch(e=>{console.error(e);document.getElementById('status').textContent='R2-08A 初始化失败：'+e.message;});
</script>
</body>
