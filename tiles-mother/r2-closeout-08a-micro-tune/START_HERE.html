<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tiles Mother · R2 收尾候选 08A</title>
<style>html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#e0e2dd;color:#283532;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}#status{max-width:560px;padding:28px;line-height:1.7}</style>
</head>
<body>
<div id="status">载入 R2-07 冻结候选，并应用 R2-08A 收尾微调…</div>
<script>
'use strict';
const SOURCE='/haihao0307/HOUSE/dcf4053f69efc031174b7c41bd41e2309dfb13ec/tiles-mother/r2-closeout-07-detail/START_HERE.html';
const replaceAll=(s,a,b)=>s.split(a).join(b);
async function boot(){
  const r=await fetch(SOURCE,{cache:'no-store'});
  if(!r.ok)throw new Error('07 source HTTP '+r.status);
  let html=await r.text();

  // Compatibility-only fix: GLSL ES 3.0 reserves the standalone identifier "patch".
  // This does not change the material model; it only renames the existing local variable.
  html=replaceAll(html,
    'float patch=n3(p*89.3+offset+vec3(5.7,1.3,8.1));',
    'float porePatch=n3(p*89.3+offset+vec3(5.7,1.3,8.1));');
  html=replaceAll(html,
    'smoothstep(.43,.74,patch)',
    'smoothstep(.43,.74,porePatch)');

  // Micro-tune only: reduce existing surface contribution. No new pattern functions.
  html=replaceAll(html,
    "const settings={scene:'pan',seed:314159,year:0,care:false,relief:.82,warmth:.36,patina:.38,wet:0,moss:.22,mossHeight:.82,brightness:.96,variation:.62,core:.48,twist:1.15,r2:.38,finish:1,fracture:0,diagnostic:0};",
    "const settings={scene:'pan',seed:314159,year:0,care:false,relief:.76,warmth:.36,patina:.38,wet:0,moss:.22,mossHeight:.82,brightness:.96,variation:.58,core:.48,twist:.92,r2:.24,finish:.72,fracture:0,diagnostic:0};");

  html=replaceAll(html,'<output id="variationVal">62%</output>','<output id="variationVal">58%</output>');
  html=replaceAll(html,'id="variation" type="range" min="0" max="1.5" step="0.05" value="0.62"','id="variation" type="range" min="0" max="1.5" step="0.05" value="0.58"');
  html=replaceAll(html,'<output id="reliefVal">82%</output>','<output id="reliefVal">76%</output>');
  html=replaceAll(html,'id="relief" type="range" min="0" max="1.8" step=".05" value="0.82"','id="relief" type="range" min="0" max="1.8" step=".05" value="0.76"');
  html=replaceAll(html,'<output id="twistVal">115%</output>','<output id="twistVal">92%</output>');
  html=replaceAll(html,'id="twist" type="range" min="0" max="2" step="0.1" value="1.15"','id="twist" type="range" min="0" max="2" step="0.1" value="0.92"');
  html=replaceAll(html,'<output id="r2Val">38%</output>','<output id="r2Val">24%</output>');
  html=replaceAll(html,'id="r2" type="range" min="0" max="1" step="0.05" value="0.38"','id="r2" type="range" min="0" max="1" step="0.05" value="0.24"');
  html=replaceAll(html,'data-r2="0.38">R2 A=38%','data-r2="0.24">R2 A=24%');
  html=replaceAll(html,
    "{brightness:.96,variation:.62,patina:.38,warmth:.36,relief:.82,core:.48,twist:1.15,r2:.38,wet:0,moss:.22,mossHeight:.82}",
    "{brightness:.96,variation:.58,patina:.38,warmth:.36,relief:.76,core:.48,twist:.92,r2:.24,wet:0,moss:.22,mossHeight:.82}");

  html=replaceAll(html,'Tiles Mother · R2 收尾候选 07','Tiles Mother · R2 收尾候选 08A');
  html=replaceAll(html,'R2 收尾候选 07 · 局部刮抹 / 压实麻面','R2 收尾候选 08A · 只做表面强度微调');
  html=replaceAll(html,'材质与失养 · R2 收尾 07','材质与失养 · R2 收尾 08A');
  html=replaceAll(html,'对照 B · 07','对照 B · 08A');
  html=replaceAll(html,'同机位切换最后细节：局部刮抹、压实与稀疏麻面。','同机位只降低既有表面层强度；没有增加任何新纹样，主体形体、搭接、种子和场景保持不动。');
  html=replaceAll(html,"version:'R2-closeout-07'","version:'R2-closeout-08A-micro-tune'");

  document.open();document.write(html);document.close();
}
boot().catch(e=>{console.error(e);document.getElementById('status').textContent='R2-08A 初始化失败：'+e.message;});
</script>
</body>
</html>
