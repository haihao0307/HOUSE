<style>
:root{color-scheme:dark;--bg:#0c1310;--panel:#121d18;--line:#33463c;--text:#f1eee5;--muted:#aab6ae;--gold:#d6ab68}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,"Microsoft YaHei",sans-serif}body{display:grid;grid-template-rows:auto 1fr auto}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:16px;color:var(--gold);margin:0}p{margin:4px 0 0;font-size:10px;color:var(--muted)}.actions{display:flex;gap:6px;flex-wrap:wrap}button,a{border:1px solid var(--line);border-radius:6px;background:#17251f;color:var(--text);padding:7px 9px;font-size:10px;text-decoration:none;cursor:pointer}.grid{min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}.view{position:relative;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#101714}.view canvas{width:100%;height:100%;display:block;touch-action:none}.label{position:absolute;left:10px;top:10px;max-width:340px;padding:9px 10px;border:1px solid #43564c;border-radius:7px;background:#101914dd;pointer-events:none}.label b{display:block;color:#ebc98f;font-size:12px}.label span{font-size:9px;line-height:1.5;color:#c3cec7}.stats{position:absolute;left:10px;bottom:10px;padding:6px 8px;border:1px solid #43564c;border-radius:6px;background:#101914dd;font-size:9px;color:#ccd5cf}.status{padding:8px 14px;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}
@media(max-width:850px){body{height:auto;min-height:100%}.grid{grid-template-columns:1fr}.view{height:72vh;min-height:520px}header{align-items:flex-start;flex-direction:column}}

<body>
<header><div><h1>标准云南建筑 · 三模型参考校准对比</h1><p>左侧保存 5.4.2 基线，右侧应用大理、乌龙村、团结乡的可回滚视觉校准。精确搭接、隐蔽基层和尺寸继续锁定。</p></div><div class="actions"><button id="sync">同步相机：开</button><button id="reset">复位</button><a href="../three-reference-study.html">查看三模型研究</a><a href="../index.html">返回生产线</a></div></header>
<main class="grid"><section class="view" id="baseline"><div class="label"><b>基线模型 5.4.2</b><span>统一灰瓦、原始屋面高度与墙面材质。用于比较参考校准造成的真实变化。</span></div><div class="stats" id="baseStats">加载中</div></section><section class="view" id="calibrated"><div class="label"><b>参考校准模型 5.4.3</b><span>独立屋面高差、可见叠层厚度、受控灰瓦综合色、墙面综合色和修补层。全部可回滚。</span></div><div class="stats" id="calStats">加载中</div></section></main>
<footer class="status" id="status">正在建立基线和校准模型…</footer>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/controls/OrbitControls.js';
import { createYunnanCourtyardPrototype, disposeYunnanCourtyardPrototype } from './YunnanCourtyardProduction.js';
import { createReferenceCalibratedYunnanCourtyardPrototype, disposeReferenceCalibratedYunnanCourtyardPrototype, YUNNAN_REFERENCE_CALIBRATION_V543 } from './YunnanReferenceCalibrationV543.js';

function makeStage(hostId,model){
 const host=document.getElementById(hostId),scene=new THREE.Scene();scene.background=new THREE.Color('#101714');
 const camera=new THREE.PerspectiveCamera(42,1,.05,120);camera.position.set(15,11,17);
 const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.shadowMap.enabled=true;host.appendChild(renderer.domElement);
 const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,2.2,0);controls.enableDamping=true;controls.dampingFactor=.06;controls.minDistance=7;controls.maxDistance=44;
 scene.add(new THREE.HemisphereLight('#f0ddba','#23322c',2.1));const key=new THREE.DirectionalLight('#fff0d2',3.6);key.position.set(9,18,7);key.castShadow=true;scene.add(key);const fill=new THREE.DirectionalLight('#9eb3be',1.1);fill.position.set(-12,7,-9);scene.add(fill);
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(70,70),new THREE.MeshStandardMaterial({color:'#18231e',roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.02;ground.receiveShadow=true;scene.add(ground);model.rotation.y=Math.PI*.08;scene.add(model);
 const resize=()=>{const w=Math.max(1,host.clientWidth),h=Math.max(1,host.clientHeight);camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)};new ResizeObserver(resize).observe(host);resize();
 return{host,scene,camera,renderer,controls,model,render:()=>{controls.update();renderer.render(scene,camera)},reset:()=>{camera.position.set(15,11,17);controls.target.set(0,2.2,0);controls.update()}};
}
const base=createYunnanCourtyardPrototype({seed:401});
const calibrated=createReferenceCalibratedYunnanCourtyardPrototype({seed:543});
const left=makeStage('baseline',base),right=makeStage('calibrated',calibrated);let synced=true;
document.getElementById('baseStats').textContent=`${base.userData.stats.meshCount.toLocaleString()} 网格 · ${Math.round(base.userData.stats.triangleCount).toLocaleString()} 三角面`;
document.getElementById('calStats').textContent=`${calibrated.userData.stats.meshCount.toLocaleString()} 网格 · ${Math.round(calibrated.userData.stats.triangleCount).toLocaleString()} 三角面 · ${calibrated.userData.referenceCalibrationV543.roofUnitCount} 屋面单元`;
document.getElementById('status').textContent=`已应用 ${YUNNAN_REFERENCE_CALIBRATION_V543.id}。当前视觉层厚 ${YUNNAN_REFERENCE_CALIBRATION_V543.roof.visibleBuildUpMeters} m，仅作参考校准。`;
document.getElementById('sync').onclick=e=>{synced=!synced;e.currentTarget.textContent=`同步相机：${synced?'开':'关'}`};
document.getElementById('reset').onclick=()=>{left.reset();right.reset()};
function copyCamera(from,to){to.camera.position.copy(from.camera.position);to.controls.target.copy(from.controls.target);to.camera.zoom=from.camera.zoom;to.camera.updateProjectionMatrix()}
let lastLeft={x:0,y:0,z:0};function animate(){requestAnimationFrame(animate);if(synced){const p=left.camera.position;if(p.x!==lastLeft.x||p.y!==lastLeft.y||p.z!==lastLeft.z){copyCamera(left,right);lastLeft={x:p.x,y:p.y,z:p.z}}}left.render();right.render()}animate();
window.__YUNNAN_REFERENCE_CALIBRATION_TEST__={base,calibrated,left,right,stats:()=>({base:base.userData.stats,calibrated:calibrated.userData.stats,calibration:calibrated.userData.referenceCalibrationV543})};
window.addEventListener('beforeunload',()=>{disposeYunnanCourtyardPrototype(base);disposeReferenceCalibratedYunnanCourtyardPrototype(calibrated)});
</script>
</body>
