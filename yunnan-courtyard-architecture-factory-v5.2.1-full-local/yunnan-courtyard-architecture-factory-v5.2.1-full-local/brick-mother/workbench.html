:root{color-scheme:dark;--bg:#080a0b;--panel:#111516;--panel2:#171b1c;--line:rgba(255,255,255,.105);--line2:rgba(255,255,255,.18);--text:#f3f0e9;--muted:#a5aba8;--accent:#d4ad74;--accentSoft:rgba(212,173,116,.16);--ok:#86b696;--warn:#e0a56e;font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text)}body{display:grid;grid-template-rows:58px 49px minmax(0,1fr)}

nav{display:flex;align-items:center;gap:6px;padding:6px 12px;border-bottom:1px solid var(--line);background:#101314;overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}.tab{flex:0 0 auto;height:35px;padding:0 13px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--muted);font:550 10px/1 inherit;letter-spacing:.025em;cursor:pointer;transition:.18s}.tab:hover{color:var(--text);background:rgba(255,255,255,.04)}.tab.on{color:var(--text);border-color:rgba(212,173,116,.30);background:var(--accentSoft)}.tab.experimental::after{content:'未批准';margin-left:6px;padding:2px 5px;border:1px solid rgba(224,165,110,.36);border-radius:999px;color:#efbc89;font-size:7px;vertical-align:1px}
.open{margin-left:auto;flex:0 0 auto;height:35px;padding:0 12px;display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;color:#ded9cf;text-decoration:none;font-size:9px;background:rgba(255,255,255,.025)}.open:hover{border-color:var(--line2);background:rgba(255,255,255,.05)}
main{position:relative;min-width:0;min-height:0;background:#000}.panel{position:absolute;inset:0;display:none}.panel.on{display:block}.panel iframe{width:100%;height:100%;border:0;background:#000}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#090b0c;z-index:2;color:var(--muted);font-size:10px;letter-spacing:.08em;transition:.25s}.loading.hidden{opacity:0;visibility:hidden}.spinner{width:28px;height:28px;margin:0 auto 13px;border:1px solid rgba(255,255,255,.13);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.candidate-note{position:absolute;left:50%;top:14px;z-index:4;transform:translateX(-50%);max-width:min(720px,calc(100% - 32px));padding:8px 12px;border:1px solid rgba(224,165,110,.34);border-radius:999px;background:rgba(22,18,14,.88);color:#e8c39d;font-size:9px;letter-spacing:.025em;pointer-events:none;backdrop-filter:blur(10px)}
@media(max-width:760px){body{grid-template-rows:54px 46px minmax(0,1fr)}header{padding:0 11px}.copy span{display:none}.state{font-size:8px;padding:6px 8px}nav{padding:5px 7px}.tab{height:34px;padding:0 10px}.open{height:34px;padding:0 10px}.candidate-note{top:9px;border-radius:10px;text-align:center}}
@media(max-width:470px){.state span{display:none}.state{width:28px;height:28px;padding:0;justify-content:center}.open{font-size:0}.open::after{content:'↗';font-size:14px}.tab{font-size:9px}.tab.experimental::after{display:none}}

<nav aria-label="工作台分区">

</nav>
<main>

<script>
(() => {
  const panels=[...document.querySelectorAll('.panel')];
  const tabs=[...document.querySelectorAll('.tab')];
  const open=document.getElementById('openCurrent');
  const mounted=new Set();
  function mount(panel){
    const frame=panel.querySelector('iframe');
    if(!frame.hasAttribute('src')) frame.src=frame.dataset.src;
    if(mounted.has(panel.id)) return;
    mounted.add(panel.id);
    const done=()=>panel.querySelector('.loading')?.classList.add('hidden');
    frame.addEventListener('load',done,{once:true});
    setTimeout(done,12000);
  }
  function select(id,writeHash=true){
    const panel=document.getElementById(id)||document.getElementById('core');
    panels.forEach(p=>{
      p.classList.toggle('on',p===panel);
      if(p!==panel&&p.id!=='core'){
        const f=p.querySelector('iframe');
        if(f.hasAttribute('src')) f.removeAttribute('src');
        mounted.delete(p.id);
        p.querySelector('.loading')?.classList.remove('hidden');
      }
    });
    tabs.forEach(t=>t.classList.toggle('on',t.dataset.view===panel.id));
    mount(panel);
    open.href=panel.dataset.url;
    if(writeHash) history.replaceState(null,'','#'+panel.id);
    document.documentElement.dataset.activeWorkbench=panel.id;
  }
  tabs.forEach(tab=>tab.addEventListener('click',()=>select(tab.dataset.view)));
  select(location.hash.slice(1)||'core',false);
  window.addEventListener('hashchange',()=>select(location.hash.slice(1)||'core',false));
  document.documentElement.dataset.brickMotherWorkbenchReady='true';
  document.documentElement.dataset.canonicalEntry='brick-mother-standalone-v2.7.5.html';
  window.__BRICK_MOTHER_WORKBENCH__={version:'3.2.0-alpha.1',canonicalRuntime:'2.7.5-alpha.1',canonicalBlob:'7b10389cb9367f7423619262820883cc94b07a61',candidateRuntime:'1.4.0-alpha.2',candidateStatus:'rejected_for_visual_regression',sections:['core','weathering','masonry','lithology','v26'],humanVisualApproved:false,productionApproved:false};
})();
</script>
