*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text)}
body{display:grid;grid-template-rows:58px 49px minmax(0,1fr)}
header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#171b1c,#111415)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.mark{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line2);border-radius:10px;color:var(--accent);font:700 10px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.13em}.copy{min-width:0}.copy strong{display:block;font-size:13px;letter-spacing:.08em;white-space:nowrap}.copy span{display:block;margin-top:4px;color:var(--muted);font-size:9px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.state{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:9px;white-space:nowrap}.state i{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(134,182,150,.12)}
nav{display:flex;align-items:center;gap:6px;padding:6px 12px;border-bottom:1px solid var(--line);background:#101314;overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;height:35px;padding:0 13px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--muted);font:550 10px/1 inherit;letter-spacing:.025em;cursor:pointer;transition:.18s}.tab:hover{color:var(--text);background:rgba(255,255,255,.04)}.tab.on{color:var(--text);border-color:rgba(212,173,116,.30);background:var(--accentSoft)}
.open{margin-left:auto;flex:0 0 auto;height:35px;padding:0 12px;display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;color:#ded9cf;text-decoration:none;font-size:9px;background:rgba(255,255,255,.025)}.open:hover{border-color:var(--line2);background:rgba(255,255,255,.05)}
main{position:relative;min-width:0;min-height:0;background:#000}.panel{position:absolute;inset:0;display:none}.panel.on{display:block}.panel iframe{width:100%;height:100%;border:0;background:#000}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#090b0c;z-index:2;color:var(--muted);font-size:10px;letter-spacing:.08em;transition:.25s}.loading.hidden{opacity:0;visibility:hidden}.spinner{width:28px;height:28px;margin:0 auto 13px;border:1px solid rgba(255,255,255,.13);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:760px){body{grid-template-rows:54px 46px minmax(0,1fr)}header{padding:0 11px}.copy span{display:none}.state{font-size:8px;padding:6px 8px}nav{padding:5px 7px}.tab{height:34px;padding:0 10px}.open{height:34px;padding:0 10px}}
@media(max-width:470px){.state span{display:none}.state{width:28px;height:28px;padding:0;justify-content:center}.open{font-size:0}.open::after{content:'↗';font-size:14px}.tab{font-size:9px}}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="mark">BM</div><div class="copy"><strong>BRICK MOTHER 综合工作台</strong><span>三材质核心完整保留 · 实时风化 PBR 与砌筑石形态独立接入</span></div></div>

</header>
<nav aria-label="工作台分区">

</nav>
<main>
  <section class="panel on" id="core" data-url="./brick-mother-standalone-v2.7.5.html?v=20260902-restored">

    <iframe title="Brick Mother 核心三材质 V2.7.5" src="./brick-mother-standalone-v2.7.5.html?v=20260902-restored" allow="fullscreen"></iframe>

  </section>
</main>
<script>
(() => {
  const panels=[...document.querySelectorAll('.panel')];
  const tabs=[...document.querySelectorAll('.tab')];
  const open=document.getElementById('openCurrent');
  function mount(panel){
    const frame=panel.querySelector('iframe');
    if(!frame.src) frame.src=frame.dataset.src;
    const done=()=>panel.querySelector('.loading')?.classList.add('hidden');
    frame.addEventListener('load',done,{once:true});
    setTimeout(done,6000);
  }
  function select(id,writeHash=true){
    const panel=document.getElementById(id)||document.getElementById('core');
    panels.forEach(p=>p.classList.toggle('on',p===panel));
    tabs.forEach(t=>t.classList.toggle('on',t.dataset.view===panel.id));
    mount(panel);
    open.href=panel.dataset.url;
    if(writeHash) history.replaceState(null,'','#'+panel.id);
    document.documentElement.dataset.activeWorkbench=panel.id;
  }
  tabs.forEach(tab=>tab.addEventListener('click',()=>select(tab.dataset.view)));
  const core=document.querySelector('#core iframe');
  core.addEventListener('load',()=>document.querySelector('#core .loading')?.classList.add('hidden'),{once:true});
  setTimeout(()=>document.querySelector('#core .loading')?.classList.add('hidden'),6000);
  select(location.hash.slice(1)||'core',false);
  window.addEventListener('hashchange',()=>select(location.hash.slice(1)||'core',false));
  document.documentElement.dataset.brickMotherWorkbenchReady='true';
  window.__BRICK_MOTHER_WORKBENCH__={version:'2.11.0-alpha.1',corePreserved:'2.7.5',weatheringRuntime:'1.1.0-alpha.3',masonryRuntime:'20260902-runtime-fix',pbrChannels:16,baseColorSpace:'sRGB',dataChannelSpace:'linear',dielectricF0:0.04,sections:['core','weathering','masonry','lithology','v26'],visualApproved:false,productionApproved:false};
})();
</script>
