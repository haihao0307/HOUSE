<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark">
<meta name="description" content="Brick Mother 砌筑石形态母体 V2.9。四个家族使用独立的承重、断裂、层理和磨圆语法。">
<title>Brick Mother 砌筑石形态母体 V2.9</title><link rel="icon" href="data:,"><style>  :root{
    --bg:#07090b;
    --panel:rgba(17,20,23,.78);
    --panel-strong:rgba(19,22,25,.94);
    --line:rgba(255,255,255,.105);
    --line-strong:rgba(255,255,255,.18);
    --text:#f2f0eb;
    --muted:#9da4a8;
    --soft:#6f777c;
    --accent:#d2a96f;
    --accent-soft:rgba(210,169,111,.16);
    --danger:#a56d62;
  }
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--text)}
  body{user-select:none;-webkit-user-select:none}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#07090b}
  .grain,.vignette{position:fixed;inset:0;pointer-events:none}
  .vignette{background:radial-gradient(ellipse at 47% 43%,transparent 36%,rgba(0,0,0,.08) 62%,rgba(0,0,0,.58) 112%)}
  .grain{opacity:.032;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.65'/%3E%3C/svg%3E");mix-blend-mode:soft-light}
  .topbar{position:fixed;left:22px;right:22px;top:18px;height:52px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
  .brand{display:flex;align-items:center;gap:13px;pointer-events:auto}
  .mark{width:34px;height:34px;border:1px solid var(--line-strong);display:grid;place-items:center;border-radius:10px;background:rgba(12,14,16,.72);backdrop-filter:blur(18px);font:600 10px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.12em;color:var(--accent)}
  .brand-copy strong{display:block;font-size:13px;letter-spacing:.14em;font-weight:650}
  .brand-copy span{display:block;margin-top:4px;color:var(--muted);font-size:10px;letter-spacing:.09em}
  .status{pointer-events:auto;display:flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:rgba(12,14,16,.68);backdrop-filter:blur(16px);font-size:10px;color:var(--muted);letter-spacing:.06em}
  .status i{width:6px;height:6px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 4px rgba(165,109,98,.12)}
  .family-rail{position:fixed;left:22px;top:92px;width:176px;padding:8px;border:1px solid var(--line);border-radius:14px;background:var(--panel);backdrop-filter:blur(22px);box-shadow:0 18px 60px rgba(0,0,0,.24)}
  .rail-title{padding:8px 10px 10px;font-size:9px;color:var(--soft);letter-spacing:.14em;text-transform:uppercase}
  .family-btn{width:100%;border:0;outline:0;background:transparent;color:var(--muted);border-radius:10px;padding:11px 10px;display:flex;gap:10px;align-items:center;text-align:left;cursor:pointer;transition:.22s ease;font:inherit}
  .family-btn:hover{background:rgba(255,255,255,.045);color:var(--text)}
  .family-btn.active{background:var(--accent-soft);color:var(--text)}
  .family-btn .index{width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--line);border-radius:7px;font:600 9px/1 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--soft)}
  .family-btn.active .index{border-color:rgba(210,169,111,.44);color:var(--accent)}
  .family-btn b{font-size:11px;font-weight:570;letter-spacing:.04em}
  .family-btn small{display:block;margin-top:3px;font-size:8.5px;color:var(--soft);letter-spacing:.02em}
  .control-panel{position:fixed;right:22px;top:92px;width:238px;padding:16px 15px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);backdrop-filter:blur(22px);box-shadow:0 18px 60px rgba(0,0,0,.26)}
  .panel-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
  .panel-head strong{font-size:11px;letter-spacing:.08em;font-weight:620}
  .panel-head span{font:500 9px/1.3 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--soft)}
  .seed-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:14px}
  .seed-box{height:34px;border:1px solid var(--line);border-radius:9px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:rgba(0,0,0,.17)}
  .seed-box span{font-size:9px;color:var(--soft);letter-spacing:.08em}
  .seed-box b{font:600 11px/1 ui-monospace,SFMono-Regular,Consolas,monospace;color:#e4e0d8}
  button.icon-btn{height:34px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.035);color:var(--muted);font:500 9px/1 inherit;cursor:pointer;transition:.2s}
  button.icon-btn:hover{border-color:var(--line-strong);color:var(--text);background:rgba(255,255,255,.06)}
  .control{margin:11px 0 0}
  .control label{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;font-size:9.5px;color:var(--muted);letter-spacing:.03em}
  .control output{font:500 9px/1 ui-monospace,SFMono-Regular,Consolas,monospace;color:#d8d3ca}
  input[type=range]{appearance:none;-webkit-appearance:none;width:100%;height:3px;border:0;border-radius:99px;background:linear-gradient(90deg,var(--accent) 0 var(--fill,50%),rgba(255,255,255,.12) var(--fill,50%) 100%);outline:0;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;border:2px solid #1c1f22;background:#e5c18e;box-shadow:0 2px 10px rgba(0,0,0,.5)}
  input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;border:2px solid #1c1f22;background:#e5c18e}
  .lightbar{position:fixed;right:22px;bottom:22px;display:flex;gap:6px;padding:6px;border:1px solid var(--line);border-radius:12px;background:rgba(14,16,18,.75);backdrop-filter:blur(18px)}
  .light-btn,.view-btn{border:0;background:transparent;color:var(--muted);border-radius:8px;padding:9px 11px;font:500 9px/1 inherit;letter-spacing:.04em;cursor:pointer;transition:.2s}
  .light-btn:hover,.view-btn:hover{color:var(--text);background:rgba(255,255,255,.045)}
  .light-btn.active{color:#1a1712;background:var(--accent)}
  .viewbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px;border:1px solid var(--line);border-radius:12px;background:rgba(14,16,18,.75);backdrop-filter:blur(18px)}
  .view-btn.active{background:rgba(255,255,255,.095);color:var(--text)}
  .view-divider{width:1px;height:19px;background:var(--line);margin:0 2px}
  .meta{position:fixed;left:22px;bottom:22px;min-width:258px;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:rgba(14,16,18,.72);backdrop-filter:blur(18px)}
  .meta-main{display:flex;align-items:baseline;justify-content:space-between;gap:18px}
  .meta-main strong{font-size:11px;font-weight:600;letter-spacing:.05em}
  .meta-main span{font:500 9px/1 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--accent)}
  .meta-sub{display:flex;gap:13px;margin-top:7px;color:var(--soft);font-size:8.5px;letter-spacing:.04em}
  .hint{position:fixed;left:50%;top:22px;transform:translateX(-50%);padding:8px 12px;border:1px solid transparent;border-radius:99px;color:rgba(220,220,216,.56);font-size:9px;letter-spacing:.04em;pointer-events:none;transition:.4s}
  .hint.flash{border-color:var(--line);background:rgba(10,12,14,.68);color:#e2dfd8;backdrop-filter:blur(12px)}
  .loading{position:fixed;inset:0;display:grid;place-items:center;background:#090b0d;z-index:20;transition:opacity .42s ease}
  .loading.hidden{opacity:0;visibility:hidden}
  .loader{display:flex;flex-direction:column;align-items:center;gap:13px;color:var(--muted);font-size:9px;letter-spacing:.12em}
  .loader-ring{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.12);border-top-color:var(--accent);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .error{position:fixed;inset:0;display:none;place-items:center;padding:30px;background:#090b0d;z-index:30;text-align:center;color:#d6d1c9;line-height:1.7;font-size:13px}
  .error b{display:block;margin-bottom:8px;color:#fff}
  @media(max-width:920px){
    .family-rail{left:12px;top:auto;bottom:74px;width:auto;right:12px;display:flex;overflow:auto;padding:5px}
    .rail-title{display:none}.family-btn{min-width:112px;padding:9px 8px}.family-btn small{display:none}
    .control-panel{right:12px;top:76px;width:218px}
    .topbar{left:13px;right:13px;top:10px}.meta{display:none}.viewbar{left:12px;transform:none;bottom:14px}.lightbar{right:12px;bottom:14px}
  }
  @media(max-width:640px){
    .brand-copy span{display:none}.status{font-size:8px;padding:7px 9px}.control-panel{top:70px;right:10px;width:190px;padding:12px;transform:translateX(calc(100% + 20px));transition:transform .25s}.control-panel.open{transform:none}
    .panel-toggle{display:block!important}.light-btn{padding:8px 8px}.view-btn{padding:8px 8px}.family-rail{bottom:62px}.hint{display:none}
  }
  .panel-toggle{display:none;position:fixed;right:12px;top:70px;width:34px;height:34px;border:1px solid var(--line);border-radius:10px;background:rgba(14,16,18,.75);backdrop-filter:blur(14px);color:var(--muted);z-index:5}
</style>
</head>
<body>
<canvas id="gl" aria-label="Brick Mother 砌筑石形态母体三维工作台"></canvas><div class="vignette"></div><div class="grain"></div>
<div class="topbar"><div class="brand"><div class="mark">BM</div><div class="brand-copy"><strong>BRICK MOTHER</strong><span>STONE FORM DNA · V2.9 HIGH FIDELITY</span></div></div><div class="status"><i style="background:#8eb89b"></i><span>形面母体重构 · 四家族独立语法</span></div></div>
<div class="hint" id="hint">拖动旋转 · 滚轮缩放 · 右键平移 · R 重置视角</div>
<nav class="family-rail" aria-label="石材家族"><div class="rail-title">STONE FORM DNA</div>
<button class="family-btn active" data-family="0"><span class="index">01</span><span><b>规则石材</b><small>承重面 · 錾修面 · 局部崩角</small></span></button>
<button class="family-btn" data-family="1"><span class="index">02</span><span><b>半规则毛石</b><small>偏心体量 · 多面断口 · 稳定落座</small></span></button>
<button class="family-btn" data-family="2"><span class="index">03</span><span><b>片石</b><small>主层理 · 薄板厚度 · 沿层破裂</small></span></button>
<button class="family-btn" data-family="3"><span class="index">04</span><span><b>卵石</b><small>磨圆度 · 碰撞伤 · 水磨表面</small></span></button></nav>
<button class="panel-toggle" id="panelToggle" aria-label="打开参数">☰</button>
<aside class="control-panel" id="controls"><div class="panel-head"><strong>形成参数</strong><span>FORM FIRST</span></div>
<div class="seed-row"><div class="seed-box"><span>母种子</span><b id="seedValue">8231</b></div><button class="icon-btn" id="newSeed">换一组</button></div>
<div class="control"><label><span>体量偏心</span><output id="formOut">0.52</output></label><input id="form" type="range" min="0" max="1" step="0.01" value="0.52"></div>
<div class="control"><label><span>断裂强度</span><output id="fractureOut">0.36</output></label><input id="fracture" type="range" min="0" max="1" step="0.01" value="0.36"></div>
<div class="control"><label><span>边缘磨圆</span><output id="edgeOut">0.28</output></label><input id="edge" type="range" min="0" max="1" step="0.01" value="0.28"></div>
<div class="control"><label><span>中尺度起伏</span><output id="reliefOut">0.42</output></label><input id="relief" type="range" min="0" max="1" step="0.01" value="0.42"></div>
<div class="control"><label><span>风化响应</span><output id="weatherOut">0.38</output></label><input id="weather" type="range" min="0" max="1" step="0.01" value="0.38"></div>
<div class="control"><label><span>粗糙度</span><output id="roughOut">0.82</output></label><input id="rough" type="range" min="0.18" max="1" step="0.01" value="0.82"></div>
<div class="control"><label><span>主光方向</span><output id="lightOut">−34°</output></label><input id="lightAngle" type="range" min="-90" max="70" step="1" value="-34"></div></aside>
<div class="meta"><div class="meta-main"><strong id="familyName">规则石材</strong><span id="triangleCount">0 TRI</span></div><div class="meta-sub" id="familyRule"><span>承重面稳定 · 錾修侧面 · 局部崩角</span></div></div>
<div class="viewbar"><button class="view-btn active" data-piece="all">全景</button><button class="view-btn" data-piece="hero">主样本</button><button class="view-btn" data-piece="mini">小样组</button><span class="view-divider"></span><button class="view-btn" id="autoRotate">转台</button><button class="view-btn" id="resetView">复位</button></div>
<div class="lightbar"><button class="light-btn active" data-light="studio">棚拍</button><button class="light-btn" data-light="neutral">中性</button><button class="light-btn" data-light="raking">掠射</button></div>
<div class="loading" id="loading"><div class="loader"><div class="loader-ring"></div><span>BUILDING STONE FORM DNA</span></div></div>
<div class="error" id="error"><div><b>砌筑石形态母体启动失败</b><span id="errorText">请使用最新版 Chrome、Edge、Safari 或 Firefox。</span></div></div>
<script>
const parts=['stone-form-v29.part1.txt', 'stone-form-v29.part2.txt', 'stone-form-v29.part3.txt', 'stone-form-v29.part4.txt', 'stone-form-v29.part5.txt', 'stone-form-v29.part6.txt'];
Promise.all(parts.map(url=>fetch(url,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('runtime '+r.status+' '+url);return r.text();}))).then(chunks=>{
 const script=document.createElement('script');
 const blob=new Blob([chunks.join('')],{type:'text/javascript'});
 const src=URL.createObjectURL(blob);
 script.src=src;
 script.onload=()=>URL.revokeObjectURL(src);
 script.onerror=()=>{URL.revokeObjectURL(src);throw new Error('runtime script load failed');};
 document.body.appendChild(script);
}).catch(error=>{console.error(error);const e=document.getElementById('error');if(e){e.style.display='grid';e.innerHTML='<div><b>石材形体运行时启动失败</b><span>'+String(error.message).replace(/[<>]/g,'')+'</span></div>';}const l=document.getElementById('loading');if(l)l.classList.add('hidden');document.documentElement.dataset.runtimeFailure='true';});
</script></body></html>
