<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brick Mother · R3.6</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0d120e;color:#e9e5d8;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
#boot{height:100%;display:grid;place-content:center;text-align:center;gap:10px;padding:24px}
small{color:#9ca69b;line-height:1.5}
</style>
</head>
<body>
<div id="boot"><b>正在装载 Brick Mother R3.6 三维工作台…</b><small>墙心覆盖 · Microscope 多尺度形体 · 可调土色 · 柔边抹灰<br>WebGL2</small></div>
<script>
(async()=>{
  const root='experiments/wall-4x3-r3-6/parts/';
  const files=Array.from({length:8},(_,i)=>root+`part-${String(i+1).padStart(2,'0')}.txt`);
  const parts=[];
  for(const file of files){
    const response=await fetch(file,{cache:'no-store'});
    if(!response.ok)throw new Error(`${file} · HTTP ${response.status}`);
    parts.push(await response.text());
  }
  const html=parts.join('');
  if(!html.startsWith('<!doctype html>')||!html.includes('window.__BRICK_WALL_R3_6__'))throw new Error('R3.6 载荷不完整');
  document.open();
  document.write(html);
  document.close();
})().catch(error=>{
  document.getElementById('boot').innerHTML=`<b>R3.6 装载失败</b><small>${String(error.message||error)}<br>请刷新页面，或使用最新版 Chrome / Edge / Safari。</small>`;
  console.error(error);
});
</script>
</body>
</html>
