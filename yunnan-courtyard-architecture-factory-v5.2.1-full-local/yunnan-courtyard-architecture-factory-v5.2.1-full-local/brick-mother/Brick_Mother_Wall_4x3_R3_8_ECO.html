<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Brick Mother R3.8 ECO</title><style>html,body{margin:0;width:100%;height:100%;background:#0d120e;color:#e9e5d8;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}#boot{height:100%;display:grid;place-content:center;text-align:center;gap:10px;padding:24px}small{color:#9ca69b;line-height:1.5}</style></head><body><div id="boot"><b>正在打开 R3.8 固定墙体省电显示…</b><small>相同参数与默认外观 · 更低像素上限 · 按需渲染</small></div><script>
(async()=>{try{const root='eco/r3-8/';const files=['R3_8_ECO_PAYLOAD_01.txt', 'R3_8_ECO_PAYLOAD_02.txt', 'R3_8_ECO_PAYLOAD_03.txt', 'R3_8_ECO_PAYLOAD_04.txt', 'R3_8_ECO_PAYLOAD_05.txt'];const parts=[];for(const file of files){const response=await fetch(root+file,{cache:'no-store'});if(!response.ok)throw new Error(`${file} · HTTP ${response.status}`);parts.push((await response.text()).trim());}const b64=parts.join('');if(b64.length!==30092)throw new Error(`省电载荷长度异常：${b64.length}`);const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(!('DecompressionStream' in self))throw new Error('当前浏览器不支持内置 gzip 解压，请使用最新版 Chrome / Edge / Safari。');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();if(!html.startsWith('<!doctype html>')||!html.includes('__BRICK_WALL_R3_8__'))throw new Error('R3.8 ECO 载荷校验失败');document.open();document.write(html);document.close();}catch(e){document.getElementById('boot').innerHTML='<b>R3.8 ECO 打开失败</b><small>'+String(e.message||e)+'</small>';console.error(e);}})();
</script></body></html>
