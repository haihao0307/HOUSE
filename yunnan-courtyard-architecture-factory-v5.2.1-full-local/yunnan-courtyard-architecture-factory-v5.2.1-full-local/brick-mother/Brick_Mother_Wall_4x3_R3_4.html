<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brick Mother · R3.4 正在载入</title>
<style>html,body{margin:0;height:100%;background:#0d120e;color:#dedbd2;font:14px system-ui;display:grid;place-items:center}.load{padding:18px 22px;border:1px solid #ffffff1a;border-radius:12px;background:#151b15}</style>
</head>
<body><div class="load" id="load">Brick Mother R3.4 正在载入…</div>
<script>
(async()=>{
  const names=['experiments/wall-4x3-r3-4/parts/part-01.txt','experiments/wall-4x3-r3-4/parts/part-02.txt','experiments/wall-4x3-r3-4/parts/part-03.txt','experiments/wall-4x3-r3-4/parts/part-04.txt','experiments/wall-4x3-r3-4/parts/part-05.txt','experiments/wall-4x3-r3-4/parts/part-06.txt','experiments/wall-4x3-r3-4/parts/part-07.txt'];
  try{
    const parts=await Promise.all(names.map(n=>fetch(n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n+' '+r.status);return r.text()})));
    document.open();document.write(parts.join(''));document.close();
  }catch(e){document.getElementById('load').textContent='R3.4 载入失败：'+e.message;console.error(e);}
})();
</script></body></html>
