<title>Brick Mother · Macroscopic microscope R2</title>
<style>
:root{color-scheme:dark;font:12px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;background:#11130f;color:#e7e0d1;--line:#ffffff17;--accent:#d0b783}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11130f}body{display:grid;grid-template-rows:34px minmax(0,1fr) 30px;height:100dvh}header{display:flex;align-items:center;gap:7px;padding:0 9px;border-bottom:1px solid var(--line);background:#151913f2;z-index:2}header strong{font-size:10px;letter-spacing:.7px;font-weight:550;white-space:nowrap}header small{color:var(--accent);font-size:9px;margin-left:4px}button,input{font:inherit;color:inherit}button{border:1px solid #ffffff14;background:#242a20;border-radius:5px;padding:4px 8px;cursor:pointer;white-space:nowrap}button:hover{background:#363f2e}button.active{border-color:#d0b78399;background:#433b28;color:#fff2cd}.controls{display:flex;gap:5px;align-items:center;margin-left:auto}.control{display:flex;align-items:center;gap:5px;color:#aeb7a4;font-size:10px}.control input{width:92px;accent-color:var(--accent)}#stage{position:relative;min-height:0;background:radial-gradient(ellipse at 49% 37%,#2b2d22 0,#171b15 52%,#0f120e 100%)}canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}.badge{position:absolute;left:9px;top:9px;padding:5px 7px;border:1px solid #ffffff12;border-radius:5px;background:#11160fc7;color:#aeb8a7;font:10px ui-monospace,SFMono-Regular,Consolas,monospace;pointer-events:none}.legend{position:absolute;right:9px;top:9px;text-align:right;color:#9aa794;font-size:9px;pointer-events:none}.error{position:absolute;inset:auto 12px 12px;padding:10px;background:#532f28;border-radius:6px;color:#fff;z-index:4}footer{display:flex;align-items:center;gap:9px;padding:0 9px;border-top:1px solid var(--line);background:#151913;color:#9eaa99;font-size:9px;white-space:nowrap;overflow:hidden}footer span:first-child{color:#e0d1ad}footer .right{margin-left:auto;color:#84907f}.mobileOnly{display:none}@media(max-width <body>
<header>
  <strong>BRICK MOTHER <small>MM R2 · CORE 1+2 PROBE</small></strong>
  <button id="single" class="active">单块近景</button>
  <button id="grid">12块同族</button>
  <button id="base">A=0 基线</button>
  <button id="r2" class="active">R2 个体差异</button>
  <button id="layers">17层</button>
  <button id="next">换一组</button>
  <div class="controls"><label class="control">强度 <input id="strength" type="range" min="0" max="1" step="0.01" value="0.58"><output id="strengthOut">0.58</output></label></div>
</header>
<main id="stage">
  <canvas id="view" aria-label="十二块旧砖的三维程序化材料对照"></canvas>
  <div class="badge" id="badge">12 BRICKS · GROUP 01 · 17 OCTAVES</div>
  <div class="legend">拖动旋转 · 滚轮缩放<br>同一对象坐标 · 相机不改纹理身份</div>
  <div id="error" class="error" hidden></div>
</main>
<footer><span>隔离进展样板</span><span>R5 主工作台未改动</span><span>当前只验证对数球坐标、17层前缀和稳定 brickId</span><span class="right desktopOnly">细节只进入颜色、粗糙度与微法线，不冒充孔洞或断边</span><span class="mobileOnly">拖动看六面</span></footer>
<script>
'use strict';
(()=>{
const canvas=document.getElementById('view'),error=document.getElementById('error'),gl=canvas.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance'});

const $=id=>document.getElementById(id),TAU=Math.PI*2;
const vs=`#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNormal;
layout(location=2) in vec3 iOffset;
layout(location=3) in float iSeed;
uniform mat4 uVP;
out vec3 vLocal;

out vec3 vNormal;

void main(){vec3 p=aPos;vec3 world=p+iOffset;vLocal=p;vWorld=world;vNormal=aNormal;vSeed=iSeed;gl_Position=uVP*vec4(world,1.0);}`;
const fs=`#version 300 es
precision highp float;
in vec3 vLocal;in vec3 vWorld;in vec3 vNormal;flat in float vSeed;uniform vec3 uEye;uniform float uStrength;uniform int uLayers;out vec4 frag;const float PI=3.141592653589793;
float hash1(float n){return fract(sin(n*127.1+31.7)*43758.5453123);}vec3 hash3(float n){return fract(sin(vec3(n*127.1+11.3,n*269.5+17.9,n*419.2+3.7))*43758.5453123);}float kernel(float u,float v,float w,float s){float cw=cos(s*w),cu=cos(s*u),cv=cos(s*v);return cos(cw*cu+cv*cv+cv*cu);}vec3 rotateAxis(vec3 v,vec3 axis,float angle){float c=cos(angle),s=sin(angle);return v*c+cross(axis,v)*s+axis*dot(axis,v)*(1.0-c);}float microscope(vec3 p,float seed,int layers,float footprint){vec3 id=hash3(seed);float radialScale=mix(.88,1.14,hash1(seed+7.0));vec3 q=p*vec3(1.15,2.35,1.72)*radialScale+vec3(1.55,1.05,1.35);if(seed>.5){vec3 c1=vec3(-.35+.7*id.x,-.18+.36*id.y,-.28+.56*id.z);vec3 a1=normalize(hash3(seed+61.0)-.5+vec3(.13,.21,.08));float t1=.46*sin(dot(q-c1,a1)*1.65+id.z*6.2831);q=c1+rotateAxis(q-c1,a1,t1);vec3 c2=vec3(.22-.44*id.z,.14-.28*id.x,.18-.36*id.y);vec3 a2=normalize(hash3(seed+113.0)-.5+vec3(.09,.17,.23));float t2=.16*sin(dot(q-c2,a2)*4.25+id.x*6.2831);q=c2+rotateAxis(q-c2,a2,t2);}float r=max(length(q),1e-4);float u=log2(r)-2.0+(id.x-.5)*1.6;float v=-q.z/r+(id.y-.5)*.23;float w=atan(q.x,q.y)+(id.z-.5)*1.4;float sum=0.0,s=1.0;for(int j=0;j<17;j++){if(j>=layers)break;float visible=1.0-smoothstep(.22,.92,s*footprint);if(visible<.001)break;sum+=kernel(u,v,w,s)*visible/s;s*=2.0;}return sum;}float coarseField(vec3 p,float seed,float fp){return microscope(p,seed,min(uLayers,5),fp);}float fullField(vec3 p,float seed,float fp){return microscope(p,seed,uLayers,fp);}vec3 pbr(vec3 base,float rough,vec3 N,vec3 V,vec3 L){vec3 H=normalize(V+L);float nl=max(dot(N,L),0.0),nv=max(dot(N,V),0.001),nh=max(dot(N,H),0.0),vh=max(dot(V,H),0.0);float a=max(.045,rough*rough),a2=a*a;float den=nh*nh*(a2-1.0)+1.0;float D=a2/(PI*den*den+1e-5);float k=(rough+1.0);k=k*k*.125;float G=(nl/(nl*(1.0-k)+k))*(nv/(nv*(1.0-k)+k));vec3 F=vec3(.04)+(vec3(1.0)-vec3(.04))*pow(1.0-vh,5.0);vec3 spec=D*G*F/max(4.0*nl*nv,1e-4);vec3 diffuse=base/PI;vec3 direct=(diffuse*(vec3(1.0)-F)+spec)*nl*2.75;vec3 sky=base*(. void main(){float A=uStrength;float seed=A<0.0001?0.0:vSeed;float footprint=max(length(dFdx(vLocal)),length(dFdy(vLocal)));float f0=fullField(vLocal,0.0,footprint);float f=fullField(vLocal,seed,footprint);float c=coarseField(vLocal,seed,footprint);float baseC=coarseField(vLocal,0.0,footprint);float field=mix(f0,f,A);float macro=mix(baseC,c,A);float fine=field-macro;vec3 id=hash3(seed+23.0);vec3 base0=vec3(.47,.125,.050);vec3 red1=vec3(.61,.168,.061),red2=vec3(.315,.065,.022);float broad=clamp(.5+.28*sin(macro*2.25+id.x*2.7)+.17*sin(c*4.15+id.y*3.2),0.0,1.0);vec3 varied=mix(red2,red1,broad);varied*=vec3(mix(.94,1.055,id.x),mix(.955,1.025,id.y),mix(.96,1.015,id.z));float warm=.5+.5*sin(coarseField(vLocal,seed+19.0,footprint)*2.8+id.z*4.1);varied=mix(varied,varied*vec3(1.075,.95,.82),.18*warm*A);float soot=smoothstep(.84,.97,.5+.5*sin(coarseField(vLocal,seed+41.0,footprint)*2.35+id.x*5.7))*mix(.0,.045,A);varied=mix(varied,vec3(.235,.185,.155),soot);vec3 base=mix(base0,varied,A);float h=mix(f0,f,A)*.0310+fine*.0180*A;vec3 dpdx=dFdx(vWorld),dpdy=dFdy(vWorld);vec3 N0=normalize(vNormal);vec3 N=normalize(cross(dpdx+N0*dFdx(h),dpdy+N0*dFdy(h)));if(dot(N,N0)<0.0)N=-N;float rough=clamp(mix(.86,.76+.13*(.5+.5*tanh((coarseField(vLocal,seed+71.0,footprint)-1.30)*1.45)),A)+fine*.020*A,.62,.96);vec3 V=normalize(uEye-vWorld),L=normalize(vec3(-.72,.34,.60));vec3 col=pbr(base,rough,N,V,L);float rim=pow(1.0-max(dot(N,V),0.0),3.0);col+=vec3(.18,.13,.08)*rim*.08;col=pow(clamp(col,0.0,1.0),vec3(1.0/2.2));frag=vec4(col,1.0);}`;
const planeVS=`#version 300 es
precision highp float;layout(location=0)in vec3 aPos;uniform mat4 uVP;out vec3 vP;void main(){vP=aPos;gl_Position=uVP*vec4(aPos,1.0);}`;const planeFS=`#version 300 es
precision highp float;in vec3 vP;out vec4 frag;void main(){float r=length(vP.xz*.08);vec3 c=mix(vec3(.075,.085,.068),vec3(.035,.041,.034),smoothstep(.1,1.1,r));float grid=(smoothstep(.985,1.,abs(sin(vP.x*3.14159*.5)))*.015+smoothstep(.985,1.,abs(sin(vP.z*3.14159*.5)))*.015);frag=vec4(c+grid,1.0);}`;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}function program(a,b){const p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,a));gl.attachShader(p,shader(gl.FRAGMENT_SHADER,b));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return p;}let brickProg,planeProg;try{brickProg=program(vs,fs);planeProg=program(planeVS,planeFS);}catch(e){error.hidden=false;error.textContent='Shader 编译失败：'+e;return;}
function brickMesh(){const h=[1.08,.33,.57],pos=[],nor=[],idx=[],faces=[[0,1],[0,-1],[1,1],[1,-1],[2,1],[2,-1]];for(const [axis,sign] of faces){const uv=[0,1,2].filter(v=>v!==axis),nu=axis===1?30:axis===0?16:30,nv=axis===1?16:axis===0?10:10,base=pos.length/3;for(let j=0;j<=nv;j++)for(let i=0;i<=nu;i++){const p=[0,0,0],n=[0,0,0];p[axis]=sign*h[axis];p[uv[0]]=(i/nu*2-1)*h[uv[0]];p[uv[1]]=(j/nv*2-1)*h[uv[1]];n[axis]=sign;pos.push(...p);nor.push(...n);}for(let j=0;j<nv;j++)for(let i=0;i<nu;i++){const a=base+j*(nu+1)+i,b=a+1,c=a+nu+1,d=c+1,A=a*3,B=b*3,C=c*3;const ab=[pos[B]-pos[A],pos[B+1]-pos[A+1],pos[B+2]-pos[A+2]],ac=[pos[C]-pos[A],pos[C+1]-pos[A+1],pos[C+2]-pos[A+2]],cr=[ab[1]*ac[2]-ab[2]*ac[1],ab[2]*ac[0]-ab[0]*ac[2],ab[0]*ac[1]-ab[1]*ac[0]];if(cr[axis]*sign>0)idx.push(a,b,c,b,d,c);else idx.push(a,c,b,b,c,d);}}return{pos:new Float32Array(pos),nor:new Float32Array(nor),idx:new Uint32Array(idx)};}
const mesh=brickMesh(),vao=gl.createVertexArray();gl.bindVertexArray(vao);function attrib(loc,data,size,div=0){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,size,gl.FLOAT,false,0,0);if(div)gl.vertexAttribDivisor(loc,div);return b;}attrib(0,mesh.pos,3);attrib(1,mesh.nor,3);const offsets=[],seeds=[];for(let row=0;row<3;row++)for(let col=0;col<4;col++){offsets.push((col-1.5)*2.55,.34,(row-1)*1.85);seeds.push(row*4+col+1);}const offsetBuffer=attrib(2,new Float32Array(offsets),3,1),seedBuffer=attrib(3,new Float32Array(seeds),1,1);const ebo=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ebo);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,mesh.idx,gl.STATIC_DRAW);gl.bindVertexArray(null);const planeVao=gl.createVertexArray();gl.bindVertexArray(planeVao);attrib(0,new Float32Array([-20,0,-16,20,0,-16,-20,0,16,-20,0,16,20,0,-16,20,0,16]),3);gl.bindVertexArray(null);
function mul(a,b){const o=new Float32Array(16);for(let r=0;r<4;r++)for(let c=0;c<4;c++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o;}function perspective(fov,aspect,n,f){const t=1/Math.tan(fov/2),o=new Float32Array(16);o[0]=t/aspect;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o;}function lookAt(e,t,u){let z=[e[0]-t[0],e[1]-t[1],e[2]-t[2]],l=Math.hypot(...z);z=z.map(v=>v/l);let x=[u[1]*z[2]-u[2]*z[1],u[2]*z[0]-u[0]*z[2],u[0]*z[1]-u[1]*z[0]];l=Math.hypot(...x);x=x.map(v=>v/l);const y=[z[1]*x[2]-z[2]*x[1],z[2]*x[0]-z[0]*x[2],z[0]*x[1]-z[1]*x[0]],o=new Float32Array(16);o[0]=x[0];o[1]=y[0];o[2]=z[0];o[4]=x[1];o[5]=y[1];o[6]=z[1];o[8]=x[2];o[9]=y[2];o[10]=z[2];o[12]=-(x[0]*e[0]+x[1]*e[1]+x[2]*e[2]);o[13]=-(y[0]*e[0]+y[1]*e[1]+y[2]*e[2]);o[14]=-(z[0]*e[0]+z[1]*e[1]+z[2]*e[2]);o[15]=1;return o;}
let yaw=.72,pitch=.34,dist=3.9,strength=.58,layers=17,group=1,dirty=true,drag=false,last=[0,0],viewMode='single',instanceCount=1;function updateInstances(){const seedsA=new Float32Array(12),off=new Float32Array(36);for(let i=0;i<12;i++){seedsA[i]=group*1009+i*37+1;const row=Math.floor(i/4),col=i%4;if(viewMode==='single'){off[i*3]=0;off[i*3+1]=.34;off[i*3+2]=0;}else{off[i*3]=(col-1.5)*2.55;off[i*3+1]=.34;off[i*3+2]=(row-1)*1.85;}}gl.bindBuffer(gl.ARRAY_BUFFER,seedBuffer);gl.bufferSubData(gl.ARRAY_BUFFER,0,seedsA);gl.bindBuffer(gl.ARRAY_BUFFER,offsetBuffer);gl.bufferSubData(gl.ARRAY_BUFFER,0,off);instanceCount=viewMode==='single'?1:12;dirty=true;badge();}function badge(){$('badge').textContent=`${viewMode==='single'?'BRICK '+String(group).padStart(2,'0'):'12 BRICKS · GROUP '+String(group).padStart(2,'0')} · ${layers} OCTAVES · A=${strength.toFixed(2)}`;$('strengthOut').textContent=strength.toFixed(2);}function resize(){const dpr=Math.min(devicePixelRatio||1,innerWidth<720?1.15:1.25),w=Math.max(1,Math.floor(canvas.clientWidth*dpr)),h=Math.max(1,Math.floor(canvas.clientHeight*dpr));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;dirty=true;}gl.viewport(0,0,w,h);}function draw(){if(!dirty)return;dirty=false;resize();const eye=[Math.sin(yaw)*Math.cos(pitch)*dist,Math.sin(pitch)*dist,Math.cos(yaw)*Math.cos(pitch)*dist],vp=mul(perspective(.62,canvas.width/canvas.height,.1,60),lookAt(eye,[0,.15,0],[0,1,0]));gl.enable(gl.DEPTH_TEST);gl.enable(gl.CULL_FACE);gl.cullFace(gl.BACK);gl.clearColor(.055,.065,.052,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(planeProg);gl.uniformMatrix4fv(gl.getUniformLocation(planeProg,'uVP'),false,vp);gl.bindVertexArray(planeVao);gl.drawArrays(gl.TRIANGLES,0,6);gl.useProgram(brickProg);gl.uniformMatrix4fv(gl.getUniformLocation(brickProg,'uVP'),false,vp);gl.uniform3fv(gl.getUniformLocation(brickProg,'uEye'),eye);gl.uniform1f(gl.getUniformLocation(brickProg,'uStrength'),strength);gl.uniform1i(gl.getUniformL canvas.addEventListener('pointerdown',e=>{drag=true;last=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-last[0])*.006;pitch=Math.max(.15,Math.min(1.18,pitch+(e.clientY-last[1])*.004));last=[e.clientX,e.clientY];dirty=true});canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);canvas.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(6.5,Math.min(18,dist*Math.exp(e.deltaY*.001)));dirty=true},{passive:false});$('base').onclick=()=>{strength=0;$('strength').value=0;$('base').classList.add('active');$('r2').classList.remove('active');dirty=true;badge()};$('r2').onclick=()=>{strength=.58;$('strength').value=.58;$('r2').classList.add('active');$('base').classList.remove('active');dirty=true;badge()};$('layers').onclick=()=>{layers=layers===17?5:17;$('layers').textContent=layers+'层';dirty=true;badge()};$('single').onclick=()=>{viewMode='single';dist=3.9;$('single').classList.add('active');$('grid').classList.remove('active');updateInstances()};$('grid').onclick=()=>{viewMode='grid';dist=11.6;$('grid').classList.add('active');$('single').classList.remove('active');updateInstances()};$('next').onclick=()=>{group=group%99+1;updateInstances()};$('strength').oninput=e=>{strength=Number(e.target.value);$('base').classList.toggle('active',strength===0);$('r2').classList.toggle('active',strength>0);dirty=true;badge()};addEventListener('resize',()=>{dirty=true});window.__BRICK_MM_R2__={version:'0.1.0-isolated',core:[1,2],count:12,get state(){return{strength,layers,group,yaw,pitch,dist,viewMode,instanceCount}},setStrength(v){strength=Math.max(0,Math.min(1,v));$('strength').value=strength;dirty=true;badge()},setLayers(v){layers=v===17?17:5;dirty=true;badge()},nextGroup(){group++;updateInstances()},render(){dirty=true;draw()},gl};gl.disable(gl.DITHER);updateInstances();badge();frame();
})();
