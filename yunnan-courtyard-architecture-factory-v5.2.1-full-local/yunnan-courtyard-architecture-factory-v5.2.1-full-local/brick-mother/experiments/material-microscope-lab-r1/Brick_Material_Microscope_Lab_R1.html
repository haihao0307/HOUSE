<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brick Mother · Material Microscope Lab R1</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#101210;color:#e9e5da}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101210}
#c{display:block;width:100%;height:100%;touch-action:none}
.top{position:fixed;left:12px;right:12px;top:10px;display:flex;align-items:center;gap:8px;z-index:5;pointer-events:none}
.badge{pointer-events:auto;background:#171b18dd;border:1px solid #ffffff18;border-radius:8px;padding:7px 10px;backdrop-filter:blur(8px);font-size:12px}
.title{font-weight:650;letter-spacing:.3px}.sub{color:#a8afa5;font-size:10px;margin-top:2px}.controls{margin-left:auto;display:flex;gap:5px;pointer-events:auto}
button{color:#ddd8cc;background:#1b211d;border:1px solid #ffffff18;border-radius:6px;padding:7px 9px;font:11px inherit;cursor:pointer}button.active{border-color:#d4aa6a;color:#ffe8c0;background:#34291d}
.labels{position:fixed;left:0;right:0;top:62px;display:grid;grid-template-columns:1fr 1fr;pointer-events:none;z-index:4;text-align:center;font-size:11px;color:#bfc5bb}.labels b{color:#eee7d9;font-weight:600}.labels span{display:block;font-size:9px;color:#8e968d;margin-top:2px}
.bottom{position:fixed;left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;gap:8px;z-index:5;pointer-events:none}.bottom>div{pointer-events:auto;background:#151917d9;border:1px solid #ffffff12;border-radius:7px;padding:6px 9px;font-size:10px;color:#9da59b}.ok{color:#c9d7bd}
@media(max-width:700px){.top{left:7px;right:7px;top:7px}.badge{padding:6px 8px}.title{font-size:11px}.sub{display:none}.controls button{padding:6px 7px;font-size:10px}.labels{top:51px;font-size:10px}.bottom{left:7px;right:7px}.bottom .method{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top">
  <div class="badge"><div class="title">BRICK MOTHER · MATERIAL MICROSCOPE LAB R1</div><div class="sub">单项实验：烧结砖 · 固定几何 · 片元级 Macroscopic microscope · 共享材料形成遮罩</div></div>
  <div class="controls">
    <button data-mode="0" class="active">成品</button>
    <button data-mode="1">高度</button>
    <button data-mode="2">粗糙度</button>
    <button data-mode="3">形成遮罩</button>
    <button id="mm">Microscope 开</button>
  </div>
</div>
<div class="labels"><div><b>A · 旧式独立噪声</b><span>颜色 / 粗糙 / 细节缺少共同形成关系</span></div><div><b>B · Process + Microscope</b><span>同一形成遮罩驱动 BaseColor / Roughness / Height</span></div></div>
<div class="bottom"><div class="method">拖动旋转 · 滚轮缩放 · 两块砖共用同一几何、相机、灯光</div><div id="status" class="ok">WebGL2 · IOR 1.5 · dielectric F0≈0.04 · 17层片元级显微结构</div></div>
<script>
'use strict';
const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl2',{antialias:true,alpha:false,powerPreference:'high-performance'});
if(!gl){document.getElementById('status').textContent='当前浏览器未提供 WebGL2';throw new Error('WebGL2 unavailable');}
const vs=`#version 300 es
precision highp float;
const vec2 P[3]=vec2[3](vec2(-1.,-1.),vec2(3.,-1.),vec2(-1.,3.));
out vec2 vUv;
void main(){vec2 p=P[gl_VertexID];vUv=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;
const fs=`#version 300 es
precision highp float;
in vec2 vUv;out vec4 frag;
uniform vec2 uRes;uniform float uTime;uniform float uYaw;uniform float uPitch;uniform float uZoom;uniform int uMode;uniform float uMM;
#define PI 3.14159265359
float sat(float x){return clamp(x,0.,1.);} 
mat2 r2(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);} 
vec3 rotInv(vec3 p){p.xz=r2(-uYaw)*p.xz;p.yz=r2(-uPitch)*p.yz;return p;}
float hash31(vec3 p){p=fract(p*.1031);p+=dot(p,p.yzx+33.33);return fract((p.x+p.y)*p.z);} 
float noise3(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(mix(hash31(i),hash31(i+vec3(1,0,0)),f.x),mix(hash31(i+vec3(0,1,0)),hash31(i+vec3(1,1,0)),f.x),f.y),mix(mix(hash31(i+vec3(0,0,1)),hash31(i+vec3(1,0,1)),f.x),mix(hash31(i+vec3(0,1,1)),hash31(i+vec3(1,1,1)),f.x),f.y),f.z);} 
float fbm(vec3 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*noise3(p);p=p*2.03+vec3(7.1,-3.7,11.9);a*=.5;}return s;}
float sdRoundBox(vec3 p,vec3 b,float r){vec3 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.)-r;}
vec3 localBrick(vec3 p,float id){vec3 c=vec3(id<.5?-1.32:1.32,0.,0.);return rotInv(p-c);} 
vec2 map(vec3 p){float d0=sdRoundBox(localBrick(p,0.),vec3(1.04,.43,.50),.075);float d1=sdRoundBox(localBrick(p,1.),vec3(1.04,.43,.50),.075);vec2 o=d0<d1?vec2(d0,0.):vec2(d1,1.);float floorD=p.y+.72;if(floorD<o.x)o=vec2(floorD,2.);return o;}
vec3 normalAt(vec3 p){float e=.0018;vec2 k=vec2(1,-1);return normalize(k.xyy*map(p+k.xyy*e).x+k.yyx*map(p+k.yyx*e).x+k.yxy*map(p+k.yxy*e).x+k.xxx*map(p+k.xxx*e).x);} 
float softShadow(vec3 ro,vec3 rd,float mint,float maxt){float res=1.,t=mint;for(int i=0;i<36;i++){float h=map(ro+rd*t).x;res=min(res,13.*h/t);t+=clamp(h,.018,.22);if(h<.001||t>maxt)break;}return sat(res);} 
float ao(vec3 p,vec3 n){float a=0.,w=1.;for(int i=1;i<=4;i++){float d=.045*float(i);a+=(d-map(p+n*d).x)*w;w*=.55;}return sat(1.-a*2.2);} 
float mmCell(vec3 p){vec3 c=cos(p);return cos(c.z*c.x+c.y*c.y+c.y*c.x);} 
float microscope(vec3 q){float rr=max(length(q),1e-4);vec3 xi=vec3(log2(rr)-2.,-q.z/rr-1.,atan(q.x,q.y));float fp=max(length(dFdx(xi)),length(dFdy(xi)));float s=0.,sc=1.;for(int j=0;j<17;j++){float gate=1.-smoothstep(.48,1.10,fp*sc);s+=gate*(mmCell(xi*sc)-.6556965)/sc;sc*=2.;}return s;} 
struct Mat{vec3 base;float rough;float h;vec4 mask;};
Mat oldMaterial(vec3 q){Mat m;float a=noise3(q*2.1+3.7),b=noise3(q*8.4-7.2),c=noise3(q*31.);m.base=mix(vec3(.24,.045,.020),vec3(.66,.20,.065),sat(.45+.72*(a-.5)+.24*(b-.5)));m.base*=.91+.18*(c-.5);m.rough=clamp(.80+.16*(noise3(q*17.+2.)-.5),.58,.97);m.h=(noise3(q*42.)-.5)*.006+(noise3(q*110.+8.)-.5)*.002;m.mask=vec4(a,b,c,0.);return m;}
Mat processMaterial(vec3 q){Mat m;float body=fbm(q*1.15+vec3(-2.7,4.1,8.3));float fire=fbm(q*2.65+vec3(7.1,-5.2,1.7));float firing=smoothstep(.27,.79,.66*body+.34*fire);float reduction=smoothstep(.69,.88,fbm(q*.82+vec3(12.1,1.4,-9.7)))*smoothstep(.38,.82,firing);float poreA=noise3(q*29.7+vec3(2.3,9.1,-4.4)),poreB=noise3(q*61.3+vec3(-7.2,3.7,14.6));float pore=smoothstep(.79,.92,poreA)*smoothstep(.64,.84,poreB);float skin=smoothstep(.36,.76,fbm(q*5.1+vec3(1.9,-3.2,11.4)));vec3 dark=vec3(.235,.043,.023),mid=vec3(.455,.105,.048),warm=vec3(.625,.205,.082);m.base=mix(dark,mid,smoothstep(.14,.76,firing));m.base=mix(m.base,warm,smoothstep(.58,.92,firing)*.34);m.base=mix(m.base,vec3(.19,.055,.038),reduction*.63);m.base=mix(m.base,m.base*vec3(.62,.58,.54),pore*.30);m.base*=.965+.07*(skin-.5);m.rough=clamp(.90-.10*firing+.055*reduction+.075*pore+.035*(skin-.5),.68,.985);float mm=microscope(q*9.5);float meso=(body-.5)*.010+(skin-.5)*.004;float micro=uMM*mm*.0034;m.h=meso+micro-pore*.0048;m.mask=vec4(firing,reduction,pore,skin);return m;}
vec3 perturb(vec3 n,vec3 p,float h){vec3 x=dFdx(p),y=dFdy(p),r1=cross(y,n),r2=cross(n,x);float det=dot(x,r1);vec3 g=sign(det)*(dFdx(h)*r1+dFdy(h)*r2)/max(abs(det),1e-7);return normalize(n-g);} 
vec3 shade(vec3 p,vec3 n,vec3 rd,float id){vec3 q=localBrick(p,id);Mat m;if(id<.5)m=oldMaterial(q);else m=processMaterial(q);if(uMode==1){float v=sat(.5+m.h*34.);return vec3(v);}if(uMode==2)return vec3(m.rough);if(uMode==3){return id<.5?vec3(m.mask.xyz):vec3(m.mask.x,m.mask.y,m.mask.z);}n=perturb(n,p,m.h);vec3 L=normalize(vec3(-.48,.78,.38));vec3 V=normalize(-rd),H=normalize(L+V);float nl=max(dot(n,L),0.),nv=max(dot(n,V),.001),nh=max(dot(n,H),0.),vh=max(dot(V,H),0.);float a=m.rough*m.rough,a2=a*a,den=nh*nh*(a2-1.)+1.;float D=a2/(PI*den*den+1e-6);float k=(m.rough+1.);k=k*k/8.;float G1L=nl/(nl*(1.-k)+k),G1V=nv/(nv*(1.-k)+k),G=G1L*G1V;vec3 F=vec3(.04)+(1.-.04)*pow(1.-vh,5.);vec3 spec=D*G*F/max(4.*nl*nv,.001);float sh=softShadow(p+n*.01,L,.02,4.);float occ=ao(p,n);vec3 hemi=mix(vec3(.10,.105,.105),vec3(.34,.35,.34),n.y*.5+.5);vec3 color=m.base*hemi*occ + (m.base/PI*(1.-F)+spec)*vec3(3.1,2.95,2.72)*nl*sh;color+=m.base*vec3(.12,.14,.17)*max(dot(n,normalize(vec3(.55,.25,-.80))),0.);return color;}
vec3 floorShade(vec3 p,vec3 n,vec3 rd){vec3 L=normalize(vec3(-.48,.78,.38));float sh=softShadow(p+n*.01,L,.02,5.);float c=.105+.018*noise3(p*2.1);return vec3(c)*(.55+.45*sh);} 
void main(){vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y;vec3 ro=vec3(0.,.25,uZoom),ta=vec3(0.,0.,0.);vec3 ww=normalize(ta-ro),uu=normalize(cross(ww,vec3(0,1,0))),vv=cross(uu,ww);vec3 rd=normalize(uu*uv.x+vv*uv.y+ww*1.55);float t=0.;vec2 hit=vec2(0.);bool ok=false;for(int i=0;i<96;i++){vec3 p=ro+rd*t;hit=map(p);if(hit.x<.0015){ok=true;break;}t+=hit.x*.82;if(t>18.)break;}vec3 col=mix(vec3(.045,.052,.048),vec3(.105,.115,.105),sat(.5+.5*rd.y));if(ok){vec3 p=ro+rd*t,n=normalAt(p);if(hit.y>1.5)col=floorShade(p,n,rd);else col=shade(p,n,rd,hit.y);}float vign=1.-.24*dot(uv,uv);col*=vign;col=col/(1.+col);col=pow(max(col,0.),vec3(1./2.2));frag=vec4(col,1.);}`;
function compile(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
const prog=gl.createProgram();gl.attachShader(prog,compile(gl.VERTEX_SHADER,vs));gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));
const vao=gl.createVertexArray();gl.bindVertexArray(vao);gl.useProgram(prog);
const U={};for(const n of ['uRes','uTime','uYaw','uPitch','uZoom','uMode','uMM'])U[n]=gl.getUniformLocation(prog,n);
let yaw=-.22,pitch=.08,zoom=4.8,mode=0,mm=1,drag=false,last=[0,0],start=performance.now();
function resize(){const d=Math.min(devicePixelRatio||1,1.45),w=Math.max(2,Math.round(innerWidth*d)),h=Math.max(2,Math.round(innerHeight*d));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}}
function draw(){resize();gl.viewport(0,0,canvas.width,canvas.height);gl.useProgram(prog);gl.uniform2f(U.uRes,canvas.width,canvas.height);gl.uniform1f(U.uTime,(performance.now()-start)/1000);gl.uniform1f(U.uYaw,yaw);gl.uniform1f(U.uPitch,pitch);gl.uniform1f(U.uZoom,zoom);gl.uniform1i(U.uMode,mode);gl.uniform1f(U.uMM,mm);gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(draw);}draw();
canvas.addEventListener('pointerdown',e=>{drag=true;last=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-last[0],dy=e.clientY-last[1];last=[e.clientX,e.clientY];yaw-=dx*.006;pitch=Math.max(-1.05,Math.min(1.05,pitch+dy*.006));});for(const ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,()=>drag=false);canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(3.4,Math.min(7.2,zoom*Math.exp(e.deltaY*.001)));},{passive:false});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=Number(b.dataset.mode);document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));});document.getElementById('mm').onclick=e=>{mm=mm?0:1;e.currentTarget.textContent=mm?'Microscope 开':'Microscope 关';e.currentTarget.classList.toggle('active',!!mm);};document.getElementById('mm').classList.add('active');
</script>
</body></html>
