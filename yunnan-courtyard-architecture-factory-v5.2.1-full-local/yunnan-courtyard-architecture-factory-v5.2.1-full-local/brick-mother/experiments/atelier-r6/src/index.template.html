<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Brick Mother R6</title><style>/*STYLE*/</style></head><body data-version="R6.0.0">
<header><span>BRICK MOTHER <small>R6</small></span><nav><button id="previous">R5 对照</button><button id="togglePanel" aria-expanded="false">调材质</button></nav></header>
<section id="families" aria-label="七类实物"><button data-family="fired">烧结旧砖</button><button data-family="kiln">窑变旧砖</button><button data-family="adobe">纤维土坯</button><button data-family="dressed">粗凿砌筑石</button><button data-family="rubble">不规则毛石</button><button data-family="stone">层状毛石</button><button data-family="pebble">建筑卵石</button></section>
<div id="identity"><strong id="specimenName"></strong><span id="shapeName"></span><span id="materialName"></span></div>
<div id="recipes"><div id="rockControls" hidden><label for="rock">岩性</label><select id="rock" aria-label="选择岩性"><option value="1">花岗岩</option><option value="2">砂岩</option><option value="3">玄武岩</option><option value="4">石英岩</option><option value="5">板岩</option><option value="6">片麻岩</option><option value="7">大理岩</option></select><div class="rockButtons"><button data-rock="1">花岗</button><button data-rock="2">砂岩</button><button data-rock="3">玄武</button><button data-rock="4">石英</button><button data-rock="5">板岩</button><button data-rock="6">片麻</button><button data-rock="7">大理</button></div></div><span class="gesture">拖动旋转 · 滚轮缩放 · Shift 平移</span></div>
<main id="stage"><canvas id="view" aria-label="三维成品"></canvas><div id="views"><button data-face="front">正</button><button data-face="back">背</button><button data-face="left">左</button><button data-face="right">右</button><button data-face="top">顶</button><button data-face="bottom">底</button><button id="resetView">归位</button></div><div id="status" role="status"></div><div id="busy" hidden>生成中 <button id="cancel">取消</button></div><div id="error" hidden role="alert"></div></main>
<footer><div id="quickShapes"><button data-shape="long">长条</button><button data-shape="sample">厚块</button><button data-shape="half">断块</button><button data-shape="thin">薄片</button></div><div><button id="nextSeed">换一块</button><button id="spin">转台</button><button id="pause">暂停</button></div></footer>
<aside id="panel" hidden><div class="panelTitle"><span>成品属性</span><button id="closePanel">收起</button></div><label class="seedRow"><span>主种子</span><input id="seed" type="number" min="0" max="4294967295"></label><details><summary>分层种子</summary><div id="layerSeeds"></div></details><div id="sliders"></div><div class="presets"><button id="export">存参数</button><button id="import">载入</button><button id="resetAll">重置本类</button></div><input id="presetFile" type="file" accept="application/json,.json" hidden><button id="share">复制当前视图链接</button><input id="shareText" readonly hidden aria-label="当前视图网址"><p class="note">岩性调整会匹配砌筑石的破损配方；卵石保留圆磨形体。颜色和反光独立调整。数值是可调外观配方，尚未进行实物反射率标定。</p></aside>
<script>/*KERNEL*/</script><script>/*RENDERER*/</script><script>/*APP*/</script></body></html>
