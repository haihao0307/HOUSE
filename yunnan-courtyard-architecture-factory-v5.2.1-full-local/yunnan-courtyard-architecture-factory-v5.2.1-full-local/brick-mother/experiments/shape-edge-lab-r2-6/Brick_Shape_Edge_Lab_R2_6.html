<script>
'use strict';
const SOURCE='https://rawcdn.githack.com/haihao0307/HOUSE/030d84b979a8158d03398aa60da69e8e3315cd40/yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/experiments/material-microscope-lab-r2-1/Brick_Material_Microscope_Lab_R2_1.html';
const loading=document.getElementById('loading'),error=document.getElementById('error'),frame=document.getElementById('lab');
function fail(msg){loading.classList.add('hidden');error.textContent=msg;error.classList.remove('hidden');}
function rr(text,oldText,newText,label){if(!text.includes(oldText))throw new Error('继承点不匹配：'+label);return text.replace(oldText,newText);}
(async()=>{try{
 const r=await fetch(SOURCE,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let html=await r.text();
 html=rr(html,'<title>Brick Mother · 显微材质 R2.1</title>','<title>Brick Mother · R2.6 GLB边缘细节收尾</title>','title');
 html=rr(html,'BRICK MOTHER · 显微材质 R2.1','BRICK MOTHER · R2.6 GLB边缘细节收尾','heading');
 html=rr(html,'烧结砖 / Process · 共享形成遮罩 · 片元级显微结构','烧结砖 / R2.4大形锁定 · GLB只提供边缘细节','subtitle');
 html=rr(html,'<div class="label">B 基准 <small>基准参数 · 中心修复 · 显微开启</small></div><div class="label"><b>B 调参</b><small id="tunedLabel">增强预设 · 显微开启</small></div>','<div class="label">R2.4 基线 <small>B材质 · 大形/比例/厚度锁定</small></div><div class="label"><b>R2.6 细节收尾</b><small id="tunedLabel">同一大形 · 仅侧边起伏/缺口/磨蚀来自GLB观察</small></div>','labels');
 html=rr(html,'<span class="paneltitle">调参侧 · 显微贡献</span>','<span class="paneltitle">材质冻结 · 只比较边缘几何细节</span>','panel title');
 html=rr(html,'</style></head>','#mm,#enhance,#reset,.sliders{display:none!important}\n</style></head>','lock UI');
 html=rr(html,'uniform vec2 uRes;uniform vec2 uOrigin;uniform vec4 uMicro;uniform float uTime;uniform float uYaw;uniform float uPitch;uniform float uZoom;uniform int uMode;uniform float uMM;','uniform vec2 uRes;uniform vec2 uOrigin;uniform vec4 uMicro;uniform float uTime;uniform float uYaw;uniform float uPitch;uniform float uZoom;uniform int uMode;uniform float uMM;uniform float uDetail;','detail uniform');
 const oldMap='vec2 map(vec3 p){vec2 o=vec2(sdRoundBox(rotInv(p),vec3(1.04,.43,.50),.075),1.);float floorD=p.y+.72;if(floorD<o.x)o=vec2(floorD,2.);return o;}';
 const newMap=`float chipEllipsoid(vec3 p,vec3 c,vec3 r){vec3 q=(p-c)/r;return (length(q)-1.0)*min(r.x,min(r.y,r.z));}
float g1(float x,float c,float w){float t=(x-c)/w;return exp(-t*t);}
void r24Macro(inout vec3 q,inout vec3 b){
 float xn=q.x/1.04;
 q.y-=.018*xn+.006*sin(1.45*xn+.35)*(1.-.35*xn*xn)+.0035*sin(3.1*q.z+.7);
 q.z-=.006*sin(1.25*xn+.9)*(1.-.25*xn*xn);
 b.y+=.010*sin(1.85*xn-.45)+.005*sin(3.4*xn+1.1);
 b.z+=.004*sin(1.65*xn+.4);
}
void scanEdgeCharacter(inout vec3 q,inout vec3 b){
 // The scan is NOT a size reference. Only centered deviations from its side profiles are transferred.
 float x=clamp(q.x/1.04,-.88,.88),x2=x*x,x3=x2*x,x4=x2*x2;
 float wc=(-.023312*x4-.009120*x3+.017039*x2+.034702*x-.027084)+.025760;
 float wh=(-.001622*x4+.033412*x3+.017976*x2-.014182*x+.934419)-.938748;
 float tc=( .030877*x4-.060972*x3-.029240*x2+.020462*x+.022233)-.018658;
 float th=(-.014886*x4+.047145*x3-.037153*x2-.027845*x+.969717)-.958250;
 // Low-amplitude asymmetric waviness observed on the scanned long sides; mean dimensions remain R2.4.
 q.z-=.480*wc*.24; b.z+=.480*wh*.24;
 q.y-=.265*tc*.24; b.y+=.265*th*.24;
 // A few shallow side dents, kept below macro-shape scale.
 b.z-=.0040*g1(x,-.40,.055)+.0030*g1(x,.74,.050);
 b.y-=.0028*g1(x,-.16,.045)+.0023*g1(x,.40,.050);
}
float brickR24(vec3 q){
 vec3 b=vec3(1.04,.265,.480);r24Macro(q,b);float d=sdRoundBox(q,b,.055);
 d=max(d,-chipEllipsoid(q,vec3(-.69,.282,.494),vec3(.030,.020,.020)));
 d=max(d,-chipEllipsoid(q,vec3(-.16,-.279,.493),vec3(.022,.017,.018)));
 d=max(d,-chipEllipsoid(q,vec3(.69,.281,-.494),vec3(.024,.018,.018)));
 d=max(d,-chipEllipsoid(q,vec3(1.046,-.272,.474),vec3(.022,.018,.020)));
 return d;
}
float brickR26(vec3 q){
 vec3 b=vec3(1.04,.265,.480);r24Macro(q,b);scanEdgeCharacter(q,b);float d=sdRoundBox(q,b,.055);
 // Positions follow inward deviations sampled from the uploaded GLB edge sections; losses stay sparse and shallow.
 d=max(d,-chipEllipsoid(q,vec3(-.76,.270,.483),vec3(.026,.015,.014)));
 d=max(d,-chipEllipsoid(q,vec3(-.70,.271,-.482),vec3(.022,.014,.013)));
 d=max(d,-chipEllipsoid(q,vec3(-.37,.270,.484),vec3(.020,.013,.012)));
 d=max(d,-chipEllipsoid(q,vec3(-.25,-.270,.483),vec3(.024,.014,.013)));
 d=max(d,-chipEllipsoid(q,vec3(.31,-.270,.483),vec3(.021,.013,.012)));
 d=max(d,-chipEllipsoid(q,vec3(.52,-.270,.483),vec3(.020,.012,.012)));
 d=max(d,-chipEllipsoid(q,vec3(-.21,.270,-.483),vec3(.024,.014,.013)));
 d=max(d,-chipEllipsoid(q,vec3(.31,.270,-.483),vec3(.028,.015,.014)));
 d=max(d,-chipEllipsoid(q,vec3(.42,.270,-.483),vec3(.022,.013,.012)));
 d=max(d,-chipEllipsoid(q,vec3(.73,.270,-.482),vec3(.026,.014,.013)));
 d=max(d,-chipEllipsoid(q,vec3(-.15,-.270,-.483),vec3(.021,.013,.012)));
 d=max(d,-chipEllipsoid(q,vec3(.83,-.270,-.481),vec3(.022,.013,.012)));
 // End-corner losses are a touch stronger than mid-edge wear, matching the scan's silhouette without altering overall size.
 d=max(d,-chipEllipsoid(q,vec3(-1.043,-.263,-.468),vec3(.020,.025,.024)));
 d=max(d,-chipEllipsoid(q,vec3(1.043,.263,.469),vec3(.018,.022,.022)));
 // Two restrained shallow long-face dents for the scanned side-face feel; not texture noise.
 d=max(d,-chipEllipsoid(q,vec3(-.43,.025,.482),vec3(.035,.022,.010)));
 d=max(d,-chipEllipsoid(q,vec3(.58,-.055,-.482),vec3(.030,.020,.009)));
 return d;
}
vec2 map(vec3 p){vec3 q=rotInv(p);float d=mix(brickR24(q),brickR26(q),uDetail);vec2 o=vec2(d,1.);float floorD=p.y+.55;if(floorD<o.x)o=vec2(floorD,2.);return o;}`;
 html=rr(html,oldMap,newMap,'R2.4 macro + GLB edge detail geometry');
 html=rr(html,"const U={};for(const n of ['uRes','uOrigin','uMicro','uTime','uYaw','uPitch','uZoom','uMode','uMM'])U[n]=gl.getUniformLocation(prog,n);","const U={};for(const n of ['uRes','uOrigin','uMicro','uTime','uYaw','uPitch','uZoom','uMode','uMM','uDetail'])U[n]=gl.getUniformLocation(prog,n);",'uniform location');
 html=rr(html,'let values=[...enhanced],yaw=-.22,pitch=.08,zoom=4.8,mode=0,mm=1,drag=false,last=[0,0],pending=false,lost=false;','let values=[...reference],yaw=-.22,pitch=.08,zoom=4.8,mode=0,mm=1,drag=false,last=[0,0],pending=false,lost=false;','frozen B values');
 html=rr(html,'gl.uniform4fv(U.uMicro,panel?values:reference);gl.uniform1f(U.uMM,panel?mm:1);gl.drawArrays(gl.TRIANGLES,0,3);','gl.uniform4fv(U.uMicro,reference);gl.uniform1f(U.uMM,1);gl.uniform1f(U.uDetail,panel?1:0);gl.drawArrays(gl.TRIANGLES,0,3);','per-panel detail');
 html=rr(html,"document.getElementById('status').textContent='WebGL2 · R2.1 · '+['成品','高度','粗糙度','形成遮罩'][mode];","document.getElementById('status').textContent='WebGL2 · R2.6 EDGE DETAIL · '+['成品','高度','粗糙度','形成遮罩'][mode];",'status');
 html=rr(html,"refresh('增强预设');","refresh('基准参数');",'startup baseline');
 html=rr(html,'<span>材质实验 · 待视觉验收 · 尺度为模型倍率</span>','<span>左R2.4 / 右R2.6 · 大形相同 · 仅边缘几何细节不同</span>','footer');
 frame.addEventListener('load',()=>loading.classList.add('hidden'),{once:true});frame.srcdoc=html;
}catch(e){console.error(e);fail('R2.6 构建失败：'+e.message+'。旧版本未被修改。');}})();
