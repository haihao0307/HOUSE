<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brick Mother · V2.7.5 / V2.6</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#0d120e;color:#ece8dc}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d120e}
main{height:100svh;display:grid;grid-template-rows:auto minmax(0,1fr)}
nav{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid #ffffff16;background:#151b15}
button{min-height:40px;padding:7px 12px;border:1px solid #4d564a;border-radius:8px;background:#222a22;color:#e4e1d6;font:inherit;font-size:11px;cursor:pointer}
button:hover{background:#313a30}button.active{background:#463620;border-color:#d0a365;color:#ffe5bb}.release{margin-left:auto}
.stage{position:relative;min-height:0;background:#090d0a}.viewer{position:absolute;inset:0}iframe{display:block;width:100%;height:100%;border:0;background:#0d120e}
.loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:7px;padding:24px;background:#0d120e;color:#e8e2d4;z-index:3}.loading[hidden]{display:none}.loading small{color:#98a294;line-height:1.55}
@media(max-width:720px){nav{display:grid;grid-template-columns:1fr 1fr;padding:7px 8px}.release{grid-column:1/-1;margin-left:0}button{font-size:9px;padding:6px}}
</style>
</head>
<body>
<main>
<nav aria-label="V2.7.5 与 V2.6">
<button class="active" data-page="v275">V2.7.5</button>
<button data-page="v26">V2.6 高变化版</button>
<button type="button" id="release" class="release">停止显示 / 释放显存</button>
</nav>
<section class="stage">
<div id="viewer" class="viewer"></div>
<div id="loading" class="loading"><b>正在打开 V2.7.5…</b><small>当前只运行一个 WebGL 页面</small></div>
</section>
</main>
<script>
'use strict';
const PAGES={
  v275:{title:'正在打开 V2.7.5…',url:'./brick-mother-standalone-v2.7.5.html'},
  v26:{title:'正在打开 V2.6 高变化版…',url:'./brick-mother-standalone-v2.6.html'}
};
const viewer=document.getElementById('viewer'),loading=document.getElementById('loading');
let current='',frame=null,serial=0,watchdog=0;
function destroy(){serial++;clearTimeout(watchdog);if(frame){try{frame.src='about:blank'}catch{}frame.remove();frame=null}viewer.replaceChildren()}
function setButtons(key){document.querySelectorAll('button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===key))}
function openPage(key){
  if(!PAGES[key]||key===current)return;
  current=key;setButtons(key);loading.hidden=false;
  loading.querySelector('b').textContent=PAGES[key].title;
  loading.querySelector('small').textContent='先释放上一版本，再打开当前版本';
  destroy();const token=serial;
  setTimeout(()=>{
    if(token!==serial)return;
    const next=document.createElement('iframe');
    next.title=PAGES[key].title;next.allow='fullscreen; autoplay; xr-spatial-tracking';next.referrerPolicy='no-referrer';next.src=PAGES[key].url;
    next.addEventListener('load',()=>{if(next===frame){loading.hidden=true;clearTimeout(watchdog)}});
    frame=next;viewer.appendChild(next);
    watchdog=setTimeout(()=>{if(next===frame&&!loading.hidden)loading.querySelector('small').textContent='三维模型仍在生成；可按“停止显示”立即释放显存。'},18000);
  },140)
}
document.querySelectorAll('button[data-page]').forEach(b=>b.addEventListener('click',()=>openPage(b.dataset.page)));
document.getElementById('release').addEventListener('click',()=>{current='';setButtons('');destroy();loading.hidden=false;loading.querySelector('b').textContent='当前显示已经停止';loading.querySelector('small').textContent='WebGL 页面已销毁；请选择一个版本。'});
window.addEventListener('pagehide',destroy);window.addEventListener('beforeunload',destroy);openPage('v275');
</script>
</body>
</html>
