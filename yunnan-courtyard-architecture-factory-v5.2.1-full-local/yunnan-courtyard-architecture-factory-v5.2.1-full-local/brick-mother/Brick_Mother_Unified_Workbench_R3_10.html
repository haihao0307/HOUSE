<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brick Mother · 稳定工作台 R3.11</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#0d120e;color:#ece8dc}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d120e}
main{height:100svh;display:grid;grid-template-rows:auto auto minmax(0,1fr)}
header{padding:10px 14px;border-bottom:1px solid #ffffff16;background:#121812}
h1{margin:0 0 3px;font-size:14px}.sub{font-size:9px;color:#9da79a;line-height:1.45}
nav{display:flex;gap:7px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid #ffffff16;background:#151b15}
button{min-height:40px;padding:7px 11px;border:1px solid #4c554a;border-radius:8px;background:#222a22;color:#e5e2d8;font:inherit;font-size:11px;cursor:pointer}
button.active{background:#463620;border-color:#d0a365;color:#ffe5bb}button:hover{background:#313a30}.release{margin-left:auto}
.stage{position:relative;min-height:0;background:#090d0a}.viewer{position:absolute;inset:0}
iframe{display:block;width:100%;height:100%;border:0;background:#0d120e}
.loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:6px;padding:24px;background:#0d120e;color:#e8e2d4;z-index:2}.loading[hidden]{display:none}.loading small{color:#98a294;line-height:1.5}
.note{position:absolute;left:10px;bottom:9px;max-width:min(820px,calc(100% - 20px));padding:6px 8px;border-radius:7px;background:#0c110cc9;border:1px solid #ffffff14;color:#a7b0a3;font-size:8px;pointer-events:none;z-index:3}
@media(max-width:860px){header{padding:8px 10px}nav{padding:7px 8px;display:grid;grid-template-columns:1fr 1fr}button{font-size:9px;padding:6px}.release{margin-left:0}.sub{font-size:8px}.note{font-size:7px}}
</style>
</head>
<body>
<main>
<header>
<h1>BRICK MOTHER · 稳定工作台 R3.11</h1>
<div class="sub">现在只保留两个生产入口：固定墙体，以及砖／土砖／毛石。省电与精细墙体已并入同一页；老砖高变化、土砖三版和毛石三版共用同一材质算法。旧“单砖／砖墙／土墙”页面已从工作台彻底移除。</div>
</header>
<nav aria-label="工作台入口">
<button class="active" data-page="wall">固定墙体</button>
<button data-page="materials">砖 / 土砖 / 毛石</button>
<button type="button" id="release" class="release">停止显示 / 释放显存</button>
</nav>
<section class="stage">
<div id="viewer" class="viewer"></div>
<div id="loading" class="loading"><b>正在打开固定墙体…</b><small>当前只运行一个 WebGL 工作台</small></div>
<div class="note" id="note">固定墙体的省电和精细显示共用同一份 R3.8 冻结真值结构。</div>
</section>
</main>
<script>
'use strict';
const PAGES={
  wall:{
    title:'正在打开固定墙体…',
    note:'墙体页内部切换省电或精细显示；切换时先销毁上一 WebGL 页面。',
    url:'./Brick_Mother_Wall_R3_11.html'
  },
  materials:{
    title:'正在打开砖、土砖和毛石统一工作台…',
    note:'历史手工砖、完整老砖、老砖高变化、土砖三版和毛石三版共用一个生成内核与网格缓存。',
    url:'./Brick_Mother_Brick_Lab_R3_10.html?eco=1&profile=old-pbr-fired&mode=siblings&solo=1&focus=1'
  }
};
const viewer=document.getElementById('viewer');
const loading=document.getElementById('loading');
const note=document.getElementById('note');
let current='',frame=null,serial=0,watchdog=0;
function destroyFrame(){
  serial++;
  clearTimeout(watchdog);
  if(frame){try{frame.src='about:blank';}catch{}frame.remove();frame=null;}
  viewer.replaceChildren();
}
function setButtons(key){document.querySelectorAll('button[data-page]').forEach(button=>button.classList.toggle('active',button.dataset.page===key));}
function openPage(key){
  if(!PAGES[key]||key===current)return;
  current=key;
  setButtons(key);
  loading.hidden=false;
  loading.querySelector('b').textContent=PAGES[key].title;
  loading.querySelector('small').textContent='先释放上一工作台，再打开当前页面';
  note.textContent=PAGES[key].note;
  destroyFrame();
  const token=serial;
  setTimeout(()=>{
    if(token!==serial)return;
    const next=document.createElement('iframe');
    next.title=PAGES[key].title;
    next.allow='fullscreen; autoplay; xr-spatial-tracking';
    next.referrerPolicy='no-referrer';
    next.src=PAGES[key].url;
    next.addEventListener('load',()=>{
      if(next===frame){loading.hidden=true;clearTimeout(watchdog);}
    });
    frame=next;
    viewer.appendChild(next);
    watchdog=setTimeout(()=>{
      if(next===frame&&!loading.hidden)loading.querySelector('small').textContent='模型仍在生成；可按“停止显示”立即释放显存。';
    },18000);
  },160);
}
document.querySelectorAll('button[data-page]').forEach(button=>button.addEventListener('click',()=>openPage(button.dataset.page)));
document.getElementById('release').addEventListener('click',()=>{
  current='';
  setButtons('');
  destroyFrame();
  loading.hidden=false;
  loading.querySelector('b').textContent='当前显示已经停止';
  loading.querySelector('small').textContent='WebGL 页面已销毁，显存已释放；请重新选择一个入口。';
  note.textContent='稳定规则：一次只运行一个三维工作台。';
});
window.addEventListener('pagehide',destroyFrame);
window.addEventListener('beforeunload',destroyFrame);
openPage('wall');
</script>
</body>
</html>
