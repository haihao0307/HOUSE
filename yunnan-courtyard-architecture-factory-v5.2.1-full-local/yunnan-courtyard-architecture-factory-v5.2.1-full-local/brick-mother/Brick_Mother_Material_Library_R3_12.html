<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brick Mother · 材料总库</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#0d120e;color:#ece8dc}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d120e}
main{height:100svh;display:grid;grid-template-rows:auto auto minmax(0,1fr)}
header{padding:11px 14px;border-bottom:1px solid #ffffff16;background:#121812}
h1{margin:0;font-size:15px;letter-spacing:.025em}
nav{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid #ffffff16;background:#151b15}
button{min-height:40px;padding:7px 11px;border:1px solid #4d564a;border-radius:8px;background:#222a22;color:#e4e1d6;font:inherit;font-size:11px;cursor:pointer}
button:hover{background:#313a30}button.active{background:#463620;border-color:#d0a365;color:#ffe5bb}.release{margin-left:auto}
.stage{position:relative;min-height:0;background:#090d0a}.viewer{position:absolute;inset:0}iframe{display:block;width:100%;height:100%;border:0;background:#0d120e}
.loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:7px;padding:24px;background:#0d120e;color:#e8e2d4;z-index:3}.loading[hidden]{display:none}.loading small{color:#98a294;line-height:1.55}
.note{position:absolute;left:10px;bottom:9px;max-width:min(960px,calc(100% - 20px));padding:7px 9px;border:1px solid #ffffff14;border-radius:7px;background:#0c110cd9;color:#aab2a6;font-size:8px;line-height:1.5;pointer-events:none;z-index:2}
@media(max-width:860px){header{padding:9px 10px}nav{display:grid;grid-template-columns:1fr 1fr;padding:7px 8px}button{font-size:9px;padding:6px}.release{margin-left:0;grid-column:1/-1}.note{font-size:7px}}
</style>
</head>
<body>
<main>
<header><h1>材料总库</h1></header>
<nav aria-label="材料历史版本">
<button class="active" data-page="r6">R6 · 真稻壳 / 七岩性</button>
<button data-page="r72">R7.2 · 七类选定版</button>
<button data-page="r5">R5 · 形体基线</button>
<button data-page="compare">V2.7.5 / V2.6 高变化版</button>
<button type="button" id="release" class="release">停止显示 / 释放显存</button>
</nav>
<section class="stage">
<div id="viewer" class="viewer"></div>
<div id="loading" class="loading"><b>正在打开 R6 真稻壳与岩性全谱…</b><small>先释放上一工作台，再打开当前历史原版</small></div>
<div id="note" class="note">R6：真实小稻壳具有内面、外面、连接边缘和嵌入关系；同时保留花岗岩、砂岩、玄武岩、石英岩、板岩、片麻岩、大理岩等岩性配方。</div>
</section>
</main>
<script>
'use strict';
const PAGES={
 r6:{title:'正在打开 R6 真稻壳与岩性全谱…',url:'./experiments/atelier-r6/web/index.html',note:'R6 原版：真稻壳具备内外面、连接边缘和嵌入；七种岩性配方可切换，且保留土坯、砌筑石与卵石。'},
 r72:{title:'正在打开 R7.2 七类选定版…',url:'./experiments/atelier-r7/Brick_Mother_R7_2_StoneCloseout.html',note:'R7.2 原版：烧结旧砖、窑变旧砖、纤维土坯、粗凿砌筑石、不规则毛石、层状毛石、建筑卵石七类同屏入口。'},
 r5:{title:'正在打开 R5 形体基线…',url:'./experiments/atelier-r5/web/index.html',note:'R5 原版：保留已接近成功的砖、土坯、毛石与卵石形体基线；完整谷壳尚未在该版本启用。'},
 compare:{title:'正在打开 V2.7.5 / V2.6 高变化版…',url:'./Brick_Mother_V275_V26_Workbench_R3_13.html',note:'V2.7.5 与 V2.6 高变化版放在同一个工作台，内部只运行当前选择的一个 WebGL 页面。'}
};
const viewer=document.getElementById('viewer'),loading=document.getElementById('loading'),note=document.getElementById('note');
let current='',frame=null,serial=0,watchdog=0;
function destroy(){serial++;clearTimeout(watchdog);if(frame){try{frame.src='about:blank'}catch{}frame.remove();frame=null}viewer.replaceChildren()}
function buttons(key){document.querySelectorAll('button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===key))}
function openPage(key){
  if(!PAGES[key]||key===current)return;
  current=key;buttons(key);loading.hidden=false;
  loading.querySelector('b').textContent=PAGES[key].title;
  loading.querySelector('small').textContent='先销毁上一 WebGL 上下文，再载入当前工作台';
  note.textContent=PAGES[key].note;destroy();
  const token=serial;
  setTimeout(()=>{
    if(token!==serial)return;
    const f=document.createElement('iframe');
    f.title=PAGES[key].title;f.allow='fullscreen; autoplay; xr-spatial-tracking';f.referrerPolicy='no-referrer';f.src=PAGES[key].url;
    f.addEventListener('load',()=>{if(f===frame){loading.hidden=true;clearTimeout(watchdog)}});
    frame=f;viewer.appendChild(f);
    watchdog=setTimeout(()=>{if(f===frame&&!loading.hidden)loading.querySelector('small').textContent='工作台仍在生成三维网格；可按“停止显示”立即释放显存。'},18000);
  },160)
}
document.querySelectorAll('button[data-page]').forEach(b=>b.addEventListener('click',()=>openPage(b.dataset.page)));
document.getElementById('release').addEventListener('click',()=>{
  current='';buttons('');destroy();loading.hidden=false;
  loading.querySelector('b').textContent='当前显示已经停止';
  loading.querySelector('small').textContent='三维页面与 WebGL 上下文已销毁；请选择一个材料工作台。';
  note.textContent='材料总库只做入口编排，不删除、不改写历史原版。';
});
window.addEventListener('pagehide',destroy);window.addEventListener('beforeunload',destroy);openPage('r6');
</script>
</body>
</html>
