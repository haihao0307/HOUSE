<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="云南历史建筑组件工作台。按总体蓝图、地基、木结构、屋顶、瓦作、墙体、门窗和木纹分线工作。">
  <meta name="theme-color" content="#101512">
  <title>云南建筑组件工作台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/studio.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="返回组件工作台首页">
        <span class="brand-mark" aria-hidden="true">云</span>
        <span>
          <strong>云南建筑组件工作台</strong>
          <small>Yunnan Architecture Component Studio</small>
        </span>
      </a>
      <div class="topbar-actions">
        <span class="sync-pill" id="syncPill"><i></i>本机工作区已连接</span>
        <a class="ghost-button" href="../folk-building-production-line.html">返回生产线</a>
      </div>
    </header>

    <main id="app" class="app-main" aria-live="polite">
      <section class="loading-state">
        <div class="loader" aria-hidden="true"></div>
        <p>正在读取组件注册表</p>
      </section>
    </main>

    <footer class="site-footer">
      <span>HOUSE · 云南历史建筑生产线</span>
      <span id="footerBuild">组件工作台 V1</span>
    </footer>
  </div>

  <template id="hubTemplate">
    <section class="hero-panel">
      <div class="hero-copy">
        <span class="eyebrow">模块化生产总控</span>
        <h1>一栋建筑，八条独立生产线</h1>
        <p>每个工作室只处理一个明确范围。总体蓝图提供共同坐标，各组件完成视觉检查和生产锁定后进入总装。</p>
      </div>
      <div class="hero-actions">
        <button class="primary-button" data-action="open-all">同时打开八个工作室</button>
        <button class="secondary-button" data-action="export-workspace">导出总工作包</button>
      </div>
    </section>

    <section class="workspace-settings panel">
      <div class="section-heading">
        <div>
          <span class="section-kicker">当前样板</span>
          <h2>总装上下文</h2>
        </div>
        <span class="autosave-label">自动保存</span>
      </div>
      <div class="settings-grid">
        <label>建筑 ID<input id="buildingIdInput" type="text" autocomplete="off"></label>
        <label>建筑类型<input id="typologyInput" type="text" autocomplete="off"></label>
        <label>目标年代<input id="periodInput" type="text" autocomplete="off"></label>
        <label>总装版本<input id="assemblyVersionInput" type="text" autocomplete="off" placeholder="0.1.0"></label>
      </div>
    </section>

    <section class="pipeline-panel panel">
      <div class="section-heading">
        <div>
          <span class="section-kicker">依赖关系</span>
          <h2>生产路径</h2>
        </div>
        <div class="legend">
          <span><i class="status-dot draft"></i>草稿</span>
          <span><i class="status-dot review"></i>检查中</span>
          <span><i class="status-dot locked"></i>已锁定</span>
        </div>
      </div>
      <div class="pipeline-rail" id="pipelineRail"></div>
    </section>

    <section class="module-section">
      <div class="section-heading wide-heading">
        <div>
          <span class="section-kicker">独立工作室</span>
          <h2>组件生产线</h2>
        </div>
        <div class="progress-block">
          <strong id="lockedCount">0 / 8</strong>
          <span>生产锁定</span>
          <div class="progress-track"><i id="progressBar"></i></div>
        </div>
      </div>
      <div class="module-grid" id="moduleGrid"></div>
    </section>

    <section class="assembly-panel panel">
      <div class="section-heading">
        <div>
          <span class="section-kicker">总装门槛</span>
          <h2>组件版本清单</h2>
        </div>
        <button class="secondary-button compact" data-action="copy-assembly">复制总装清单</button>
      </div>
      <div class="assembly-table-wrap">
        <table class="assembly-table">
          <thead><tr><th>组件</th><th>状态</th><th>版本</th><th>更新时间</th><th>总装候选</th></tr></thead>
          <tbody id="assemblyTableBody"></tbody>
        </table>
      </div>
      <div class="assembly-summary" id="assemblySummary"></div>
    </section>
  </template>

  <template id="moduleTemplate">
    <nav class="breadcrumb" aria-label="当前位置">
      <a href="./">组件工作台</a><span>/</span><strong id="crumbModule"></strong>
    </nav>

    <section class="module-hero" id="moduleHero">
      <div>
        <span class="module-number" id="moduleNumber"></span>
        <span class="eyebrow">独立组件生产线</span>
        <h1 id="moduleName"></h1>
        <p id="moduleSummary"></p>
      </div>
      <div class="module-hero-actions">
        <a class="secondary-button" id="previewLink" target="_blank" rel="noopener">打开现有三维成果</a>
        <button class="primary-button" data-action="save-snapshot">保存本轮快照</button>
      </div>
    </section>

    <section class="module-status-strip panel">
      <label>当前状态<select id="statusSelect"></select></label>
      <label>模块版本<input id="versionInput" type="text" placeholder="0.1.0"></label>
      <label>计划独立库<input id="repoInput" type="text" readonly></label>
      <label>最后更新<input id="updatedInput" type="text" readonly></label>
      <label class="candidate-toggle"><input id="assemblyCandidateInput" type="checkbox"><span>列为总装候选</span></label>
    </section>

    <section class="module-layout">
      <div class="module-column">
        <section class="panel work-panel">
          <div class="section-heading">
            <div><span class="section-kicker">01 输入</span><h2>资料收件箱</h2></div>
            <button class="text-button" data-action="import-json">导入模块包</button>
          </div>
          <div class="drop-zone" id="dropZone" tabindex="0" role="button" aria-label="添加参考资料">
            <input id="fileInput" type="file" multiple hidden>
            <div class="drop-icon" aria-hidden="true">＋</div>
            <strong>拖入图片、PDF、JSON 或其他参考文件</strong>
            <span>资料保存在当前浏览器，可随模块包导出文件清单</span>
          </div>
          <div class="attachment-list" id="attachmentList"></div>
        </section>

        <section class="panel work-panel">
          <div class="section-heading"><div><span class="section-kicker">02 范围</span><h2>本模块负责什么</h2></div></div>
          <div class="chip-list" id="scopeList"></div>
          <div class="contract-box">
            <h3>标准输出</h3>
            <ul id="outputList"></ul>
          </div>
          <div class="dependency-box">
            <h3>上游依赖</h3>
            <div id="dependencyList"></div>
          </div>
        </section>
      </div>

      <div class="module-column main-column">
        <section class="panel work-panel editor-panel">
          <div class="section-heading">
            <div><span class="section-kicker">03 本轮工作</span><h2>要求与判断</h2></div>
            <span class="autosave-label">输入即保存</span>
          </div>
          <label class="editor-field"><span>这次要解决什么</span><textarea id="requirementsInput" rows="6" placeholder="写下本轮只允许处理的目标、参考范围和验收重点"></textarea></label>
          <label class="editor-field"><span>已经确认的决定</span><textarea id="decisionsInput" rows="5" placeholder="记录已经锁定的建筑判断、尺寸关系和视觉决定"></textarea></label>
          <label class="editor-field"><span>禁止事项</span><textarea id="forbiddenInput" rows="4" placeholder="记录本模块不能越过的边界"></textarea></label>
          <label class="editor-field"><span>仍需回答的问题</span><textarea id="questionsInput" rows="4" placeholder="把尚未解决的问题集中留在这里"></textarea></label>
          <label class="editor-field"><span>研究笔记与链接</span><textarea id="notesInput" rows="6" placeholder="可粘贴网址、观察记录、图片说明和资料索引"></textarea></label>
        </section>

        <section class="panel work-panel">
          <div class="section-heading">
            <div><span class="section-kicker">04 任务</span><h2>模块任务板</h2></div>
            <button class="text-button" data-action="add-task">添加任务</button>
          </div>
          <div class="task-list" id="taskList"></div>
        </section>
      </div>

      <div class="module-column">
        <section class="panel work-panel release-panel">
          <div class="section-heading"><div><span class="section-kicker">05 发布</span><h2>蒸馏与交付</h2></div></div>
          <div class="release-gates" id="releaseGates"></div>
          <button class="primary-button full" data-action="copy-handoff">复制给小李的交接内容</button>
          <button class="secondary-button full" data-action="export-module">导出模块 JSON</button>
          <button class="secondary-button full" data-action="create-issue">生成 GitHub 提交页</button>
          <button class="danger-button full" data-action="reset-module">清空本机模块数据</button>
          <p class="privacy-note">图片和文件保存在当前浏览器。导出的 JSON 包含文件名、类型、大小和校验信息，不包含文件本体。</p>
        </section>

        <section class="panel work-panel">
          <div class="section-heading"><div><span class="section-kicker">06 记录</span><h2>工作日志</h2></div></div>
          <div class="activity-log" id="activityLog"></div>
        </section>
      </div>
    </section>
  </template>

  <input type="file" id="jsonImportInput" accept="application/json,.json" hidden>
  <div class="toast-region" id="toastRegion" aria-live="polite"></div>

  <script defer src="assets/studio-core.js"></script>
  <script defer src="assets/studio-hub.js"></script>
  <script defer src="assets/studio-module.js"></script>
  <script defer src="assets/studio-actions.js"></script>
</body>
</html>
