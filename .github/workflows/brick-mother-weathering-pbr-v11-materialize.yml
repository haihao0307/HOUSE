name: Brick Mother Weathering PBR V1.1 Materialize

on:
  push:
    branches:
      - feature/brick-mother-v2.0-composite-material-dna
    paths:
      - ".github/workflows/brick-mother-weathering-pbr-v11-materialize.yml"
      - "private-review/brick-mother-weathering-pbr-v11/payload/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brick-mother-weathering-pbr-v11-materialize
  cancel-in-progress: false

env:
  TARGET_BRANCH: feature/brick-mother-v2.0-composite-material-dna
  PAYLOAD_ROOT: private-review/brick-mother-weathering-pbr-v11/payload
  BRICK_ROOT: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother
  CORE_BLOB: 7b10389cb9367f7423619262820883cc94b07a61
  PAYLOAD_SHA256: d37d58fd310e7192352736383fd6865b81e5be8fb95633757b2117fde9b53bc7

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout latest target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Decode and verify exact V1.1 payload
        shell: bash
        run: |
          set -euo pipefail
          for part in 00 01 02 03 04 05 06 07 08 09; do
            test -s "$PAYLOAD_ROOT/payload.$part.b64"
          done
          cat "$PAYLOAD_ROOT"/payload.{00,01,02,03,04,05,06,07,08,09}.b64 > /tmp/brick-mother-weathering-pbr-v11.b64
          base64 --decode /tmp/brick-mother-weathering-pbr-v11.b64 > /tmp/brick-mother-weathering-pbr-v11.tar.gz
          echo "$PAYLOAD_SHA256  /tmp/brick-mother-weathering-pbr-v11.tar.gz" | sha256sum --check --strict
          tar -tzf /tmp/brick-mother-weathering-pbr-v11.tar.gz
          tar -xzf /tmp/brick-mother-weathering-pbr-v11.tar.gz -C .

      - name: Validate preserved core and PBR contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$BRICK_ROOT/brick-mother-standalone-v2.7.5.html")" = "$CORE_BLOB"
          test -s "$BRICK_ROOT/workbench.html"
          test -s "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.0.0.html"
          test -s "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.css"
          test -s "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.js"
          test -s "$BRICK_ROOT/brick-mother-weathering-geometry-v1.js"
          test -s "$BRICK_ROOT/BRICK_MOTHER_REALTIME_WEATHERING_PBR_BUILD.json"
          node --check "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.js"
          node --check "$BRICK_ROOT/brick-mother-weathering-geometry-v1.js"
          grep -q "1.1.0-alpha.1" "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.js"
          grep -q 'id="compareMode"' "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.0.0.html"
          grep -q 'id="fullWeather"' "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.0.0.html"
          grep -q 'id="weatherMix"' "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.0.0.html"
          grep -q 'id="compareSplit"' "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.0.0.html"
          grep -q 'data-view="11"' "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.0.0.html"
          grep -q 'data-view="12"' "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.0.0.html"
          grep -q "dataset.baseColorSpace='sRGB'" "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.js"
          grep -q "dataset.dataChannelSpace='linear'" "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.js"
          grep -q "dataset.aoPolicy='diffuse-only'" "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.js"
          grep -q "dataset.heightFrequency='low-mid'" "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.js"
          grep -q "dataset.normalFrequency='high'" "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.js"
          grep -q "3.0.0-alpha.1" "$BRICK_ROOT/workbench.html"
          git diff --check
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json

          root=Path('yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother')
          build=json.loads((root/'BRICK_MOTHER_REALTIME_WEATHERING_PBR_BUILD.json').read_text())
          assert build['runtimeVersion']=='1.1.0-alpha.1'
          assert build['pbr']['metalness']==0
          assert build['pbr']['dielectricF0']==0.04
          assert build['pbr']['baseColorSpace']=='sRGB'
          assert build['pbr']['dataChannelSpace']=='linear'
          assert build['pbr']['aoPolicy']=='diffuse-only'
          assert build['pbr']['baseColorSafeRangeSRGB']==[30,240]
          assert build['diagnosticCount']==13

          class IdParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]
              def handle_starttag(self,tag,attrs):
                  for key,value in attrs:
                      if key=='id': self.ids.append(value)
          parser=IdParser(); parser.feed((root/'brick-mother-realtime-weathering-pbr-v1.0.0.html').read_text())
          assert len(parser.ids)==len(set(parser.ids)), 'duplicate HTML ids'
          required={'compareMode','fullWeather','weatherMix','compareSplit','simSpeed','compareLabels','compareDivider'}
          assert required.issubset(set(parser.ids)), required-set(parser.ids)
          PY

      - name: Commit integrated V1.1 workbench
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Brick Mother Automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.0.0.html" \
            "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.css" \
            "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.js" \
            "$BRICK_ROOT/BRICK_MOTHER_REALTIME_WEATHERING_PBR_BUILD.json" \
            "$BRICK_ROOT/workbench.html" \
            ".github/workflows/brick-mother-pages-preview.yml" \
            "docs/brick-mother/BRICK_MOTHER_REALTIME_WEATHERING_PBR_DNA_V1.0.md" \
            "docs/brick-mother/BRICK_MOTHER_REALTIME_WEATHERING_PBR_DNA_V1.0.json"
          if git diff --cached --quiet; then
            echo "V1.1 workbench is already materialized"
            exit 0
          fi
          git commit -m "feat(brick): integrate PBR realtime weathering workbench v1.1"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            fi
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH"
          done
          echo "unable to publish materialized V1.1 workbench" >&2
          exit 1
