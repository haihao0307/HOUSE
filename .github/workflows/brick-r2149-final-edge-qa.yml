name: Brick R2.14.9 Final Edge QA

on:
  push:
    branches:
      - codex/brick-r2143-continuous-surface-20260914

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser QA dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow numpy
          python -m playwright install --with-deps chromium
      - name: Verify fixed preview and capture front/side silhouettes
        shell: bash
        run: |
          cat > /tmp/qa.py <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image
          import numpy as np

          URL='https://rawcdn.githack.com/haihao0307/HOUSE/a9eac5bc51ea100e62be4b93086e2149e576104d/yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/experiments/shape-edge-lab-r2-14/Brick_Shape_Edge_Lab_R2_14_9.html'
          errors=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist'])
              context=browser.new_context(viewport={'width':1440,'height':900},device_scale_factor=1,user_agent='Brick-Mother-QA/2.14.9')
              context.add_cookies([{'name':'__Http-phish','value':'1','url':'https://rawcdn.githack.com/','secure':True,'httpOnly':True,'sameSite':'Lax'}])
              page=context.new_page()
              page.set_default_timeout(120000)
              page.on('pageerror',lambda exc: errors.append('pageerror: '+str(exc)))
              page.on('console',lambda msg: errors.append('console: '+msg.text) if msg.type=='error' else None)
              resp=page.goto(URL,wait_until='networkidle',timeout=120000)
              assert resp and resp.ok, f'public HTTP failed: {resp.status if resp else None}'
              page.wait_for_timeout(5000)
              assert 'R2.14.9' in page.title(), page.title()
              iframe=page.locator('#lab'); iframe.wait_for(state='attached',timeout=60000)
              frame=iframe.element_handle().content_frame()
              canvas=frame.locator('#c'); canvas.wait_for(state='attached',timeout=60000)
              frame.wait_for_function("document.querySelector('#c')?.dataset.ready === 'true'",timeout=60000)
              status=frame.locator('#status').inner_text()
              err=frame.locator('#error').inner_text() if frame.locator('#error').count() else ''
              print('STATUS',status); print('INNER_ERROR',err); print('ERRORS',errors)
              assert not errors, errors
              canvas.screenshot(path='/tmp/r2149-front.png',timeout=120000)
              box=canvas.bounding_box(); assert box
              x=box['x']+box['width']*.72; y=box['y']+box['height']*.45
              page.mouse.move(x,y); page.mouse.down(); page.mouse.move(x+230,y+12,steps=8); page.mouse.up()
              page.wait_for_timeout(1200)
              page.screenshot(path='/tmp/r2149-side-a.png',full_page=True,timeout=120000)
              page.mouse.move(x+230,y+12); page.mouse.down(); page.mouse.move(x-170,y-6,steps=12); page.mouse.up()
              page.wait_for_timeout(1200)
              page.screenshot(path='/tmp/r2149-side-b.png',full_page=True,timeout=120000)
              for fn in ['r2149-front.png','r2149-side-a.png','r2149-side-b.png']:
                  im=np.asarray(Image.open('/tmp/'+fn).convert('RGB'))
                  print(fn,'SIZE',im.shape,'STD',float(im.std()))
                  assert im.std()>8, fn+' looks blank'
              browser.close()
          PY
          python /tmp/qa.py
      - name: Upload final edge QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-r2149-final-edge-qa
          path: /tmp/r2149-*.png
          if-no-files-found: ignore
