          css_path.write_text(css, encoding='utf-8')

          version_path = root / 'VERSION.json'
          version = json.loads(version_path.read_text(encoding='utf-8'))
          version['version'] = '2.7.5-alpha.1'
          version['releaseDate'] = '2026-08-29'
          version['status'] = 'mobile-fast-preview-alpha'
          version.setdefault('engineLineage', {})['materialGeometryEngine'] = '2.7.5-alpha.1'
          version['engineLineage']['releaseMeaning'] = 'Mobile-first progressive loading with a single low-cost benchmark slab, reduced mobile SDF grid, capped device pixel ratio, visible bootstrap preview, and optional full three-material generation.'
          caps = version.setdefault('capabilities', {})
          caps.update({
              'mobileFastPreview': True,
              'progressiveFamilyLoad': True,
              'mobileLowGridSdf': True,
              'mobileDprCap': True,
              'visibleBootstrapPreview': True,
              'iosFilePreviewFallback': True,
          })
          version.setdefault('approval', {})['productionStatus'] = False
          version_path.write_text(json.dumps(version, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          contract_path = root / 'qa/v27-visual-truth-contract.json'
          contract = json.loads(contract_path.read_text(encoding='utf-8'))
          contract['mobileRuntime'] = {
              'defaultMode': 'single-benchmark-slab-fast-preview',
              'fullFamilyIsExplicit': True,
              'quickGridMinimum': [16, 16, 12],
              'devicePixelRatioCap': 1.20,
              'bootstrapPreviewVisibleBeforeWebGLReady': True,
              'failureKeepsVisiblePreview': True,
