  }
  body.mobile-runtime .toolbar .tool-button { min-width: 0; padding: 9px 6px; font-size: 11px; }
  body.mobile-runtime #exportDNA,
  body.mobile-runtime #showReference,
  body.mobile-runtime #resetView { display: none; }
