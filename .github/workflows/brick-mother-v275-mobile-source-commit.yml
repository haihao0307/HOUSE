  body.mobile-runtime .viewer { width: 100vw; height: 100svh; min-height: 620px; border: 0; border-radius: 0; }
  body.mobile-runtime #brickCanvas { width: 100vw !important; height: 100svh !important; }
  body.mobile-runtime .viewer-hud { top: 88px; left: 14px; right: 14px; max-width: none; padding: 9px 11px; }
  body.mobile-runtime .viewer-hud b { font-size: 11px; }
  body.mobile-runtime .viewer-hud p { margin-top: 4px; font-size: 10px; }
  body.mobile-runtime .toolbar {
