name: Brick Mother V2.7.5 Mobile Fast Preview Source Commit

on:
  push:
    branches:
      - feature/brick-mother-v2.0-composite-material-dna
    paths:
      - ".github/workflows/brick-mother-v275-mobile-source-commit.yml"

permissions:
  contents: write

jobs:
  apply-gate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feature/brick-mother-v2.0-composite-material-dna
          fetch-depth: 0

      - name: Apply V2.7.5 mobile fast preview runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother')

          def must_replace(text, old, new, label):
              if old not in text:
                  raise RuntimeError(f'missing patch anchor: {label}')
              return text.replace(old, new, 1)

          app_path = root / 'brick-mother-app-v2.js'
          app = app_path.read_text(encoding='utf-8')
          app = must_replace(
              app,
              "const QUERY = new URLSearchParams(window.location.search);\nconst REBUILD_CONTROL_KEYS",
              """const QUERY = new URLSearchParams(window.location.search);
const MOBILE_QUERY = QUERY.get('mobile');
const MOBILE_RUNTIME = MOBILE_QUERY === '1' || (MOBILE_QUERY !== '0' && (
  /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
  ((window.matchMedia?.('(pointer: coarse)')?.matches ?? false) &&
    Math.min(window.innerWidth || 9999, window.innerHeight || 9999) < 920)
));
const REBUILD_CONTROL_KEYS""",
              'mobile detector',
          )
          app = must_replace(
              app,
              """  evidenceMode: QUERY.get('evidence') === '1',
  evidenceFocus: Math.max(0, Math.min(2, Math.round(Number(QUERY.get('focus') ?? 1) || 1))),
  soloMode: QUERY.get('solo') === '1',
  benchmarkMode: QUERY.get('specimen') !== 'historical'
""",
              """  evidenceMode: QUERY.get('evidence') === '1',
  mobileMode: MOBILE_RUNTIME,
  fullFamilyRequested: QUERY.get('full') === '1',
  mobileQuickProfile: QUERY.get('profile') || 'old-pbr-fired',
  evidenceFocus: Math.max(0, Math.min(2, Math.round(Number(QUERY.get('focus') ?? 1) || 1))),
  soloMode: QUERY.get('solo') === '1' || (MOBILE_RUNTIME && QUERY.get('full') !== '1'),
  benchmarkMode: QUERY.get('specimen') !== 'historical'
""",
              'mobile state',
          )
          app = must_replace(
              app,
              """function showFatal(error) {
  const node = $('#fatal');
  if (!node) return;
  node.hidden = false;
  node.textContent = `页面初始化失败：${error?.message || error}`;
}
""",
              """function showFatal(error) {
  const node = $('#fatal');
  if (node) {
    node.hidden = false;
    node.textContent = `页面初始化失败：${error?.message || error}`;
  }
  if (state.mobileMode) {
    document.body.classList.add('runtime-failed');
    $('#loadingMask')?.classList.remove('on');
    const copy = $('#mobileBootstrapCopy');
    if (copy) copy.innerHTML = '<b>当前预览器没有完成三维初始化</b><span>页面已保留可见预览。用 Safari 打开同一 HTML 可继续进入手机快速三维模式。</span>';
  }
}
""",
              'mobile fatal fallback',
          )
          app = must_replace(
              app,
              """  result.benchmarkSlab = state.benchmarkMode ? 1 : 0;
  return normalizeControls(result);
""",
              """  result.benchmarkSlab = state.benchmarkMode ? 1 : 0;
  result.mobilePreview = state.mobileMode && !state.fullFamilyRequested ? 1 : 0;
  return normalizeControls(result);
""",
              'mobile control flag',
          )

          mobile_functions = r'''
function mobileQuickActive() {
  return state.mobileMode && !state.fullFamilyRequested;
}

function syncMobileRuntimeUI() {
  if (!state.mobileMode) return;
  const button = $('#mobileFullFamily');
  if (button) {
    button.textContent = state.fullFamilyRequested ? '返回手机快速单块' : '加载完整三材质';
    button.classList.toggle('on', state.fullFamilyRequested);
  }
  const copy = $('#mobileBootstrapCopy');
  if (copy && !document.body.classList.contains('runtime-failed')) {
    copy.innerHTML = mobileQuickActive()
      ? '<b>手机快速预览</b><span>先生成一块低负载基准方砖，完成后可再加载完整三材质。</span>'
      : '<b>手机完整三材质</b><span>正在依次生成烧结砖、石材和土砖，耗时会高于快速单块。</span>';
  }
}

function installMobileRuntimeUI() {
  if (!state.mobileMode) return;
  document.body.classList.add('mobile-runtime');
  document.documentElement.dataset.mobileRuntime = 'true';
  const viewer = $('.viewer');
  if (viewer && !$('#mobileBootstrapPreview')) {
    const preview = document.createElement('div');
    preview.id = 'mobileBootstrapPreview';
    preview.className = 'mobile-bootstrap-preview';
    preview.innerHTML = `
      <div class="mobile-bootstrap-brick" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
      <div class="mobile-bootstrap-copy" id="mobileBootstrapCopy"></div>
    `;
    viewer.prepend(preview);
  }
  const toolbar = $('.toolbar');
  if (toolbar && !$('#mobileFullFamily')) {
    const button = document.createElement('button');
    button.className = 'tool-button mobile-family-button';
    button.id = 'mobileFullFamily';
    button.addEventListener('click', () => {
      state.fullFamilyRequested = !state.fullFamilyRequested;
      if (state.fullFamilyRequested) {
        state.batchMode = 'mixed';
        state.soloMode = false;
      } else {
        state.selectedProfile = state.profiles.has(state.mobileQuickProfile)
          ? state.mobileQuickProfile
          : 'old-pbr-fired';
        state.batchMode = 'siblings';
        state.soloMode = true;
        state.evidenceFocus = 1;
        const profile = state.profiles.get(state.selectedProfile);
        updateProfilePanel(profile);
        loadProfileDNA(profile);
      }
      $$('.mode-button').forEach((item) => item.classList.toggle('on', item.dataset.mode === state.batchMode));
      $$('.profile-button').forEach((item) => item.classList.toggle('on', item.dataset.profile === state.selectedProfile && state.batchMode === 'siblings'));
      $('#soloView').classList.toggle('on', state.soloMode);
      $('#soloView').textContent = state.soloMode ? '返回家族' : '单块近景';
      syncMobileRuntimeUI();
      buildCurrentBatch();
    });
    toolbar.prepend(button);
  }
  syncMobileRuntimeUI();
}

'''
          app = must_replace(app, 'function scheduleBuild(delay = 220) {', mobile_functions + 'function scheduleBuild(delay = 220) {', 'mobile functions')
          app = must_replace(
              app,
              """  setProgress('正在复合八类种子、Gaea 场图、深孔几何和多层材料事件场…', 4);
""",
              """  setProgress(
    mobileQuickActive()
      ? '手机快速模式：先生成一块低负载基准方砖…'
      : '正在复合八类种子、Gaea 场图、深孔几何和多层材料事件场…',
    4
  );
""",
              'mobile progress copy',
          )
          app = must_replace(
              app,
              """      const quality = state.evidenceMode ? 0.78 : (state.soloMode ? 1.00 : (state.benchmarkMode ? 0.72 : 1.04));
""",
              """      const quality = state.mobileMode
        ? (state.fullFamilyRequested ? 0.56 : 0.30)
        : (state.evidenceMode ? 0.78 : (state.soloMode ? 1.00 : (state.benchmarkMode ? 0.72 : 1.04)));
""",
              'mobile quality',
          )
          app = must_replace(
              app,
              """    setProgress('V2.7 视觉真值结构生成完成。可检查宏观片层、定向地质、悬沿深腔和土坯纤维束。', 100);
""",
              """    setProgress(
      mobileQuickActive()
        ? '手机快速预览完成。现在可以旋转、缩放，或加载完整三材质。'
        : 'V2.7.5 视觉真值结构生成完成。可检查三类材料与复合事件。',
      100
    );
""",
              'mobile completion copy',
          )
          app = must_replace(
              app,
              """    document.documentElement.dataset.benchmarkSpecimen = state.benchmarkMode ? 'true' : 'false';
""",
              """    document.documentElement.dataset.benchmarkSpecimen = state.benchmarkMode ? 'true' : 'false';
    document.documentElement.dataset.mobileRuntime = state.mobileMode ? 'true' : 'false';
    document.documentElement.dataset.mobileQuick = mobileQuickActive() ? 'true' : 'false';
    document.documentElement.dataset.mobileGridProfile = mobileQuickActive() ? 'quick' : (state.mobileMode ? 'family' : 'desktop');
""",
              'mobile datasets',
          )
          app = must_replace(
              app,
              """      benchmarkSpecimen: state.benchmarkMode,
""",
              """      benchmarkSpecimen: state.benchmarkMode,
      mobileRuntime: state.mobileMode,
      mobileQuickPreview: mobileQuickActive(),
      progressiveFamilyLoad: state.mobileMode,
""",
              'mobile QA fields',
          )
          app = must_replace(
              app,
              """    state.debugMode = Math.max(0, Math.min(10, Math.round(Number(QUERY.get('debug') ?? 0) || 0)));
""",
              """    if (state.mobileMode && !state.fullFamilyRequested && !state.evidenceMode) {
      state.selectedProfile = state.profiles.has(state.mobileQuickProfile)
        ? state.mobileQuickProfile
        : 'old-pbr-fired';
      state.batchMode = 'siblings';
      state.soloMode = true;
      state.evidenceFocus = 1;
      state.benchmarkMode = true;
    }
    state.debugMode = Math.max(0, Math.min(10, Math.round(Number(QUERY.get('debug') ?? 0) || 0)));
""",
              'mobile main override',
          )
          app = must_replace(
              app,
              """    state.seedBank = seedBankForProfile(profile);
    state.renderer = new BrickRenderer($('#brickCanvas'));
""",
              """    state.seedBank = seedBankForProfile(profile);
    installMobileRuntimeUI();
    state.renderer = new BrickRenderer($('#brickCanvas'));
""",
              'install mobile UI before renderer',
          )
          app = app.replace('2.7.4-alpha.1', '2.7.5-alpha.1')
          app = app.replace('Brick Mother V2.7.4', 'Brick Mother V2.7.5')
          app_path.write_text(app, encoding='utf-8')

          geometry_path = root / 'brick-mother-geometry-v2.js'
          geometry = geometry_path.read_text(encoding='utf-8')
          geometry = must_replace(
              geometry,
              """    poreVariety: number('poreVariety', 1.08, 0.20, 1.80),
    benchmarkSlab: number('benchmarkSlab', 1.0, 0, 1)
""",
              """    poreVariety: number('poreVariety', 1.08, 0.20, 1.80),
    benchmarkSlab: number('benchmarkSlab', 1.0, 0, 1),
    mobilePreview: number('mobilePreview', 0.0, 0, 1)
""",
              'mobile geometry control',
          )
          geometry = must_replace(
              geometry,
              """  const benchmark = (field.controls.benchmarkSlab ?? 0) > 0.5;
  const target = Math.round(52 * quality);
  const nx = clamp(Math.round(target * size.x / longest), benchmark ? 38 : 24, target);
  const ny = clamp(Math.round(target * size.y / longest), benchmark ? 38 : 20, target);
  const nz = clamp(Math.round(target * size.z / longest), benchmark ? 24 : 22, target);
""",
              """  const benchmark = (field.controls.benchmarkSlab ?? 0) > 0.5;
  const mobilePreview = (field.controls.mobilePreview ?? 0) > 0.5;
  const target = Math.max(mobilePreview ? 16 : 24, Math.round(52 * quality));
  const minX = mobilePreview ? 16 : (benchmark && quality < 0.62 ? 26 : (benchmark ? 38 : 24));
  const minY = mobilePreview ? 16 : (benchmark && quality < 0.62 ? 26 : (benchmark ? 38 : 20));
  const minZ = mobilePreview ? 12 : (benchmark && quality < 0.62 ? 16 : (benchmark ? 24 : 22));
  const nx = clamp(Math.round(target * size.x / longest), Math.min(minX, target), target);
  const ny = clamp(Math.round(target * size.y / longest), Math.min(minY, target), target);
  const nz = clamp(Math.round(target * size.z / longest), Math.min(minZ, target), target);
""",
              'mobile grid profile',
          )
          geometry = must_replace(
              geometry,
              '  const maxVertices = 420000;',
              '  const maxVertices = mobilePreview ? 120000 : 420000;',
              'mobile vertex cap',
          )
          geometry = re.sub(r"noiseVersion: '[^']+'", "noiseVersion: 'v2.7.5-mobile-fast-preview-alpha1'", geometry, count=1)
          geometry_path.write_text(geometry, encoding='utf-8')

          renderer_path = root / 'brick-mother-renderer-v2.js'
          renderer = renderer_path.read_text(encoding='utf-8')
          renderer = must_replace(
              renderer,
              """  resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
""",
              """  resize() {
    const mobileRuntime = document.documentElement.dataset.mobileRuntime === 'true' || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    const dpr = Math.min(devicePixelRatio || 1, mobileRuntime ? 1.20 : 2);
""",
              'mobile DPR cap',
          )
          renderer_path.write_text(renderer, encoding='utf-8')

          index_path = root / 'index.html'
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('20260829-v273-reference-pore-contrast', '20260829-v275-mobile-fast-preview')
          index = index.replace('COMPOSITE MATERIAL DNA · V2.7 VISUAL TRUTH FORMATION', 'COMPOSITE MATERIAL DNA · V2.7.5 MOBILE FAST PREVIEW')
          index = index.replace('V2.7 视觉真值结构', 'V2.7.5 手机快速预览')
          index = index.replace('Brick Mother V2.7 视觉真值基准子代', 'Brick Mother V2.7.5 手机与桌面视觉真值子代')
          index_path.write_text(index, encoding='utf-8')

          css_path = root / 'visual-calibration.css'
          css = css_path.read_text(encoding='utf-8')
          css += r'''

/* Brick Mother V2.7.5 mobile fast preview */
.mobile-bootstrap-preview {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: none;
  place-items: center;
  align-content: center;
  gap: 18px;
  padding: 28px;
  background: radial-gradient(circle at 50% 34%, rgba(113,68,42,.22), transparent 44%), #090b0a;
  transition: opacity .35s ease, visibility .35s ease;
}
.mobile-bootstrap-brick {
  position: relative;
  width: min(74vw, 330px);
  aspect-ratio: 1.08;
  overflow: hidden;
  border-radius: 28px 22px 30px 20px;
  background:
    radial-gradient(ellipse at 72% 24%, rgba(223,174,116,.72) 0 3%, transparent 3.8%),
    radial-gradient(ellipse at 28% 70%, rgba(35,18,12,.96) 0 5%, rgba(88,43,26,.72) 6%, transparent 8%),
    radial-gradient(ellipse at 78% 67%, rgba(28,16,12,.88) 0 3%, transparent 4.5%),
    radial-gradient(ellipse at 42% 40%, rgba(165,74,37,.84), transparent 28%),
    radial-gradient(ellipse at 64% 52%, rgba(58,41,34,.84), transparent 34%),
    linear-gradient(145deg, #a75f34 0%, #73371f 43%, #3c302b 74%, #98704d 100%);
  box-shadow: 0 30px 75px rgba(0,0,0,.65), inset 12px 10px 28px rgba(255,211,160,.16), inset -18px -20px 35px rgba(0,0,0,.58);
  transform: perspective(720px) rotateY(-8deg) rotateX(2deg);
}
.mobile-bootstrap-brick::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: .58;
  background:
    repeating-radial-gradient(circle at 30% 40%, rgba(255,255,255,.10) 0 1px, transparent 1.5px 7px),
    linear-gradient(112deg, transparent 0 32%, rgba(21,13,10,.58) 33% 35%, transparent 36% 100%);
  mix-blend-mode: overlay;
}
.mobile-bootstrap-brick i {
  position: absolute;
  width: 26px;
  height: 20px;
  border-radius: 58% 42% 53% 47%;
  background: radial-gradient(circle at 43% 42%, #090807 0 36%, #3b2118 48%, rgba(151,84,47,.54) 64%, transparent 70%);
  filter: drop-shadow(2px 3px 2px rgba(0,0,0,.68));
}
.mobile-bootstrap-brick i:nth-child(1) { left: 16%; top: 25%; transform: scale(.72) rotate(18deg); }
.mobile-bootstrap-brick i:nth-child(2) { left: 69%; top: 19%; transform: scale(1.18) rotate(-12deg); }
.mobile-bootstrap-brick i:nth-child(3) { left: 31%; top: 62%; transform: scale(1.35) rotate(7deg); }
.mobile-bootstrap-brick i:nth-child(4) { left: 76%; top: 69%; transform: scale(.82) rotate(25deg); }
.mobile-bootstrap-brick i:nth-child(5) { left: 54%; top: 43%; transform: scale(.48) rotate(-8deg); }
.mobile-bootstrap-brick i:nth-child(6) { left: 12%; top: 78%; transform: scale(.54) rotate(31deg); }
