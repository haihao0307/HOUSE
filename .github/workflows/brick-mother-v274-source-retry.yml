name: Brick Mother V2.7.4 Shallow Cavity Source Retry

on:
  push:
    branches:
      - feature/brick-mother-v2.0-composite-material-dna
    paths:
      - ".github/workflows/brick-mother-v274-source-retry.yml"

permissions:
  contents: write

jobs:
  apply-gate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feature/brick-mother-v2.0-composite-material-dna
          fetch-depth: 0

      - name: Reconstruct exact deterministic V2.7.4 scripts
        shell: bash
        run: |
          set -euo pipefail
          cat .github/brick-mother-v274-tune/part-*.b64 > /tmp/brick-mother-v274-scripts.b64
          echo '0fdcdf694aa48015382d0950d24e8b6e84dfffd8063c109a55ba7951160734d8  /tmp/brick-mother-v274-scripts.b64' | sha256sum -c -
          base64 -d /tmp/brick-mother-v274-scripts.b64 > /tmp/brick-mother-v274-scripts.tar.xz
          echo 'c367d22eed7771b5a4015b8c2d3d0bdb3aa6fd6da0b4d3a9170c61bbcdf4928c  /tmp/brick-mother-v274-scripts.tar.xz' | sha256sum -c -
          mkdir -p /tmp/brick-mother-v274
          tar -xJf /tmp/brick-mother-v274-scripts.tar.xz -C /tmp/brick-mother-v274
          echo 'd970c330b0126014995e5fd434523bc76c9a226db1f9b9b25974ac7b468d0696  /tmp/brick-mother-v274/apply_v274.py' | sha256sum -c -
          echo '3f27ebba43a65a534ed7f49c7a58be30bb3f3f7e806a63936ed59e1b053969ba  /tmp/brick-mother-v274/build_standalone_v274.py' | sha256sum -c -
          python3 -m py_compile /tmp/brick-mother-v274/apply_v274.py /tmp/brick-mother-v274/build_standalone_v274.py

      - name: Apply V2.7.4 shallow cavity and fired color patch
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/brick-mother-v274/apply_v274.py
          python3 /tmp/brick-mother-v274/build_standalone_v274.py

      - name: Validate V2.7.4 source and standalone
        shell: bash
        run: |
          set -euxo pipefail
          brick="yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother"
          node --check "$brick/brick-mother-gaea-kernel-v1.js"
          node --check "$brick/brick-mother-geometry-v2.js"
          node --check "$brick/brick-mother-renderer-v2.js"
          node --check "$brick/brick-mother-app-v2.js"
          python3 -m json.tool "$brick/data/brick-material-profiles-v2.json" >/dev/null
          python3 -m json.tool "$brick/qa/gaea-distillation-contract-v1.json" >/dev/null
          python3 -m json.tool "$brick/qa/v27-visual-truth-contract.json" >/dev/null
          python3 -m json.tool "$brick/VERSION.json" >/dev/null
          grep -q '"version": "2.7.4-alpha.1"' "$brick/VERSION.json"
          grep -q '"shallowNonPerforatingCavities": true' "$brick/VERSION.json"
          grep -q '"firedClayBroadChromaticZones": true' "$brick/VERSION.json"
          grep -q 'v2.7.4-shallow-cavity-rich-fired-alpha1' "$brick/brick-mother-geometry-v2.js"
          grep -q 'Math.min(0.235 \* minD' "$brick/brick-mother-geometry-v2.js"
          grep -q 'vec3 brickRed = vec3(0.185' "$brick/brick-mother-renderer-v2.js"
          grep -q 'float poreOrganicA' "$brick/brick-mother-renderer-v2.js"
          standalone="$brick/brick-mother-standalone-v2.7.4.html"
          test -s "$standalone"
          test "$(wc -c < "$standalone")" -gt 180000
          ! grep -q '<script src=' "$standalone"
          ! grep -q '<link rel="stylesheet"' "$standalone"
          grep -q 'window.__BRICK_MOTHER_INLINE_DATA__' "$standalone"
          grep -q 'DOMContentLoaded' "$standalone"
          sha256sum "$standalone" > /tmp/brick-mother-v274-standalone.sha256

      - name: Gate V2.7.4 fired benchmark slab in Chromium
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          uri="$(python3 - <<'PY'
          from pathlib import Path
          print(Path('yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/brick-mother-standalone-v2.7.4.html').resolve().as_uri())
          PY
          )"
          timeout 480s "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-background-networking \
            --allow-file-access-from-files \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --enable-unsafe-swiftshader \
            --use-gl=angle \
            --use-angle=swiftshader \
            --hide-scrollbars \
            --window-size=1600,1000 \
            --virtual-time-budget=12000 \
            --screenshot=/tmp/brick-mother-v274-fired-gate.png \
            --dump-dom \
            "${uri}?evidence=1&solo=1&specimen=benchmark&profile=old-pbr-fired&focus=2&debug=0&qa=v274-source-retry" \
            > /tmp/brick-mother-v274-source-dom.html \
            2> /tmp/brick-mother-v274-source-chrome.log
          grep -q 'data-brick-mother-ready="true"' /tmp/brick-mother-v274-source-dom.html
          grep -q 'data-brick-mother-version="2.7.4-alpha.1"' /tmp/brick-mother-v274-source-dom.html
          grep -q 'data-benchmark-specimen="true"' /tmp/brick-mother-v274-source-dom.html
          grep -Eq 'data-deep-pores="[1-9][0-9]*"' /tmp/brick-mother-v274-source-dom.html
          grep -Eq 'data-pore-rim-chips="[1-9][0-9]*"' /tmp/brick-mother-v274-source-dom.html
          grep -q 'data-debug-modes="11"' /tmp/brick-mother-v274-source-dom.html
          test -s /tmp/brick-mother-v274-fired-gate.png
          test "$(wc -c < /tmp/brick-mother-v274-fired-gate.png)" -gt 120000

      - name: Commit browser gated V2.7.4 source
        shell: bash
        run: |
          set -euo pipefail
          brick="yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother"
          git restore --source=HEAD --staged --worktree .github/workflows
          rm -rf .github/brick-mother-v274-tune
          git config user.name "Brick Mother V2.7.4 Calibration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A "$brick" .github/brick-mother-v274-tune
          if git diff --cached --quiet; then
            echo 'No V2.7.4 source changes to commit' >&2
            exit 1
          fi
          git commit -m "Tune Brick Mother V2.7.4 shallow cavities and fired color zones"
          git push origin HEAD:feature/brick-mother-v2.0-composite-material-dna

      - name: Upload V2.7.4 source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-mother-v274-source-retry-evidence
          path: |
            /tmp/brick-mother-v274-fired-gate.png
            /tmp/brick-mother-v274-source-dom.html
            /tmp/brick-mother-v274-source-chrome.log
            /tmp/brick-mother-v274-standalone.sha256
            yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/brick-mother-standalone-v2.7.4.html
            yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/VERSION.json
            yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/qa/v27-visual-truth-contract.json
          compression-level: 1
          if-no-files-found: ignore
