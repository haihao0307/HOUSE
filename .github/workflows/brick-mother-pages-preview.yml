name: Brick Mother V1.3 Archived Audit

# V1.3 is retained for source history only. Canonical Pages deployment is owned
# by brick-mother-canonical-pages.yml and must open the frozen V2.7.5 core.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BRICK_ROOT: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother
  PRESERVED_CORE_BLOB: 7b10389cb9367f7423619262820883cc94b07a61

jobs:
  archived-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Verify retained source and approval state
        shell: bash
        run: |
          set -euo pipefail
          test -s "$BRICK_ROOT/studio-v1.3.html"
          test -s "$BRICK_ROOT/brick-mother-standalone-v2.7.5.html"
          test "$(git hash-object "$BRICK_ROOT/brick-mother-standalone-v2.7.5.html")" = "$PRESERVED_CORE_BLOB"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['BRICK_ROOT'])
          registry=json.loads((root/'BASELINE_REGISTRY_V1.json').read_text())
          assert registry['canonicalEntry']['gitBlob']==os.environ['PRESERVED_CORE_BLOB']
          assert registry['canonicalEntry']['immutable'] is True
          assert registry['approvals']['humanVisualApproved'] is False
          assert registry['approvals']['productionApproved'] is False
          PY
