name: Brick Mother Studio V1.2 Review and Direct HTML Publish

on:
  push:
    branches: [feature/brick-mother-v2.0-composite-material-dna]
    paths:
      - .github/workflows/brick-mother-pages-preview.yml
      - tools/brick-mother/**
      - yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/**
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: brick-mother-pages
  cancel-in-progress: false

env:
  BRICK_ROOT: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      source_head: ${{ steps.source.outputs.source_head }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build additive self-contained studio
        run: |
          set -euo pipefail
          python3 tools/brick-mother/publish_studio12.py "$BRICK_ROOT"
          python3 - <<'PY'
          import os,re,subprocess
          from pathlib import Path
          root=Path(os.environ['BRICK_ROOT'])
          text=(root/'studio.html').read_text()
          for index,code in enumerate(re.findall(r'<script[^>]*>([\s\S]*?)</script>',text)):
              path=Path(f'/tmp/brick-studio-script-{index}.js')
              path.write_text(code)
              subprocess.run(['node','--check',str(path)],check=True)
          assert len(text)>90000
          assert 'staticImageGeneration' not in text or 'true' not in text.split('staticImageGeneration')[1][:10]
          PY
      - name: Install browser test driver
        run: python3 -m pip install playwright
      - name: Real WebGL material and interaction checks
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$BRICK_ROOT" >/tmp/brick-studio-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/studio.html >/dev/null && break; sleep 1; done
          python3 tools/brick-mother/test_studio12.py http://127.0.0.1:8765 /tmp/brick-studio-review
      - name: Save review evidence and exact candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-studio-v12-review-${{ github.sha }}
          path: |
            /tmp/brick-studio-review
            /tmp/brick-studio-server.log
            ${{ env.BRICK_ROOT }}/studio.html
            ${{ env.BRICK_ROOT }}/STUDIO_BUILD.json
          retention-days: 7
      - name: Check reviewed builder gate
        id: gate
        run: |
          set -euo pipefail
          publish=false
          if [ -f tools/brick-mother/STUDIO_RELEASE_READY.json ]; then
            python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          gate=json.loads(Path('tools/brick-mother/STUDIO_RELEASE_READY.json').read_text())
          blob=subprocess.check_output(['git','hash-object','tools/brick-mother/publish_studio12.py'],text=True).strip()
          assert gate['builderBlob']==blob
          assert gate['internalReviewComplete'] is True
          assert gate['humanVisualApproved'] is False
          assert gate['productionApproved'] is False
          PY
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Append generated source without rewriting history
        id: source
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          git config user.name 'Brick Mother Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add "$BRICK_ROOT/studio.html" "$BRICK_ROOT/studio.webmanifest" "$BRICK_ROOT/studio-icon.svg" "$BRICK_ROOT/studio-sw.js" "$BRICK_ROOT/STUDIO_BUILD.json" "$BRICK_ROOT/workbench.html"
          if ! git diff --cached --quiet; then
            git commit -m 'feat(brick): publish verified immersive material studio v1.2'
            git push origin HEAD:feature/brick-mother-v2.0-composite-material-dna
          fi
          echo "source_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Assemble existing public site with new studio
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          src="$(dirname "$BRICK_ROOT")"
          mkdir -p _site
          cp -R "$src"/. _site/
          rm -rf _site/references-private _site/release _site/.git _site/.github
          rm -f _site/assets/models/YN_TUANJIE_001_EDITABLE_HIGH.glb
          touch _site/.nojekyll
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          Path('_site/brick-mother/STUDIO_DEPLOYMENT.json').write_text(json.dumps({'sourceHead':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'triggerHead':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'runtime':'1.2.0-alpha.9','visualApproved':False,'productionApproved':False},indent=2))
          PY
      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.publish == 'true'
        with:
          path: _site

  deploy:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: brick-mother-online
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  verify-public:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirm exact public source identity
        env:
          SOURCE_HEAD: ${{ needs.build.outputs.source_head }}
        run: |
          set -euo pipefail
          base=https://haihao0307.github.io/HOUSE/brick-mother
          for i in $(seq 1 40); do
            curl -fsS "$base/STUDIO_DEPLOYMENT.json?build=$SOURCE_HEAD" -o /tmp/deployed.json || true
            if [ -s /tmp/deployed.json ] && grep -q "$SOURCE_HEAD" /tmp/deployed.json; then break; fi
            sleep 5
          done
          grep -q "$SOURCE_HEAD" /tmp/deployed.json
          curl -fsS "$base/studio.html?build=$SOURCE_HEAD" -o /tmp/live-studio.html
          curl -fsS "$base/STUDIO_BUILD.json?build=$SOURCE_HEAD" -o /tmp/build.json
          curl -fsS "$base/brick-mother-standalone-v2.7.5.html?build=$SOURCE_HEAD" -o /tmp/core.html
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          m=json.loads(Path('/tmp/build.json').read_text())
          assert hashlib.sha256(Path('/tmp/live-studio.html').read_bytes()).hexdigest()==m['files']['studio.html']['sha256']
          b=Path('/tmp/core.html').read_bytes()
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==m['preservedCoreBlob']
          PY
      - name: Open live public page in Chromium
        run: |
          python3 -m pip install playwright
          python3 - <<'PY'
          import json,shutil
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b=p.chromium.launch(executable_path=shutil.which('google-chrome') or shutil.which('chromium'),args=['--no-sandbox','--enable-unsafe-swiftshader','--use-gl=angle','--use-angle=swiftshader'])
              page=b.new_page(viewport={'width':1280,'height':850})
              errors=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              page.goto('https://haihao0307.github.io/HOUSE/brick-mother/studio.html',wait_until='domcontentloaded')
              page.wait_for_function("document.documentElement.dataset.workbenchReady==='true'",timeout=90000)
              assert page.evaluate('window.__BRICK_MOTHER_WEATHERING_PBR__.version')=='1.2.0-alpha.9'
              assert page.evaluate("document.documentElement.dataset.runtimeFailure!=='true'")
              page.wait_for_timeout(1000)
              page.screenshot(path='/tmp/live-studio.png')
              Path('/tmp/live-proof.json').write_text(json.dumps({'errors':errors,'data':page.evaluate('({...document.documentElement.dataset})'),'url':page.url,'visualApproved':False,'productionApproved':False},indent=2))
              assert not errors
              b.close()
          PY
      - name: Upload public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-studio-v12-public-${{ github.sha }}
          path: |
            /tmp/live-studio.png
            /tmp/live-proof.json
            /tmp/deployed.json
            /tmp/build.json
          retention-days: 7
