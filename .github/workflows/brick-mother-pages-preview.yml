name: Deploy Brick Mother Online Workbench

on:
  push:
    branches:
      - feature/brick-mother-v2.0-composite-material-dna
    paths:
      - ".github/workflows/brick-mother-pages-preview.yml"
      - "yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Validate preserved core and added stone section
        shell: bash
        run: |
          set -euo pipefail
          root="yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother"
          page="$root/brick-mother-stone-masonry-v2.8.0-alpha.html"
          test -s "$root/brick-mother-standalone-v2.7.5.html"
          test -s "$root/brick-mother-standalone-v2.6.html"
          test -s "$root/stone-study.html"
          test -s "$page"
          test -s "$root/brick-mother-stone-masonry-v2.8.0-alpha.css"
          test -s "$root/brick-mother-stone-masonry-v2.8.0-alpha.part1.txt"
          test -s "$root/brick-mother-stone-masonry-v2.8.0-alpha.part2.txt"
          test -s "$root/brick-mother-stone-masonry-v2.8.0-alpha.part3.txt"
          test -s "$root/brick-mother-stone-masonry-v2.8.0-alpha.part4.txt"
          test -s "$root/brick-mother-stone-masonry-v2.8.0-alpha.part5.txt"
          test -s "$root/brick-mother-stone-masonry-v2.8.0-alpha.part6.txt"
          test -s "$root/workbench.html"
          grep -q "核心三材质 V2.7.5" "$root/workbench.html"
          grep -q "砌筑石形态" "$root/workbench.html"
          grep -q "V2.6 高变化保留线" "$root/workbench.html"
          grep -q "规则石材" "$page"
          grep -q "半规则毛石" "$page"
          grep -q "片石" "$page"
          grep -q "卵石" "$page"
          node --check "$root/brick-mother-gaea-kernel-v1.js"
          node --check "$root/brick-mother-geometry-v2.js"
          node --check "$root/brick-mother-renderer-v2.js"
          node --check "$root/brick-mother-app-v2.js"
          cat "$root/brick-mother-stone-masonry-v2.8.0-alpha.part1.txt" \
              "$root/brick-mother-stone-masonry-v2.8.0-alpha.part2.txt" \
              "$root/brick-mother-stone-masonry-v2.8.0-alpha.part3.txt" \
              "$root/brick-mother-stone-masonry-v2.8.0-alpha.part4.txt" \
              "$root/brick-mother-stone-masonry-v2.8.0-alpha.part5.txt" \
              "$root/brick-mother-stone-masonry-v2.8.0-alpha.part6.txt" \
              > /tmp/brick-mother-stone-masonry-v2.8.0-alpha.js
          node --check /tmp/brick-mother-stone-masonry-v2.8.0-alpha.js
          python3 - "$page" <<'PY'
          from pathlib import Path
          import re
          import sys

          text=Path(sys.argv[1]).read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.I|re.S)
          assert len(scripts) == 1, len(scripts)
          Path('/tmp/brick-mother-masonry-inline-loader.js').write_text(scripts[0], encoding='utf-8')
          assert "URL.createObjectURL(new Blob" in scripts[0]
          assert "script.onerror" in scripts[0]
          assert "brickMotherStoneError" in scripts[0]
          PY
          node --check /tmp/brick-mother-masonry-inline-loader.js

      - name: Browser QA masonry runtime before deployment
        shell: bash
        run: |
          set -euo pipefail
          root="yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother"
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$root" > /tmp/brick-masonry-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/brick-mother-stone-masonry-v2.8.0-alpha.html >/dev/null && break
            sleep 1
          done
          timeout 180s "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-background-networking \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --enable-unsafe-swiftshader \
            --use-gl=angle \
            --use-angle=swiftshader \
            --hide-scrollbars \
            --window-size=1440,900 \
            --virtual-time-budget=30000 \
            --screenshot=/tmp/brick-masonry-browser.png \
            --dump-dom \
            "http://127.0.0.1:8765/brick-mother-stone-masonry-v2.8.0-alpha.html?qa=$GITHUB_SHA" \
            > /tmp/brick-masonry-browser.dom.html \
            2> /tmp/brick-masonry-browser.chrome.log
          grep -q 'data-brick-mother-stone-ready="true"' /tmp/brick-masonry-browser.dom.html
          grep -q 'data-workbench-ready="true"' /tmp/brick-masonry-browser.dom.html
          grep -q 'class="loading hidden"' /tmp/brick-masonry-browser.dom.html
          ! grep -q 'data-brick-mother-stone-error=' /tmp/brick-masonry-browser.dom.html
          test -s /tmp/brick-masonry-browser.png
          test "$(wc -c < /tmp/brick-masonry-browser.png)" -gt 70000
          python3 - <<'PY'
          from pathlib import Path
          import struct
          data=Path('/tmp/brick-masonry-browser.png').read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          width,height=struct.unpack('>II',data[16:24])
          assert (width,height) == (1440,900), (width,height)
          print({'screenshotBytes':len(data),'size':[width,height]})
          PY

      - name: Upload masonry browser QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-mother-masonry-browser-${{ github.sha }}
          path: |
            /tmp/brick-masonry-browser.png
            /tmp/brick-masonry-browser.dom.html
            /tmp/brick-masonry-browser.chrome.log
            /tmp/brick-masonry-server.log
          compression-level: 1
          if-no-files-found: ignore

      - name: Assemble complete public site
        shell: bash
        run: |
          set -euo pipefail
          src="yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local"
          mkdir -p _site
          cp -R "$src"/. _site/
          rm -rf _site/references-private _site/release _site/.git _site/.github
          rm -f _site/assets/models/YN_TUANJIE_001_EDITABLE_HIGH.glb
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: brick-mother-online
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-public:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: deploy
    steps:
      - name: Verify live Brick Mother files
        shell: bash
        env:
          BASE_URL: https://haihao0307.github.io/HOUSE/brick-mother
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 30); do
            if curl -fsSL --retry 2 --retry-delay 2 "$BASE_URL/workbench.html?build=$GITHUB_SHA" -o /tmp/workbench.html \
              && grep -q "核心三材质 V2.7.5" /tmp/workbench.html \
              && grep -q "砌筑石形态" /tmp/workbench.html \
              && curl -fsSL --retry 2 --retry-delay 2 "$BASE_URL/brick-mother-standalone-v2.7.5.html?build=$GITHUB_SHA" -o /tmp/core.html \
              && grep -q "Brick Mother V2.7" /tmp/core.html \
              && curl -fsSL --retry 2 --retry-delay 2 "$BASE_URL/brick-mother-stone-masonry-v2.8.0-alpha.html?build=$GITHUB_SHA" -o /tmp/masonry.html \
              && grep -q "规则石材" /tmp/masonry.html \
              && grep -q "半规则毛石" /tmp/masonry.html \
              && grep -q "片石" /tmp/masonry.html \
              && grep -q "卵石" /tmp/masonry.html \
              && grep -q "URL.createObjectURL(new Blob" /tmp/masonry.html; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = 1
          printf 'workbench=%s bytes\n' "$(wc -c < /tmp/workbench.html)"
          printf 'core=%s bytes\n' "$(wc -c < /tmp/core.html)"
          printf 'masonry=%s bytes\n' "$(wc -c < /tmp/masonry.html)"

      - name: Verify live masonry runtime in Chromium
        shell: bash
        env:
          BASE_URL: https://haihao0307.github.io/HOUSE/brick-mother
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          timeout 180s "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-background-networking \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --enable-unsafe-swiftshader \
            --use-gl=angle \
            --use-angle=swiftshader \
            --hide-scrollbars \
            --window-size=1440,900 \
            --virtual-time-budget=30000 \
            --screenshot=/tmp/live-brick-masonry.png \
            --dump-dom \
            "$BASE_URL/brick-mother-stone-masonry-v2.8.0-alpha.html?build=$GITHUB_SHA" \
            > /tmp/live-brick-masonry.dom.html \
            2> /tmp/live-brick-masonry.chrome.log
          grep -q 'data-brick-mother-stone-ready="true"' /tmp/live-brick-masonry.dom.html
          grep -q 'data-workbench-ready="true"' /tmp/live-brick-masonry.dom.html
          grep -q 'class="loading hidden"' /tmp/live-brick-masonry.dom.html
          ! grep -q 'data-brick-mother-stone-error=' /tmp/live-brick-masonry.dom.html
          test -s /tmp/live-brick-masonry.png
          test "$(wc -c < /tmp/live-brick-masonry.png)" -gt 70000
