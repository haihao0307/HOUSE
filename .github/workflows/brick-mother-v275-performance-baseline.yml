name: Brick Mother V2.7.5 Startup Baseline

on:
  push:
    branches: [feature/brick-mother-v2.0-composite-material-dna]
    paths:
      - .github/workflows/brick-mother-v275-performance-baseline.yml
      - tools/brick-mother/measure_v275_startup.py
      - yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/brick-mother-standalone-v2.7.5.html
      - yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/index.html
      - yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/brick-mother-app-v2.js
      - yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/brick-mother-renderer-v2.js
      - yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/brick-mother-geometry-v2.js
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brick-mother-v275-startup-baseline
  cancel-in-progress: true

env:
  BRICK_ROOT: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother
  PRESERVED_CORE_BLOB: 7b10389cb9367f7423619262820883cc94b07a61

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify retained V2.7.5 identity
        shell: bash
        run: |
          set -euo pipefail
          test -s "$BRICK_ROOT/brick-mother-standalone-v2.7.5.html"
          test -s "$BRICK_ROOT/index.html"
          test "$(git hash-object "$BRICK_ROOT/brick-mother-standalone-v2.7.5.html")" = "$PRESERVED_CORE_BLOB"
          python3 -m py_compile tools/brick-mother/measure_v275_startup.py

      - name: Install browser profiler dependency
        run: python3 -m pip install playwright

      - name: Run phase-by-phase startup measurements
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/brick-mother-v275-startup
          mkdir -p "$OUT"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$BRICK_ROOT" >"$OUT/server.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/brick-mother-standalone-v2.7.5.html >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          python3 tools/brick-mother/measure_v275_startup.py http://127.0.0.1:8765 "$OUT" 2
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('/tmp/brick-mother-v275-startup/v275-startup-baseline.json')
          data=json.loads(path.read_text())
          assert data['coreBlobExpected']=='7b10389cb9367f7423619262820883cc94b07a61'
          assert set(data['cases'])=={'standalone-hero','standalone-three-family','modular-hero','modular-three-family'}
          for name,case in data['cases'].items():
              assert len(case['runs'])==2,name
              assert all(row['httpStatus']==200 for row in case['runs']),name
              assert all(row['dataset'].get('brickMotherReady')=='true' for row in case['runs']),name
              assert all(not row['pageErrors'] for row in case['runs']),name
          assert data['visualApproved'] is False
          assert data['productionApproved'] is False
          PY

      - name: Upload startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-mother-v275-startup-${{ github.sha }}
          path: /tmp/brick-mother-v275-startup
          compression-level: 1
          retention-days: 14
          if-no-files-found: warn
