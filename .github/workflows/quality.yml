name: Validate HOUSE Production Line

on:
  pull_request:
    branches: [main]
    paths:
      - 'yunnan-courtyard-architecture-factory-v5.2.1-full-local/**'
      - '.github/workflows/quality.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: house-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate data and package
        working-directory: ${{ env.PROJECT_DIR }}
        run: python tools/validate.py

  browser-smoke:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser test dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Run procedural tile production preview smoke test
        working-directory: ${{ env.PROJECT_DIR }}
        run: xvfb-run -a python tools/production_preview_smoke.py

      - name: Run public-repository browser regression
        working-directory: ${{ env.PROJECT_DIR }}
        run: xvfb-run -a python tools/browser_ci_smoke_test.py

      - name: Upload QA outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: house-v5.4.2-browser-qa
          path: |
            ${{ env.PROJECT_DIR }}/data/qa/*.json
            ${{ env.PROJECT_DIR }}/qa/screenshots/*.png
          if-no-files-found: warn
