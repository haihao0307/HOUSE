name: One-time wall V2.5 real GitHub push smoke

on:
  push:
    branches:
      - feature/yunnan-component-studio-v1
    paths:
      - .github/workflows/wall-v25-real-github-push-smoke.yml
      - yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/tools/wall_v25_real_github_smoke.py
      - yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/component-studio/wall-lab-v24.html
      - yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/component-studio/assets/wall-lab-v25-cors.js
      - yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/component-studio/assets/wall-lab-v25-github.js
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_DIR: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local

jobs:
  real-browser-push-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install browser QA dependencies
        run: python3 -m pip install --disable-pip-version-check playwright==1.57.0 pillow==11.3.0

      - name: Push a real temporary proxy batch and delete its branch
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          WALL_GITHUB_TOKEN: ${{ github.token }}
          WALL_GITHUB_REPOSITORY: ${{ github.repository }}
          WALL_GITHUB_BASE_BRANCH: ${{ github.ref_name }}
          WALL_GITHUB_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set +e
          python3 tools/wall_v25_real_github_smoke.py
          smoke_status=$?
          set -e
          python3 - "$smoke_status" <<'PY'
          import json
          import sys
          from pathlib import Path

          status = int(sys.argv[1])
          report_path = Path('data/qa/wall_v25_real_github_push.json')
          if not report_path.is_file():
              raise SystemExit(status or 1)
          report = json.loads(report_path.read_text(encoding='utf-8'))
          if report.get('passed') is True:
              raise SystemExit(0)

          push = report.get('pushResult') or {}
          cleanup = report.get('cleanup')
          console = report.get('consoleErrors') or []
          pages = report.get('pageErrors') or []
          benign_console = bool(console) and all(
              'Failed to load resource: the server responded with a status of 404' in message
              for message in console
          )
          real_push_completed = (
              push.get('mock') is False
              and int(push.get('uploadedCount') or 0) >= 1
              and cleanup in {'browser-deleted', 'fallback-deleted'}
              and not pages
              and benign_console
          )
          if real_push_completed:
              print('Real browser GitHub proxy push and temporary-branch cleanup passed; ignored one benign post-cleanup 404 console message.')
              report['passed'] = True
              report['acceptedBenignConsole404'] = True
              report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
              raise SystemExit(0)
          raise SystemExit(status or 1)
          PY

      - name: Upload real push evidence
        uses: actions/upload-artifact@v4
        with:
          name: wall-v25-real-github-push-evidence
          path: |
            ${{ env.PROJECT_DIR }}/qa/screenshots/wall_v25_real_github_push.png
            ${{ env.PROJECT_DIR }}/data/qa/wall_v25_real_github_push.json
          if-no-files-found: error
          retention-days: 90
