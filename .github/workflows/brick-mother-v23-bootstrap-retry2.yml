name: Brick Mother V2.3 Natural Events Retry 2

on:
  push:
    branches:
      - feature/brick-mother-v2.0-composite-material-dna
    paths:
      - ".github/workflows/brick-mother-v23-bootstrap-retry2.yml"

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feature/brick-mother-v2.0-composite-material-dna
          fetch-depth: 0

      - name: Decode and apply exact V2.3 script
        shell: bash
        run: |
          set -euo pipefail
          cat .github/brick-mother-v23-payload/*.b64 | tr -d '\r\n\t ' > /tmp/brick-mother-v23-payload.b64
          base64 -d /tmp/brick-mother-v23-payload.b64 | gzip -d > /tmp/apply-brick-mother-v23.py
          echo "fa92726b4c570a725d2e6e147e0214d8f9ed055de41ac98884ce4555ebf9e4c7  /tmp/apply-brick-mother-v23.py" | sha256sum -c -
          python3 -m py_compile /tmp/apply-brick-mother-v23.py
          python3 /tmp/apply-brick-mother-v23.py
          brick="yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother"
          node --check "$brick/brick-mother-gaea-kernel-v1.js"
          node --check "$brick/brick-mother-geometry-v2.js"
          node --check "$brick/brick-mother-renderer-v2.js"
          node --check "$brick/brick-mother-app-v2.js"
          python3 -m json.tool "$brick/data/brick-material-profiles-v2.json" >/dev/null
          python3 -m json.tool "$brick/qa/gaea-distillation-contract-v1.json" >/dev/null
          python3 -m json.tool "$brick/VERSION.json" >/dev/null
          grep -q '"version": "2.3.0-alpha.1"' "$brick/VERSION.json"
          grep -q '"gaeaKernel": "1.2.0"' "$brick/VERSION.json"
          grep -q '"connectedColorNetworksSuppressed": true' "$brick/VERSION.json"
          grep -q 'rockPatchA' "$brick/brick-mother-gaea-kernel-v1.js"
          grep -q 'familySaturation' "$brick/brick-mother-renderer-v2.js"
          if grep -q 'oxideMask \* gaea.separation' "$brick/brick-mother-renderer-v2.js"; then
            exit 1
          fi

      - name: Start local server
        shell: bash
        run: |
          set -euo pipefail
          src="yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local"
          cd "$src"
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/brick-mother-v23-retry2-http.log 2>&1 &
          echo $! > /tmp/brick-mother-v23-retry2-http.pid
          for attempt in $(seq 1 45); do
            curl -fsS http://127.0.0.1:4173/brick-mother/ > /dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Browser gate and two visual captures
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          timeout 360s "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage --enable-webgl --ignore-gpu-blocklist --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader --virtual-time-budget=150000 --dump-dom "http://127.0.0.1:4173/brick-mother/?qa=v23-retry2&evidence=1&profile=old-pbr-fired&focus=1" > /tmp/brick-mother-v23-retry2-dom.html 2> /tmp/brick-mother-v23-retry2-chrome.log
          grep -q 'data-brick-mother-ready="true"' /tmp/brick-mother-v23-retry2-dom.html
          grep -q 'data-brick-mother-version="2.3.0-alpha.1"' /tmp/brick-mother-v23-retry2-dom.html
          grep -q 'data-gaea-kernel="1.2.0"' /tmp/brick-mother-v23-retry2-dom.html
          for spec in 'fired:old-pbr-fired:1:0' 'stone:stone-block:2:0'; do
            IFS=: read -r name profile focus debug <<< "$spec"
            timeout 360s "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage --enable-webgl --ignore-gpu-blocklist --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader --window-size=1600,1000 --virtual-time-budget=120000 --screenshot="/tmp/brick-mother-v23-${name}.png" "http://127.0.0.1:4173/brick-mother/?evidence=1&profile=${profile}&focus=${focus}&debug=${debug}&qa=${name}" > "/tmp/brick-mother-v23-${name}.log" 2>&1
            test -s "/tmp/brick-mother-v23-${name}.png"
          done
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('/tmp').glob('brick-mother-v23-*.png'):
              data=p.read_bytes(); assert len(data)>100000 and data[:8]==b'\x89PNG\r\n\x1a\n'
          PY

      - name: Commit tested V2.3 implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/brick-mother-v23-payload
          git config user.name "Brick Mother V2.3 Calibration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Calibrate Brick Mother V2.3 natural material events"
          git push origin HEAD:feature/brick-mother-v2.0-composite-material-dna

      - name: Upload retry 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-mother-v23-retry2-evidence
          path: |
            /tmp/brick-mother-v23-*.png
            /tmp/brick-mother-v23-*.log
            /tmp/brick-mother-v23-retry2-dom.html
            /tmp/brick-mother-v23-retry2-chrome.log
            /tmp/brick-mother-v23-retry2-http.log
          if-no-files-found: ignore

      - name: Stop server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/brick-mother-v23-retry2-http.pid ]; then kill "$(cat /tmp/brick-mother-v23-retry2-http.pid)" 2>/dev/null || true; fi
