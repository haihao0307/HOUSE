name: Tiles Mother 08F final full-shell candidate

on:
  push:
    branches: [codex/tiles-08f-final-20260914]
    paths:
      - .github/workflows/tiles-mother-08f-final.yml
      - tiles-mother/r2-closeout-08f-final/build.py
      - tiles-mother/r2-closeout-08f-final/shape.glsl
      - tiles-mother/r2-closeout-08f-final/REFERENCE_DISTILLATION_2026-09-14.json

permissions:
  contents: write

concurrency:
  group: tiles-mother-08f-final
  cancel-in-progress: false

jobs:
  verify-materialize-public:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            tiles-mother/r2-closeout-08e-contact
            tiles-mother/r2-closeout-08f-final

      - name: Build 08F from verified 08E baseline
        run: python tiles-mother/r2-closeout-08f-final/build.py

      - name: Parse-check generated inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('tiles-mother/r2-closeout-08f-final/START_HERE.html')
          text=p.read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',text)
          if not m: raise SystemExit('inline script not found')
          Path('/tmp/tiles08f-inline.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/tiles08f-inline.js

      - name: Solve bilateral rigid seating with new full-shell geometry
        run: node tiles-mother/r2-closeout-08f-final/calibrate_seats_v2.cjs

      - name: Sample all retained contact relations before final headroom
        shell: bash
        run: node tiles-mother/r2-closeout-08f-final/qa_matrix.cjs || true

      - name: Add only sampled worst-case rigid headroom
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('tiles-mother/r2-closeout-08f-final')
          matrix=json.loads((root/'CONTACT_MATRIX_QA.json').read_text(encoding='utf-8'))
          cal=json.loads((root/'SEAT_CALIBRATION.json').read_text(encoding='utf-8'))
          target=0.02
          support=[x for x in matrix['checks'] if x.get('minGapMm') is not None]
          rafter=[x['minGapMm'] for x in support if x['group']=='rafter-pan']
          pan_cover=[x['minGapMm'] for x in support if x['group']=='pan-cover']
          if not rafter or not pan_cover: raise SystemExit('missing support groups in pre-headroom matrix')
          worst_rafter=min(rafter); worst_pan_cover=min(pan_cover)
          pan_lift=max(0.0,target-worst_rafter)
          cover_relative_lift=max(0.0,target-worst_pan_cover)
          seats=dict(cal['solvedSeats'])
          seats['panY']+=pan_lift/1000.0
          seats['coverY']+=(pan_lift+cover_relative_lift)/1000.0
          cal['preHeadroomWorstRafterMm']=worst_rafter
          cal['preHeadroomWorstPanCoverMm']=worst_pan_cover
          cal['headroomTargetMm']=target
          cal['panSafetyLiftMm']=pan_lift
          cal['coverRelativeSafetyLiftMm']=cover_relative_lift
          cal['solvedSeats']=seats
          (root/'SEAT_CALIBRATION.json').write_text(json.dumps(cal,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          hp=root/'START_HERE.html'; html=hp.read_text(encoding='utf-8')
          pattern=r'const SEATS=Object\.freeze\((\{[^\n]+\})\);'
          replacement='const SEATS=Object.freeze('+json.dumps(seats,separators=(',',':'))+');'
          html,n=re.subn(pattern,replacement,html,count=1)
          if n!=1: raise SystemExit('SEATS replacement failed')
          hp.write_text(html,encoding='utf-8',newline='')
          print(json.dumps({'worstRafterMm':worst_rafter,'worstPanCoverMm':worst_pan_cover,'panSafetyLiftMm':pan_lift,'coverRelativeSafetyLiftMm':cover_relative_lift,'seats':seats},indent=2))
          PY

      - name: Parse-check calibrated page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('tiles-mother/r2-closeout-08f-final/START_HERE.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',text)
          if not m: raise SystemExit('inline script not found')
          Path('/tmp/tiles08f-inline.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/tiles08f-inline.js

      - name: Run full-shell geometry and retained contact QA
        run: node tiles-mother/r2-closeout-08f-final/qa_geometry.cjs

      - name: Run final 54-relation matrix
        run: node tiles-mother/r2-closeout-08f-final/qa_matrix.cjs

      - name: Require new shell field plus retained contact conditions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('tiles-mother/r2-closeout-08f-final')
          contact=json.loads((root/'CONTACT_QA.json').read_text(encoding='utf-8'))
          matrix=json.loads((root/'CONTACT_MATRIX_QA.json').read_text(encoding='utf-8'))
          build=json.loads((root/'BUILD_QA.json').read_text(encoding='utf-8'))
          cal=json.loads((root/'SEAT_CALIBRATION.json').read_text(encoding='utf-8'))
          if contact.get('bottomMicroZeroLegacyStatus')!='not_applicable_after_user_full_shell_goal_2026-09-14':
              raise SystemExit('legacy bottom-zero status not revised')
          if not contact.get('shellFieldPresent'):
              raise SystemExit('08F full-shell geometry field not present on bottom/side samples')
          if not contact.get('contactPassed'):
              raise SystemExit('08F known contacts failed')
          if not matrix.get('pass'):
              raise SystemExit('08F expanded relation matrix failed: '+json.dumps(matrix.get('failures',[]),ensure_ascii=False))
          build['contactPassed']=True
          build['expandedMatrixPassed']=True
          build['shellFieldPresent']=True
          build['actualContactQa']=contact
          build['contactMatrixSummary']=matrix['summary']
          build['seatCalibration']=cal['solvedSeats']
          build['panSafetyLiftMm']=cal['panSafetyLiftMm']
          build['coverRelativeSafetyLiftMm']=cal['coverRelativeSafetyLiftMm']
          (root/'BUILD_QA.json').write_text(json.dumps(build,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'shellFieldPresent':True,'contactMatrix':matrix['summary'],'shapeEvidence':contact['shapeEvidence'],'seats':cal['solvedSeats']},ensure_ascii=False,indent=2))
          PY

      - name: Commit generated 08F candidate and QA on same branch
        shell: bash
        run: |
          set -eu
          test "$GITHUB_REF_NAME" = 'codex/tiles-08f-final-20260914'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tiles-mother/r2-closeout-08f-final/START_HERE.html \
            tiles-mother/r2-closeout-08f-final/qa_geometry.cjs \
            tiles-mother/r2-closeout-08f-final/contact-lib.cjs \
            tiles-mother/r2-closeout-08f-final/calibrate_seats_v2.cjs \
            tiles-mother/r2-closeout-08f-final/qa_matrix.cjs \
            tiles-mother/r2-closeout-08f-final/BUILD_QA.json \
            tiles-mother/r2-closeout-08f-final/SEAT_CALIBRATION.json \
            tiles-mother/r2-closeout-08f-final/CONTACT_QA.json \
            tiles-mother/r2-closeout-08f-final/CONTACT_MATRIX_QA.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(tiles): materialize verified 08F full-shell final candidate'
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
          echo "PAGE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install browser smoke dependency
        run: python -m pip install --quiet selenium

      - name: Open fixed public 08F and exercise top underside edge and roof
        shell: bash
        run: |
          python - <<'PY'
          import json,os,time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          sha=os.environ['PAGE_SHA']
          url=f'https://raw.githack.com/haihao0307/HOUSE/{sha}/tiles-mother/r2-closeout-08f-final/START_HERE.html'
          opt=webdriver.ChromeOptions(); opt.add_argument('--headless=new'); opt.add_argument('--no-sandbox'); opt.add_argument('--window-size=1440,1000'); opt.add_argument('--use-angle=swiftshader'); opt.add_argument('--enable-unsafe-swiftshader'); opt.add_argument('--disable-dev-shm-usage')
          d=webdriver.Chrome(options=opt)
          try:
              d.execute_cdp_cmd('Network.enable',{})
              c=d.execute_cdp_cmd('Network.setCookie',{'name':'__Http-phish','value':'1','url':'https://raw.githack.com/','secure':True,'httpOnly':True,'sameSite':'Lax'})
              if c.get('success') is False: raise RuntimeError('rawgithack confirmation cookie rejected')
              d.get(url); w=WebDriverWait(d,30)
              w.until(lambda x:'08F' in x.title and x.execute_script("return document.body.dataset.ready==='true'"))
              brand=d.find_element(By.CSS_SELECTOR,'.brand').text
              if '08F' not in brand: raise RuntimeError('08F brand missing')
              if any(x.is_displayed() for x in d.find_elements(By.CSS_SELECTOR,'.fail')): raise RuntimeError('visible failure panel')
              d.find_element(By.CSS_SELECTOR,'button[data-view="under"]').click(); time.sleep(1); Path('/tmp/tiles08f-under.png').write_bytes(d.get_screenshot_as_png())
              d.find_element(By.CSS_SELECTOR,'button[data-view="edge"]').click(); d.find_element(By.ID,'shapePanel').click(); time.sleep(1); Path('/tmp/tiles08f-edge.png').write_bytes(d.get_screenshot_as_png())
              d.find_element(By.CSS_SELECTOR,'button[data-scene="roof48"]').click(); time.sleep(2); Path('/tmp/tiles08f-roof48.png').write_bytes(d.get_screenshot_as_png())
              stage=d.find_element(By.ID,'stage'); dims=d.execute_script('return {w:innerWidth,h:innerHeight,cw:arguments[0].width,ch:arguments[0].height}',stage)
              result={'url':url,'title':d.title,'brand':brand,'canvas':dims,'undersideView':True,'edgeView':True,'shapePanel':True,'roof48':True,'screenshots':{p.name:p.stat().st_size for p in map(Path,['/tmp/tiles08f-under.png','/tmp/tiles08f-edge.png','/tmp/tiles08f-roof48.png'])}}
              Path('/tmp/tiles08f-public.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'); print(json.dumps(result,ensure_ascii=False,indent=2))
          finally: d.quit()
          PY
        env:
          PAGE_SHA: ${{ env.PAGE_SHA }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiles-08f-final-${{ github.run_id }}
          path: |
            /tmp/tiles08f-public.json
            /tmp/tiles08f-under.png
            /tmp/tiles08f-edge.png
            /tmp/tiles08f-roof48.png
            tiles-mother/r2-closeout-08f-final/BUILD_QA.json
            tiles-mother/r2-closeout-08f-final/CONTACT_QA.json
            tiles-mother/r2-closeout-08f-final/CONTACT_MATRIX_QA.json
          retention-days: 14

      - name: Print fixed public URL
        run: echo "https://raw.githack.com/haihao0307/HOUSE/${PAGE_SHA}/tiles-mother/r2-closeout-08f-final/START_HERE.html"
