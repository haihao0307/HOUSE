name: Brick R2.14.8 Equivalence And Performance

on:
  push:
    branches:
      - codex/brick-r2143-continuous-surface-20260914

jobs:
  browser-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser QA dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow numpy
          python -m playwright install --with-deps chromium
      - name: Compare R2.14.7 and R2.14.8
        shell: bash
        run: |
          cat > /tmp/perf.py <<'PY'
          from playwright.sync_api import sync_playwright
          from time import perf_counter
          from statistics import median
          from PIL import Image
          import numpy as np

          URLS={
            'R2.14.7':'https://rawcdn.githack.com/haihao0307/HOUSE/de0092625992455e30f7584477b572efadf21775/yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/experiments/shape-edge-lab-r2-14/Brick_Shape_Edge_Lab_R2_14_7.html',
            'R2.14.8':'https://rawcdn.githack.com/haihao0307/HOUSE/d8b11f7b200d07e0f1c0afca36b6c5a307398281/yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/experiments/shape-edge-lab-r2-14/Brick_Shape_Edge_Lab_R2_14_8.html'
          }

          def one(page,label,url,round_id):
              errors=[]
              page.on('pageerror',lambda exc: errors.append('pageerror: '+str(exc)))
              page.on('console',lambda msg: errors.append('console: '+msg.text) if msg.type=='error' else None)
              t0=perf_counter()
              resp=page.goto(url,wait_until='domcontentloaded',timeout=120000)
              assert resp and resp.ok
              iframe=page.locator('#lab'); iframe.wait_for(state='attached',timeout=60000)
              frame=iframe.element_handle().content_frame()
              canvas=frame.locator('#c'); canvas.wait_for(state='attached',timeout=60000)
              frame.wait_for_function("document.querySelector('#c')?.dataset.ready === 'true'",timeout=60000)
              ready_ms=(perf_counter()-t0)*1000
              assert not errors, errors
              t_static=perf_counter()
              static_path=f'/tmp/{label.replace(".","")}-static-r{round_id}.png'
              canvas.screenshot(path=static_path)
              static_ms=(perf_counter()-t_static)*1000
              box=canvas.bounding_box(); assert box
              x=box['x']+box['width']*.72; y=box['y']+box['height']*.45
              t1=perf_counter()
              page.mouse.move(x,y); page.mouse.down()
              page.mouse.move(x+55,y+18,steps=1); page.mouse.move(x+90,y+8,steps=1); page.mouse.up()
              canvas.screenshot(path=f'/tmp/{label.replace(".","")}-drag-r{round_id}.png')
              redraw_ms=(perf_counter()-t1)*1000
              print(label,'ROUND',round_id,'READY_MS',ready_ms,'STATIC_SCREENSHOT_MS',static_ms,'DRAG_AND_SCREENSHOT_MS',redraw_ms)
              return ready_ms,static_ms,redraw_ms

          results={k:[] for k in URLS}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist'])
              context=browser.new_context(viewport={'width':1440,'height':900},device_scale_factor=1,user_agent='Brick-Mother-Perf-QA')
              context.add_cookies([{'name':'__Http-phish','value':'1','url':'https://rawcdn.githack.com/','secure':True,'httpOnly':True,'sameSite':'Lax'}])
              for round_id,order in [(1,['R2.14.7','R2.14.8']),(2,['R2.14.8','R2.14.7'])]:
                  for label in order:
                      page=context.new_page(); results[label].append(one(page,label,URLS[label],round_id)); page.close()
              browser.close()

          for label,vals in results.items():
              print(label,'MEDIAN_READY_MS',median(v[0] for v in vals),'MEDIAN_STATIC_MS',median(v[1] for v in vals),'MEDIAN_DRAG_MS',median(v[2] for v in vals))
          a=results['R2.14.7']; b=results['R2.14.8']
          print('READY_RATIO_R2148_OVER_R2147',median(v[0] for v in b)/median(v[0] for v in a))
          print('STATIC_RATIO_R2148_OVER_R2147',median(v[1] for v in b)/median(v[1] for v in a))
          print('REDRAW_RATIO_R2148_OVER_R2147',median(v[2] for v in b)/median(v[2] for v in a))

          aimg=np.asarray(Image.open('/tmp/R2147-static-r1.png').convert('RGB')).astype(np.int16)
          bimg=np.asarray(Image.open('/tmp/R2148-static-r1.png').convert('RGB')).astype(np.int16)
          h,w,_=aimg.shape
          # Exclude canvas labels and compare the actual brick/floor region only.
          xa=w//2+10; xb=w-10; ya=120; yb=min(h-80,560)
          d=np.abs(aimg[ya:yb,xa:xb]-bimg[ya:yb,xa:xb]).mean(axis=2)
          print('GEOMETRY_REGION_MEAN_ABS_PIXEL_DELTA',float(d.mean()))
          print('GEOMETRY_REGION_FRACTION_GT2',float((d>2).mean()))
          print('GEOMETRY_REGION_FRACTION_GT6',float((d>6).mean()))
          PY
          python /tmp/perf.py
      - name: Upload equivalence frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-r2148-equivalence-perf
          path: /tmp/R214*-*.png
          if-no-files-found: ignore
