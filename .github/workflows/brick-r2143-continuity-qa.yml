name: Brick R2.14.7 Frequency Split QA

on:
  push:
    branches:
      - codex/brick-r2143-continuous-surface-20260914

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser QA dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow numpy
          python -m playwright install --with-deps chromium
      - name: Capture R2.14.7 and report silhouette stability
        shell: bash
        run: |
          cat > /tmp/qa.py <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image
          import numpy as np

          URL='https://rawcdn.githack.com/haihao0307/HOUSE/de0092625992455e30f7584477b572efadf21775/yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/experiments/shape-edge-lab-r2-14/Brick_Shape_Edge_Lab_R2_14_7.html'

          def silhouette_roughness(a, top=True):
              H,W,_=a.shape
              xs=[]; ys=[]
              rows=np.arange(H)
              lo,hi=(120,560) if top else (250,550)
              for x in range(30,W-50):
                  col=a[:,x,:].astype(np.int16)
                  mask=((col[:,0]-col[:,1]>18)&(col[:,0]>70)&(rows>lo)&(rows<hi))
                  hit=np.where(mask)[0]
                  if len(hit):
                      xs.append(x); ys.append(int(hit.min() if top else hit.max()))
              x=np.asarray(xs,dtype=float); y=np.asarray(ys,dtype=float)
              p=np.polyfit(x,y,2 if top else 3)
              res=y-np.polyval(p,x)
              return float(res.std()),float(np.percentile(np.abs(res),95)),float(np.max(np.abs(res)))

          errors=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist'])
              context=browser.new_context(viewport={'width':1440,'height':900},device_scale_factor=1,user_agent='Brick-Mother-QA/2.14.7')
              context.add_cookies([{'name':'__Http-phish','value':'1','url':'https://rawcdn.githack.com/','secure':True,'httpOnly':True,'sameSite':'Lax'}])
              page=context.new_page()
              page.on('pageerror',lambda exc: errors.append('pageerror: '+str(exc)))
              page.on('console',lambda msg: errors.append('console: '+msg.text) if msg.type=='error' else None)
              resp=page.goto(URL,wait_until='networkidle',timeout=120000)
              assert resp and resp.ok, f'public HTTP failed: {resp.status if resp else None}'
              page.wait_for_timeout(5000)
              assert 'R2.14.7' in page.title(), page.title()
              inner=page.frame_locator('#lab')
              canvas=inner.locator('#c')
              canvas.wait_for(state='attached',timeout=30000)
              ready=canvas.get_attribute('data-ready')
              status=inner.locator('#status').inner_text()
              err=inner.locator('#error').inner_text() if inner.locator('#error').count() else ''
              print('STATUS',status); print('INNER_ERROR',err); print('ERRORS',errors)
              assert ready=='true', f'canvas not ready: {ready}; status={status}; inner={err}; errors={errors}'
              assert not errors, errors
              canvas.screenshot(path='/tmp/r2147-canvas.png')
              im=np.asarray(Image.open('/tmp/r2147-canvas.png').convert('RGB')).astype(np.int16)
              h,w,_=im.shape
              left=im[:, :w//2]; right=im[:, w//2:w//2+left.shape[1]]
              d=np.abs(left-right).mean(axis=2)
              print('MEAN_ABS_PIXEL_DELTA',float(d.mean()))
              print('CHANGED_PIXEL_FRACTION_GT4',float((d>4).mean()))
              print('STRONG_PIXEL_FRACTION_GT10',float((d>10).mean()))
              for label,a in [('LEFT',left),('RIGHT',right)]:
                  ts,tp,tm=silhouette_roughness(a,True)
                  bs,bp,bm=silhouette_roughness(a,False)
                  print(label+'_TOP_STD',ts); print(label+'_TOP_P95ABS',tp); print(label+'_TOP_MAXABS',tm)
                  print(label+'_BOTTOM_STD',bs); print(label+'_BOTTOM_P95ABS',bp); print(label+'_BOTTOM_MAXABS',bm)
              browser.close()
          PY
          python /tmp/qa.py
      - name: Upload R2.14.7 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-r2147-frequency-split-qa
          path: /tmp/r2147-canvas.png
          if-no-files-found: ignore
