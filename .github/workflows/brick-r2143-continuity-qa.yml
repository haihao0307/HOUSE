name: Brick R2.14.7 Performance Compare

on:
  push:
    branches:
      - codex/brick-r2143-continuous-surface-20260914

jobs:
  browser-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser QA dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Compare startup and drag redraw cost
        shell: bash
        run: |
          cat > /tmp/perf.py <<'PY'
          from playwright.sync_api import sync_playwright
          from time import perf_counter
          from statistics import median

          URLS={
            'R2.14.5':'https://rawcdn.githack.com/haihao0307/HOUSE/14090cdc494edd71eaa9717d802a43a46151eecf/yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/experiments/shape-edge-lab-r2-14/Brick_Shape_Edge_Lab_R2_14_5.html',
            'R2.14.7':'https://rawcdn.githack.com/haihao0307/HOUSE/de0092625992455e30f7584477b572efadf21775/yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/experiments/shape-edge-lab-r2-14/Brick_Shape_Edge_Lab_R2_14_7.html'
          }

          def one(page,label,url,round_id):
              errors=[]
              page.on('pageerror',lambda exc: errors.append('pageerror: '+str(exc)))
              page.on('console',lambda msg: errors.append('console: '+msg.text) if msg.type=='error' else None)
              t0=perf_counter()
              resp=page.goto(url,wait_until='domcontentloaded',timeout=120000)
              assert resp and resp.ok
              iframe=page.locator('#lab')
              iframe.wait_for(state='attached',timeout=60000)
              frame=iframe.element_handle().content_frame()
              frame.locator('#c').wait_for(state='attached',timeout=60000)
              frame.wait_for_function("document.querySelector('#c')?.dataset.ready === 'true'",timeout=60000)
              ready_ms=(perf_counter()-t0)*1000
              assert not errors, errors
              canvas=frame.locator('#c')
              box=canvas.bounding_box()
              assert box
              x=box['x']+box['width']*.72; y=box['y']+box['height']*.45
              t1=perf_counter()
              page.mouse.move(x,y)
              page.mouse.down()
              page.mouse.move(x+55,y+18,steps=1)
              page.mouse.move(x+90,y+8,steps=1)
              page.mouse.up()
              canvas.screenshot(path=f'/tmp/{label.replace(".","")}-r{round_id}.png')
              redraw_ms=(perf_counter()-t1)*1000
              print(label,'ROUND',round_id,'READY_MS',ready_ms,'DRAG_AND_SCREENSHOT_MS',redraw_ms)
              return ready_ms,redraw_ms

          results={k:[] for k in URLS}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist'])
              context=browser.new_context(viewport={'width':1440,'height':900},device_scale_factor=1,user_agent='Brick-Mother-Perf-QA')
              context.add_cookies([{'name':'__Http-phish','value':'1','url':'https://rawcdn.githack.com/','secure':True,'httpOnly':True,'sameSite':'Lax'}])
              # Alternate order to reduce warm-cache bias.
              for round_id,order in [(1,['R2.14.5','R2.14.7']),(2,['R2.14.7','R2.14.5'])]:
                  for label in order:
                      page=context.new_page()
                      results[label].append(one(page,label,URLS[label],round_id))
                      page.close()
              browser.close()
          for label,vals in results.items():
              print(label,'MEDIAN_READY_MS',median(v[0] for v in vals),'MEDIAN_DRAG_AND_SCREENSHOT_MS',median(v[1] for v in vals))
          b=results['R2.14.5']; c=results['R2.14.7']
          br=median(v[0] for v in b); cr=median(v[0] for v in c)
          bd=median(v[1] for v in b); cd=median(v[1] for v in c)
          print('READY_RATIO_R2147_OVER_R2145',cr/br)
          print('REDRAW_RATIO_R2147_OVER_R2145',cd/bd)
          PY
          python /tmp/perf.py
      - name: Upload comparison frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-r2147-perf-compare
          path: /tmp/R214*-r*.png
          if-no-files-found: ignore
