name: Brick Mother Realtime Weathering PBR V1 Materialize

on:
  push:
    branches:
      - feature/brick-mother-v2.0-composite-material-dna
    paths:
      - ".github/workflows/brick-mother-weathering-pbr-v1-materialize.yml"
      - "private-review/brick-mother-weathering-pbr-v1/payload/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  PAYLOAD_ROOT: private-review/brick-mother-weathering-pbr-v1/payload
  BRICK_ROOT: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother
  TARGET_BRANCH: feature/brick-mother-v2.0-composite-material-dna
  PAYLOAD_SHA256: 360aeb605cc8338ad0f9069a394ffe005edd45713254bfc65a8428b940c6f2ae
  PRESERVED_CORE_BLOB: 7b10389cb9367f7423619262820883cc94b07a61

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact payload head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat "$PAYLOAD_ROOT"/payload.0{0,1,2,3,4,5,6}.b64 | base64 --decode > /tmp/brick-mother-weathering-pbr-v1.tar.gz
          actual="$(sha256sum /tmp/brick-mother-weathering-pbr-v1.tar.gz | awk '{print $1}')"
          test "$actual" = "$PAYLOAD_SHA256"
          tar -tzf /tmp/brick-mother-weathering-pbr-v1.tar.gz
          tar -xzf /tmp/brick-mother-weathering-pbr-v1.tar.gz -C .
          git restore .github/workflows/brick-mother-pages-preview.yml

      - name: Validate preserved core and new runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$BRICK_ROOT/brick-mother-standalone-v2.7.5.html")" = "$PRESERVED_CORE_BLOB"
          test -s "$BRICK_ROOT/workbench.html"
          test -s "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.0.0.html"
          test -s "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.css"
          test -s "$BRICK_ROOT/brick-mother-weathering-geometry-v1.js"
          test -s "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.js"
          node --check "$BRICK_ROOT/brick-mother-weathering-geometry-v1.js"
          node --check "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.js"
          grep -q "PBR 实时风化" "$BRICK_ROOT/workbench.html"
          grep -q "Base Color" "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.0.0.html"
          grep -q "Roughness" "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.0.0.html"
          grep -q "PBR Safe" "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.0.0.html"
          grep -q "uDielectricF0" "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.js"
          grep -q "dataset.metalness='0'" "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.js"
          grep -q "dataset.dielectricF0='0.04'" "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.js"

      - name: Commit materialized workbench
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Brick Mother Automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            "$BRICK_ROOT/workbench.html" \
            "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.0.0.html" \
            "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.css" \
            "$BRICK_ROOT/brick-mother-weathering-geometry-v1.js" \
            "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.js"
          if git diff --cached --quiet; then
            echo "Realtime weathering PBR workbench already materialized"
          else
            git commit -m "feat(brick): add realtime weathering PBR 3D workbench"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
