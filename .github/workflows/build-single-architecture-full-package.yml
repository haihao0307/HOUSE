name: Build Single Architecture Full Package

on:
  push:
    branches:
      - package-architecture-blueprint-full-v1.0.0-20260902
    paths-ignore:
      - Yunnan_Traditional_Architecture_Full_Package_2026-09-02.zip
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: single-architecture-full-package
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package contents
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build one full ZIP
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="Yunnan_Traditional_Architecture_Full_Package_2026-09-02.zip"
          ROOT="Yunnan_Traditional_Architecture_Full_Package_2026-09-02"
          rm -rf "$ROOT" "$PACKAGE"
          mkdir -p "$ROOT"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude="$PACKAGE" \
            ./ "$ROOT/"
          zip -q -r -9 "$PACKAGE" "$ROOT"
          test -s "$PACKAGE"
          unzip -tq "$PACKAGE"
          sha256sum "$PACKAGE"

      - name: Publish the single ZIP to GitHub
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="Yunnan_Traditional_Architecture_Full_Package_2026-09-02.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PACKAGE"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(package): publish one architecture full package [single-package]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
