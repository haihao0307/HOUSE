name: Materialize Brick Mother Realtime PBR Workbench V1.1

on:
  push:
    branches:
      - feature/brick-mother-v2.0-composite-material-dna
    paths:
      - ".github/workflows/brick-mother-weathering-pbr-v11-release.yml"
      - "private-review/brick-mother-weathering-pbr-v11-release/payload.*.b64"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brick-mother-weathering-pbr-v11-release
  cancel-in-progress: false

env:
  TARGET_BRANCH: feature/brick-mother-v2.0-composite-material-dna
  PAYLOAD_ROOT: private-review/brick-mother-weathering-pbr-v11-release
  BRICK_ROOT: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother
  RELEASE_SHA256: 59dbf95bf3ee44584aadb72c972803c325f3f6c3a583306bc51404a0e9f4e40b
  PRESERVED_CORE_BLOB: 7b10389cb9367f7423619262820883cc94b07a61

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact payload head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify exact release bundle
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/brick-mother-realtime-pbr-v11.tar.gz
          stage=/tmp/brick-mother-realtime-pbr-v11
          cat \
            "$PAYLOAD_ROOT/payload.00.b64" \
            "$PAYLOAD_ROOT/payload.01.b64" \
            "$PAYLOAD_ROOT/payload.02.b64" \
            "$PAYLOAD_ROOT/payload.03a.b64" \
            "$PAYLOAD_ROOT/payload.03b.b64" \
            | base64 --decode > "$archive"
          echo "$RELEASE_SHA256  $archive" | sha256sum --check --strict
          rm -rf "$stage"
          mkdir -p "$stage"
          tar -xzf "$archive" -C "$stage"
          expected=(
            BRICK_MOTHER_REALTIME_WEATHERING_PBR_BUILD_V1.1.json
            brick-mother-pages-preview.yml
            brick-mother-realtime-weathering-pbr-v1.1.0.html
            brick-mother-realtime-weathering-pbr-v1.1.css
            brick-mother-realtime-weathering-pbr-v1.1.js
            brick-mother-stone-form-geometry-v3.5.js
            brick-mother-weathering-geometry-v1.1.js
            workbench.html
          )
          for file in "${expected[@]}"; do test -s "$stage/$file"; done
          test "$(find "$stage" -maxdepth 1 -type f | wc -l)" -eq 8
          node --check "$stage/brick-mother-stone-form-geometry-v3.5.js"
          node --check "$stage/brick-mother-weathering-geometry-v1.1.js"
          node --check "$stage/brick-mother-realtime-weathering-pbr-v1.1.js"
          python3 -m json.tool "$stage/BRICK_MOTHER_REALTIME_WEATHERING_PBR_BUILD_V1.1.json" >/dev/null
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          stage=Path('/tmp/brick-mother-realtime-pbr-v11')
          data=json.loads((stage/'BRICK_MOTHER_REALTIME_WEATHERING_PBR_BUILD_V1.1.json').read_text())
          assert data['runtimeVersion']=='1.1.0-alpha.3'
          assert data['rendering']['brdf']=='GGX'
          assert data['rendering']['energyConserving'] is True
          assert data['rendering']['metalness']==0
          assert data['rendering']['dielectricF0']==0.04
          assert data['rendering']['baseColorSpace']=='sRGB'
          assert data['rendering']['dataChannelSpace']=='linear'
          assert data['rendering']['aoScope']=='diffuse ambient only'
          assert len(data['materialFamilies'])==6
          assert len(data['diagnosticChannels'])==16
          assert data['preservedCore']['gitBlob']==os.environ['PRESERVED_CORE_BLOB']
          assert data['visualApproved'] is False
          assert data['productionApproved'] is False
          PY
          grep -q "weatheringRuntime:'1.1.0-alpha.3'" "$stage/workbench.html"
          grep -q "pbrChannels:16" "$stage/workbench.html"
          grep -q "brick-mother-realtime-weathering-pbr-v1.1.0.html" "$stage/workbench.html"
          grep -q "Deploy Brick Mother Online Workbench V2.11" "$stage/brick-mother-pages-preview.yml"
          grep -q "data-view=\"15\"" "$stage/brick-mother-realtime-weathering-pbr-v1.1.0.html"
          grep -q "BrickMotherStoneFormGeometryV35" "$stage/brick-mother-weathering-geometry-v1.1.js"
          grep -q "dataset.aoScope='diffuse-ambient-only'" "$stage/brick-mother-realtime-weathering-pbr-v1.1.js"
          grep -q "dataset.heightRole='low-frequency-silhouette'" "$stage/brick-mother-realtime-weathering-pbr-v1.1.js"
          grep -q "dataset.normalRole='high-frequency-surface'" "$stage/brick-mother-realtime-weathering-pbr-v1.1.js"

      - name: Materialize source and deployment workflow
        shell: bash
        run: |
          set -euo pipefail
          stage=/tmp/brick-mother-realtime-pbr-v11
          install -m 0644 "$stage/brick-mother-stone-form-geometry-v3.5.js" "$BRICK_ROOT/brick-mother-stone-form-geometry-v3.5.js"
          install -m 0644 "$stage/brick-mother-weathering-geometry-v1.1.js" "$BRICK_ROOT/brick-mother-weathering-geometry-v1.1.js"
          install -m 0644 "$stage/brick-mother-realtime-weathering-pbr-v1.1.js" "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.1.js"
          install -m 0644 "$stage/brick-mother-realtime-weathering-pbr-v1.1.css" "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.1.css"
          install -m 0644 "$stage/brick-mother-realtime-weathering-pbr-v1.1.0.html" "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.1.0.html"
          install -m 0644 "$stage/BRICK_MOTHER_REALTIME_WEATHERING_PBR_BUILD_V1.1.json" "$BRICK_ROOT/BRICK_MOTHER_REALTIME_WEATHERING_PBR_BUILD_V1.1.json"
          install -m 0644 "$stage/workbench.html" "$BRICK_ROOT/workbench.html"
          install -m 0644 "$stage/brick-mother-pages-preview.yml" .github/workflows/brick-mother-pages-preview.yml
          test "$(git hash-object "$BRICK_ROOT/brick-mother-standalone-v2.7.5.html")" = "$PRESERVED_CORE_BLOB"
          node --check "$BRICK_ROOT/brick-mother-stone-form-geometry-v3.5.js"
          node --check "$BRICK_ROOT/brick-mother-weathering-geometry-v1.1.js"
          node --check "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.1.js"
          python3 -m json.tool "$BRICK_ROOT/BRICK_MOTHER_REALTIME_WEATHERING_PBR_BUILD_V1.1.json" >/dev/null

      - name: Commit and append to current remote head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Brick Mother Automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            .github/workflows/brick-mother-pages-preview.yml \
            "$BRICK_ROOT/brick-mother-stone-form-geometry-v3.5.js" \
            "$BRICK_ROOT/brick-mother-weathering-geometry-v1.1.js" \
            "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.1.js" \
            "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.1.css" \
            "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.1.0.html" \
            "$BRICK_ROOT/BRICK_MOTHER_REALTIME_WEATHERING_PBR_BUILD_V1.1.json" \
            "$BRICK_ROOT/workbench.html"
          if git diff --cached --quiet; then
            echo "Exact realtime PBR V1.1 release already materialized."
            exit 0
          fi
          git commit -m "feat(brick): integrate realtime PBR weathering workbench v1.1"
          for attempt in 1 2 3 4; do
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH"
            test "$(git hash-object "$BRICK_ROOT/brick-mother-standalone-v2.7.5.html")" = "$PRESERVED_CORE_BLOB"
            node --check "$BRICK_ROOT/brick-mother-stone-form-geometry-v3.5.js"
            node --check "$BRICK_ROOT/brick-mother-weathering-geometry-v1.1.js"
            node --check "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.1.js"
            if git push origin "HEAD:$TARGET_BRANCH"; then
              echo "Release appended successfully on attempt $attempt."
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "Unable to append release after four normal fast-forward attempts." >&2
          exit 1
