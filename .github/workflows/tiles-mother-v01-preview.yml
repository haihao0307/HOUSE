name: Tiles Mother V0.1 Workbench

on:
  push:
    branches: [feature/tiles-mother-v0.1-workbench]
    paths:
      - .github/workflows/tiles-mother-v01-preview.yml
      - tiles-mother/tools/**
      - tiles-mother/index.html
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tiles-mother-v01-workbench
  cancel-in-progress: false

jobs:
  workbench:
    if: github.ref == 'refs/heads/feature/tiles-mother-v0.1-workbench'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact standalone HTML and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re
          html=Path('tiles-mother/index.html').read_bytes()
          assert len(html)==77348
          assert hashlib.sha256(html).hexdigest()=='87ed9f2e1a4a668f8c85547a959694dab4be0c103e7bc43eb0b93b91f1c5b4ec'
          for i,js in enumerate(re.findall(r'<script[^>]*>([\s\S]*?)</script>',html.decode('utf-8'))):
              Path(f'/tmp/tiles-script-{i}.js').write_text(js,encoding='utf-8')
          PY
          for script in /tmp/tiles-script-*.js; do node --check "$script"; done

      - name: Install browser dependencies and Chinese system fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
          python3 -m pip install 'playwright>=1.50,<2' 'pillow>=10,<13'

      - name: Test real WebGL2, seeds, mobile layout and reference persistence
        run: python3 tiles-mother/tools/browser_qa.py

      - name: Verify the public experimental preview returns exact tested HTML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,time,urllib.request
          sha=os.environ['GITHUB_SHA']
          url=f'https://raw.githack.com/haihao0307/HOUSE/{sha}/tiles-mother/index.html'
          expected='87ed9f2e1a4a668f8c85547a959694dab4be0c103e7bc43eb0b93b91f1c5b4ec'
          report={'url':url,'sourceCommit':sha,'scope':'HTTP readback and SHA256. WebGL and UI tests run against the identical HTML on the runner localhost.','thirdPartyPreview':True,'githubPagesChanged':False,'visualApproved':False,'productionApproved':False,'verified':False}
          try:
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(url,timeout=40) as response:
                          data=response.read();report.update(httpStatus=response.status,contentType=response.headers.get('Content-Type'),bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
                      assert report['httpStatus']==200 and report['sha256']==expected,report
                      assert 'text/html' in report['contentType'],report
                      report['verified']=True
                      break
                  except Exception as error:
                      report['lastError']=str(error)
                      if attempt==2: raise
                      time.sleep(5)
          finally:
              Path('tiles-mother/qa/public-preview.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
              print(json.dumps(report,indent=2))
          PY

      - name: Preserve truthful QA and preview report on this branch only
        if: always()
        shell: bash
        env:
          BRANCH: feature/tiles-mother-v0.1-workbench
        run: |
          set -euo pipefail
          test -d tiles-mother/qa || exit 0
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in tiles-mother/qa/browser-report.json tiles-mother/qa/public-preview.json; do
            if test -f "$file"; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'test(tiles-mother): record browser and public preview verification'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi

      - name: Upload HTML and browser evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiles-mother-v01-${{ github.sha }}
          path: |
            tiles-mother/index.html
            tiles-mother/qa/
          if-no-files-found: warn
          retention-days: 30

      - name: Report preview status
        if: always()
        shell: bash
        run: |
          echo '## Tiles Mother experimental workbench' >> "$GITHUB_STEP_SUMMARY"
          echo 'Only feature/tiles-mother-v0.1-workbench was written. Main, Brick Mother, release and Pages were not modified.' >> "$GITHUB_STEP_SUMMARY"
          echo 'visualApproved=false; productionApproved=false. Experimental dimensions await user references.' >> "$GITHUB_STEP_SUMMARY"
          for file in tiles-mother/qa/browser-report.json tiles-mother/qa/public-preview.json; do
            if test -f "$file"; then
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$file" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
