name: Wood Mother isolated browser verification
on:
  push:
    branches: [trial/wood-mother-r01-20261028]
    paths: ['wood-mother-r01/**', '.github/workflows/wood-mother-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: pip install playwright==1.57.0
      - run: test -x /opt/google/chrome/chrome && google-chrome --version
      - run: python wood-mother-r01/test_field.py
      - name: Real browser test, no sandbox override or unsafe GPU flags
        run: python wood-mother-r01/ci/browser_check.py
      - name: Isolated v4 footprint readback
        run: python wood-mother-r01/diagnostic-lane/run.py
      - name: Single medium-scale comparison
        run: python wood-mother-r01/diagnostic-lane/compare.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wood-mother-real-browser-evidence
          path: wood-mother-r01/ci/evidence
