name: Brick Mother Realtime PBR V1.1 Archived Verification

# Retained for audit history. Active deployment lives in brick-mother-pages-preview.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BRICK_ROOT: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother
  PRESERVED_CORE_BLOB: 7b10389cb9367f7423619262820883cc94b07a61

jobs:
  archived-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Verify archived V1.1 source contract
        shell: bash
        run: |
          set -euo pipefail
          root="$BRICK_ROOT"
          test -s "$root/workbench.html"
          test -s "$root/brick-mother-standalone-v2.7.5.html"
          test -s "$root/brick-mother-realtime-weathering-pbr-v1.1.0.html"
          test -s "$root/brick-mother-realtime-weathering-pbr-v1.1.css"
          test -s "$root/brick-mother-realtime-weathering-pbr-v1.1.js"
          test -s "$root/brick-mother-weathering-geometry-v1.1.js"
          test -s "$root/brick-mother-stone-form-geometry-v3.5.js"
          test -s "$root/BRICK_MOTHER_REALTIME_WEATHERING_PBR_BUILD_V1.1.json"
          test "$(git hash-object "$root/brick-mother-standalone-v2.7.5.html")" = "$PRESERVED_CORE_BLOB"
          node --check "$root/brick-mother-realtime-weathering-pbr-v1.1.js"
          node --check "$root/brick-mother-weathering-geometry-v1.1.js"
          node --check "$root/brick-mother-stone-form-geometry-v3.5.js"
          python3 -m json.tool "$root/BRICK_MOTHER_REALTIME_WEATHERING_PBR_BUILD_V1.1.json" >/dev/null
