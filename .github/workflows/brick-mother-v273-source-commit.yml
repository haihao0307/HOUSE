name: Brick Mother V2.7.3 Reference Contrast Source Commit

on:
  push:
    branches:
      - feature/brick-mother-v2.0-composite-material-dna
    paths:
      - ".github/workflows/brick-mother-v273-source-commit.yml"

permissions:
  contents: write

jobs:
  apply-gate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feature/brick-mother-v2.0-composite-material-dna
          fetch-depth: 0

      - name: Reconstruct deterministic V2.7.3 scripts
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/brick-mother-v273-tune/scripts.tar.xz.b64 > /tmp/brick-mother-v273-scripts.tar.xz
          echo '7613553464770ba2e9383d4e978954d64e478ef80fd1910d81ffdd05bb4f0e3b  /tmp/brick-mother-v273-scripts.tar.xz' | sha256sum -c -
          mkdir -p /tmp/brick-mother-v273
          tar -xJf /tmp/brick-mother-v273-scripts.tar.xz -C /tmp/brick-mother-v273
          echo '20a8e549b365c31f521973fab1f59282a08e864eb077b9180f3deaa4227d02d9  /tmp/brick-mother-v273/apply_v273.py' | sha256sum -c -
          echo '8b45a6f2655b4529b25607529a3afc80eaac3579b4e655ba51511bbb1e17a2cd  /tmp/brick-mother-v273/build_standalone_v273.py' | sha256sum -c -
          python3 -m py_compile /tmp/brick-mother-v273/apply_v273.py /tmp/brick-mother-v273/build_standalone_v273.py

      - name: Apply V2.7.3 reference contrast and pore tuning
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/brick-mother-v273/apply_v273.py
          python3 /tmp/brick-mother-v273/build_standalone_v273.py

      - name: Validate V2.7.3 source and standalone
        shell: bash
        run: |
          set -euxo pipefail
          brick="yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother"
          node --check "$brick/brick-mother-gaea-kernel-v1.js"
          node --check "$brick/brick-mother-geometry-v2.js"
          node --check "$brick/brick-mother-renderer-v2.js"
          node --check "$brick/brick-mother-app-v2.js"
          python3 -m json.tool "$brick/data/brick-material-profiles-v2.json" >/dev/null
          python3 -m json.tool "$brick/qa/gaea-distillation-contract-v1.json" >/dev/null
          python3 -m json.tool "$brick/qa/v27-visual-truth-contract.json" >/dev/null
          python3 -m json.tool "$brick/VERSION.json" >/dev/null
          grep -q '"version": "2.7.3-alpha.1"' "$brick/VERSION.json"
          grep -q '"frontBiasedPoreDistribution": true' "$brick/VERSION.json"
          grep -q '"reducedSilhouetteBites": true' "$brick/VERSION.json"
          grep -q '"eventArtifactSuppression": true' "$brick/VERSION.json"
          grep -q 'v2.7.3-reference-contrast-pore-bias-alpha1' "$brick/brick-mother-geometry-v2.js"
          grep -q 'choosePoreFace' "$brick/brick-mother-geometry-v2.js"
          grep -q 'type == 6 || type == 8' "$brick/brick-mother-renderer-v2.js"
          grep -q 'profile.family === .STONE. ? 0.68 : 0.60' "$brick/brick-mother-renderer-v2.js"
          standalone="$brick/brick-mother-standalone-v2.7.3.html"
          test -s "$standalone"
          test "$(wc -c < "$standalone")" -gt 170000
          ! grep -q '<script src=' "$standalone"
          ! grep -q '<link rel="stylesheet"' "$standalone"
          grep -q 'window.__BRICK_MOTHER_INLINE_DATA__' "$standalone"
          grep -q 'DOMContentLoaded' "$standalone"
          sha256sum "$standalone" > /tmp/brick-mother-v273-standalone.sha256

      - name: Gate V2.7.3 fired benchmark slab in Chromium
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          uri="$(python3 - <<'PY'
          from pathlib import Path
          print(Path('yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/brick-mother-standalone-v2.7.3.html').resolve().as_uri())
          PY
          )"
          timeout 480s "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-background-networking \
            --allow-file-access-from-files \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --enable-unsafe-swiftshader \
            --use-gl=angle \
            --use-angle=swiftshader \
            --hide-scrollbars \
            --window-size=1600,1000 \
            --virtual-time-budget=12000 \
            --screenshot=/tmp/brick-mother-v273-fired-gate.png \
            --dump-dom \
            "${uri}?evidence=1&solo=1&specimen=benchmark&profile=old-pbr-fired&focus=2&debug=0&qa=v273-source-gate" \
            > /tmp/brick-mother-v273-source-dom.html \
            2> /tmp/brick-mother-v273-source-chrome.log
          grep -q 'data-brick-mother-ready="true"' /tmp/brick-mother-v273-source-dom.html
          grep -q 'data-brick-mother-version="2.7.3-alpha.1"' /tmp/brick-mother-v273-source-dom.html
          grep -q 'data-benchmark-specimen="true"' /tmp/brick-mother-v273-source-dom.html
          grep -Eq 'data-deep-pores="[1-9][0-9]*"' /tmp/brick-mother-v273-source-dom.html
          grep -Eq 'data-pore-rim-chips="[1-9][0-9]*"' /tmp/brick-mother-v273-source-dom.html
          grep -q 'data-debug-modes="11"' /tmp/brick-mother-v273-source-dom.html
          test -s /tmp/brick-mother-v273-fired-gate.png
          test "$(wc -c < /tmp/brick-mother-v273-fired-gate.png)" -gt 120000

      - name: Commit browser gated V2.7.3 source
        shell: bash
        run: |
          set -euo pipefail
          brick="yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother"
          git restore --source=HEAD --staged --worktree .github/workflows
          rm -rf .github/brick-mother-v273-tune
          git config user.name "Brick Mother V2.7.3 Calibration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A "$brick" .github/brick-mother-v273-tune
          if git diff --cached --quiet; then
            echo 'No V2.7.3 source changes to commit' >&2
            exit 1
          fi
          git commit -m "Tune Brick Mother V2.7.3 reference contrast and pore distribution"
          git push origin HEAD:feature/brick-mother-v2.0-composite-material-dna

      - name: Upload V2.7.3 source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-mother-v273-source-gate-evidence
          path: |
            /tmp/brick-mother-v273-fired-gate.png
            /tmp/brick-mother-v273-source-dom.html
            /tmp/brick-mother-v273-source-chrome.log
            /tmp/brick-mother-v273-standalone.sha256
            yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/brick-mother-standalone-v2.7.3.html
            yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/VERSION.json
            yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/qa/v27-visual-truth-contract.json
          compression-level: 1
          if-no-files-found: ignore
