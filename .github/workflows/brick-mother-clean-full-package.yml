name: Brick Mother V2.7.5 Clean Full Package

on:
  push:
    branches:
      - feature/brick-mother-v2.0-composite-material-dna
    paths:
      - .github/workflows/brick-mother-clean-full-package.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble clean full package
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_RUNTIME_HEAD="fa142a834a74dc2009a161553d713acf77324c26"
          PACKAGE="BRICK_MOTHER_V2.7.5_CLEAN_FULL_PACKAGE_2026-08-30"
          ROOT="$RUNNER_TEMP/$PACKAGE"
          REPO_OVERLAY="$ROOT/repo-overlay"
          REVIEW="$ROOT/local-review"
          EVIDENCE="$ROOT/evidence"
          BRICK="yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother"
          OVERLAY_BRICK="$REPO_OVERLAY/$BRICK"

          rm -rf "$ROOT"
          mkdir -p "$OVERLAY_BRICK/data" "$OVERLAY_BRICK/docs" "$OVERLAY_BRICK/qa" "$OVERLAY_BRICK/tools"
          mkdir -p "$REPO_OVERLAY/.github/workflows" "$REVIEW/data" "$EVIDENCE"

          required=(
            "$BRICK/VERSION.json"
            "$BRICK/index.html"
            "$BRICK/brick-mother-observation-studio.html"
            "$BRICK/brick-mother-standalone-v2.7.5.html"
            "$BRICK/brick-mother-standalone-v2.6.html"
            "$BRICK/brick-mother-app-v2.js"
            "$BRICK/brick-mother-gaea-kernel-v1.js"
            "$BRICK/brick-mother-geometry-v2.js"
            "$BRICK/brick-mother-renderer-v2.js"
            "$BRICK/style.css"
            "$BRICK/gaea-distilled.css"
            "$BRICK/visual-calibration.css"
            "$BRICK/data/brick-material-profiles-v2.json"
            "$BRICK/data/gaea-distilled-node-recipes-v1.json"
            "$BRICK/docs/BRICK_MOTHER_GAEA_DISTILLATION_V1.md"
            "$BRICK/docs/BRICK_MOTHER_V0_4_NOISE_FIDELITY.md"
            "$BRICK/docs/BRICK_MOTHER_V27_VISUAL_TRUTH_SPEC.md"
            "$BRICK/docs/BRICK_MOTHER_V2_COMPOSITE_MATERIAL_DNA.md"
            "$BRICK/qa/evidence-manifest-v275.json"
            "$BRICK/qa/gaea-distillation-contract-v1.json"
            "$BRICK/qa/v27-visual-truth-contract.json"
            "$BRICK/tools/capture_evidence_v275.py"
            ".github/workflows/brick-mother-v2-smoke.yml"
            ".github/workflows/brick-mother-observation-studio-smoke.yml"
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing required file: $file" >&2; exit 1; }
          done

          cp "$BRICK/VERSION.json" "$OVERLAY_BRICK/"
          cp "$BRICK/index.html" "$OVERLAY_BRICK/"
          cp "$BRICK/brick-mother-observation-studio.html" "$OVERLAY_BRICK/"
          cp "$BRICK/brick-mother-standalone-v2.7.5.html" "$OVERLAY_BRICK/"
          cp "$BRICK/brick-mother-standalone-v2.6.html" "$OVERLAY_BRICK/"
          cp "$BRICK/brick-mother-app-v2.js" "$OVERLAY_BRICK/"
          cp "$BRICK/brick-mother-gaea-kernel-v1.js" "$OVERLAY_BRICK/"
          cp "$BRICK/brick-mother-geometry-v2.js" "$OVERLAY_BRICK/"
          cp "$BRICK/brick-mother-renderer-v2.js" "$OVERLAY_BRICK/"
          cp "$BRICK/style.css" "$OVERLAY_BRICK/"
          cp "$BRICK/gaea-distilled.css" "$OVERLAY_BRICK/"
          cp "$BRICK/visual-calibration.css" "$OVERLAY_BRICK/"
          cp "$BRICK/data/brick-material-profiles-v2.json" "$OVERLAY_BRICK/data/"
          cp "$BRICK/data/gaea-distilled-node-recipes-v1.json" "$OVERLAY_BRICK/data/"
          cp "$BRICK/docs/BRICK_MOTHER_GAEA_DISTILLATION_V1.md" "$OVERLAY_BRICK/docs/"
          cp "$BRICK/docs/BRICK_MOTHER_V0_4_NOISE_FIDELITY.md" "$OVERLAY_BRICK/docs/"
          cp "$BRICK/docs/BRICK_MOTHER_V27_VISUAL_TRUTH_SPEC.md" "$OVERLAY_BRICK/docs/"
          cp "$BRICK/docs/BRICK_MOTHER_V2_COMPOSITE_MATERIAL_DNA.md" "$OVERLAY_BRICK/docs/"
          cp "$BRICK/qa/evidence-manifest-v275.json" "$OVERLAY_BRICK/qa/"
          cp "$BRICK/qa/gaea-distillation-contract-v1.json" "$OVERLAY_BRICK/qa/"
          cp "$BRICK/qa/v27-visual-truth-contract.json" "$OVERLAY_BRICK/qa/"
          cp "$BRICK/tools/capture_evidence_v275.py" "$OVERLAY_BRICK/tools/"
          cp .github/workflows/brick-mother-v2-smoke.yml "$REPO_OVERLAY/.github/workflows/"
          cp .github/workflows/brick-mother-observation-studio-smoke.yml "$REPO_OVERLAY/.github/workflows/"

          cp "$BRICK/brick-mother-observation-studio.html" "$REVIEW/index.html"
          cp "$BRICK/brick-mother-observation-studio.html" "$REVIEW/brick-mother-observation-studio.html"
          cp "$BRICK/brick-mother-standalone-v2.7.5.html" "$REVIEW/brick-mother-standalone-v2.7.5.html"
          cp "$BRICK/brick-mother-standalone-v2.6.html" "$REVIEW/brick-mother-standalone-v2.6.html"
          cp "$BRICK/brick-mother-app-v2.js" "$REVIEW/"
          cp "$BRICK/brick-mother-gaea-kernel-v1.js" "$REVIEW/"
          cp "$BRICK/brick-mother-geometry-v2.js" "$REVIEW/"
          cp "$BRICK/brick-mother-renderer-v2.js" "$REVIEW/"
          cp "$BRICK/style.css" "$REVIEW/"
          cp "$BRICK/gaea-distilled.css" "$REVIEW/"
          cp "$BRICK/visual-calibration.css" "$REVIEW/"
          cp "$BRICK/VERSION.json" "$REVIEW/"
          cp "$BRICK/data/brick-material-profiles-v2.json" "$REVIEW/data/"
          cp "$BRICK/data/gaea-distilled-node-recipes-v1.json" "$REVIEW/data/"

          cat > "$REVIEW/START_OBSERVATION_STUDIO.bat" <<'BAT'
          @echo off
          setlocal
          cd /d "%~dp0"
          where py >nul 2>nul && set PYTHON_CMD=py -3
          if not defined PYTHON_CMD where python >nul 2>nul && set PYTHON_CMD=python
          if not defined PYTHON_CMD (
            echo Python 3 is required to start the local server.
            pause
            exit /b 1
          )
          start "Brick Mother Local Server" cmd /c "%PYTHON_CMD% -m http.server 8765 --bind 127.0.0.1"
          timeout /t 2 /nobreak >nul
          start "" "http://127.0.0.1:8765/index.html?mobile=0&full=1"
          endlocal
          BAT

          cat > "$REVIEW/START_OBSERVATION_STUDIO.ps1" <<'PS1'
          $ErrorActionPreference = 'Stop'
          Set-Location $PSScriptRoot
          $python = Get-Command py -ErrorAction SilentlyContinue
          if ($python) { Start-Process py -ArgumentList '-3','-m','http.server','8765','--bind','127.0.0.1' }
          else {
            $python = Get-Command python -ErrorAction SilentlyContinue
            if (-not $python) { throw 'Python 3 is required.' }
            Start-Process python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1'
          }
          Start-Sleep -Seconds 2
          Start-Process 'http://127.0.0.1:8765/index.html?mobile=0&full=1'
          PS1

          cat > "$REVIEW/start_observation_studio.sh" <<'SH'
          #!/usr/bin/env sh
          set -eu
          cd "$(dirname "$0")"
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/brick-mother-server.log 2>&1 &
          sleep 2
          printf '%s\n' 'Open http://127.0.0.1:8765/index.html?mobile=0&full=1'
          SH
          chmod +x "$REVIEW/start_observation_studio.sh"

          cat > "$ROOT/README_FIRST.md" <<EOF
          # Brick Mother V2.7.5 Clean Full Package

          Source repository: haihao0307/HOUSE
          Source branch: feature/brick-mother-v2.0-composite-material-dna
          Runtime source head: $SOURCE_RUNTIME_HEAD
          Package workflow head: ${GITHUB_SHA}

          ## Local review

          Open local-review/START_OBSERVATION_STUDIO.bat on Windows. The script starts a local server and opens the focused three-column observation studio.

          local-review/brick-mother-standalone-v2.7.5.html is the latest single-file runtime.
          local-review/brick-mother-standalone-v2.6.html is retained as the approved high-variation comparison line.

          ## Repository application

          repo-overlay contains only the maintained V2.7.5 runtime, two maintained QA workflows, essential material data, core knowledge documents, current contracts and evidence capture tool.

          Read CODEX_PUSH_INSTRUCTIONS.md before applying the overlay.

          ## Approval state

          All human visual approvals and productionApproved remain false.
          V1.0 frozen assets must remain unchanged.
          EOF

          cat > "$ROOT/CODEX_PUSH_INSTRUCTIONS.md" <<'EOF'
          # Codex apply and push instructions

          Repository: haihao0307/HOUSE
          Target branch: feature/brick-mother-v2.0-composite-material-dna

          1. Fetch the remote branch and confirm its current head.
          2. Create a clean worktree from the newest remote head. Use fast-forward history only.
          3. Copy every file from repo-overlay into the repository root, preserving relative paths.
          4. Read DELETE_FROM_REPO.txt and remove only the listed obsolete V2 development files that still exist.
          5. Do not modify release/brick-mother-v1.0, main, gh-pages or V1 frozen assets.
          6. Run node --check on the three V2 JavaScript runtime files and the Gaea kernel.
          7. Run python -m json.tool on VERSION.json, the two data JSON files and the three QA JSON files.
          8. Start a local HTTP server in the brick-mother directory and open brick-mother-observation-studio.html?mobile=0&full=1.
          9. Confirm the page reaches data-brick-mother-ready="true" and that fired clay, stone and adobe can be selected.
          10. Commit normally and push without force.
          11. Keep PR #15 open, Draft and unmerged. Keep every manual visual approval and productionApproved false.

          Recommended commit title:

          Clean Brick Mother V2.7.5 runtime and handoff package
          EOF

          cat > "$ROOT/DELETE_FROM_REPO.txt" <<'EOF'
          # Remove only when these paths exist on the V2 feature branch.
          # Preserve brick-mother/releases/v1.0 and the release/brick-mother-v1.0 branch.

          .github/workflows/brick-mother-v27-source-commit.yml
          .github/workflows/brick-mother-v27-source-retry.yml
          .github/workflows/brick-mother-v27-source-retry2.yml
          .github/workflows/brick-mother-v271-source-commit.yml
          .github/workflows/brick-mother-v272-source-commit.yml
          .github/workflows/brick-mother-v273-source-commit.yml
          .github/workflows/brick-mother-v273-source-retry.yml
          .github/workflows/brick-mother-v274-source-commit.yml
          .github/workflows/brick-mother-v274-source-retry.yml
          .github/workflows/brick-mother-observation-package.yml

          yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/brick-mother-app-v04.js
          yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/brick-mother-app.js
          yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/brick-mother-geometry-v04.js
          yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/brick-mother-geometry.js
          yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/brick-mother-renderer-v04.js
          yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/brick-mother-renderer.js

          yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/brick-mother-standalone-v2.5.html
          yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/brick-mother-standalone-v2.7.html
          yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/brick-mother-standalone-v2.7.1.html
          yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/brick-mother-standalone-v2.7.2.html
          yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/brick-mother-standalone-v2.7.3.html
          yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/brick-mother-standalone-v2.7.4.html

          yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/data/brick-material-profiles-v0.3.json
          yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/data/brick-material-profiles-v0.4.json

          yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/docs/BRICK_MOTHER_V2_2_VISUAL_CALIBRATION.md
          yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/docs/BRICK_MOTHER_V2_3_NATURAL_EVENT_COLOR.md
          yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/docs/BRICK_MOTHER_V2_4_SPECTRAL_BALANCE.md
          yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/docs/GEOMETRY_QA_V2_ALPHA1.json
          yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/docs/QA_V2_ALPHA1.json
          yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/README_V25_DEEP_PORE_SPECTRUM.md
          yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/tools/apply_gaea_distillation_v21.py
          EOF

          cat > "$ROOT/CLEANUP_REPORT.md" <<'EOF'
          # Cleanup report

          Retained:

          - Current V2.7.5 split runtime
          - Focused three-column observation studio
          - Latest V2.7.5 single-file runtime
          - V2.6 high-variation comparison runtime
          - Current material profiles and Gaea node recipes
          - Four core knowledge documents
          - Three active QA contracts
          - Current evidence capture tool
          - Two maintained CI workflows
          - Local Windows, PowerShell and macOS/Linux launchers

          Excluded from the package:

          - Failed workflow artifacts and screenshots
          - One-off source-commit and retry workflows
          - Intermediate V2.5 and V2.7.0 through V2.7.4 standalone pages
          - V0.3 and V0.4 material profile copies
          - Legacy app, geometry and renderer implementations
          - One-off migration script
          - Superseded visual calibration notes and alpha QA reports
          - Unrelated HOUSE building, timber, reference model and large GLB assets

          Frozen V1.0 release files are intentionally absent from this overlay and must remain untouched in the repository.
          EOF

          cat > "$ROOT/SOURCE_HEAD.json" <<EOF
          {
            "repository": "haihao0307/HOUSE",
            "branch": "feature/brick-mother-v2.0-composite-material-dna",
            "runtimeSourceHead": "$SOURCE_RUNTIME_HEAD",
            "packageWorkflowHead": "${GITHUB_SHA}",
            "version": "2.7.5-alpha.1",
            "v1BaselineBranch": "release/brick-mother-v1.0",
            "v1BaselineImmutable": true,
            "manualVisualApprovals": false,
            "productionApproved": false
          }
          EOF

          cat > "$REVIEW/README.md" <<'EOF'
          # Local review

          Windows: run START_OBSERVATION_STUDIO.bat.
          PowerShell: run START_OBSERVATION_STUDIO.ps1.
          macOS/Linux: run ./start_observation_studio.sh, then open the printed URL.

          Main entry: index.html
          Latest standalone: brick-mother-standalone-v2.7.5.html
          High-variation comparison: brick-mother-standalone-v2.6.html
          EOF

          node --check "$OVERLAY_BRICK/brick-mother-gaea-kernel-v1.js"
          node --check "$OVERLAY_BRICK/brick-mother-geometry-v2.js"
          node --check "$OVERLAY_BRICK/brick-mother-renderer-v2.js"
          node --check "$OVERLAY_BRICK/brick-mother-app-v2.js"
          python3 -m json.tool "$OVERLAY_BRICK/VERSION.json" >/dev/null
          python3 -m json.tool "$OVERLAY_BRICK/data/brick-material-profiles-v2.json" >/dev/null
          python3 -m json.tool "$OVERLAY_BRICK/data/gaea-distilled-node-recipes-v1.json" >/dev/null
          python3 -m json.tool "$OVERLAY_BRICK/qa/evidence-manifest-v275.json" >/dev/null
          python3 -m json.tool "$OVERLAY_BRICK/qa/gaea-distillation-contract-v1.json" >/dev/null
          python3 -m json.tool "$OVERLAY_BRICK/qa/v27-visual-truth-contract.json" >/dev/null

          grep -q 'data-layout-version="brick-observation-v1"' "$REVIEW/index.html"
          grep -q 'version": "2.7.5-alpha.1"' "$REVIEW/VERSION.json"
          grep -q 'pullout-aligned-to-fiber-bundle' "$OVERLAY_BRICK/brick-mother-geometry-v2.js"
          grep -q 'inclusionProjection' "$OVERLAY_BRICK/brick-mother-renderer-v2.js"
          grep -q 'gl.clearColor(benchmark ? 0.0' "$OVERLAY_BRICK/brick-mother-renderer-v2.js"

          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path

          root = Path(__import__('os').environ['RUNNER_TEMP']) / 'BRICK_MOTHER_V2.7.5_CLEAN_FULL_PACKAGE_2026-08-30'
          entries = []
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name != 'PACKAGE_MANIFEST_SHA256.json':
                  data = path.read_bytes()
                  entries.append({
                      'path': path.relative_to(root).as_posix(),
                      'bytes': len(data),
                      'sha256': hashlib.sha256(data).hexdigest(),
                  })
          manifest = {
              'package': root.name,
              'version': '2.7.5-alpha.1',
              'runtimeSourceHead': 'fa142a834a74dc2009a161553d713acf77324c26',
              'fileCount': len(entries),
              'files': entries,
          }
          (root / 'PACKAGE_MANIFEST_SHA256.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

          find "$ROOT" -type d \( -name node_modules -o -name .git -o -name __pycache__ \) -print -quit | grep -q . && {
            echo 'Forbidden directory leaked into package' >&2
            exit 1
          } || true

          cd "$RUNNER_TEMP"
          zip -9 -r "$PACKAGE.zip" "$PACKAGE" >/dev/null
          sha256sum "$PACKAGE.zip" > "$PACKAGE.zip.sha256"
          unzip -t "$PACKAGE.zip" >/dev/null
          printf '%s\n' "PACKAGE=$RUNNER_TEMP/$PACKAGE.zip" >> "$GITHUB_ENV"
          printf '%s\n' "CHECKSUM=$RUNNER_TEMP/$PACKAGE.zip.sha256" >> "$GITHUB_ENV"

      - name: Upload clean full package
        uses: actions/upload-artifact@v4
        with:
          name: brick-mother-v275-clean-full-package
          path: |
            ${{ env.PACKAGE }}
            ${{ env.CHECKSUM }}
          compression-level: 0
          if-no-files-found: error
