name: Tiles Mother 08E public browser smoke

on:
  push:
    branches: [codex/tiles-08e-contact-20260914]
    paths:
      - .github/workflows/tiles-mother-08e-public-smoke.yml

jobs:
  public-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Selenium client
        run: python -m pip install --quiet selenium

      - name: Open fixed public URL and exercise core controls
        env:
          PAGE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          sha=os.environ['PAGE_SHA']
          url=f'https://raw.githack.com/haihao0307/HOUSE/{sha}/tiles-mother/r2-closeout-08e-contact/START_HERE.html'
          opt=webdriver.ChromeOptions()
          opt.add_argument('--headless=new')
          opt.add_argument('--no-sandbox')
          opt.add_argument('--window-size=1440,1000')
          opt.add_argument('--use-angle=swiftshader')
          opt.add_argument('--enable-unsafe-swiftshader')
          opt.add_argument('--disable-dev-shm-usage')
          driver=webdriver.Chrome(options=opt)
          try:
              driver.get('https://raw.githack.com/')
              driver.add_cookie({'name':'__Http-phish','value':'1','domain':'raw.githack.com','path':'/'})
              driver.get(url)
              wait=WebDriverWait(driver,25)
              wait.until(lambda d: '08E' in d.title)
              stage=wait.until(EC.presence_of_element_located((By.ID,'stage')))
              wait.until(lambda d: d.execute_script('return arguments[0].width>0 && arguments[0].height>0',stage))
              brand=driver.find_element(By.CSS_SELECTOR,'.brand').text
              if '08E' not in brand: raise RuntimeError('08E brand marker missing: '+brand)
              fail=driver.find_elements(By.CSS_SELECTOR,'.fail')
              if any(x.is_displayed() for x in fail): raise RuntimeError('visible runtime failure panel')
              driver.find_element(By.CSS_SELECTOR,'button[data-scene="roof48"]').click()
              time.sleep(2)
              driver.find_element(By.CSS_SELECTOR,'button[data-view="edge"]').click()
              driver.find_element(By.ID,'shapePanel').click()
              wait.until(lambda d: d.find_element(By.ID,'panel').is_displayed())
              dims=driver.execute_script('return {w:innerWidth,h:innerHeight,cw:arguments[0].width,ch:arguments[0].height}',stage)
              Path('/tmp/tiles08e-public.png').write_bytes(driver.get_screenshot_as_png())
              result={'url':url,'title':driver.title,'brand':brand,'canvas':dims,'roof48Clicked':True,'edgeViewClicked':True,'shapePanelOpened':True,'screenshotBytes':Path('/tmp/tiles08e-public.png').stat().st_size}
              Path('/tmp/public-smoke.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              print(json.dumps(result,ensure_ascii=False,indent=2))
          finally:
              driver.quit()
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: tiles-08e-public-smoke
          path: |
            /tmp/public-smoke.json
            /tmp/tiles08e-public.png
