name: Brick Mother R7.1 RawCDN Open-Page Verify

on:
  push:
    branches:
      - feature/brick-mother-v2.0-composite-material-dna
    paths:
      - .github/BRICK_R71_RAWCDN_OPEN_VERIFY_KICK.txt

permissions:
  contents: read

jobs:
  verify-open-page:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANDIDATE_COMMIT: a534aa0503bbc80a2ff8b94193cfcada8a1efd3c
      CANDIDATE_SHA256: 6c2718ae3a8b437f96f9a8b1bf0cf77c2a282ae229e55fd588128b262cd8b9b8
      R7_DIR: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/experiments/atelier-r7
      CANDIDATE_FILE: Brick_Mother_R7_1_Closeout.html
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Open RawCDN safety gate and verify workbench
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/brick-r71-open"
          xvfb-run -a python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import hashlib, json, os
          root=Path(os.environ['RUNNER_TEMP'])/'brick-r71-open'
          url=f"https://rawcdn.githack.com/haihao0307/HOUSE/{os.environ['CANDIDATE_COMMIT']}/{os.environ['R7_DIR']}/{os.environ['CANDIDATE_FILE']}"
          report={'url':url,'gateSeen':False,'gateTitle':None,'afterOpenTitle':None,'afterOpenUrl':None,'documentResponseSha256':None,'families':[],'mobile':{},'errors':[],'consoleErrors':[],'passed':False}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=False,args=['--use-angle=swiftshader','--enable-unsafe-swiftshader','--no-sandbox'])
              page=browser.new_page(viewport={'width':1280,'height':820})
              page.on('pageerror',lambda e:report['errors'].append(str(e)))
              page.on('console',lambda m:report['consoleErrors'].append(m.text) if m.type=='error' else None)
              response=page.goto(url,wait_until='load',timeout=60000)
              assert response and response.status==200
              report['gateTitle']=page.title()
              page.screenshot(path=str(root/'01-public-entry.png'),full_page=True)
              if 'External Content Notice' in page.title():
                  report['gateSeen']=True
                  opener=page.get_by_text('Open the page',exact=True)
                  assert opener.count()==1 and opener.is_visible()
                  with page.expect_navigation(wait_until='load',timeout=60000) as nav:
                      opener.click()
                  opened=nav.value
                  assert opened and opened.status==200
                  report['documentResponseSha256']=hashlib.sha256(opened.body()).hexdigest()
              else:
                  report['documentResponseSha256']=hashlib.sha256(response.body()).hexdigest()
              report['afterOpenTitle']=page.title()
              report['afterOpenUrl']=page.url
              page.screenshot(path=str(root/'02-workbench-opened.png'),full_page=True)
              if report['documentResponseSha256']!=os.environ['CANDIDATE_SHA256']:
                  raise AssertionError(f"opened response sha mismatch: {report['documentResponseSha256']}")
              page.wait_for_function("document.querySelectorAll('[data-family]').length===7",timeout=30000)
              page.wait_for_function("document.querySelector('canvas') && document.querySelector('#busy') && document.querySelector('#busy').hidden",timeout=120000)
              for family in ['fired','kiln','adobe','dressed','rubble','stone','pebble']:
                  button=page.locator(f'[data-family="{family}"]')
                  assert button.count()==1 and button.is_visible()
                  button.click()
                  page.wait_for_function("document.querySelector('#busy').hidden",timeout=120000)
                  error=page.locator('#error')
                  if error.count() and not error.is_hidden(): raise AssertionError(error.inner_text())
                  page.wait_for_timeout(350)
                  report['families'].append({'family':family,'status':page.locator('#status').inner_text()})
              page.screenshot(path=str(root/'03-desktop-all-families-checked.png'),full_page=True)
              page.set_viewport_size({'width':390,'height':844}); page.wait_for_timeout(650)
              for family in ['adobe','stone','fired']:
                  button=page.locator(f'[data-family="{family}"]')
                  assert button.is_visible(); button.click(); page.wait_for_function("document.querySelector('#busy').hidden",timeout=120000)
              report['mobile']={'viewport':[390,844],'canvasVisible':page.locator('canvas').first.is_visible(),'sevenButtonsVisible':all(page.locator(f'[data-family="{f}"]').is_visible() for f in ['fired','kiln','adobe','dressed','rubble','stone','pebble'])}
              assert report['mobile']['canvasVisible'] and report['mobile']['sevenButtonsVisible']
              page.screenshot(path=str(root/'04-mobile-390x844.png'),full_page=True)
              if report['errors']: raise AssertionError(report['errors'])
              report['passed']=True
              browser.close()
          (root/'RAWCDN_OPEN_BROWSER_QA.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          assert report['passed']
          PY

      - name: Upload public open-page evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-r71-rawcdn-open-verify-${{ github.run_id }}
          path: ${{ runner.temp }}/brick-r71-open
          retention-days: 30
