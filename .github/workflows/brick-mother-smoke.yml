name: Brick Mother Browser Smoke

on:
  push:
    branches: [main]
    paths:
      - "yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/**"
      - ".github/workflows/brick-mother-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start local production server
        shell: bash
        run: |
          set -euo pipefail
          src="yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local"
          cd "$src"
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/brick-mother-http.log 2>&1 &
          echo $! > /tmp/brick-mother-http.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/brick-mother/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/brick-mother-http.log
          exit 1

      - name: Run real Chromium V0.4 generation smoke
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "No Chromium executable found" >&2
            exit 1
          fi

          timeout 210s "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --use-gl=angle \
            --use-angle=swiftshader \
            --virtual-time-budget=120000 \
            --dump-dom \
            "http://127.0.0.1:4173/brick-mother/?qa=browser-smoke-v04" \
            > /tmp/brick-mother-dom.html \
            2> /tmp/brick-mother-chrome.log

          grep -q 'data-brick-mother-ready="true"' /tmp/brick-mother-dom.html
          grep -q 'data-brick-mother-version="0.4.0"' /tmp/brick-mother-dom.html
          grep -q 'data-noise-stack="6"' /tmp/brick-mother-dom.html
          grep -q 'data-index="0"' /tmp/brick-mother-dom.html
          grep -q 'data-index="1"' /tmp/brick-mother-dom.html
          grep -q 'data-index="2"' /tmp/brick-mother-dom.html
          grep -q '<dd id="profileFamily">烧结黏土</dd>' /tmp/brick-mother-dom.html
          grep -q 'class="loading" id="loadingMask"' /tmp/brick-mother-dom.html
          grep -q 'V0.4 高细节子代生成完成' /tmp/brick-mother-dom.html
          grep -q '几何孔簇' /tmp/brick-mother-dom.html

          echo "Brick Mother V0.4 browser smoke passed"
          grep -o 'data-index="[0-2]"' /tmp/brick-mother-dom.html | sort -u

      - name: Capture V0.4 browser evidence
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          timeout 210s "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --use-gl=angle \
            --use-angle=swiftshader \
            --window-size=1600,1100 \
            --virtual-time-budget=120000 \
            --screenshot=/tmp/brick-mother-v04.png \
            "http://127.0.0.1:4173/brick-mother/?qa=browser-evidence-v04" \
            > /tmp/brick-mother-screenshot.log \
            2>&1
          test -s /tmp/brick-mother-v04.png

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-mother-v04-browser-evidence
          path: |
            /tmp/brick-mother-v04.png
            /tmp/brick-mother-dom.html
            /tmp/brick-mother-chrome.log
            /tmp/brick-mother-screenshot.log
            /tmp/brick-mother-http.log
          if-no-files-found: ignore

      - name: Stop local server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/brick-mother-http.pid ]; then
            kill "$(cat /tmp/brick-mother-http.pid)" 2>/dev/null || true
          fi
