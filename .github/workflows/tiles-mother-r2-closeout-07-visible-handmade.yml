name: Tiles Mother R2 Closeout 07 Visible Handmade

on:
  push:
    branches:
      - feature/tiles-mother-r2-handmade-visible-07
    paths:
      - .github/workflows/tiles-mother-r2-closeout-07-visible-handmade.yml
      - tiles-mother/tools/build_r2_closeout07_visible_handmade.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/tiles-mother-r2-handmade-visible-07
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate candidate 07
        run: python tiles-mother/tools/build_r2_closeout07_visible_handmade.py
      - name: Verify visible handmade markers
        shell: bash
        run: |
          test -f tiles-mother/r2-closeout-07-visible-handmade/START_HERE.html
          grep -q '12片灰模' tiles-mother/r2-closeout-07-visible-handmade/START_HERE.html
          grep -q 'widthDrift' tiles-mother/r2-closeout-07-visible-handmade/START_HERE.html
          grep -q 'microShape' tiles-mother/r2-closeout-07-visible-handmade/START_HERE.html
          python - <<'PY'
          import json
          q=json.load(open('tiles-mother/r2-closeout-07-visible-handmade/QA.json'))
          assert q['visualApproved'] is False
          assert q['productionApproved'] is False
          print(q['sourceSHA256'])
          PY
      - name: Commit candidate 07
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tiles-mother/r2-closeout-07-visible-handmade
          if git diff --cached --quiet; then
            echo 'Candidate already generated.'
            exit 0
          fi
          git commit -m 'feat(tiles): publish R2 closeout 07 visible handmade [skip ci]'
          git push origin HEAD:feature/tiles-mother-r2-handmade-visible-07
