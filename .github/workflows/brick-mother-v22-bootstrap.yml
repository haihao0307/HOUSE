name: Brick Mother V2.2 Event Calibration Bootstrap

on:
  push:
    branches:
      - feature/brick-mother-v2.0-composite-material-dna
    paths:
      - ".github/workflows/brick-mother-v22-bootstrap.yml"

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feature/brick-mother-v2.0-composite-material-dna
          fetch-depth: 0

      - name: Reconstruct deterministic V2.2 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/brick-mother-v22-payload/*.b64 > /tmp/brick-mother-v22-payload.b64
          echo "ad3647b3d418e907a2221b4961f8038bf93bca2bc471370aea98affb0c6a85bb  /tmp/brick-mother-v22-payload.b64" | sha256sum -c -
          base64 -d /tmp/brick-mother-v22-payload.b64 | gzip -d > /tmp/apply-brick-mother-v22.py
          echo "aa8bd06a9819731e5f61d18663a2e4ee7bb531d21fed98739f9fc73b30b2f4f7  /tmp/apply-brick-mother-v22.py" | sha256sum -c -
          python3 -m py_compile /tmp/apply-brick-mother-v22.py

      - name: Apply and validate V2.2 material calibration
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/apply-brick-mother-v22.py
          brick="yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother"
          node --check "$brick/brick-mother-gaea-kernel-v1.js"
          node --check "$brick/brick-mother-geometry-v2.js"
          node --check "$brick/brick-mother-renderer-v2.js"
          node --check "$brick/brick-mother-app-v2.js"
          python3 -m json.tool "$brick/data/brick-material-profiles-v2.json" >/dev/null
          python3 -m json.tool "$brick/qa/gaea-distillation-contract-v1.json" >/dev/null
          python3 -m json.tool "$brick/VERSION.json" >/dev/null
          grep -q '"version": "2.2.0-alpha.1"' "$brick/VERSION.json"
          grep -q '"gaeaKernel": "1.1.0"' "$brick/VERSION.json"
          grep -q 'inclusionVoids' "$brick/brick-mother-geometry-v2.js"
          grep -q 'eventGate' "$brick/brick-mother-renderer-v2.js"
          grep -q 'kilnMacro' "$brick/brick-mother-renderer-v2.js"
          if grep -q 'float band = sin' "$brick/brick-mother-renderer-v2.js"; then
            echo "Legacy regular firing band remains" >&2
            exit 1
          fi

      - name: Start local production server
        shell: bash
        run: |
          set -euo pipefail
          src="yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local"
          cd "$src"
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/brick-mother-v22-retry-http.log 2>&1 &
          echo $! > /tmp/brick-mother-v22-retry-http.pid
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/brick-mother/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/brick-mother-v22-retry-http.log
          exit 1

      - name: Run real Chromium V2.2 gate
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          timeout 420s "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --enable-unsafe-swiftshader \
            --use-gl=angle \
            --use-angle=swiftshader \
            --virtual-time-budget=180000 \
            --dump-dom \
            "http://127.0.0.1:4173/brick-mother/?qa=v22-retry&evidence=1&profile=stone-block&focus=2&debug=8" \
            > /tmp/brick-mother-v22-retry-dom.html \
            2> /tmp/brick-mother-v22-retry-chrome.log
          grep -q 'data-brick-mother-ready="true"' /tmp/brick-mother-v22-retry-dom.html
          grep -q 'data-brick-mother-version="2.2.0-alpha.1"' /tmp/brick-mother-v22-retry-dom.html
          grep -q 'data-gaea-kernel="1.1.0"' /tmp/brick-mother-v22-retry-dom.html
          grep -q 'data-active-profile="stone-block"' /tmp/brick-mother-v22-retry-dom.html
          grep -q 'data-oxide-contours="suppressed"' /tmp/brick-mother-v22-retry-dom.html
          grep -q 'data-event-color-masking="true"' /tmp/brick-mother-v22-retry-dom.html
          grep -q 'data-evidence-ready="true"' /tmp/brick-mother-v22-retry-dom.html

      - name: Commit tested implementation without workflow mutation
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/brick-mother-v2-smoke.yml
          rm -rf .github/brick-mother-v22-payload
          git config user.name "Brick Mother V2.2 Calibration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No V2.2 changes to commit" >&2
            exit 1
          fi
          git commit -m "Calibrate Brick Mother V2.2 material events"
          git push origin HEAD:feature/brick-mother-v2.0-composite-material-dna

      - name: Upload retry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-mother-v22-retry-evidence
          path: |
            /tmp/brick-mother-v22-retry-dom.html
            /tmp/brick-mother-v22-retry-chrome.log
            /tmp/brick-mother-v22-retry-http.log
          if-no-files-found: ignore

      - name: Stop local server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/brick-mother-v22-retry-http.pid ]; then
            kill "$(cat /tmp/brick-mother-v22-retry-http.pid)" 2>/dev/null || true
          fi
