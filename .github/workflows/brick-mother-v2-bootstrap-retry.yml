name: Brick Mother V2 Verified Retry

on:
  push:
    branches: [feature/brick-mother-v2.0-composite-material-dna]
    paths: [".github/workflows/brick-mother-v2-bootstrap-retry.yml"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  BRANCH: feature/brick-mother-v2.0-composite-material-dna
  BASE: 77ce0a1bc63d301829942c14e5708fc16a06cdcd
  ISSUE: "14"
  PAYLOAD_SHA: f5f4339da5dea600f4b664c24adc17de261eac9e447fd6b84a47d09916a2ee5b

jobs:
  verified-build:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Reassemble exact source payload
        env:
          TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE" HEAD
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, tarfile, urllib.request
          url=f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/{os.environ['ISSUE']}/comments?per_page=100"
          req=urllib.request.Request(url,headers={'Authorization':f"Bearer {os.environ['TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          comments=json.load(urllib.request.urlopen(req))
          pat=re.compile(r'^BRICK_MOTHER_V2_CHUNK_(\d{3})_OF_010\r?\n([A-Za-z0-9+/=\r\n]+)\s*$')
          chunks={}
          for item in comments:
              m=pat.match(item.get('body') or '')
              if m: chunks[int(m.group(1))]=''.join(m.group(2).split())
          if sorted(chunks)!=list(range(1,11)): raise SystemExit(f'chunk set invalid: {sorted(chunks)}')
          encoded=''.join(chunks[i] for i in range(1,11))
          payload=base64.b64decode(encoded,validate=True)
          digest=hashlib.sha256(payload).hexdigest()
          report={'chunks':len(chunks),'base64Length':len(encoded),'bytes':len(payload),'sha256':digest}
          pathlib.Path('/tmp/reassembly.json').write_text(json.dumps(report,indent=2)+'\n')
          if len(encoded)!=51224 or len(payload)!=38417 or digest!=os.environ['PAYLOAD_SHA']:
              raise SystemExit(f'payload contract failed: {report}')
          archive=pathlib.Path('/tmp/payload.tar.gz'); archive.write_bytes(payload)
          with tarfile.open(archive,'r:gz') as tf:
              for member in tf.getmembers():
                  p=pathlib.PurePosixPath(member.name)
                  if p.is_absolute() or '..' in p.parts: raise SystemExit(f'unsafe path: {member.name}')
              tf.extractall('.')
          PY
          rm -f .github/workflows/brick-mother-v2-bootstrap.yml .github/workflows/brick-mother-v2-bootstrap-retry.yml

      - name: Validate source and four material mothers
        shell: bash
        run: |
          set -euo pipefail
          brick="yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother"
          node --check "$brick/brick-mother-geometry-v2.js"
          node --check "$brick/brick-mother-renderer-v2.js"
          node --check "$brick/brick-mother-app-v2.js"
          python3 -m json.tool "$brick/data/brick-material-profiles-v2.json" >/dev/null
          python3 -m json.tool "$brick/VERSION.json" >/dev/null
          BRICK="$brick" node <<'NODE'
          const fs=require('fs'),path=require('path'); global.window={};
          const brick=process.env.BRICK; require(path.resolve(brick,'brick-mother-geometry-v2.js'));
          const G=window.BrickMotherGeometryV2;
          const profiles=JSON.parse(fs.readFileSync(path.resolve(brick,'data/brick-material-profiles-v2.json'))).profiles;
          const qa=[];
          for(const p of profiles){
            const m=G.buildMesh(p,p.runtimeDNA.seedBase+17,p.compositeDefaults,0.74,0.58);
            if(!m.triangles||!m.vertices||!m.damage.deepPores.length||!m.damage.erosionBites.length) throw Error(`${p.id}: incomplete geometry`);
            if([...m.positions,...m.normals].some(v=>!Number.isFinite(v))) throw Error(`${p.id}: non-finite mesh`);
            if(Object.keys(m.seedDNA).length-1!==8) throw Error(`${p.id}: seed layer mismatch`);
            qa.push({profile:p.id,triangles:m.triangles,deepPores:m.damage.deepPores.length,erosionBites:m.damage.erosionBites.length,seedLayers:8});
          }
          fs.writeFileSync('/tmp/geometry-qa.json',JSON.stringify(qa,null,2)+'\n'); console.log(qa);
          NODE

      - name: Run Chromium WebGL2 generation and capture
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          root="yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local"
          (cd "$root" && python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 & echo $! >/tmp/http.pid)
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/brick-mother/ >/dev/null && break; sleep 1; done
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          flags=(--headless=new --no-sandbox --disable-dev-shm-usage --enable-webgl --ignore-gpu-blocklist --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader)
          timeout 360s "$chrome" "${flags[@]}" --virtual-time-budget=150000 --dump-dom "http://127.0.0.1:4173/brick-mother/?qa=v2-alpha1" >/tmp/dom.html 2>/tmp/chrome.log
          grep -q 'data-brick-mother-ready="true"' /tmp/dom.html
          grep -q 'data-brick-mother-version="2.0.0-alpha.1"' /tmp/dom.html
          grep -q 'data-seed-layers="8"' /tmp/dom.html
          grep -Eq 'data-deep-pores="[1-9][0-9]*"' /tmp/dom.html
          grep -q 'data-control="colorRichness"' /tmp/dom.html
          grep -q 'data-control="poreDepth"' /tmp/dom.html
          grep -q 'data-seed="inclusion"' /tmp/dom.html
          grep -q 'data-channel="7"' /tmp/dom.html
          grep -q 'V2 复合材质 DNA 首轮生成完成' /tmp/dom.html
          timeout 360s "$chrome" "${flags[@]}" --window-size=1600,1100 --virtual-time-budget=150000 --screenshot=/tmp/brick-mother-v2-alpha1.png "http://127.0.0.1:4173/brick-mother/?qa=v2-alpha1-shot" >/tmp/shot.log 2>&1
          test -s /tmp/brick-mother-v2-alpha1.png

      - name: Commit tested implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Brick Mother Production Bot"
          git config user.email "brick-mother-bot@users.noreply.github.com"
          git add -A && git diff --cached --check
          git commit -m "Build Brick Mother V2 composite material DNA alpha 1"
          git push origin "HEAD:$BRANCH"
          git rev-parse HEAD | tee /tmp/commit.txt

      - name: Close staging evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --comment "Exact payload SHA256, four-mother geometry QA, and Chromium WebGL2 generation QA passed. Tested commit $(cat /tmp/commit.txt) was pushed to $BRANCH."

      - name: Upload tested evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-mother-v2-alpha1-tested-evidence-retry
          path: |
            /tmp/reassembly.json
            /tmp/geometry-qa.json
            /tmp/dom.html
            /tmp/chrome.log
            /tmp/brick-mother-v2-alpha1.png
            /tmp/shot.log
            /tmp/http.log
            /tmp/commit.txt
          if-no-files-found: ignore

      - name: Stop server
        if: always()
        shell: bash
        run: test ! -f /tmp/http.pid || kill "$(cat /tmp/http.pid)" 2>/dev/null || true
