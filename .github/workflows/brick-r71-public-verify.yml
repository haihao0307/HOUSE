name: Brick Mother R7.1 Immutable Public Verify

on:
  push:
    branches:
      - feature/brick-mother-v2.0-composite-material-dna
    paths:
      - .github/BRICK_R71_PUBLIC_VERIFY_KICK.txt

permissions:
  contents: read

jobs:
  verify-public:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANDIDATE_COMMIT: a534aa0503bbc80a2ff8b94193cfcada8a1efd3c
      CANDIDATE_SHA256: 6c2718ae3a8b437f96f9a8b1bf0cf77c2a282ae229e55fd588128b262cd8b9b8
      R7_DIR: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/experiments/atelier-r7
      CANDIDATE_FILE: Brick_Mother_R7_1_Closeout.html
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify immutable HTTP bytes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/brick-r71-public"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, time, urllib.request
          root=Path(os.environ['RUNNER_TEMP'])/'brick-r71-public'
          base=f"https://raw.githack.com/haihao0307/HOUSE/{os.environ['CANDIDATE_COMMIT']}/{os.environ['R7_DIR']}/{os.environ['CANDIDATE_FILE']}"
          url=base+'?v='+os.environ['CANDIDATE_SHA256']
          last=''
          for attempt in range(60):
              try:
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'BrickMotherR71PublicQA'})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      data=r.read(); status=r.status; ct=r.headers.get('Content-Type',''); cd=r.headers.get('Content-Disposition','')
                  sha=hashlib.sha256(data).hexdigest()
                  if status==200 and 'text/html' in ct and 'attachment' not in cd.lower() and sha==os.environ['CANDIDATE_SHA256']:
                      report={'baseUrl':base,'verifiedUrl':url,'status':status,'contentType':ct,'contentDisposition':cd,'bytes':len(data),'sha256':sha,'passed':True}
                      (root/'PUBLIC_HTTP_QA.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
                      print(json.dumps(report,ensure_ascii=False,indent=2))
                      break
                  last=f'status={status} ct={ct} cd={cd} sha={sha}'
              except Exception as e:
                  last=repr(e)
              print('retry',attempt,last,flush=True); time.sleep(3)
          else:
              raise SystemExit('immutable HTTP verification failed: '+last)
          PY

      - name: Install Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Verify exact delivered URL in Chromium
        run: |
          set -euo pipefail
          xvfb-run -a python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json, os
          root=Path(os.environ['RUNNER_TEMP'])/'brick-r71-public'
          http=json.loads((root/'PUBLIC_HTTP_QA.json').read_text(encoding='utf-8'))
          url=http['verifiedUrl']
          report={'url':url,'status':None,'contentType':None,'title':None,'families':[],'mobile':{},'errors':[],'consoleErrors':[],'passed':False}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=False,args=['--use-angle=swiftshader','--enable-unsafe-swiftshader','--no-sandbox'])
              page=browser.new_page(viewport={'width':1280,'height':820})
              page.on('pageerror',lambda e:report['errors'].append(str(e)))
              page.on('console',lambda m: report['consoleErrors'].append(m.text) if m.type=='error' else None)
              response=page.goto(url,wait_until='load',timeout=60000)
              assert response is not None
              report['status']=response.status
              report['contentType']=response.headers.get('content-type','')
              report['title']=page.title()
              if response.status!=200:
                  raise AssertionError(f'HTTP {response.status}')
              page.wait_for_function("document.readyState==='complete'",timeout=30000)
              page.wait_for_function("document.querySelectorAll('[data-family]').length===7",timeout=60000)
              page.wait_for_function("document.querySelector('canvas') && document.querySelector('#busy') && document.querySelector('#busy').hidden",timeout=120000)
              for family in ['fired','kiln','adobe','dressed','rubble','stone','pebble']:
                  button=page.locator(f'[data-family="{family}"]')
                  assert button.count()==1 and button.is_visible()
                  button.click()
                  page.wait_for_function("document.querySelector('#busy').hidden",timeout=120000)
                  error=page.locator('#error')
                  if error.count() and not error.is_hidden():
                      raise AssertionError(error.inner_text())
                  page.wait_for_timeout(350)
                  report['families'].append({'family':family,'status':page.locator('#status').inner_text()})
              page.screenshot(path=str(root/'public-desktop-1280x820.png'),full_page=True)
              page.set_viewport_size({'width':390,'height':844}); page.wait_for_timeout(600)
              for family in ['adobe','stone','fired']:
                  button=page.locator(f'[data-family="{family}"]'); assert button.is_visible(); button.click(); page.wait_for_function("document.querySelector('#busy').hidden",timeout=120000)
              report['mobile']={'viewport':[390,844],'canvasVisible':page.locator('canvas').first.is_visible(),'sevenButtonsVisible':all(page.locator(f'[data-family="{f}"]').is_visible() for f in ['fired','kiln','adobe','dressed','rubble','stone','pebble'])}
              assert report['mobile']['canvasVisible'] and report['mobile']['sevenButtonsVisible']
              page.screenshot(path=str(root/'public-mobile-390x844.png'),full_page=True)
              if report['errors']:
                  raise AssertionError(report['errors'])
              report['passed']=True
              browser.close()
          (root/'PUBLIC_BROWSER_QA.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          assert report['passed']
          PY

      - name: Upload public verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-r71-public-verify-${{ github.run_id }}
          path: ${{ runner.temp }}/brick-r71-public
          retention-days: 30
