name: Brick Mother Stone Form V2.9 Bundled Review

on:
  push:
    branches:
      - feature/brick-mother-v2.0-composite-material-dna
    paths:
      - ".github/workflows/brick-mother-stone-form-v29-bundle-review.yml"
      - "yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/review-v29/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  REVIEW_ROOT: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/review-v29

jobs:
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4

      - name: Validate source bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s "$REVIEW_ROOT/brick-mother-stone-form-v2.9.0-bundled.html"
          cat "$REVIEW_ROOT"/stone-form-v29.part{1,2,3,4,5,6}.txt > /tmp/stone-form-v29.js
          node --check /tmp/stone-form-v29.js

      - name: Capture all stone families
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stone-form-v29-bundle-review
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$REVIEW_ROOT" >/tmp/stone-form-v29-bundle-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8765/brick-mother-stone-form-v2.9.0-bundled.html >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          for family in 0 1 2 3; do
            for view in all hero; do
              stem="family-${family}-${view}"
              url="http://127.0.0.1:8765/brick-mother-stone-form-v2.9.0-bundled.html?family=${family}&view=${view}&qa=bundle-review&head=${GITHUB_SHA}"
              timeout 210s "$chrome" \
                --headless=new \
                --no-sandbox \
                --disable-dev-shm-usage \
                --disable-background-networking \
                --enable-webgl \
                --ignore-gpu-blocklist \
                --enable-unsafe-swiftshader \
                --use-gl=angle \
                --use-angle=swiftshader \
                --hide-scrollbars \
                --window-size=1600,1000 \
                --virtual-time-budget=24000 \
                --screenshot="/tmp/stone-form-v29-bundle-review/${stem}.png" \
                --dump-dom \
                "$url" \
                > "/tmp/stone-form-v29-bundle-review/${stem}.dom.html" \
                2> "/tmp/stone-form-v29-bundle-review/${stem}.chrome.log"
              dom="/tmp/stone-form-v29-bundle-review/${stem}.dom.html"
              png="/tmp/stone-form-v29-bundle-review/${stem}.png"
              grep -q 'data-brick-mother-stone-form-ready="true"' "$dom"
              grep -q 'data-visual-ready="true"' "$dom"
              grep -q 'data-stone-form-version="2.9.0-alpha.1"' "$dom"
              ! grep -q 'data-runtime-failure="true"' "$dom"
              test -s "$png"
              test "$(wc -c < "$png")" -gt 80000
            done
          done
          python3 - <<'PY'
          from pathlib import Path
          import json, os, struct
          root=Path('/tmp/stone-form-v29-bundle-review')
          rows=[]
          for p in sorted(root.glob('*.png')):
              data=p.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n'
              width,height=struct.unpack('>II',data[16:24])
              assert (width,height)==(1600,1000),(p.name,width,height)
              rows.append({'file':p.name,'bytes':len(data),'width':width,'height':height})
          assert len(rows)==8, len(rows)
          (root/'manifest.json').write_text(json.dumps({'head':os.environ['GITHUB_SHA'],'candidate':'2.9.0-alpha.1','screenshots':rows,'visualApproved':False,'productionApproved':False},indent=2)+'\n')
          PY

      - name: Upload private visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-mother-stone-form-v29-bundle-review-${{ github.sha }}
          path: |
            /tmp/stone-form-v29-bundle-review
            /tmp/stone-form-v29-bundle-server.log
          compression-level: 1
          if-no-files-found: error
          retention-days: 7
