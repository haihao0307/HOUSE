name: Brick Mother R7.2 Selected Public Verify

on:
  push:
    branches:
      - feature/brick-mother-v2.0-composite-material-dna
    paths:
      - .github/BRICK_R72_SELECTED_PUBLIC_KICK.txt

permissions:
  contents: read

jobs:
  verify-selected-public:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANDIDATE_COMMIT: 29c84e1108697c0d1d0698835fa922512a4295f5
      CANDIDATE_SHA256: 12b1f6ab83e039c7d0aa5d06c06d439af3d1ee126443c4c3c683654a8e70c71d
      R7_DIR: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/experiments/atelier-r7
      CANDIDATE_FILE: Brick_Mother_R7_2_StoneCloseout.html
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify immutable RawCDN bytes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/brick-r72-selected"
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,time,urllib.request
          root=Path(os.environ['RUNNER_TEMP'])/'brick-r72-selected'
          url=f"https://rawcdn.githack.com/haihao0307/HOUSE/{os.environ['CANDIDATE_COMMIT']}/{os.environ['R7_DIR']}/{os.environ['CANDIDATE_FILE']}"
          last=''
          for attempt in range(60):
              try:
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0 BrickMotherR72SelectedQA'})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      data=r.read();status=r.status;ct=r.headers.get('Content-Type','');cd=r.headers.get('Content-Disposition','')
                  sha=hashlib.sha256(data).hexdigest()
                  if status==200 and 'text/html' in ct and 'attachment' not in cd.lower() and sha==os.environ['CANDIDATE_SHA256']:
                      report={'url':url,'status':status,'contentType':ct,'contentDisposition':cd,'bytes':len(data),'sha256':sha,'passed':True}
                      (root/'PUBLIC_HTTP_QA.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8');print(json.dumps(report,ensure_ascii=False,indent=2));break
                  last=f'{status} {ct} {cd} {sha}'
              except Exception as e:last=repr(e)
              print('retry',attempt,last,flush=True);time.sleep(3)
          else:raise SystemExit('immutable HTTP verification failed: '+last)
          PY

      - name: Install Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Follow real RawGit safety gate and verify seven families
        run: |
          set -euo pipefail
          xvfb-run -a python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import hashlib,json,os
          root=Path(os.environ['RUNNER_TEMP'])/'brick-r72-selected';http=json.loads((root/'PUBLIC_HTTP_QA.json').read_text(encoding='utf-8'));url=http['url']
          report={'url':url,'gateSeen':False,'gateTitle':None,'afterOpenTitle':None,'afterOpenUrl':None,'documentResponseSha256':None,'families':[],'mobile':{},'errors':[],'consoleErrors':[],'passed':False}
          with sync_playwright() as p:
              b=p.chromium.launch(headless=False,args=['--use-angle=swiftshader','--enable-unsafe-swiftshader','--no-sandbox']);page=b.new_page(viewport={'width':1280,'height':820});page.on('pageerror',lambda e:report['errors'].append(str(e)));page.on('console',lambda m:report['consoleErrors'].append(m.text) if m.type=='error' else None)
              response=page.goto(url,wait_until='load',timeout=60000);assert response and response.status==200;report['gateTitle']=page.title();page.screenshot(path=str(root/'01-entry.png'),full_page=True)
              if 'External Content Notice' in page.title():
                  report['gateSeen']=True;opener=page.get_by_text('Open the page',exact=True);assert opener.count()==1 and opener.is_visible()
                  with page.expect_navigation(wait_until='load',timeout=60000) as nav:opener.click()
                  opened=nav.value;assert opened and opened.status==200;report['documentResponseSha256']=hashlib.sha256(opened.body()).hexdigest()
              else:report['documentResponseSha256']=hashlib.sha256(response.body()).hexdigest()
              report['afterOpenTitle']=page.title();report['afterOpenUrl']=page.url;page.screenshot(path=str(root/'02-opened.png'),full_page=True);assert report['documentResponseSha256']==os.environ['CANDIDATE_SHA256']
              page.wait_for_function("document.querySelectorAll('[data-family]').length===7",timeout=30000);page.wait_for_function("document.querySelector('canvas')&&document.querySelector('#busy')&&document.querySelector('#busy').hidden",timeout=120000)
              for family in ['fired','kiln','adobe','dressed','rubble','stone','pebble']:
                  q=page.locator(f'[data-family="{family}"]');assert q.count()==1 and q.is_visible();q.click();page.wait_for_function("document.querySelector('#busy').hidden",timeout=120000);e=page.locator('#error');assert not e.count() or e.is_hidden(),e.inner_text() if e.count() else '';page.wait_for_timeout(350);report['families'].append({'family':family,'status':page.locator('#status').inner_text()})
              page.screenshot(path=str(root/'03-desktop.png'),full_page=True);page.set_viewport_size({'width':390,'height':844});page.wait_for_timeout(650)
              for family in ['stone','adobe','fired']:
                  q=page.locator(f'[data-family="{family}"]');assert q.is_visible();q.click();page.wait_for_function("document.querySelector('#busy').hidden",timeout=120000)
              report['mobile']={'viewport':[390,844],'canvasVisible':page.locator('canvas').first.is_visible(),'sevenButtonsVisible':all(page.locator(f'[data-family="{f}"]').is_visible() for f in ['fired','kiln','adobe','dressed','rubble','stone','pebble'])};assert report['mobile']['canvasVisible'] and report['mobile']['sevenButtonsVisible'];page.screenshot(path=str(root/'04-mobile.png'),full_page=True);assert not report['errors'];report['passed']=True;b.close()
          (root/'PUBLIC_BROWSER_QA.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8');print(json.dumps(report,ensure_ascii=False,indent=2));assert report['passed']
          PY

      - name: Upload selected public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-r72-selected-public-${{ github.run_id }}
          path: ${{ runner.temp }}/brick-r72-selected
          retention-days: 30
