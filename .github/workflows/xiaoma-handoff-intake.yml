name: Xiaoma handoff intake V1.1.1

on:
  push:
    branches: ['xiaoma/intake-v1.1.1-20260905']
    paths: ['.github/workflows/xiaoma-handoff-intake.yml']

permissions:
  contents: write

concurrency:
  group: xiaoma-intake-v1-1-1
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - name: Verify archive and extract without executing its contents
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, stat, zipfile
          from pathlib import Path, PurePosixPath
          from datetime import datetime, timezone

          name = 'Mother_System_Xiaoma_Full_Handoff_V1.1.1_2026-09-05.zip'
          archive = Path(name)
          data = archive.read_bytes()
          expected = 'f3fd21d92ebf66cdb92144d5d476e8334e873f2a'
          blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          if len(data) != 1642048 or blob != expected:
              raise RuntimeError('Pinned archive integrity mismatch')
          root = Path('mother-system')
          destination = root / 'handoffs' / 'v1.1.1' / 'source'
          if destination.exists():
              raise RuntimeError('Refusing to overwrite an existing extracted handoff')
          root.mkdir(exist_ok=True)
          manifest = []
          with zipfile.ZipFile(archive) as z:
              entries = z.infolist()
              if len(entries) > 10000 or sum(i.file_size for i in entries) > 128 * 1024 * 1024:
                  raise RuntimeError('Archive exceeds intake limits')
              seen = set()
              for info in entries:
                  p = PurePosixPath(info.filename)
                  if p.is_absolute() or '..' in p.parts or '\\' in info.filename or not p.parts or ':' in p.parts[0]:
                      raise RuntimeError('Unsafe archive path')
                  if stat.S_ISLNK(info.external_attr >> 16):
                      raise RuntimeError('Archive symlinks are forbidden')
                  if info.is_dir():
                      continue
                  if p.as_posix() in seen:
                      raise RuntimeError('Duplicate archive path')
                  seen.add(p.as_posix())
                  payload = z.read(info)
                  target = destination.joinpath(*p.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(payload)
                  manifest.append({'path': target.as_posix(), 'archivePath': info.filename, 'bytes': len(payload), 'sha256': hashlib.sha256(payload).hexdigest()})
          receipt = {
              'schemaVersion': 1,
              'createdAt': datetime.now(timezone.utc).isoformat(),
              'sourceRepository': 'haihao0307/HOUSE',
              'sourceCommit': 'b1cb5e57899cbf80dee7aa22bac84a82d6182540',
              'sourceArchive': name,
              'sourceBlobSha': blob,
              'archiveBytes': len(data),
              'archiveSha256': hashlib.sha256(data).hexdigest(),
              'targetBranch': 'xiaoma/intake-v1.1.1-20260905',
              'targetDirectory': destination.as_posix(),
              'sourcePreserved': True,
              'mainBranchModified': False,
              'extractionVerified': True,
              'contentReviewComplete': False,
              'otherMotherJobsStarted': False,
              'files': manifest
          }
          (root / 'INTAKE_RECEIPT.json').write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          lines = ['# 小妈总控交接资料接管索引', '', '来源：HOUSE 中固定提交的 V1.1.1 全量包。原 ZIP 保留；本目录位于独立接管分支。', '', '状态：已完成归档完整性检查和安全解包。内容审阅、总控正式接管与其他 Mother 开工需另行记录，不能由解包成功推定。', '', '## 解包文件', '']
          for item in manifest:
              lines.append('- `' + item['path'] + '` (' + str(item['bytes']) + ' bytes)')
          (root / 'READING_INDEX.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('Archive verified. Extracted', len(manifest), 'files. No archive code executed.')
          PY
      - name: Commit only isolated Mother System intake files
        shell: bash
        run: |
          git config user.name 'Xiaoma handoff intake'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- mother-system/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs(xiaoma): preserve and unpack V1.1.1 handoff with integrity receipt [skip ci]'
          git push origin HEAD:refs/heads/xiaoma/intake-v1.1.1-20260905
