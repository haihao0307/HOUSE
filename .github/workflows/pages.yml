name: Deploy Yunnan Courtyard Production Line

on:
  push:
    branches:
      - main
      - codex/yunnan-surface-production-v5.5.0
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # GitHub Pages has one public target for the repository. Serialize main and
  # Draft deployments so a second ref cannot replace build.json while the
  # first run is performing its commit-bound public browser verification.
  group: pages
  cancel-in-progress: true

env:
  PROJECT_DIR: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local
  PAGES_QA_OUTPUT_DIR: ${{ github.workspace }}/.qa-output/pages-${{ github.sha }}-attempt-${{ github.run_attempt }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate production package
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tools/validate.py

      - name: Assemble public site
        shell: bash
        run: |
          set -euo pipefail
          src="yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local"
          mkdir -p _site
          cp -R "$src"/. _site/
          rm -rf _site/references-private _site/release _site/.git _site/.github
          rm -f _site/assets/models/YN_TUANJIE_001_EDITABLE_HIGH.glb
          touch _site/.nojekyll
          printf '{"schemaVersion":"5.5.0","sha":"%s","ref":"%s","runId":"%s","runAttempt":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > _site/build.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: ${{ github.ref_name == 'main' && 'github-pages' || 'github-pages-preview' }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify public Pages on desktop and mobile
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize clean Pages evidence directory for this commit
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_WORKSPACE/.qa-output/pages-$GITHUB_SHA-attempt-$GITHUB_RUN_ATTEMPT"
          test "$PAGES_QA_OUTPUT_DIR" = "$expected"
          rm -rf -- "$PAGES_QA_OUTPUT_DIR"
          mkdir -p "$PAGES_QA_OUTPUT_DIR/screenshots"
          printf '{"schemaVersion":"5.5.0","sha":"%s","ref":"%s","runId":"%s","runAttempt":"%s","deploymentEnvironment":"%s","protectionRulesChanged":false,"deployResult":"%s","pageUrl":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "${{ github.ref_name == 'main' && 'github-pages' || 'github-pages-preview' }}" "${{ needs.deploy.result }}" "${{ needs.deploy.outputs.page_url }}" > "$PAGES_QA_OUTPUT_DIR/run-metadata.json"

      - name: Record Pages deployment blocker
        if: needs.deploy.result != 'success'
        shell: bash
        run: |
          printf '{"schemaVersion":"5.5.0","runSha":"%s","sourceRef":"%s","deploymentEnvironment":"%s","protectionRulesChanged":false,"deployResult":"%s","verified":false,"publicQaSkipped":true,"reason":"Pages deployment did not succeed; browser verification was not run","summary":{"passed":0,"failed":1,"total":1}}\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "${{ github.ref_name == 'main' && 'github-pages' || 'github-pages-preview' }}" "${{ needs.deploy.result }}" > "$PAGES_QA_OUTPUT_DIR/deployment-status.json"

      - name: Set up Python
        if: needs.deploy.result == 'success'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright Chromium
        if: needs.deploy.result == 'success'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Verify deployed commit and public surface lab
        id: public_qa
        if: needs.deploy.result == 'success'
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          python tools/surface_production_smoke.py \
            --base-url "$PAGE_URL" \
            --expected-sha "$GITHUB_SHA" \
            --run-sha "$GITHUB_SHA" \
            --run-ref "$GITHUB_REF_NAME" \
            --report "$PAGES_QA_OUTPUT_DIR/pages-surface-production-smoke.json" \
            --screenshots "$PAGES_QA_OUTPUT_DIR/screenshots"

      - name: Upload Pages verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-surface-v550-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ env.PAGES_QA_OUTPUT_DIR }}/**
          if-no-files-found: error
          retention-days: 30

      - name: Require successful deployment and public verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.deploy.result }}" = "success"
          test "${{ steps.public_qa.outcome }}" = "success"
          test -s "$PAGES_QA_OUTPUT_DIR/pages-surface-production-smoke.json"
          python3 - "$PAGES_QA_OUTPUT_DIR/pages-surface-production-smoke.json" \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "${{ needs.deploy.outputs.page_url }}" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          report_path, expected_sha, expected_ref, expected_run_id, expected_attempt, page_url = sys.argv[1:]
          report = json.load(open(report_path, encoding="utf-8"))
          if report.get("runSha") != expected_sha or report.get("expectedSha") != expected_sha:
              raise SystemExit("public Pages QA did not verify this workflow commit")
          if report.get("sourceRef") != expected_ref:
              raise SystemExit("public Pages QA sourceRef does not match the deployed branch")
          if report.get("publicMode") is not True:
              raise SystemExit("public Pages QA was not executed against a public deployment")
          if report.get("baseUrl") != page_url.rstrip("/") + "/":
              raise SystemExit("public Pages QA base URL differs from deploy-pages output")

          readiness = report.get("deploymentReadiness") or {}
          readiness_resources = readiness.get("finalResources") or {}
          if (
              readiness.get("required") is not True
              or readiness.get("ready") is not True
              or readiness.get("observedSha") != expected_sha
              or readiness.get("observedRef") != expected_ref
              or set(readiness_resources) != {"build", "surfaceLab", "surfaceSeed"}
              or any(resource.get("status") != 200 or resource.get("accepted") is not True
                     for resource in readiness_resources.values())
          ):
              raise SystemExit("public Pages readiness did not verify all three exact-head resources")

          build = report.get("buildJson")
          if not isinstance(build, dict):
              raise SystemExit("public Pages QA did not preserve the full build.json object")
          if build.get("sha") != expected_sha or build.get("ref") != expected_ref:
              raise SystemExit("public build.json SHA/ref mismatch")
          if (
              build.get("schemaVersion") != "5.5.0"
              or str(build.get("runId", "")) != expected_run_id
              or str(build.get("runAttempt", "")) != expected_attempt
          ):
              raise SystemExit("public build.json is incomplete or belongs to a different workflow attempt")

          results = report.get("results")
          summary = report.get("summary")
          if not isinstance(results, list) or not isinstance(summary, dict):
              raise SystemExit("public Pages QA results or summary is missing")
          passed = sum(item.get("ok") is True for item in results)
          failed = len(results) - passed
          if (
              not results
              or summary.get("passed") != passed
              or summary.get("failed") != failed
              or summary.get("total") != len(results)
              or failed != 0
              or passed != len(results)
          ):
              raise SystemExit(f"public Pages QA has an incoherent or failing summary: {summary}")

          diagnostics = report.get("diagnostics") or {}
          for key in ("consoleErrors", "pageErrors", "failedRequests", "httpErrors"):
              if diagnostics.get(key):
                  raise SystemExit(f"public Pages QA contains {key}: {diagnostics[key]}")
          execution = report.get("execution") or {}
          if execution.get("notExecutedPhases") or execution.get("uncaughtException"):
              raise SystemExit("public Pages QA skipped a phase or caught an exception")

          operated_controls = report.get("operatedControls") or []
          operated_checks = {
              item.get("check") for item in operated_controls
              if item.get("method") in {"visible-click", "visible-select"}
          }
          required_control_checks = {
              "ab-same-camera",
              "surface-preset-museum1940sBalanced",
              "surface-preset-wulongWeathered",
              "surface-preset-daliMaintained",
              "visible-seven-layer-explode-toggle",
              "open-door-window-leaves",
              "play-visitor-gate-to-upper-floor",
              "complete-building-overview",
          }
          if not required_control_checks <= operated_checks:
              raise SystemExit(
                  "public Pages QA did not operate every required control: "
                  f"{sorted(required_control_checks - operated_checks)}"
              )

          required_screenshots = {
              "v550_complete_building.png",
              "v550_ab_same_camera.png",
              "v550_pan_cover_eave_closeup.png",
              "v550_roof_weathering_closeup.png",
              "v550_ridge_closures.png",
              "v550_wall_abutment_closeup.png",
              "v550_roof_exploded_layers.png",
              "v550_wall_weathering_closeup.png",
              "v550_door_closed_closeup.png",
              "v550_door_open_closeup.png",
              "v550_window_closed_closeup.png",
              "v550_window_open_closeup.png",
              "v550_visitor_entry_to_upper_route.png",
              "v550_stair_8_plus_8.png",
              "v550_mobile_regression.png",
              "v550_mobile_production_performance.png",
          }
          screenshots = report.get("screenshots") or []
          present = {
              item.get("name") for item in screenshots
              if int(item.get("bytes", 0) or 0) > 1000 and item.get("sha256")
          }
          if not required_screenshots <= present:
              raise SystemExit(f"public Pages QA screenshots are incomplete: {sorted(present)}")
          screenshot_by_name = {item.get("name"): item for item in screenshots}
          screenshot_dir = Path(report_path).parent / "screenshots"
          if any(
              screenshot_by_name[name].get("filename") != name
              or not (screenshot_by_name[name].get("camera") or {}).get("presetId")
              or not (screenshot_by_name[name].get("camera") or {}).get("fingerprint")
              or screenshot_by_name[name].get("seed") is None
              or not screenshot_by_name[name].get("structuralFingerprint")
              or not screenshot_by_name[name].get("actualStructureManifestFingerprint")
              or (screenshot_by_name[name].get("actualStructureManifestEvidence") or {}).get("contract")
                 != "canonical-live-structural-renderables-plus-explicit-building-roof-wall-opening-stair-manifest-v3-root-display-name-normalized"
              or (screenshot_by_name[name].get("actualStructureManifestEvidence") or {}).get(
                  "normalizedRootIdentity", {}
              ).get("descendantNamesAndStructuralIdentityRetained") is not True
              or int((screenshot_by_name[name].get("actualStructureManifestEvidence") or {}).get(
                  "renderableInstanceCount", 0
              ) or 0) <= 0
              or not (screenshot_by_name[name].get("actualStructureManifestEvidence") or {}).get(
                  "recordFingerprint"
              )
              or (screenshot_by_name[name].get("actualStructureManifestEvidence") or {}).get(
                  "manifestFingerprint"
              ) != screenshot_by_name[name].get("actualStructureManifestFingerprint")
              or not (screenshot_by_name[name].get("actualStructureManifestEvidence") or {}).get("manifest")
              or not screenshot_by_name[name].get("surfaceFingerprint")
              or not screenshot_by_name[name].get("viewport")
              or not (screenshot_dir / name).is_file()
              or (screenshot_dir / name).stat().st_size
                 != int(screenshot_by_name[name].get("bytes", 0) or 0)
              or hashlib.sha256((screenshot_dir / name).read_bytes()).hexdigest()
                 != screenshot_by_name[name].get("sha256")
              or (screenshot_by_name[name].get("pngPixelEvidence") or {}).get("validPng") is not True
              or (screenshot_by_name[name].get("pngPixelEvidence") or {}).get("nonEmpty") is not True
              or (screenshot_by_name[name].get("renderEvidence") or {}).get("capturedAfterProductionRender") is not True
              or int((screenshot_by_name[name].get("renderEvidence") or {}).get("renderFrameId", 0) or 0)
              <= int((screenshot_by_name[name].get("renderEvidence") or {}).get("previousRenderFrameId", 0) or 0)
              or not screenshot_by_name[name].get("checks")
              for name in required_screenshots
          ):
              raise SystemExit("public Pages QA screenshot metadata is incomplete")

          visitor = report.get("visitorPlayback") or {}
          rendered_frames = visitor.get("renderedFrameCount", visitor.get("frameCount", 0))
          destination = visitor.get("destination") or {}
          if (
              int(rendered_frames or 0) < 30
              or int(visitor.get("uniquePositionCount", 0) or 0) < 25
              or visitor.get("completed") is not True
              or visitor.get("frameFailures")
              or visitor.get("wallIntersectionCount") != 0
              or visitor.get("openingCollisionCount") != 0
              or visitor.get("railCollisionCount") != 0
              or visitor.get("suspendedFrameCount") != 0
              or visitor.get("stuckFrameCount") != 0
              or destination.get("reachedUpperFloor") is not True
              or int(destination.get("routeSampleCount", 0) or 0) < 193
              or int(destination.get("collisionSampleCount", 0) or 0)
                 < int(destination.get("routeSampleCount", 0) or 0)
              or float(destination.get("maximumCollisionSampleSpacingM", 1) or 1) > 0.08
              or destination.get("wallIntersectionCount") != 0
              or destination.get("openingCollisionCount") != 0
              or destination.get("railCollisionCount") != 0
              or destination.get("suspendedFrameCount") != 0
              or destination.get("stuckFrameCount") != 0
              or destination.get("unsupportedSampleCount") != 0
          ):
              raise SystemExit("public Pages visitor playback did not pass the real-frame gate")

          ab = report.get("abComparison") or {}
          baseline_manifest = ab.get("baselineActualStructureManifestEvidence") or {}
          production_manifest = ab.get("productionActualStructureManifestEvidence") or {}
          if (
              not ab.get("baselineStructuralFingerprint")
              or ab.get("baselineStructuralFingerprint") != ab.get("productionStructuralFingerprint")
              or not ab.get("baselineActualStructureManifestFingerprint")
              or ab.get("baselineActualStructureManifestFingerprint")
                 != ab.get("productionActualStructureManifestFingerprint")
              or ab.get("actualStructureManifestContract")
                 != "canonical-live-structural-renderables-plus-explicit-building-roof-wall-opening-stair-manifest-v3-root-display-name-normalized"
              or baseline_manifest.get("normalizedRootIdentity", {}).get(
                  "descendantNamesAndStructuralIdentityRetained"
              ) is not True
              or int(ab.get("actualStructureRenderableRecordCount", 0) or 0) <= 0
              or baseline_manifest != production_manifest
              or baseline_manifest.get("manifestFingerprint")
                 != ab.get("baselineActualStructureManifestFingerprint")
              or not baseline_manifest.get("recordFingerprint")
              or not baseline_manifest.get("manifest")
              or ab.get("baselineCameraFingerprint") != ab.get("productionCameraFingerprint")
              or ab.get("cameraFingerprint") != ab.get("productionCameraFingerprint")
              or not ab.get("camera")
              or not ab.get("cameraFingerprintContract")
              or ab.get("baselineLightFingerprint") != ab.get("productionLightFingerprint")
              or ab.get("lightFingerprint") != ab.get("productionLightFingerprint")
              or not ab.get("lightEvidence")
              or not ab.get("lightFingerprintContract")
              or ab.get("baselineCanvasFingerprint") != ab.get("productionCanvasFingerprint")
              or ab.get("canvasFingerprint") != ab.get("productionCanvasFingerprint")
              or ab.get("seed") is None
              or not ab.get("viewport")
              or not ab.get("composition")
              or not str(ab.get("baselineSurfaceFingerprint", "")).startswith("fnv1a32:")
              or not str(ab.get("productionSurfaceFingerprint", "")).startswith("fnv1a32:")
              or ab.get("baselineSurfaceFingerprint") == ab.get("productionSurfaceFingerprint")
          ):
              raise SystemExit("public Pages A/B comparison is not same-structure/different-surface")
          PY
