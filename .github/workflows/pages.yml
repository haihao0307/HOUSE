name: Deploy Yunnan Courtyard Production Line

on:
  push:
    branches:
      - main
      - codex/yunnan-surface-production-v5.5.0
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PROJECT_DIR: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production package
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tools/validate.py

      - name: Assemble public site
        shell: bash
        run: |
          set -euo pipefail
          src="yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local"
          mkdir -p _site
          cp -R "$src"/. _site/
          rm -rf _site/references-private _site/release _site/.git _site/.github
          rm -f _site/assets/models/YN_TUANJIE_001_EDITABLE_HIGH.glb
          touch _site/.nojekyll
          printf '{"schemaVersion":"5.5.0","sha":"%s","ref":"%s","runId":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" > _site/build.json

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: ${{ github.ref_name == 'main' && 'github-pages' || 'github-pages-preview' }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify public Pages on desktop and mobile
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright Chromium
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Verify deployed commit and public surface lab
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          python tools/surface_production_smoke.py \
            --base-url "$PAGE_URL" \
            --expected-sha "$GITHUB_SHA" \
            --report data/qa/pages_surface_production_smoke_v5_5_0.json \
            --screenshots qa/screenshots/pages-v550

      - name: Upload Pages verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-surface-v550-${{ github.sha }}
          path: |
            ${{ env.PROJECT_DIR }}/data/qa/pages_surface_production_smoke_v5_5_0.json
            ${{ env.PROJECT_DIR }}/qa/screenshots/pages-v550/**
          if-no-files-found: warn
          retention-days: 30
