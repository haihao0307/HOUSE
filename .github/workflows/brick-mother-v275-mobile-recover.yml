name: Brick Mother V2.7.5 Mobile Fast Preview Recovery

on:
  push:
    branches:
      - feature/brick-mother-v2.0-composite-material-dna
    paths:
      - ".github/workflows/brick-mother-v275-mobile-recover.yml"

permissions:
  contents: write

jobs:
  apply-gate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feature/brick-mother-v2.0-composite-material-dna
          fetch-depth: 0

      - name: Recover deterministic V2.7.5 scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('.github/workflows/brick-mother-v275-mobile-source-commit.yml').read_text(encoding='utf-8')
          blocks = re.findall(r"          python3 - <<'PY'\n(.*?)\n          PY", source, re.S)
          if len(blocks) < 2:
              raise RuntimeError(f'expected at least two embedded Python blocks, found {len(blocks)}')
          for index, block in enumerate(blocks[:2], start=1):
              lines = []
              for line in block.splitlines():
                  lines.append(line[10:] if line.startswith('          ') else line)
              target = Path(f'/tmp/brick-mother-v275-block-{index}.py')
              target.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python3 -m py_compile /tmp/brick-mother-v275-block-1.py /tmp/brick-mother-v275-block-2.py

      - name: Apply V2.7.5 mobile runtime and build standalone
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/brick-mother-v275-block-1.py
          python3 /tmp/brick-mother-v275-block-2.py

      - name: Validate V2.7.5 source and standalone
        shell: bash
        run: |
          set -euxo pipefail
          brick="yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother"
          node --check "$brick/brick-mother-gaea-kernel-v1.js"
          node --check "$brick/brick-mother-geometry-v2.js"
          node --check "$brick/brick-mother-renderer-v2.js"
          node --check "$brick/brick-mother-app-v2.js"
          python3 -m json.tool "$brick/data/brick-material-profiles-v2.json" >/dev/null
          python3 -m json.tool "$brick/qa/v27-visual-truth-contract.json" >/dev/null
          python3 -m json.tool "$brick/VERSION.json" >/dev/null
          grep -q '"version": "2.7.5-alpha.1"' "$brick/VERSION.json"
          grep -q '"mobileFastPreview": true' "$brick/VERSION.json"
          grep -q "mobilePreview: number('mobilePreview'" "$brick/brick-mother-geometry-v2.js"
          grep -q "state.fullFamilyRequested ? 0.56 : 0.30" "$brick/brick-mother-app-v2.js"
          grep -q "mobileRuntime ? 1.20 : 2" "$brick/brick-mother-renderer-v2.js"
          standalone="$brick/brick-mother-standalone-v2.7.5.html"
          test -s "$standalone"
          test "$(wc -c < "$standalone")" -gt 180000
          ! grep -q '<script src=' "$standalone"
          ! grep -q '<link rel="stylesheet"' "$standalone"
          grep -q 'window.__BRICK_MOTHER_INLINE_DATA__' "$standalone"
          sha256sum "$standalone" > /tmp/brick-mother-v275-standalone.sha256

      - name: Gate iPhone fast preview in Chromium
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          uri="$(python3 - <<'PY'
          from pathlib import Path
          print(Path('yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/brick-mother-standalone-v2.7.5.html').resolve().as_uri())
          PY
          )"
          timeout 180s "$chrome" \
            --headless=new --no-sandbox --disable-dev-shm-usage --disable-background-networking \
            --allow-file-access-from-files --enable-webgl --ignore-gpu-blocklist \
            --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader \
            --hide-scrollbars --window-size=390,844 --force-device-scale-factor=1 \
            --user-agent='Mozilla/5.0 (iPhone; CPU iPhone OS 18_1 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.1 Mobile/15E148 Safari/604.1' \
            --virtual-time-budget=9000 \
            --screenshot=/tmp/brick-mother-v275-iphone.png --dump-dom \
            "${uri}?mobile=1&qa=v275-iphone" \
            > /tmp/brick-mother-v275-iphone-dom.html 2> /tmp/brick-mother-v275-iphone-chrome.log
          grep -q 'data-brick-mother-ready="true"' /tmp/brick-mother-v275-iphone-dom.html
          grep -q 'data-brick-mother-version="2.7.5-alpha.1"' /tmp/brick-mother-v275-iphone-dom.html
          grep -q 'data-mobile-runtime="true"' /tmp/brick-mother-v275-iphone-dom.html
          grep -q 'data-mobile-quick="true"' /tmp/brick-mother-v275-iphone-dom.html
          grep -q 'data-mobile-grid-profile="quick"' /tmp/brick-mother-v275-iphone-dom.html
          grep -q 'data-benchmark-specimen="true"' /tmp/brick-mother-v275-iphone-dom.html
          test -s /tmp/brick-mother-v275-iphone.png
          test "$(wc -c < /tmp/brick-mother-v275-iphone.png)" -gt 35000

      - name: Commit browser gated V2.7.5 source
        shell: bash
        run: |
          set -euo pipefail
          brick="yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother"
          git config user.name "Brick Mother V2.7.5 Mobile Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/brick-mother-v275-mobile-source-commit.yml
          git rm .github/workflows/brick-mother-v275-mobile-recover.yml
          git add "$brick"
          git commit -m "Fix Brick Mother V2.7.5 mobile fast preview loading"
          git push origin HEAD:feature/brick-mother-v2.0-composite-material-dna

      - name: Upload V2.7.5 mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-mother-v275-mobile-fast-preview-evidence
          path: |
            /tmp/brick-mother-v275-iphone.png
            /tmp/brick-mother-v275-iphone-dom.html
            /tmp/brick-mother-v275-iphone-chrome.log
            /tmp/brick-mother-v275-standalone.sha256
            yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/brick-mother-standalone-v2.7.5.html
            yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/VERSION.json
            yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/qa/v27-visual-truth-contract.json
          compression-level: 1
          if-no-files-found: ignore
