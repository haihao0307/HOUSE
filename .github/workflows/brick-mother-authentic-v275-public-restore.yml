name: Brick Mother Authentic V2.7.5 Public Restore

on:
  push:
    branches:
      - feature/brick-mother-v2.0-composite-material-dna
    paths:
      - .github/workflows/brick-mother-authentic-v275-public-restore.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: brick-mother-authentic-v275-public
  cancel-in-progress: false

env:
  FACTORY_ROOT: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local
  BRICK_ROOT: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother
  AUTHENTIC_HANDOFF_HEAD: 8184e95a89279f546d2c02135b13e139a3c7f988
  AUTHENTIC_RUNTIME_HEAD: b25508b8b57d45f9333286ab7b883644181039e7
  OBSERVATION_BLOB: 7b2a18c6a886d0751ca2fc92530b7986d9e1a727
  STANDALONE_BLOB: 7b10389cb9367f7423619262820883cc94b07a61
  SOURCE_INDEX_BLOB: 83ea467bd074a9de1d83f34c60c7f4fec835c866
  PACKAGE_SHA256: 1d7ed164cf9c2ae4ce8dfc23c848f16b822da3f38adc168c83a4da4084d1782e

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current feature branch and full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/brick-mother-v2.0-composite-material-dna

      - name: Extract the authoritative V2.7.5 Brick Mother subtree
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$AUTHENTIC_HANDOFF_HEAD^{commit}"
          rm -rf /tmp/authentic-v275
          mkdir -p /tmp/authentic-v275
          git archive "$AUTHENTIC_HANDOFF_HEAD" "$BRICK_ROOT" | tar -x -C /tmp/authentic-v275

          authentic="/tmp/authentic-v275/$BRICK_ROOT"
          test -s "$authentic/brick-mother-observation-studio.html"
          test -s "$authentic/brick-mother-standalone-v2.7.5.html"
          test -s "$authentic/index.html"
          test "$(git hash-object "$authentic/brick-mother-observation-studio.html")" = "$OBSERVATION_BLOB"
          test "$(git hash-object "$authentic/brick-mother-standalone-v2.7.5.html")" = "$STANDALONE_BLOB"
          test "$(git hash-object "$authentic/index.html")" = "$SOURCE_INDEX_BLOB"
          grep -q 'Brick Mother V2.7.5 三维材质观察台' "$authentic/brick-mother-observation-studio.html"
          grep -q '2.7.5-alpha.1' "$authentic/VERSION.json"

      - name: Assemble current HOUSE site with only Brick Mother restored to the handoff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R "$FACTORY_ROOT"/. _site/
          rm -rf _site/brick-mother
          cp -R "/tmp/authentic-v275/$BRICK_ROOT" _site/brick-mother

          # The public Brick Mother root opens the exact original observation studio.
          cp _site/brick-mother/brick-mother-observation-studio.html _site/brick-mother/index.html
          touch _site/.nojekyll

          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root=Path('_site/brick-mother')
          def blob(path):
              data=path.read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()

          assert blob(root/'index.html') == os.environ['OBSERVATION_BLOB']
          assert blob(root/'brick-mother-observation-studio.html') == os.environ['OBSERVATION_BLOB']
          assert blob(root/'brick-mother-standalone-v2.7.5.html') == os.environ['STANDALONE_BLOB']

          later=[
            'workbench.html','studio.html','studio-v1.4.html','studio-sw.js','studio.webmanifest','studio-icon.svg',
            'brick-mother-stone-masonry-v2.8.0-alpha.html','brick-mother-realtime-weathering-pbr-v1.0.0.html',
            'brick-mother-realtime-weathering-pbr-v1.1.0.html','BASELINE_REGISTRY_V1.json','BASELINE_REGISTRY_V2.json'
          ]
          assert not any((root/name).exists() for name in later)

          receipt={
            'identity':'authentic Brick Mother V2.7.5 full handoff public restoration',
            'handoffHead':os.environ['AUTHENTIC_HANDOFF_HEAD'],
            'runtimeBaseHead':os.environ['AUTHENTIC_RUNTIME_HEAD'],
            'packageSha256':os.environ['PACKAGE_SHA256'],
            'publicDefault':'brick-mother-observation-studio.html',
            'observationStudioBlob':os.environ['OBSERVATION_BLOB'],
            'standaloneBlob':os.environ['STANDALONE_BLOB'],
            'laterExperimentalPagesPublished':False,
            'humanVisualApproved':False,
            'productionApproved':False
          }
          (root/'AUTHENTIC_V275_RESTORATION.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: brick-mother-online
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy authentic V2.7.5 site
        id: deployment
        uses: actions/deploy-pages@v4

  verify-public:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify exact public files and deleted experimental routes
        shell: bash
        env:
          BASE: https://haihao0307.github.io/HOUSE/brick-mother
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS "$BASE/AUTHENTIC_V275_RESTORATION.json?restore=$GITHUB_SHA" -o /tmp/identity.json \
              && grep -q "$AUTHENTIC_HANDOFF_HEAD" /tmp/identity.json \
              && curl -fsS "$BASE/?restore=$GITHUB_SHA" -o /tmp/root.html \
              && curl -fsS "$BASE/brick-mother-observation-studio.html?restore=$GITHUB_SHA" -o /tmp/observation.html \
              && curl -fsS "$BASE/brick-mother-standalone-v2.7.5.html?restore=$GITHUB_SHA" -o /tmp/standalone.html; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = 1

          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          def blob(path):
              data=Path(path).read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          identity=json.loads(Path('/tmp/identity.json').read_text())
          assert identity['handoffHead']==os.environ['AUTHENTIC_HANDOFF_HEAD']
          assert identity['runtimeBaseHead']==os.environ['AUTHENTIC_RUNTIME_HEAD']
          assert identity['packageSha256']==os.environ['PACKAGE_SHA256']
          assert blob('/tmp/root.html')==os.environ['OBSERVATION_BLOB']
          assert blob('/tmp/observation.html')==os.environ['OBSERVATION_BLOB']
          assert blob('/tmp/standalone.html')==os.environ['STANDALONE_BLOB']
          PY

          for removed in workbench.html studio.html studio-v1.4.html brick-mother-stone-masonry-v2.8.0-alpha.html brick-mother-realtime-weathering-pbr-v1.1.0.html; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/$removed?restore=$GITHUB_SHA")"
            test "$code" = 404
          done

      - name: Verify authentic runtime in Chromium
        shell: bash
        env:
          BASE: https://haihao0307.github.io/HOUSE/brick-mother
        run: |
          set -euo pipefail
          python3 -m pip install playwright
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          url=os.environ['BASE']+'/brick-mother-observation-studio.html?profile=stone-block&solo=1&restore='+os.environ['GITHUB_SHA']
          with sync_playwright() as pw:
              executable=shutil.which('google-chrome') or shutil.which('google-chrome-stable') or shutil.which('chromium')
              browser=pw.chromium.launch(executable_path=executable,headless=True,args=['--no-sandbox','--disable-dev-shm-usage','--enable-unsafe-swiftshader','--use-gl=angle','--use-angle=swiftshader'])
              page=browser.new_page(viewport={'width':1440,'height':1000},device_scale_factor=1)
              errors=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              response=page.goto(url,wait_until='domcontentloaded',timeout=90000)
              assert response and response.status==200
              assert page.get_attribute('html','data-layout-version')=='brick-observation-v1'
              page.wait_for_function("document.documentElement.dataset.brickMotherReady==='true' || document.body.classList.contains('runtime-failed')",timeout=180000)
              assert not page.evaluate("document.body.classList.contains('runtime-failed')")
              assert page.evaluate("window.__BRICK_MOTHER_QA__.version")=='2.7.5-alpha.1'
              assert not errors,errors
              proof={
                  'url':page.url,
                  'title':page.title(),
                  'layout':page.get_attribute('html','data-layout-version'),
                  'runtime':page.evaluate("window.__BRICK_MOTHER_QA__.version"),
                  'errors':errors,
                  'humanVisualApproved':False,
                  'productionApproved':False
              }
              Path('/tmp/authentic-v275-browser-proof.json').write_text(json.dumps(proof,ensure_ascii=False,indent=2)+'\n')
              browser.close()
          PY

      - name: Upload public verification record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-mother-authentic-v275-public-${{ github.sha }}
          path: |
            /tmp/identity.json
            /tmp/authentic-v275-browser-proof.json
          compression-level: 1
          if-no-files-found: warn
          retention-days: 14
