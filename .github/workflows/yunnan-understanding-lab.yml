name: Validate Yunnan Architecture Understanding Lab

on:
  pull_request:
    branches: [main]
    paths:
      - 'yunnan-courtyard-architecture-factory-v5.2.1-full-local/**'
      - '.github/workflows/yunnan-understanding-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yunnan-understanding-lab-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate existing production package
        working-directory: ${{ env.PROJECT_DIR }}
        run: python tools/validate.py
      - name: Validate V5.4.4 contract
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/production/yunnan_wall_roof_entry_tool_contract_v5_4_4.json')
          d=json.loads(p.read_text('utf-8'))
          assert d['schemaVersion']=='5.4.4'
          assert len(d['referenceAssets'])==3
          assert len(d['roofHierarchyRules']['requiredUnits'])>=7
          assert d['entryCirculationRules']['stair']['lowerSteps']==8
          assert d['entryCirculationRules']['stair']['upperSteps']==8
          assert len(d['wallGeneratorSchema']['presets'])>=3
          assert len(d['roofGeneratorSchema']['presets'])>=4
          print('contract validation passed')
          PY
      - name: Install Playwright
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Run real three-model understanding-lab smoke test
        working-directory: ${{ env.PROJECT_DIR }}
        run: xvfb-run -a python tools/yunnan_understanding_lab_smoke.py
      - name: Upload understanding-lab QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yunnan-understanding-lab-v5.4.4-qa
          path: |
            ${{ env.PROJECT_DIR }}/data/qa/yunnan_understanding_lab_smoke_v5_4_4.json
            ${{ env.PROJECT_DIR }}/qa/screenshots/yunnan_understanding_lab_v5_4_4.png
          if-no-files-found: warn
