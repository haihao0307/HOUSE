name: Tiles Mother V0.4 Relief Lighting Roof Time QA
on:
  push:
    branches: [feature/tiles-mother-v0.1-workbench]
    paths:
      - .github/workflows/tiles-mother-v04-qa.yml
      - tiles-mother/v04/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tiles-mother-v04-qa
  cancel-in-progress: false
jobs:
  qa:
    if: github.ref == 'refs/heads/feature/tiles-mother-v0.1-workbench'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Install analysis and native browser dependencies
        run: |
          python3 -m pip install 'playwright>=1.50,<2' 'pillow>=10,<13' 'numpy>=1.26,<3'
          python3 -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Prepare the actual pinned study without raw assets
        run: |
          test -f tiles-mother/v04/test-core.cjs
          test -f tiles-mother/v04/browser-qa.py
          python3 tiles-mother/v04/prepare-study.py
          node --check tiles-mother/v04/operators.js
          node --check tiles-mother/v04/viewer.js
          python3 - <<'PY'
          from pathlib import Path
          root=Path('tiles-mother/v04')
          forbidden={'讲武堂瓦片精细.zip','01.fbx','01_u1_v1_diffuse.png','01_u1_v1_normal.png'}
          assert not [str(p) for p in root.rglob('*') if p.is_file() and p.name in forbidden]
          assert not [str(p) for p in root.rglob('*') if p.is_file() and p.stat().st_size>8*1024*1024]
          PY
      - name: Verify final geometry and causal-history operators
        working-directory: tiles-mother/v04
        run: node test-core.cjs
      - name: Verify real WebGL2 geometry lighting and roof timeline
        run: python3 tiles-mother/v04/browser-qa.py --site tiles-mother/v04 --out tiles-mother/v04/qa-browser
      - name: Validate actual test receipts
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('tiles-mother/v04')
          core=json.loads((root/'qa/core-report.json').read_text())
          browser=json.loads((root/'qa-browser/browser-report.json').read_text())
          assert core['allPassed'] and all(t['passed'] for t in core['tests'])
          assert browser['allPassed'] and not browser['errors'] and not browser['failedRequests'],browser.get('error')
          assert not browser['visualApproved'] and not browser['productionApproved']
          names={t['name'] for t in browser['tests'] if t.get('passed')}
          required={'actual WebGL2','pan geometry actually displaced','cover geometry actually displaced','lights visibly affect render','one controller reaches 15 tiles','all roof tiles receive same physical time','rewind restores actual geometry','mobile no horizontal overflow'}
          assert required<=names,sorted(required-names)
          assert len(browser['screenshots'])>=14
          print(json.dumps({'coreTests':len(core['tests']),'browserTests':len(browser['tests']),'nativeScreenshots':len(browser['screenshots'])}))
          PY
      - name: Preserve tested candidate and evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiles-mother-v04-qa-${{ github.sha }}
          path: |
            tiles-mother/v04/qa/
            tiles-mother/v04/qa-browser/
            tiles-mother/v04/index.html
            tiles-mother/v04/operators.js
            tiles-mother/v04/viewer.js
            tiles-mother/v04/three-runtime.js
            tiles-mother/v04/reference-contact.jpg
            tiles-mother/v04/THIRD-PARTY-NOTICES.txt
            tiles-mother/v04/build-manifest.json
            tiles-mother/v04/CHECKSUMS.sha256
          if-no-files-found: warn
          retention-days: 14
      - name: Report evidence scope
        if: always()
        run: |
          echo '## Tiles Mother V0.4 candidate verification' >> "$GITHUB_STEP_SUMMARY"
          echo 'This workflow does not publish or change source branches. Existing V0.3, other Mothers, main and frozen assets are untouched.' >> "$GITHUB_STEP_SUMMARY"
          echo 'visualApproved=false; productionApproved=false; distillationComplete=false. Unsupported geometry and uncalibrated physical rates remain labelled.' >> "$GITHUB_STEP_SUMMARY"
          for file in tiles-mother/v04/qa/core-report.json tiles-mother/v04/qa-browser/browser-report.json; do
            if test -f "$file"; then
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$file" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
