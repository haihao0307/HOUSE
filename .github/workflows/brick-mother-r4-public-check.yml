name: Brick Mother R4 Public HTTPS Check
on:
  push:
    branches: [feature/brick-mother-v2.0-composite-material-dna]
    paths:
      - .github/workflows/brick-mother-r4-public-check.yml
      - yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/experiments/atelier-r4/PUBLISH.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brick-mother-r4-public-https-check
  cancel-in-progress: true
jobs:
  check-public:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      BRICK: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother
      PUBLIC_URL: https://haihao0307.github.io/HOUSE/brick-mother/experiments/atelier-r4/web/
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact reviewed public bytes
        run: |
          python - <<'PY'
          import os,json,urllib.request,time,hashlib,pathlib
          expected=json.loads((pathlib.Path(os.environ['BRICK'])/'experiments/atelier-r4/web/RELEASE.json').read_text())
          url=os.environ['PUBLIC_URL']; output=pathlib.Path(os.environ['RUNNER_TEMP'])/'r4-evidence';output.mkdir(exist_ok=True)
          good=False
          for attempt in range(100):
              try:
                  request=urllib.request.Request(url+'?release='+expected['htmlSHA256'],headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(request,timeout=20) as r:
                      data=r.read(); content_type=r.headers.get('Content-Type',''); code=r.status; disposition=r.headers.get('Content-Disposition','')
                  digest=hashlib.sha256(data).hexdigest()
                  if code==200 and 'text/html' in content_type and 'attachment' not in disposition and digest==expected['htmlSHA256']:
                      good=True;break
                  print('Waiting for exact release',attempt,code,digest,flush=True)
              except Exception as e:
                  print('Waiting for public candidate',attempt,str(e),flush=True)
              time.sleep(5)
          assert good,'Exact public HTML was not available within bounded wait'
          (output/'http-verification.json').write_text(json.dumps({'url':url,'httpStatus':code,'contentType':content_type,'htmlSHA256':digest,'expectedSHA256':expected['htmlSHA256'],'bytes':len(data),'sourceHead':expected['head'],'anonymousAccess':True,'downloadHeader':disposition,'passed':True},indent=2))
          (output/'public-index.html').write_bytes(data)
          PY
      - name: Install browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Real public URL interaction
        run: xvfb-run -a python .github/brick-public-source-repair/check_browser.py "$PUBLIC_URL"
      - name: Confirm browser response matches release
        run: |
          python - <<'PY'
          import pathlib,os,json
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'r4-evidence'
          browser=json.loads((root/'browser-report.json').read_text())
          http=json.loads((root/'http-verification.json').read_text())
          assert browser['passed'] and browser['publicURLTest']
          assert browser['htmlSHA256']==http['htmlSHA256']
          assert browser['pageSourceCommit']==http['sourceHead']
          print('Public HTTPS, exact source, seven materials, six faces and mouse rotation verified')
          PY
      - name: Retain public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-mother-r4-public-https-${{ github.run_id }}
          path: ${{ runner.temp }}/r4-evidence
          retention-days: 30
