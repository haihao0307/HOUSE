name: Brick Mother V2.5 Albedo Diagnostic Evidence

on:
  push:
    branches:
      - feature/brick-mother-v2.0-composite-material-dna
    paths:
      - ".github/workflows/brick-mother-v25-albedo-evidence.yml"

permissions:
  contents: read

jobs:
  albedo-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: old-pbr-fired
            label: fired
          - profile: stone-block
            label: stone
          - profile: raw-clay
            label: adobe
    steps:
      - uses: actions/checkout@v4

      - name: Capture solo albedo channel
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          uri="$(python3 - <<'PY'
          from pathlib import Path
          print(Path('yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/brick-mother-standalone-v2.5.html').resolve().as_uri())
          PY
          )"
          timeout 420s "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-background-networking \
            --allow-file-access-from-files \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --enable-unsafe-swiftshader \
            --use-gl=angle \
            --use-angle=swiftshader \
            --hide-scrollbars \
            --window-size=1600,1000 \
            --virtual-time-budget=140000 \
            --screenshot="/tmp/brick-mother-v25-${{ matrix.label }}-albedo.png" \
            "${uri}?evidence=1&solo=1&profile=${{ matrix.profile }}&focus=2&debug=1&qa=${{ matrix.label }}-albedo" \
            > "/tmp/brick-mother-v25-${{ matrix.label }}-albedo.log" 2>&1
          test -s "/tmp/brick-mother-v25-${{ matrix.label }}-albedo.png"

      - name: Upload albedo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-mother-v25-${{ matrix.label }}-albedo-evidence
          path: |
            /tmp/brick-mother-v25-${{ matrix.label }}-albedo.png
            /tmp/brick-mother-v25-${{ matrix.label }}-albedo.log
          compression-level: 1
          if-no-files-found: ignore
