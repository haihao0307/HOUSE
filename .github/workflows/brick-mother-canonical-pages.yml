name: Brick Mother Canonical Pages V1 Archived Audit

# Superseded after optional screenshot capture blocked an otherwise healthy
# runtime check. Active canonical deployment is canonical-pages-v2.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BRICK_ROOT: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother
  PRESERVED_CORE_BLOB: 7b10389cb9367f7423619262820883cc94b07a61

jobs:
  archived-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen core and successor workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$BRICK_ROOT/brick-mother-standalone-v2.7.5.html")" = "$PRESERVED_CORE_BLOB"
          test -s .github/workflows/brick-mother-canonical-pages-v2.yml
          test -s tools/brick-mother/test_canonical_entry.py
