name: Deploy Brick Mother Canonical V2.7.5 Workbench

on:
  push:
    branches: [feature/brick-mother-v2.0-composite-material-dna]
    paths:
      - .github/workflows/brick-mother-canonical-pages.yml
      - yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/workbench.html
      - yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/index.html
      - yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/brick-mother-standalone-v2.7.5.html
      - yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/BASELINE_REGISTRY_V1.json
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: brick-mother-pages-canonical
  cancel-in-progress: true

env:
  BRICK_ROOT: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother
  PRESERVED_CORE_BLOB: 7b10389cb9367f7423619262820883cc94b07a61
  CANONICAL_RUNTIME: 2.7.5-alpha.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify canonical hierarchy and frozen core
        shell: bash
        run: |
          set -euo pipefail
          root="$BRICK_ROOT"
          test -s "$root/workbench.html"
          test -s "$root/index.html"
          test -s "$root/brick-mother-standalone-v2.7.5.html"
          test -s "$root/BASELINE_REGISTRY_V1.json"
          test "$(git hash-object "$root/brick-mother-standalone-v2.7.5.html")" = "$PRESERVED_CORE_BLOB"
          grep -q '原 V2.7.5 三材质核心' "$root/workbench.html"
          grep -q "canonicalEntry='brick-mother-standalone-v2.7.5.html'" "$root/workbench.html"
          grep -q "candidateStatus:'rejected_for_visual_regression'" "$root/workbench.html"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['BRICK_ROOT'])
          registry=json.loads((root/'BASELINE_REGISTRY_V1.json').read_text())
          assert registry['canonicalEntry']['file']=='brick-mother-standalone-v2.7.5.html'
          assert registry['canonicalEntry']['gitBlob']==os.environ['PRESERVED_CORE_BLOB']
          assert registry['canonicalEntry']['immutable'] is True
          assert all(item['default'] is False for item in registry['experimentalCandidates'])
          assert registry['approvals']['humanVisualApproved'] is False
          assert registry['approvals']['productionApproved'] is False
          PY

      - name: Install real-browser driver
        run: python3 -m pip install playwright

      - name: Verify local default entry and retained core runtime
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/brick-mother-canonical-local
          mkdir -p "$out"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$BRICK_ROOT" >"$out/server.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8765/workbench.html >/dev/null && break
            sleep 1
          done
          python3 - <<'PY'
          import json,shutil,time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path('/tmp/brick-mother-canonical-local')
          with sync_playwright() as p:
              browser=p.chromium.launch(executable_path=shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('google-chrome-stable'),args=['--no-sandbox','--disable-dev-shm-usage','--enable-unsafe-swiftshader','--use-gl=angle','--use-angle=swiftshader'])
              page=browser.new_page(viewport={'width':1280,'height':850})
              errors=[]
              page.on('pageerror',lambda error:errors.append(str(error)))
              response=page.goto('http://127.0.0.1:8765/workbench.html',wait_until='domcontentloaded',timeout=60000)
              assert response.status==200
              page.wait_for_function("document.documentElement.dataset.brickMotherWorkbenchReady==='true'",timeout=20000)
              assert page.evaluate("document.documentElement.dataset.activeWorkbench")=='core'
              assert page.evaluate("document.documentElement.dataset.canonicalEntry")=='brick-mother-standalone-v2.7.5.html'
              assert page.locator('#core').evaluate("node=>node.classList.contains('on')")
              assert not page.locator('#weathering iframe').evaluate("node=>node.hasAttribute('src')")
              frame=page.frame_locator('#core iframe')
              frame.locator('canvas').wait_for(state='attached',timeout=30000)
              page.wait_for_function("document.querySelector('#core iframe').contentDocument?.documentElement?.dataset.brickMotherReady==='true'",timeout=180000)
              assert page.locator('#core iframe').evaluate("node=>node.contentWindow.__BRICK_MOTHER_QA__.version")=='2.7.5-alpha.1'
              assert not errors,errors
              page.screenshot(path=str(out/'canonical-workbench.png'))
              direct=browser.new_page(viewport={'width':1280,'height':850})
              direct_errors=[]
              direct.on('pageerror',lambda error:direct_errors.append(str(error)))
              response=direct.goto('http://127.0.0.1:8765/brick-mother-standalone-v2.7.5.html?mobile=0&profile=old-pbr-fired&solo=1&focus=0',wait_until='domcontentloaded',timeout=60000)
              assert response.status==200
              direct.wait_for_function("document.documentElement.dataset.brickMotherReady==='true'",timeout=180000)
              assert direct.evaluate("document.documentElement.dataset.brickMotherVersion")=='2.7.5-alpha.1'
              assert not direct_errors,direct_errors
              direct.screenshot(path=str(out/'canonical-direct-core.png'))
              (out/'verification.json').write_text(json.dumps({
                  'canonicalEntry':'brick-mother-standalone-v2.7.5.html',
                  'runtime':'2.7.5-alpha.1',
                  'workbenchDefault':'core',
                  'candidateLoadedAtStartup':False,
                  'errors':errors+direct_errors,
                  'humanVisualApproved':False,
                  'productionApproved':False
              },ensure_ascii=False,indent=2))
              browser.close()
          PY

      - name: Upload local canonical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-mother-canonical-local-${{ github.sha }}
          path: /tmp/brick-mother-canonical-local
          compression-level: 1
          retention-days: 14
          if-no-files-found: warn

      - name: Assemble public site
        shell: bash
        run: |
          set -euo pipefail
          src="$(dirname "$BRICK_ROOT")"
          mkdir -p _site
          cp -R "$src"/. _site/
          rm -rf _site/references-private _site/release _site/.git _site/.github
          rm -f _site/assets/models/YN_TUANJIE_001_EDITABLE_HIGH.glb
          touch _site/.nojekyll
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          Path('_site/brick-mother/CANONICAL_DEPLOYMENT.json').write_text(json.dumps({
              'sourceHead':os.environ['GITHUB_SHA'],
              'runId':os.environ['GITHUB_RUN_ID'],
              'canonicalEntry':'brick-mother-standalone-v2.7.5.html',
              'canonicalRuntime':os.environ['CANONICAL_RUNTIME'],
              'canonicalBlob':os.environ['PRESERVED_CORE_BLOB'],
              'workbenchDefault':'core',
              'candidateStatus':'rejected_for_visual_regression',
              'humanVisualApproved':False,
              'productionApproved':False
          },indent=2)+'\n')
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: brick-mother-online
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  verify-public:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Confirm public canonical identity
        shell: bash
        run: |
          set -euo pipefail
          base=https://haihao0307.github.io/HOUSE/brick-mother
          ok=0
          for attempt in $(seq 1 50); do
            if curl -fsS "$base/CANONICAL_DEPLOYMENT.json?build=$GITHUB_SHA" -o /tmp/canonical.json \
              && grep -q "$GITHUB_SHA" /tmp/canonical.json \
              && curl -fsS "$base/workbench.html?build=$GITHUB_SHA" -o /tmp/workbench.html \
              && grep -q '原 V2.7.5 三材质核心' /tmp/workbench.html \
              && curl -fsS "$base/brick-mother-standalone-v2.7.5.html?build=$GITHUB_SHA" -o /tmp/core.html \
              && grep -q 'Brick Mother V2.7' /tmp/core.html; then
              ok=1
              break
            fi
            sleep 6
          done
          test "$ok" = 1
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          deployment=json.loads(Path('/tmp/canonical.json').read_text())
          core=Path('/tmp/core.html').read_bytes()
          blob=hashlib.sha1(b'blob '+str(len(core)).encode()+b'\0'+core).hexdigest()
          assert deployment['canonicalEntry']=='brick-mother-standalone-v2.7.5.html'
          assert deployment['canonicalRuntime']=='2.7.5-alpha.1'
          assert deployment['canonicalBlob']==blob=='7b10389cb9367f7423619262820883cc94b07a61'
          assert deployment['workbenchDefault']=='core'
          assert deployment['humanVisualApproved'] is False
          assert deployment['productionApproved'] is False
          PY

      - name: Open public canonical workbench
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install playwright
          python3 - <<'PY'
          import json,shutil
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          url='https://haihao0307.github.io/HOUSE/brick-mother/workbench.html'
          with sync_playwright() as p:
              browser=p.chromium.launch(executable_path=shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('google-chrome-stable'),args=['--no-sandbox','--disable-dev-shm-usage','--enable-unsafe-swiftshader','--use-gl=angle','--use-angle=swiftshader'])
              page=browser.new_page(viewport={'width':1280,'height':850})
              errors=[]
              page.on('pageerror',lambda error:errors.append(str(error)))
              response=page.goto(url,wait_until='domcontentloaded',timeout=60000)
              assert response.status==200
              page.wait_for_function("document.documentElement.dataset.brickMotherWorkbenchReady==='true'",timeout=30000)
              assert page.evaluate("document.documentElement.dataset.activeWorkbench")=='core'
              assert page.evaluate("document.documentElement.dataset.canonicalEntry")=='brick-mother-standalone-v2.7.5.html'
              page.wait_for_function("document.querySelector('#core iframe').contentDocument?.documentElement?.dataset.brickMotherReady==='true'",timeout=180000)
              assert page.locator('#core iframe').evaluate("node=>node.contentWindow.__BRICK_MOTHER_QA__.version")=='2.7.5-alpha.1'
              assert not page.locator('#weathering iframe').evaluate("node=>node.hasAttribute('src')")
              assert not errors,errors
              page.screenshot(path='/tmp/public-canonical-workbench.png')
              Path('/tmp/public-canonical-proof.json').write_text(json.dumps({
                  'url':page.url,
                  'activeWorkbench':page.evaluate("document.documentElement.dataset.activeWorkbench"),
                  'canonicalEntry':page.evaluate("document.documentElement.dataset.canonicalEntry"),
                  'runtime':page.locator('#core iframe').evaluate("node=>node.contentWindow.__BRICK_MOTHER_QA__.version"),
                  'candidateLoadedAtStartup':page.locator('#weathering iframe').evaluate("node=>node.hasAttribute('src')"),
                  'errors':errors,
                  'humanVisualApproved':False,
                  'productionApproved':False
              },ensure_ascii=False,indent=2))
              browser.close()
          PY

      - name: Upload public canonical proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-mother-canonical-public-${{ github.sha }}
          path: |
            /tmp/public-canonical-workbench.png
            /tmp/public-canonical-proof.json
            /tmp/canonical.json
          compression-level: 1
          retention-days: 14
          if-no-files-found: warn
