name: Brick Mother V2.3 Payload Diagnose

on:
  push:
    branches:
      - feature/brick-mother-v2.0-composite-material-dna
    paths:
      - ".github/workflows/brick-mother-v23-payload-diagnose.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report payload bytes and hashes
        shell: bash
        run: |
          set -u
          wc -c .github/brick-mother-v23-payload/*.b64
          sha256sum .github/brick-mother-v23-payload/*.b64
          echo FIRST_TAIL
          tail -c 80 .github/brick-mother-v23-payload/001.b64; echo
          echo SECOND_HEAD
          head -c 80 .github/brick-mother-v23-payload/002.b64; echo
          cat .github/brick-mother-v23-payload/*.b64 | tr -d '\r\n\t ' > /tmp/payload.b64
          echo COMBINED
          wc -c /tmp/payload.b64
          sha256sum /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/payload.gz || true
          file /tmp/payload.gz || true
          gzip -t /tmp/payload.gz || true
