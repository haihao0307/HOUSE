name: Brick Mother V2 Source Finalize

on:
  push:
    branches: [feature/brick-mother-v2.0-composite-material-dna]
    paths: [".github/workflows/brick-mother-v2-source-finalize.yml"]

permissions:
  contents: write

env:
  BRANCH: feature/brick-mother-v2.0-composite-material-dna
  BASE: 77ce0a1bc63d301829942c14e5708fc16a06cdcd
  ISSUE: "14"
  PAYLOAD_SHA: f5f4339da5dea600f4b664c24adc17de261eac9e447fd6b84a47d09916a2ee5b

jobs:
  source-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Reassemble exact previously browser-tested payload
        env:
          TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE" HEAD
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,re,tarfile,urllib.request
          url=f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/{os.environ['ISSUE']}/comments?per_page=100"
          req=urllib.request.Request(url,headers={'Authorization':f"Bearer {os.environ['TOKEN']}",'Accept':'application/vnd.github+json'})
          comments=json.load(urllib.request.urlopen(req)); chunks={}
          pat=re.compile(r'^BRICK_MOTHER_V2_CHUNK_(\d{3})_OF_010\r?\n([A-Za-z0-9+/=\r\n]+)\s*$')
          for item in comments:
              m=pat.match(item.get('body') or '')
              if m: chunks[int(m.group(1))]=''.join(m.group(2).split())
          if sorted(chunks)!=list(range(1,11)): raise SystemExit(f'bad chunk set {sorted(chunks)}')
          encoded=''.join(chunks[i] for i in range(1,11)); payload=base64.b64decode(encoded,validate=True)
          digest=hashlib.sha256(payload).hexdigest(); report={'chunks':10,'base64Length':len(encoded),'bytes':len(payload),'sha256':digest,'browserEvidenceRun':33166482918}
          pathlib.Path('/tmp/reassembly.json').write_text(json.dumps(report,indent=2)+'\n')
          if len(encoded)!=51224 or len(payload)!=38417 or digest!=os.environ['PAYLOAD_SHA']: raise SystemExit(report)
          archive=pathlib.Path('/tmp/payload.tar.gz'); archive.write_bytes(payload)
          with tarfile.open(archive,'r:gz') as tf:
              for member in tf.getmembers():
                  p=pathlib.PurePosixPath(member.name)
                  if p.is_absolute() or '..' in p.parts: raise SystemExit(member.name)
              tf.extractall('.')
          PY
          rm -f .github/workflows/brick-mother-v2-smoke.yml

      - name: Reconfirm four mother geometry contracts
        shell: bash
        run: |
          set -euo pipefail
          brick="yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother"
          node --check "$brick/brick-mother-geometry-v2.js"
          node --check "$brick/brick-mother-renderer-v2.js"
          node --check "$brick/brick-mother-app-v2.js"
          python3 -m json.tool "$brick/data/brick-material-profiles-v2.json" >/dev/null
          BRICK="$brick" node <<'NODE'
          const fs=require('fs'),path=require('path'); global.window={}; const b=process.env.BRICK;
          require(path.resolve(b,'brick-mother-geometry-v2.js')); const G=window.BrickMotherGeometryV2;
          const profiles=JSON.parse(fs.readFileSync(path.resolve(b,'data/brick-material-profiles-v2.json'))).profiles,qa=[];
          for(const p of profiles){const m=G.buildMesh(p,p.runtimeDNA.seedBase+17,p.compositeDefaults,0.74,0.58); if(!m.triangles||!m.damage.deepPores.length||!m.damage.erosionBites.length||Object.keys(m.seedDNA).length-1!==8)throw Error(p.id); qa.push({profile:p.id,triangles:m.triangles,deepPores:m.damage.deepPores.length,erosionBites:m.damage.erosionBites.length,seedLayers:8});}
          fs.writeFileSync('/tmp/geometry-qa.json',JSON.stringify(qa,null,2)+'\n');
          NODE

      - name: Push source only
        shell: bash
        run: |
          set -euo pipefail
          brick="yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother"
          git config user.name "Brick Mother Production Bot"
          git config user.email "brick-mother-bot@users.noreply.github.com"
          git add "$brick"
          git diff --cached --check
          git commit -m "Build Brick Mother V2 composite material DNA alpha 1"
          git push origin "HEAD:$BRANCH"
          git rev-parse HEAD | tee /tmp/source-commit.txt

      - name: Upload source finalization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-mother-v2-alpha1-source-finalize
          path: |
            /tmp/reassembly.json
            /tmp/geometry-qa.json
            /tmp/source-commit.txt
          if-no-files-found: ignore
