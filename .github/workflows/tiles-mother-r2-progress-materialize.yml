name: Tiles Mother R2 Progress Materialize

on:
  push:
    branches:
      - feature/tiles-mother-v0.1-workbench
    paths:
      - .github/workflows/tiles-mother-r2-progress-materialize.yml
      - tiles-mother/r2-progress-01/source_payload.xz

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Materialize exact standalone HTML
        shell: bash
        run: |
          set -euo pipefail
          payload="tiles-mother/r2-progress-01/source_payload.xz"
          output="tiles-mother/r2-progress-01/START_HERE.html"
          if [ ! -f "$payload" ]; then
            echo "Payload already consumed; nothing to do."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, lzma
          payload = Path('tiles-mother/r2-progress-01/source_payload.xz')
          output = Path('tiles-mother/r2-progress-01/START_HERE.html')
          data = lzma.decompress(payload.read_bytes())
          expected = '2f1e782f0b4fdf7579267e8e7e571cbbe4bb4a706a3327e19cea182995b7b884'
          actual = hashlib.sha256(data).hexdigest()
          assert actual == expected, (actual, expected)
          assert len(data) == 55293, len(data)
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_bytes(data)
          PY
          rm "$payload"
          echo "2f1e782f0b4fdf7579267e8e7e571cbbe4bb4a706a3327e19cea182995b7b884  $output" | sha256sum -c -

      - name: Commit immutable progress preview
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tiles-mother/r2-progress-01; then
            echo "No materialization diff."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tiles-mother/r2-progress-01
          git commit -m "release(tiles): materialize R2 progress preview 01 [skip ci]"
          git push
