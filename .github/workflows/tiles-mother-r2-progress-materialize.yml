name: Tiles Mother R2 Progress Materialize

on:
  push:
    branches:
      - feature/tiles-mother-v0.1-workbench
    paths:
      - .github/workflows/tiles-mother-r2-progress-materialize.yml
      - tiles-mother/r2-progress-01/transport/**

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Reassemble and verify exact standalone HTML
        shell: bash
        run: |
          set -euo pipefail
          root="tiles-mother/r2-progress-01"
          output="$root/START_HERE.html"
          test -f "$root/transport/part00.b64"
          cat "$root"/transport/part*.b64 | base64 --decode > "$root/payload.xz"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, lzma
          root = Path('tiles-mother/r2-progress-01')
          data = lzma.decompress((root / 'payload.xz').read_bytes())
          expected = '2f1e782f0b4fdf7579267e8e7e571cbbe4bb4a706a3327e19cea182995b7b884'
          actual = hashlib.sha256(data).hexdigest()
          assert actual == expected, (actual, expected)
          assert len(data) == 55293, len(data)
          (root / 'START_HERE.html').write_bytes(data)
          PY
          rm -f "$root/payload.xz" "$root/source_payload.xz"
          rm -rf "$root/transport"
          echo "2f1e782f0b4fdf7579267e8e7e571cbbe4bb4a706a3327e19cea182995b7b884  $output" | sha256sum -c -

      - name: Commit immutable progress preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tiles-mother/r2-progress-01
          git commit -m "release(tiles): materialize R2 progress preview 01 [skip ci]"
          git push
