name: Tiles Mother V0.9.9 Public Preview Readback
on:
  push:
    branches: [feature/tiles-mother-v0.1-workbench]
    paths: ['.github/workflows/tiles-mother-v099-preview.yml']
permissions:
  contents: write
jobs:
  public-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PREVIEW_SOURCE_SHA: e554cbf7411fad3e9fa41c3d09ff4b23f3f2e5e5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install playwright==1.57.0
          playwright install --with-deps chromium
      - name: Public HTTP bytes, real WebGL, buttons, mouse and mobile readback
        run: python tiles-mother/v099/qa/public_preview.py
      - name: Record verified preview evidence without deploying Pages
        run: |
          test "${GITHUB_REF_NAME}" = "feature/tiles-mother-v0.1-workbench"
          git fetch origin "${GITHUB_REF_NAME}"
          test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f tiles-mother/v099/qa/public
          git commit -m 'test(tiles-mother): verify immutable public V0.9.9 preview'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tiles_Mother_V099_Public_Readback
          path: tiles-mother/v099/qa/public
          retention-days: 30
