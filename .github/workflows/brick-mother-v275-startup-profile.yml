name: Brick Mother V2.7.5 Frozen Core Startup Audit

on:
  push:
    branches:
      - feature/brick-mother-v2.0-composite-material-dna
    paths:
      - ".github/workflows/brick-mother-v275-startup-profile.yml"
      - "tools/brick-mother/profile_v275_startup.py"
      - "yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/index.html"
      - "yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/BASELINE_REGISTRY_V2.json"
  workflow_dispatch:

permissions:
  contents: read

env:
  BRICK_ROOT: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother
  PRESERVED_CORE_BLOB: 7b10389cb9367f7423619262820883cc94b07a61

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Verify frozen default entry contract
        shell: bash
        run: |
          set -euo pipefail
          test -s "$BRICK_ROOT/index.html"
          test -s "$BRICK_ROOT/BASELINE_REGISTRY_V2.json"
          test -s "$BRICK_ROOT/brick-mother-standalone-v2.7.5.html"
          test "$(git hash-object "$BRICK_ROOT/brick-mother-standalone-v2.7.5.html")" = "$PRESERVED_CORE_BLOB"
          grep -q "brick-mother-standalone-v2.7.5.html" "$BRICK_ROOT/index.html"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['BRICK_ROOT'])
          data=json.loads((root/'BASELINE_REGISTRY_V2.json').read_text())
          assert data['defaultTarget']=='brick-mother-standalone-v2.7.5.html'
          assert data['frozenCore']['gitBlob']==os.environ['PRESERVED_CORE_BLOB']
          assert data['frozenCore']['replaceable'] is False
          assert data['candidatePolicy']['defaultEntryAllowed'] is False
          assert data['deliveryPolicy']['staticImageGeneration'] is False
          assert data['qualityGates']['humanVisualApproved'] is False
          assert data['qualityGates']['productionApproved'] is False
          PY
          python3 -m py_compile tools/brick-mother/profile_v275_startup.py

      - name: Install browser profiler
        run: python3 -m pip install playwright

      - name: Run isolated cold and repeat startup measurements
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/brick-v275-startup-profile
          mkdir -p "$out"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$BRICK_ROOT" > "$out/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8765/brick-mother-standalone-v2.7.5.html >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          python3 tools/brick-mother/profile_v275_startup.py http://127.0.0.1:8765 "$out"

      - name: Upload engineering timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-mother-v275-startup-profile-${{ github.sha }}
          path: /tmp/brick-v275-startup-profile
          compression-level: 1
          if-no-files-found: error
          retention-days: 7
