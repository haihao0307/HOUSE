name: Materialize V5.4.4 Understanding Lab

on:
  push:
    branches:
      - codex/yunnan-understanding-tools-v5.4.4
    paths:
      - 'yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/tools/v544_payload/**'
      - 'yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/tools/materialize_v544.py'
      - '.github/workflows/materialize-v544.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-v544-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore generated files
        working-directory: ${{ env.PROJECT_DIR }}
        run: python tools/materialize_v544.py

      - name: Validate generated files
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python -m json.tool data/production/yunnan_wall_roof_entry_tool_contract_v5_4_4.json >/dev/null
          python -m py_compile tools/yunnan_understanding_lab_smoke.py
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('yunnan-architecture-understanding-lab.html').read_text(encoding='utf-8')
          required = [
              '三模型证据对照', '屋顶关系理解', '入户与上楼关系',
              '墙面生成工具原型', '瓦顶生成工具原型',
              'window.__YN_UNDERSTANDING_LAB__'
          ]
          missing = [token for token in required if token not in html]
          if missing:
              raise SystemExit('missing HTML tokens: ' + ', '.join(missing))
          scripts = re.findall(r'<script(?:[^>]*)>([\s\S]*?)</script>', html)
          if not scripts:
              raise SystemExit('inline application script missing')
          Path('/tmp/v544-inline.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/v544-inline.js

      - name: Commit materialized implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            "$PROJECT_DIR/yunnan-architecture-understanding-lab.html" \
            "$PROJECT_DIR/folk-building-production-line.html" \
            "$PROJECT_DIR/data/production/yunnan_wall_roof_entry_tool_contract_v5_4_4.json" \
            "$PROJECT_DIR/tools/yunnan_understanding_lab_smoke.py"
          if git diff --cached --quiet; then
            echo 'Generated files already match the payload.'
            exit 0
          fi
          git commit -m 'Materialize V5.4.4 understanding lab'
          git push origin "HEAD:${GITHUB_REF_NAME}"
