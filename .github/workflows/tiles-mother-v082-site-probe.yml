name: Tiles Mother V082 Site Preservation Probe
on:
  push:
    branches: [feature/tiles-mother-v0.1-workbench]
    paths: [.github/workflows/tiles-mother-v082-site-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const repo = context.repo;
            const pages = (await github.request('GET /repos/{owner}/{repo}/pages', repo)).data;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {...repo, per_page: 100});
            let chosen;
            for (const d of deployments) {
              if (!['github-pages', 'github-pages-preview'].includes(d.environment)) continue;
              const statuses = (await github.rest.repos.listDeploymentStatuses({...repo, deployment_id:d.id, per_page:5})).data;
              if (statuses[0]?.state === 'success') {chosen={id:d.id,sha:d.sha,environment:d.environment,status:statuses[0].state,createdAt:d.created_at};break;}
            }
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo,{...repo,name:'github-pages',per_page:100});
            const matching = artifacts.filter(a=>!a.expired && a.workflow_run?.head_sha===chosen?.sha).map(a=>({id:a.id,name:a.name,size:a.size_in_bytes,run:a.workflow_run.id,sha:a.workflow_run.head_sha}));
            const result={pagesType:pages.build_type,latestSuccessful:chosen||null,matchingArtifacts:matching,siteModified:false,mainModified:false,visualApproved:false,productionApproved:false};
            console.log('TILES_V082_PROBE '+JSON.stringify(result));
            fs.writeFileSync('tiles-v082-site-probe.json',JSON.stringify(result,null,2));
      - uses: actions/upload-artifact@v4
        with:
          name: tiles-v082-site-probe
          path: tiles-v082-site-probe.json
          retention-days: 7
