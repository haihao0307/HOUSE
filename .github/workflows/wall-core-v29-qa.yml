name: Validate Yunnan Wall Core V2.9

on:
  push:
    branches:
      - feature/yunnan-component-studio-v1
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_DIR: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local

jobs:
  wall-core-v29:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static files
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f component-studio/wall-core-lab.html
          test -f component-studio/assets/wall-core-v29.css
          test -f component-studio/assets/wall-core-v29.js
          test -f component-studio/data/wall-core-contract-v1.json
          test -f component-studio/data/evidence/wall-core-width-taper-door-closure-user-observation-2026-08-27.json
          node --check component-studio/assets/wall-core-v29.js
          python3 -m json.tool component-studio/data/wall-core-contract-v1.json >/dev/null
          python3 -m json.tool component-studio/data/evidence/wall-core-width-taper-door-closure-user-observation-2026-08-27.json >/dev/null
          python3 -m py_compile tools/wall_core_v29_browser_smoke.py
          grep -Fq '墙心总宽 m' component-studio/assets/wall-core-v29.js
          grep -Fq '墙体侧向收分 m' component-studio/assets/wall-core-v29.js
          grep -Fq '墙心包框咬合 m' component-studio/assets/wall-core-v29.js
          grep -Fq '深褐土体浓度' component-studio/assets/wall-core-v29.js

      - name: Install browser QA dependencies
        run: python3 -m pip install --disable-pip-version-check playwright==1.57.0 pillow==11.3.0

      - name: Run wall core browser QA
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tools/wall_core_v29_browser_smoke.py

      - name: Upload wall core evidence
        uses: actions/upload-artifact@v4
        with:
          name: wall-core-v29-browser-evidence
          path: |
            ${{ env.PROJECT_DIR }}/qa/screenshots/wall_core_v29_browser.png
            ${{ env.PROJECT_DIR }}/data/qa/wall_core_v29_browser.json
          if-no-files-found: error
