name: Brick Mother Studio V1.4 Archived Audit

# V1.4 remains available for regression analysis only. It is rejected as a
# visual candidate and must not publish or replace the V2.7.5 canonical entry.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BRICK_ROOT: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother
  PRESERVED_CORE_BLOB: 7b10389cb9367f7423619262820883cc94b07a61

jobs:
  archived-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Verify archive identity and canonical core protection
        shell: bash
        run: |
          set -euo pipefail
          test -s "$BRICK_ROOT/studio-v1.4.html"
          test -s "$BRICK_ROOT/STUDIO_BUILD.json"
          test -s "$BRICK_ROOT/BASELINE_REGISTRY_V1.json"
          test "$(git hash-object "$BRICK_ROOT/brick-mother-standalone-v2.7.5.html")" = "$PRESERVED_CORE_BLOB"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['BRICK_ROOT'])
          build=json.loads((root/'STUDIO_BUILD.json').read_text())
          registry=json.loads((root/'BASELINE_REGISTRY_V1.json').read_text())
          assert build['runtimeVersion']=='1.4.0-alpha.2'
          assert build['humanVisualApproved'] is False
          assert build['productionApproved'] is False
          item=next(x for x in registry['experimentalCandidates'] if x['file']=='studio-v1.4.html')
          assert item['status']=='rejected_for_visual_regression'
          assert item['default'] is False
          assert registry['canonicalEntry']['gitBlob']==os.environ['PRESERVED_CORE_BLOB']
          PY
