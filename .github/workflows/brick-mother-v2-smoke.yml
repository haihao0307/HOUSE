name: Brick Mother V2.5 Deep Pore Rich Material Smoke

on:
  push:
    branches:
      - feature/brick-mother-v2.0-composite-material-dna
    paths:
      - "yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/**"
      - ".github/workflows/brick-mother-v2-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate V2.5 source and standalone contracts
        shell: bash
        run: |
          set -euo pipefail
          brick="yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother"
          node --check "$brick/brick-mother-gaea-kernel-v1.js"
          node --check "$brick/brick-mother-geometry-v2.js"
          node --check "$brick/brick-mother-renderer-v2.js"
          node --check "$brick/brick-mother-app-v2.js"
          python3 -m json.tool "$brick/data/brick-material-profiles-v2.json" >/dev/null
          python3 -m json.tool "$brick/qa/gaea-distillation-contract-v1.json" >/dev/null
          python3 -m json.tool "$brick/VERSION.json" >/dev/null
          grep -q '"version": "2.5.0-alpha.1"' "$brick/VERSION.json"
          grep -q '"clusteredPoreAnchors": true' "$brick/VERSION.json"
          grep -q '"collapsedPoreMouths": true' "$brick/VERSION.json"
          grep -q '"brokenPoreRims": true' "$brick/VERSION.json"
          grep -q 'poreRimChips' "$brick/brick-mother-geometry-v2.js"
          grep -q 'collapsedPores' "$brick/brick-mother-geometry-v2.js"
          grep -q 'uPoreDensity' "$brick/brick-mother-renderer-v2.js"
          grep -q 'uPoreVariety' "$brick/brick-mother-renderer-v2.js"
          grep -q 'firedRed' "$brick/brick-mother-renderer-v2.js"
          grep -q 'clayRed' "$brick/brick-mother-renderer-v2.js"
          grep -q 'slateBlue' "$brick/brick-mother-renderer-v2.js"
          standalone="$brick/brick-mother-standalone-v2.5.html"
          test -s "$standalone"
          test "$(wc -c < "$standalone")" -gt 150000
          ! grep -q '<script src=' "$standalone"
          ! grep -q '<link rel="stylesheet"' "$standalone"
          grep -q 'window.__BRICK_MOTHER_INLINE_DATA__' "$standalone"
          grep -q 'DOMContentLoaded' "$standalone"
          sha256sum "$standalone" > /tmp/brick-mother-v25-standalone.sha256

      - name: Gate standalone directly from file URL
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          uri="$(python3 - <<'PY'
          from pathlib import Path
          print(Path('yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/brick-mother-standalone-v2.5.html').resolve().as_uri())
          PY
          )"
          timeout 300s "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-background-networking \
            --allow-file-access-from-files \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --enable-unsafe-swiftshader \
            --use-gl=angle \
            --use-angle=swiftshader \
            --virtual-time-budget=140000 \
            --dump-dom \
            "${uri}?evidence=1&solo=1&profile=old-pbr-fired&focus=2&debug=0&qa=v25-continuous-gate" \
            > /tmp/brick-mother-v25-gate-dom.html \
            2> /tmp/brick-mother-v25-gate-chrome.log
          grep -q 'data-brick-mother-ready="true"' /tmp/brick-mother-v25-gate-dom.html
          grep -q 'data-brick-mother-version="2.5.0-alpha.1"' /tmp/brick-mother-v25-gate-dom.html
          grep -q 'data-solo-mode="true"' /tmp/brick-mother-v25-gate-dom.html
          grep -Eq 'data-deep-pores="[1-9][0-9]*"' /tmp/brick-mother-v25-gate-dom.html
          grep -Eq 'data-pore-rim-chips="[1-9][0-9]*"' /tmp/brick-mother-v25-gate-dom.html
          grep -q 'data-collapsed-pores=' /tmp/brick-mother-v25-gate-dom.html
          grep -q 'data-evidence-ready="true"' /tmp/brick-mother-v25-gate-dom.html

      - name: Upload standalone gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-mother-v25-standalone-gate
          path: |
            /tmp/brick-mother-v25-gate-dom.html
            /tmp/brick-mother-v25-gate-chrome.log
            /tmp/brick-mother-v25-standalone.sha256
            yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/brick-mother-standalone-v2.5.html
            yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/VERSION.json
          compression-level: 1
          if-no-files-found: ignore

  material-evidence:
    needs: standalone-gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: old-pbr-fired
            label: fired
          - profile: stone-block
            label: stone
          - profile: raw-clay
            label: adobe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capture solo material closeup
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          uri="$(python3 - <<'PY'
          from pathlib import Path
          print(Path('yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/brick-mother-standalone-v2.5.html').resolve().as_uri())
          PY
          )"
          timeout 420s "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-background-networking \
            --allow-file-access-from-files \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --enable-unsafe-swiftshader \
            --use-gl=angle \
            --use-angle=swiftshader \
            --hide-scrollbars \
            --window-size=1600,1000 \
            --virtual-time-budget=140000 \
            --screenshot="/tmp/brick-mother-v25-${{ matrix.label }}.png" \
            "${uri}?evidence=1&solo=1&profile=${{ matrix.profile }}&focus=2&debug=0&qa=${{ matrix.label }}" \
            > "/tmp/brick-mother-v25-${{ matrix.label }}.log" 2>&1
          test -s "/tmp/brick-mother-v25-${{ matrix.label }}.png"
          python3 - <<'PY'
          from pathlib import Path
          import os
          label = os.environ['MATRIX_LABEL']
          path = Path('/tmp') / f'brick-mother-v25-{label}.png'
          data = path.read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          assert len(data) > 100000, (path.name, len(data))
          PY
        env:
          MATRIX_LABEL: ${{ matrix.label }}

      - name: Upload material evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-mother-v25-${{ matrix.label }}-evidence
          path: |
            /tmp/brick-mother-v25-${{ matrix.label }}.png
            /tmp/brick-mother-v25-${{ matrix.label }}.log
          compression-level: 1
          if-no-files-found: ignore
