name: Restore Authentic Brick Mother V2.7.5

on:
  push:
    branches:
      - feature/brick-mother-v2.0-composite-material-dna
    paths:
      - .github/workflows/brick-mother-restore-authentic-v275.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  TARGET_BRANCH: feature/brick-mother-v2.0-composite-material-dna
  AUTHENTIC_HANDOFF_HEAD: 8184e95a89279f546d2c02135b13e139a3c7f988
  AUTHENTIC_RUNTIME_HEAD: b25508b8b57d45f9333286ab7b883644181039e7
  BRICK_ROOT: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother
  OBSERVATION_BLOB: 7b2a18c6a886d0751ca2fc92530b7986d9e1a727
  STANDALONE_BLOB: 7b10389cb9367f7423619262820883cc94b07a61
  SOURCE_INDEX_BLOB: 83ea467bd074a9de1d83f34c60c7f4fec835c866
  PACKAGE_SHA256: 1d7ed164cf9c2ae4ce8dfc23c848f16b822da3f38adc168c83a4da4084d1782e

concurrency:
  group: brick-mother-authentic-v275-recovery
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      restored_head: ${{ steps.identity.outputs.restored_head }}
    steps:
      - name: Checkout current feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - name: Replace the entire Brick Mother scope with the authentic handoff tree
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$AUTHENTIC_HANDOFF_HEAD^{commit}"

          scope='^(yunnan-courtyard-architecture-factory-v5\.2\.1-full-local/yunnan-courtyard-architecture-factory-v5\.2\.1-full-local/brick-mother/|data/brick-mother/|docs/brick-mother/|private-review/brick-mother|tools/brick-mother/|\.github/workflows/brick-mother-)'

          git ls-files | grep -E "$scope" > /tmp/current-brick-scope.txt || true
          while IFS= read -r path; do
            [ -n "$path" ] && git rm -f --ignore-unmatch -- "$path"
          done < /tmp/current-brick-scope.txt

          git ls-tree -r --name-only "$AUTHENTIC_HANDOFF_HEAD" | grep -E "$scope" > /tmp/authentic-brick-scope.txt || true
          while IFS= read -r path; do
            [ -n "$path" ] && git checkout "$AUTHENTIC_HANDOFF_HEAD" -- "$path"
          done < /tmp/authentic-brick-scope.txt

          remaining="$(git diff --name-only "$AUTHENTIC_HANDOFF_HEAD" -- | grep -E "$scope" || true)"
          if [ -n "$remaining" ]; then
            printf 'Brick Mother scope still differs from authentic handoff:\n%s\n' "$remaining" >&2
            exit 1
          fi

          test "$(git hash-object "$BRICK_ROOT/brick-mother-observation-studio.html")" = "$OBSERVATION_BLOB"
          test "$(git hash-object "$BRICK_ROOT/brick-mother-standalone-v2.7.5.html")" = "$STANDALONE_BLOB"
          test "$(git hash-object "$BRICK_ROOT/index.html")" = "$SOURCE_INDEX_BLOB"
          grep -q 'Brick Mother V2.7.5 三维材质观察台' "$BRICK_ROOT/brick-mother-observation-studio.html"
          grep -q '2.7.5-alpha.1' "$BRICK_ROOT/VERSION.json"

      - name: Commit the clean rollback normally
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Brick Mother Recovery'
          git config user.email 'actions@users.noreply.github.com'
          git status --short
          git commit -m 'revert(brick): return all Brick Mother files to authentic V2.7.5 handoff'

          for attempt in 1 2 3 4; do
            git fetch origin "$TARGET_BRANCH"
            if git rebase "origin/$TARGET_BRANCH"; then
              if git push origin "HEAD:$TARGET_BRANCH"; then
                break
              fi
            else
              git rebase --abort || true
            fi
            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            sleep $((attempt * 3))
          done

          restored_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$restored_head" = "$remote_head"
          echo "restored_head=$restored_head" >> "$GITHUB_OUTPUT"

          scope='^(yunnan-courtyard-architecture-factory-v5\.2\.1-full-local/yunnan-courtyard-architecture-factory-v5\.2\.1-full-local/brick-mother/|data/brick-mother/|docs/brick-mother/|private-review/brick-mother|tools/brick-mother/|\.github/workflows/brick-mother-)'
          remaining="$(git diff --name-only "$AUTHENTIC_HANDOFF_HEAD" HEAD | grep -E "$scope" || true)"
          test -z "$remaining"

      - name: Assemble a clean public site from only the authentic V2.7.5 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/brick-mother
          cp -R "$BRICK_ROOT"/. _site/brick-mother/

          # The direct public root opens the authentic three-column observation studio.
          cp "$BRICK_ROOT/brick-mother-observation-studio.html" _site/brick-mother/index.html
          touch _site/.nojekyll

          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root=Path('_site/brick-mother')
          def blob(path):
              data=path.read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()

          assert blob(root/'index.html') == os.environ['OBSERVATION_BLOB']
          assert blob(root/'brick-mother-observation-studio.html') == os.environ['OBSERVATION_BLOB']
          assert blob(root/'brick-mother-standalone-v2.7.5.html') == os.environ['STANDALONE_BLOB']

          receipt={
              'identity':'authentic Brick Mother V2.7.5 handoff restoration',
              'handoffHead':os.environ['AUTHENTIC_HANDOFF_HEAD'],
              'runtimeHead':os.environ['AUTHENTIC_RUNTIME_HEAD'],
              'restoredBranchHead':os.environ.get('GITHUB_SHA'),
              'packageSha256':os.environ['PACKAGE_SHA256'],
              'publicDefault':'brick-mother-observation-studio.html',
              'observationStudioBlob':os.environ['OBSERVATION_BLOB'],
              'standaloneBlob':os.environ['STANDALONE_BLOB'],
              'laterPbrStudiosPresent':False,
              'laterStoneMasonryStudiosPresent':False,
              'humanVisualApproved':False,
              'productionApproved':False
          }
          (root/'AUTHENTIC_V275_RESTORATION.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY

          for removed in \
            studio.html \
            studio-v1.4.html \
            workbench.html \
            brick-mother-stone-masonry-v2.8.0-alpha.html \
            brick-mother-realtime-weathering-pbr-v1.0.0.html \
            brick-mother-realtime-weathering-pbr-v1.1.0.html; do
            test ! -e "_site/brick-mother/$removed"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload authentic Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: restore
    runs-on: ubuntu-latest
    environment:
      name: brick-mother-online
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy authentic V2.7.5
        id: deployment
        uses: actions/deploy-pages@v4

  verify-public:
    needs: [restore, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify exact public identity and removal of later studios
        shell: bash
        env:
          BASE: https://haihao0307.github.io/HOUSE/brick-mother
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS "$BASE/AUTHENTIC_V275_RESTORATION.json?restore=${{ needs.restore.outputs.restored_head }}" -o /tmp/identity.json \
              && grep -q "$AUTHENTIC_HANDOFF_HEAD" /tmp/identity.json \
              && curl -fsS "$BASE/?restore=${{ needs.restore.outputs.restored_head }}" -o /tmp/root.html \
              && grep -q 'Brick Mother V2.7.5 三维材质观察台' /tmp/root.html \
              && curl -fsS "$BASE/brick-mother-observation-studio.html?restore=${{ needs.restore.outputs.restored_head }}" -o /tmp/observation.html \
              && curl -fsS "$BASE/brick-mother-standalone-v2.7.5.html?restore=${{ needs.restore.outputs.restored_head }}" -o /tmp/standalone.html; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = 1

          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          def blob(path):
              data=Path(path).read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          identity=json.loads(Path('/tmp/identity.json').read_text())
          assert identity['handoffHead']==os.environ['AUTHENTIC_HANDOFF_HEAD']
          assert identity['runtimeHead']==os.environ['AUTHENTIC_RUNTIME_HEAD']
          assert identity['packageSha256']==os.environ['PACKAGE_SHA256']
          assert blob('/tmp/root.html')==os.environ['OBSERVATION_BLOB']
          assert blob('/tmp/observation.html')==os.environ['OBSERVATION_BLOB']
          assert blob('/tmp/standalone.html')==os.environ['STANDALONE_BLOB']
          PY

          for removed in studio-v1.4.html workbench.html brick-mother-stone-masonry-v2.8.0-alpha.html; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/$removed?restore=${{ needs.restore.outputs.restored_head }}")"
            test "$status" = 404
          done

      - name: Open the authentic observation studio in Chromium
        shell: bash
        env:
          BASE: https://haihao0307.github.io/HOUSE/brick-mother
        run: |
          set -euo pipefail
          python3 -m pip install playwright
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          url=os.environ['BASE']+'/?restore='+os.environ['GITHUB_RUN_ID']
          with sync_playwright() as pw:
              executable=shutil.which('google-chrome') or shutil.which('google-chrome-stable') or shutil.which('chromium')
              browser=pw.chromium.launch(executable_path=executable,headless=True,args=['--no-sandbox','--disable-dev-shm-usage','--enable-unsafe-swiftshader','--use-gl=angle','--use-angle=swiftshader'])
              page=browser.new_page(viewport={'width':1440,'height':1000},device_scale_factor=1)
              errors=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              response=page.goto(url,wait_until='domcontentloaded',timeout=90000)
              assert response and response.status==200
              assert page.get_attribute('html','data-layout-version')=='brick-observation-v1'
              page.wait_for_function("document.documentElement.dataset.brickMotherReady==='true' || document.body.classList.contains('runtime-failed')",timeout=180000)
              assert not page.evaluate("document.body.classList.contains('runtime-failed')")
              assert page.evaluate("window.__BRICK_MOTHER_QA__.version")=='2.7.5-alpha.1'
              assert not errors,errors
              proof={
                  'url':page.url,
                  'title':page.title(),
                  'layout':page.get_attribute('html','data-layout-version'),
                  'runtime':page.evaluate("window.__BRICK_MOTHER_QA__.version"),
                  'errors':errors,
                  'humanVisualApproved':False,
                  'productionApproved':False
              }
              Path('/tmp/authentic-v275-public-proof.json').write_text(json.dumps(proof,ensure_ascii=False,indent=2)+'\n')
              browser.close()
          PY

      - name: Upload restoration proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-mother-authentic-v275-restoration-${{ needs.restore.outputs.restored_head }}
          path: |
            /tmp/identity.json
            /tmp/authentic-v275-public-proof.json
          compression-level: 1
          if-no-files-found: warn
          retention-days: 14
