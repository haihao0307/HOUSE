name: Brick Mother Stone Form V3.2 Materialize Review

on:
  push:
    branches:
      - feature/brick-mother-v2.0-composite-material-dna
    paths:
      - ".github/workflows/brick-mother-stone-form-v32-materialize-review.yml"
      - "private-review/brick-mother-stone-form-v31/payload-v32/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  REVIEW_ROOT: private-review/brick-mother-stone-form-v31
  CORE_ROOT: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother

jobs:
  materialize-review:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout exact payload head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize exact V3.2 candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, zlib

          root=Path('private-review/brick-mother-stone-form-v31')
          payload=root/'payload-v32'
          geometry=zlib.decompress(base64.b64decode(''.join((payload/f'geometry.{i}.b64').read_text().strip() for i in (1,2))))
          runtime=zlib.decompress(base64.b64decode(''.join((payload/f'runtime.{i}.b64').read_text().strip() for i in (1,2,3))))
          assert hashlib.sha256(geometry).hexdigest() == 'd69c98560de24c8bc940cb48eeba48c1cac4478d572ad83886acebd0bef7c187'
          assert hashlib.sha256(runtime).hexdigest() == 'eaadd634468043b9f8829de7e543c4d9db6a1d0d819283b567f2b776a94cc113'
          (root/'stone-form-geometry-v31.js').write_bytes(geometry)
          (root/'stone-form-runtime-v31.js').write_bytes(runtime)
          page=root/'brick-mother-stone-form-v3.1.0.html'
          text=page.read_text()
          text=text.replace('V3.1','V3.2').replace('v3.1','v3.2')
          page.write_text(text)
          PY
          node --check "$REVIEW_ROOT/stone-form-geometry-v31.js"
          node --check "$REVIEW_ROOT/stone-form-runtime-v31.js"
          grep -q "3.2.0-alpha.1" "$REVIEW_ROOT/stone-form-runtime-v31.js"
          grep -q "V3.2 HIGH FIDELITY" "$REVIEW_ROOT/brick-mother-stone-form-v3.1.0.html"
          test "$(git hash-object "$CORE_ROOT/brick-mother-standalone-v2.7.5.html")" = "7b10389cb9367f7423619262820883cc94b07a61"

      - name: Capture private V3.2 visual evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stone-form-v32-review
          python3 - <<'PY'
          from pathlib import Path
          root=Path('private-review/brick-mother-stone-form-v31')
          source=root/'brick-mother-stone-form-v3.1.0.html'
          text=source.read_text()
          bootstrap="""<script>
          (()=>{const native=window.requestAnimationFrame.bind(window);window.requestAnimationFrame=callback=>{if(document.documentElement.dataset.visualReady==='true')return native(callback);return setTimeout(()=>callback(performance.now()),16);};})();
          </script>\n"""
          marker='<script src="./stone-form-geometry-v31.js"></script>'
          assert marker in text
          (root/'brick-mother-stone-form-v3.2.0-qa.html').write_text(text.replace(marker,bootstrap+marker,1))
          PY
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$REVIEW_ROOT" >/tmp/stone-form-v32-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8765/brick-mother-stone-form-v3.2.0-qa.html >/dev/null && break
            sleep 1
          done
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          for family in 0 1 2 3; do
            for view in all hero; do
              stem="family-${family}-${view}"
              light=studio
              if [ "$view" = hero ]; then light=raking; fi
              url="http://127.0.0.1:8765/brick-mother-stone-form-v3.2.0-qa.html?family=${family}&view=${view}&light=${light}&qa=private-v32&head=${GITHUB_SHA}"
              timeout 210s "$chrome" \
                --headless=new \
                --no-sandbox \
                --disable-dev-shm-usage \
                --disable-background-networking \
                --enable-webgl \
                --ignore-gpu-blocklist \
                --enable-unsafe-swiftshader \
                --use-gl=angle \
                --use-angle=swiftshader \
                --hide-scrollbars \
                --window-size=1600,1000 \
                --virtual-time-budget=60000 \
                --screenshot="/tmp/stone-form-v32-review/${stem}.png" \
                --dump-dom \
                "$url" \
                > "/tmp/stone-form-v32-review/${stem}.dom.html" \
                2> "/tmp/stone-form-v32-review/${stem}.chrome.log"
              dom="/tmp/stone-form-v32-review/${stem}.dom.html"
              png="/tmp/stone-form-v32-review/${stem}.png"
              grep -q 'data-brick-mother-stone-form-ready="true"' "$dom"
              grep -q 'data-workbench-ready="true"' "$dom"
              grep -q 'data-visual-ready="true"' "$dom"
              grep -q 'data-stone-form-version="3.2.0-alpha.1"' "$dom"
              ! grep -q 'data-runtime-failure="true"' "$dom"
              test -s "$png"
              test "$(wc -c < "$png")" -gt 100000
            done
          done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, struct
          root=Path('/tmp/stone-form-v32-review')
          rows=[]
          for p in sorted(root.glob('*.png')):
              data=p.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n'
              width,height=struct.unpack('>II',data[16:24])
              assert (width,height)==(1600,1000),(p.name,width,height)
              rows.append({'file':p.name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'width':width,'height':height})
          assert len(rows)==8,len(rows)
          manifest={'payloadHead':os.environ['GITHUB_SHA'],'candidate':'3.2.0-alpha.1','screenshots':rows,'privateVisualReview':True,'visualApproved':False,'productionApproved':False}
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY

      - name: Commit exact materialized candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$REVIEW_ROOT/brick-mother-stone-form-v3.2.0-qa.html"
          git config user.name "Brick Mother Automation"
          git config user.email "actions@users.noreply.github.com"
          git add "$REVIEW_ROOT/stone-form-geometry-v31.js" "$REVIEW_ROOT/stone-form-runtime-v31.js" "$REVIEW_ROOT/brick-mother-stone-form-v3.1.0.html"
          if git diff --cached --quiet; then
            echo "candidate already materialized"
          else
            git commit -m "feat(brick): materialize private stone form v3.2 candidate"
            git push origin HEAD:feature/brick-mother-v2.0-composite-material-dna
          fi

      - name: Upload private V3.2 review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-mother-stone-form-v32-review-${{ github.sha }}
          path: |
            /tmp/stone-form-v32-review
            /tmp/stone-form-v32-server.log
          compression-level: 1
          if-no-files-found: error
          retention-days: 7
