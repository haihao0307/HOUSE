name: Brick Mother R5 Candidate Build
on:
  push:
    branches: [feature/brick-mother-v2.0-composite-material-dna]
    paths: [.github/workflows/brick-mother-r5-build.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: brick-mother-r5-candidate-build
  cancel-in-progress: false
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRICK: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother
      BRANCH: feature/brick-mother-v2.0-composite-material-dna
      CHROMIUM_PATH: ''
    steps:
      - uses: actions/checkout@v4
      - name: Protect current public R4 and frozen originals
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$BRANCH"
          test "$(git hash-object "$BRICK/brick-mother-observation-studio.html")" = 7b2a18c6a886d0751ca2fc92530b7986d9e1a727
          test "$(git hash-object "$BRICK/brick-mother-standalone-v2.7.5.html")" = 7b10389cb9367f7423619262820883cc94b07a61
          test "$(git hash-object "$BRICK/brick-mother-standalone-v2.6.html")" = f64c65d87dc418bf1a923a4cf332b449efbe0eb9
          echo "d7ed5db0c389029b359fcb51894f8e3600de4d25670964f284f35f480172cf00  $BRICK/experiments/atelier-r4/web/index.html" | sha256sum -c -
      - name: Materialize exact R5 source and self-contained HTML
        run: python .github/brick-r5/compose.py
      - name: Run numerical and final-mesh tests
        run: |
          set -euo pipefail
          export BRICK_R4_KERNEL="$GITHUB_WORKSPACE/$BRICK/experiments/atelier-r4/web/generated-src/kernel.js"
          node "$BRICK/experiments/atelier-r5/tests/geometry.cjs"
          python -m pip install numpy==2.2.6
          python "$BRICK/experiments/atelier-r5/tests/anchors.py"
      - name: Install test browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Real local HTTP and graphics interaction
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 --directory "$BRICK/experiments/atelier-r5/web" > "$RUNNER_TEMP/r5-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          xvfb-run -a python "$BRICK/experiments/atelier-r5/tests/browser.py" http://127.0.0.1:8765/
      - name: Save review candidate with truthful separate performance status
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          DEST="$BRICK/experiments/atelier-r5"
          python - <<'PY'
          import os,json,pathlib
          root=pathlib.Path(os.environ['BRICK'])/'experiments/atelier-r5'
          browser=json.loads((root/'qa/browser-report.json').read_text())
          release=json.loads((root/'web/RELEASE.json').read_text())
          assert browser['passed'] and not browser['errors']
          assert browser['http']['sha256']==release['htmlSHA256']
          assert browser['sourceHead']==os.environ['GITHUB_SHA']
          assert json.loads((root/'qa/anchor-report.json').read_text())['passed']
          print('Technical candidate checks pass. Performance and human visual approval remain separately reported.')
          PY
          git config user.name 'Brick Mother R5 verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$DEST/src" "$DEST/build.py" "$DEST/tests" "$DEST/web" "$DEST/qa/geometry-report.json" "$DEST/qa/anchor-report.json" "$DEST/qa/browser-report.json"
          git diff --cached --name-only | while IFS= read -r f; do case "$f" in "$DEST"/*) ;; *) exit 1;; esac; done
          git commit -m 'feat(brick): save verified R5 review candidate and preserve R4 [skip ci]'
          git push origin "HEAD:refs/heads/$BRANCH"
          git rev-parse HEAD > "$DEST/qa/materialized-commit.txt"
      - name: Keep full candidate and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-mother-r5-candidate-${{ github.run_id }}
          path: |
            yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/experiments/atelier-r5
            ${{ runner.temp }}/r5-http.log
          retention-days: 30
