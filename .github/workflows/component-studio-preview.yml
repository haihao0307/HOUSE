name: Deploy Yunnan Component Studio Preview

on:
  push:
    branches:
      - feature/yunnan-component-studio-v1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PROJECT_DIR: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate existing production contracts
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tools/validate.py

      - name: Validate component studio V2.2
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          for file in component-studio/assets/studio-*.js; do node --check "$file"; done
          node --check component-studio/assets/wall-lab.js
          node --check component-studio/assets/wall-lab-v21-loader.js
          node --check component-studio/assets/wall-lab-v22-loader.js
          node --check assets/js/reference-viewer-quality.js

          python3 - <<'PY'
          import base64
          import gzip
          import json
          from pathlib import Path

          root = Path('component-studio')
          v21_parts = [root / f'assets/wall-lab-v21.part{index:02d}.b64' for index in range(4)]
          v22_parts = [root / f'assets/wall-lab-v22.part{index:02d}.b64' for index in range(3)]
          required = [
              root / 'index.html',
              root / 'assets/studio.css',
              root / 'assets/studio-core.js',
              root / 'assets/studio-hub.js',
              root / 'assets/studio-module.js',
              root / 'assets/studio-actions.js',
              root / 'data/modules.json',
              root / 'README.md',
              root / 'wall-lab.html',
              root / 'assets/wall-lab.css',
              root / 'assets/wall-lab-v22.css',
              root / 'assets/wall-lab.js',
              root / 'assets/wall-lab-v21-loader.js',
              root / 'assets/wall-lab-v22-loader.js',
              *v21_parts,
              *v22_parts,
              root / 'data/wall-knowledge-v2.json',
              root / 'data/evidence/wulong-wall-user-observation-2026-08-26.json',
              Path('assets/js/reference-viewer-quality.js'),
              Path('reference-model-showcase.html'),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f'missing component studio files: {missing}')

          def reconstruct(parts, target, markers):
              encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in parts)
              source = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
              Path(target).write_text(source, encoding='utf-8')
              for marker in markers:
                  if marker not in source:
                      raise SystemExit(f'missing reconstructed marker {marker} in {target}')

          reconstruct(v21_parts, '/tmp/wall-lab-v21.js', (
              'wulong-stone-adobe-lintel-v2.1',
              'function buildEarthBrickWall',
              'function buildStoneBase',
              "component: 'timber-lintel-board'",
          ))
          reconstruct(v22_parts, '/tmp/wall-lab-v22.js', (
              "const VERSION = '2.2.0'",
              'primary-visual-stage',
              'daylight-closed-stone-adobe-plaster-lintel-multiscale-erosion-v2',
              'function erodedBoxGeometry',
              'function buildDaylightWall',
              'openSurfaceCount: 0',
          ))

          registry = json.loads((root / 'data/modules.json').read_text(encoding='utf-8'))
          ids = [item.get('id') for item in (registry.get('modules') or [])]
          if len(ids) != 8 or len(set(ids)) != 8 or not {'knowledge-blueprint', 'tilework', 'openings', 'walls'} <= set(ids):
              raise SystemExit(f'invalid module registry: {ids}')

          wall_html = (root / 'wall-lab.html').read_text(encoding='utf-8')
          for marker in (
              '云南墙体与墙面工作室 V2.2',
              'wallCanvas',
              'modelFrame',
              'compareGrid',
              'tagCloud',
              'wall-lab-v21-loader.js',
              'wall-lab-v22-loader.js',
              'wall-lab-v22.css',
          ):
              if marker not in wall_html:
                  raise SystemExit(f'missing wall studio marker: {marker}')

          wall = json.loads((root / 'data/wall-knowledge-v2.json').read_text(encoding='utf-8'))
          if wall.get('recordId') != 'YUNNAN-WALL-KNOWLEDGE-V2' or wall.get('schemaVersion') != '2.1.0':
              raise SystemExit('wall knowledge contract mismatch')
          if len(wall.get('referenceModels') or []) != 3:
              raise SystemExit('wall knowledge must preserve all three reference models')
          PY

          node --check /tmp/wall-lab-v21.js
          node --check /tmp/wall-lab-v22.js

      - name: Assemble public site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R "$PROJECT_DIR"/. _site/
          rm -rf _site/references-private _site/release _site/.git _site/.github
          rm -f _site/assets/models/YN_TUANJIE_001_EDITABLE_HIGH.glb
          touch _site/.nojekyll
          printf '{"schemaVersion":"5.5.1","componentStudioVersion":"2.2.0","wallStudioVersion":"2.2.0","referenceViewerQuality":"2.0.0","sha":"%s","ref":"%s","runId":"%s","runAttempt":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > _site/build.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify deployed component studio V2.2
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsSL "${base}build.json" -o "$tmp/build.json" \
              && grep -Fq "$EXPECTED_SHA" "$tmp/build.json"; then
              break
            fi
            sleep 5
          done

          grep -Fq "$EXPECTED_SHA" "$tmp/build.json"
          grep -Fq '"componentStudioVersion":"2.2.0"' "$tmp/build.json"
          grep -Fq '"wallStudioVersion":"2.2.0"' "$tmp/build.json"

          fetch_and_require() {
            local url="$1"
            local target="$2"
            local marker="$3"
            curl -fsSL "$url" -o "$tmp/$target"
            grep -Fq "$marker" "$tmp/$target"
          }

          fetch_and_require "${base}component-studio/" "component-studio.html" "云南建筑组件工作台"
          fetch_and_require "${base}component-studio/wall-lab.html" "wall-lab.html" "云南墙体与墙面工作室 V2.2"
          grep -Fq 'wall-lab-v22-loader.js' "$tmp/wall-lab.html"
          grep -Fq 'wall-lab-v22.css' "$tmp/wall-lab.html"
          fetch_and_require "${base}component-studio/assets/wall-lab-v22-loader.js" "wall-lab-v22-loader.js" "DecompressionStream"
          fetch_and_require "${base}component-studio/assets/wall-lab-v22.css" "wall-lab-v22.css" "primary-visual-stage"
          fetch_and_require "${base}component-studio/data/wall-knowledge-v2.json" "wall-knowledge.json" '"revisionId": "WULONG-STONE-ADOBE-LINTEL-2026-08-26"'
          fetch_and_require "${base}reference-model-showcase.html?mode=wulong" "reference-showcase.html" "云南建筑三模型高清证据查看器"
          fetch_and_require "${base}component-studio/data/modules.json" "modules.json" '"tilework"'
          grep -Fq '"openings"' "$tmp/modules.json"
          grep -Fq '"timber-surface"' "$tmp/modules.json"

          for index in 00 01 02; do
            curl -fsSL "${base}component-studio/assets/wall-lab-v22.part${index}.b64" -o "$tmp/v22-${index}.b64"
            test -s "$tmp/v22-${index}.b64"
          done
          python3 - "$tmp" <<'PY'
          import base64
          import gzip
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          encoded = ''.join((root / f'v22-{index}.b64').read_text(encoding='utf-8').strip() for index in ('00', '01', '02'))
          source = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
          for marker in (
              "const VERSION = '2.2.0'",
              'primary-visual-stage',
              'daylight-closed-stone-adobe-plaster-lintel-multiscale-erosion-v2',
              'openSurfaceCount: 0',
          ):
              if marker not in source:
                  raise SystemExit(f'public reconstructed V2.2 wall program lacks {marker}')
          (root / 'wall-lab-v22.js').write_text(source, encoding='utf-8')
          PY
          node --check "$tmp/wall-lab-v22.js"
