name: Deploy Yunnan Component Studio Preview

on:
  push:
    branches:
      - feature/yunnan-component-studio-v1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PROJECT_DIR: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate existing production contracts
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tools/validate.py

      - name: Validate component studio
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          for file in component-studio/assets/studio-*.js; do node --check "$file"; done
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('component-studio')
          required = [
              root / 'index.html',
              root / 'assets/studio.css',
              root / 'assets/studio-core.js',
              root / 'assets/studio-hub.js',
              root / 'assets/studio-module.js',
              root / 'assets/studio-actions.js',
              root / 'data/modules.json',
              root / 'README.md',
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f'missing component studio files: {missing}')

          registry = json.loads((root / 'data/modules.json').read_text(encoding='utf-8'))
          modules = registry.get('modules') or []
          ids = [item.get('id') for item in modules]
          if len(modules) != 8 or len(set(ids)) != 8 or any(not item for item in ids):
              raise SystemExit(f'invalid module registry: {ids}')
          if 'knowledge-blueprint' not in ids or 'tilework' not in ids or 'openings' not in ids:
              raise SystemExit('required modules are absent')

          html = (root / 'index.html').read_text(encoding='utf-8')
          for marker in ('hubTemplate', 'moduleTemplate', 'dropZone', 'assemblyTableBody'):
              if marker not in html:
                  raise SystemExit(f'missing UI marker: {marker}')
          PY

      - name: Assemble public site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R "$PROJECT_DIR"/. _site/
          rm -rf _site/references-private _site/release _site/.git _site/.github
          rm -f _site/assets/models/YN_TUANJIE_001_EDITABLE_HIGH.glb
          touch _site/.nojekyll
          printf '{"schemaVersion":"5.5.0","componentStudioVersion":"1.0.0","sha":"%s","ref":"%s","runId":"%s","runAttempt":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > _site/build.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify deployed component studio
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          for attempt in $(seq 1 30); do
            build="$(curl -fsSL "${base}build.json" || true)"
            if printf '%s' "$build" | grep -q "$EXPECTED_SHA"; then
              break
            fi
            sleep 5
          done
          printf '%s' "$build" | grep -q "$EXPECTED_SHA"
          curl -fsSL "${base}component-studio/" | grep -q "云南建筑组件工作台"
          registry="$(curl -fsSL "${base}component-studio/data/modules.json")"
          printf '%s' "$registry" | grep -q '"tilework"'
          printf '%s' "$registry" | grep -q '"openings"'
          printf '%s' "$registry" | grep -q '"timber-surface"'
