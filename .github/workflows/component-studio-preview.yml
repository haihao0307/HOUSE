name: Deploy Yunnan Component Studio Preview

on:
  push:
    branches:
      - feature/yunnan-component-studio-v1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PROJECT_DIR: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate existing production contracts
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tools/validate.py

      - name: Validate component studio V2
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          for file in component-studio/assets/studio-*.js; do node --check "$file"; done
          node --check component-studio/assets/wall-lab.js
          node --check assets/js/reference-viewer-quality.js
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('component-studio')
          required = [
              root / 'index.html',
              root / 'assets/studio.css',
              root / 'assets/studio-core.js',
              root / 'assets/studio-hub.js',
              root / 'assets/studio-module.js',
              root / 'assets/studio-actions.js',
              root / 'data/modules.json',
              root / 'README.md',
              root / 'wall-lab.html',
              root / 'assets/wall-lab.css',
              root / 'assets/wall-lab.js',
              root / 'data/wall-knowledge-v2.json',
              Path('assets/js/reference-viewer-quality.js'),
              Path('reference-model-showcase.html'),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f'missing component studio files: {missing}')

          registry = json.loads((root / 'data/modules.json').read_text(encoding='utf-8'))
          modules = registry.get('modules') or []
          ids = [item.get('id') for item in modules]
          if len(modules) != 8 or len(set(ids)) != 8 or any(not item for item in ids):
              raise SystemExit(f'invalid module registry: {ids}')
          if 'knowledge-blueprint' not in ids or 'tilework' not in ids or 'openings' not in ids or 'walls' not in ids:
              raise SystemExit('required modules are absent')

          html = (root / 'index.html').read_text(encoding='utf-8')
          for marker in ('hubTemplate', 'moduleTemplate', 'dropZone', 'assemblyTableBody'):
              if marker not in html:
                  raise SystemExit(f'missing UI marker: {marker}')

          wall_html = (root / 'wall-lab.html').read_text(encoding='utf-8')
          for marker in ('云南墙体与墙面工作室', 'wallCanvas', 'modelFrame', 'compareGrid', 'tagCloud'):
              if marker not in wall_html:
                  raise SystemExit(f'missing wall studio marker: {marker}')

          wall = json.loads((root / 'data/wall-knowledge-v2.json').read_text(encoding='utf-8'))
          if wall.get('recordId') != 'YUNNAN-WALL-KNOWLEDGE-V2':
              raise SystemExit('wall knowledge record id mismatch')
          if len(wall.get('referenceModels') or []) != 3:
              raise SystemExit('wall knowledge must preserve all three reference models')
          if not {'daliMaintained', 'wulongWeathered', 'tuanjieReference', 'museum1940sBalanced'} <= set(wall.get('presets') or {}):
              raise SystemExit('wall presets are incomplete')

          showcase = Path('reference-model-showcase.html').read_text(encoding='utf-8')
          for marker in ('云南建筑三模型高清证据查看器', 'reference-viewer-quality.js', "get('mode')", 'qualityProfile'):
              if marker not in showcase:
                  raise SystemExit(f'missing high quality showcase marker: {marker}')
          PY

      - name: Assemble public site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R "$PROJECT_DIR"/. _site/
          rm -rf _site/references-private _site/release _site/.git _site/.github
          rm -f _site/assets/models/YN_TUANJIE_001_EDITABLE_HIGH.glb
          touch _site/.nojekyll
          printf '{"schemaVersion":"5.5.1","componentStudioVersion":"2.0.0","wallStudioVersion":"2.0.0","referenceViewerQuality":"2.0.0","sha":"%s","ref":"%s","runId":"%s","runAttempt":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > _site/build.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify deployed component studio V2
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsSL "${base}build.json" -o "$tmp/build.json" \
              && grep -Fq "$EXPECTED_SHA" "$tmp/build.json"; then
              break
            fi
            sleep 5
          done

          grep -Fq "$EXPECTED_SHA" "$tmp/build.json"
          grep -Fq '"componentStudioVersion":"2.0.0"' "$tmp/build.json"

          fetch_and_require() {
            local url="$1"
            local target="$2"
            local marker="$3"
            curl -fsSL "$url" -o "$tmp/$target"
            grep -Fq "$marker" "$tmp/$target"
          }

          fetch_and_require "${base}component-studio/" "component-studio.html" "云南建筑组件工作台"
          fetch_and_require "${base}component-studio/wall-lab.html" "wall-lab.html" "云南墙体与墙面工作室"
          fetch_and_require "${base}component-studio/data/wall-knowledge-v2.json" "wall-knowledge.json" '"recordId": "YUNNAN-WALL-KNOWLEDGE-V2"'
          fetch_and_require "${base}reference-model-showcase.html?mode=wulong" "reference-showcase.html" "云南建筑三模型高清证据查看器"
          fetch_and_require "${base}assets/js/reference-viewer-quality.js" "reference-viewer-quality.js" "srgb-linear-lighting-five-tap-detail-recovery-v2"
          fetch_and_require "${base}component-studio/data/modules.json" "modules.json" '"tilework"'
          grep -Fq '"openings"' "$tmp/modules.json"
          grep -Fq '"timber-surface"' "$tmp/modules.json"
