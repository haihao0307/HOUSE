name: Deploy Yunnan Component Studio Preview

on:
  push:
    branches:
      - feature/yunnan-component-studio-v1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PROJECT_DIR: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate existing production contracts
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tools/validate.py

      - name: Validate component studio V2.5.0
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          for file in component-studio/assets/studio-*.js; do node --check "$file"; done
          node --check component-studio/assets/wall-lab-v24.js
          node --check component-studio/assets/wall-lab-v24-library.js
          node --check component-studio/assets/wall-lab-v25-github.js
          node --check assets/js/reference-viewer-quality.js

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('component-studio')
          required = [
              root / 'index.html',
              root / 'assets/studio.css',
              root / 'assets/studio-core.js',
              root / 'assets/studio-hub.js',
              root / 'assets/studio-module.js',
              root / 'assets/studio-actions.js',
              root / 'data/modules.json',
              root / 'README.md',
              root / 'wall-lab.html',
              root / 'wall-lab-v24.html',
              root / 'assets/wall-lab-v24.css',
              root / 'assets/wall-lab-v25.css',
              root / 'assets/wall-lab-v24.js',
              root / 'assets/wall-lab-v24-library.js',
              root / 'assets/wall-lab-v25-github.js',
              root / 'data/wall-knowledge-v2.json',
              root / 'data/evidence/wulong-wall-user-observation-2026-08-26.json',
              Path('tools/wall_v24_browser_smoke.py'),
              Path('vendor/three/three.module.js'),
              Path('vendor/three/controls/OrbitControls.js'),
              Path('reference-model-showcase.html'),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f'missing component studio V2.5.0 files: {missing}')

          entry = (root / 'wall-lab.html').read_text(encoding='utf-8')
          if 'wall-lab-v24.html' not in entry:
              raise SystemExit('wall-lab entry does not route to the active wall workbench')

          page = (root / 'wall-lab-v24.html').read_text(encoding='utf-8')
          for marker in (
              '云南墙体与墙面工作室 V2.5.0',
              '柏林噪波 + Simplex + Worley',
              '程序化实验墙主画面',
              '参考资料窗口',
              'GitHub 临时资料桥',
              'githubBridge',
              'githubToken',
              'githubPushButton',
              'githubCleanupButton',
              'wall-lab-v25.css',
              'wall-lab-v25-github.js',
          ):
              if marker not in page:
                  raise SystemExit(f'missing wall V2.5.0 page marker: {marker}')

          runtime = (root / 'assets/wall-lab-v24.js').read_text(encoding='utf-8')
          for marker in (
              'class Perlin3',
              'class Simplex2',
              'function worley2',
              'function warpField',
              'function extrudedBlock',
              "version:'2.4.0'",
              "openSurfaceCount:0",
          ):
              if marker not in runtime:
                  raise SystemExit(f'missing wall V2.4 runtime marker: {marker}')

          library = (root / 'assets/wall-lab-v24-library.js').read_text(encoding='utf-8')
          for marker in (
              "const DB_NAME = 'YunnanComponentStudio'",
              "const CHANNEL_NAME = 'yunnan-component-studio:v1'",
              'reference-card',
              'extractEmbeddedJpeg',
              "version: '2.4.1'",
              '__YUNNAN_WALL_LIBRARY_V24__',
          ):
              if marker not in library:
                  raise SystemExit(f'missing wall reference library marker: {marker}')

          bridge = (root / 'assets/wall-lab-v25-github.js').read_text(encoding='utf-8')
          for marker in (
              "const DEFAULT_BRANCH = 'wall-evidence-inbox'",
              'temporary-branch-exif-stripped-proxies',
              'function createProxy',
              'function uploadBatch',
              '/git/blobs',
              '/git/trees',
              '/git/commits',
              "version: '2.5.0'",
              '__YUNNAN_WALL_GITHUB_BRIDGE__',
              'githubMock',
          ):
              if marker not in bridge:
                  raise SystemExit(f'missing GitHub evidence bridge marker: {marker}')

          registry = json.loads((root / 'data/modules.json').read_text(encoding='utf-8'))
          ids = [item.get('id') for item in (registry.get('modules') or [])]
          if len(ids) != 8 or len(set(ids)) != 8 or not {'knowledge-blueprint', 'tilework', 'openings', 'walls'} <= set(ids):
              raise SystemExit(f'invalid module registry: {ids}')

          wall = json.loads((root / 'data/wall-knowledge-v2.json').read_text(encoding='utf-8'))
          if wall.get('recordId') != 'YUNNAN-WALL-KNOWLEDGE-V2':
              raise SystemExit('wall knowledge contract mismatch')
          if len(wall.get('referenceModels') or []) != 3:
              raise SystemExit('wall knowledge must preserve all three reference models')
          PY

      - name: Install wall browser QA dependencies
        run: python3 -m pip install --disable-pip-version-check playwright==1.57.0 pillow==11.3.0

      - name: Run wall studio V2.5.0 browser QA
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tools/wall_v24_browser_smoke.py

      - name: Upload wall studio browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: wall-studio-v25-browser-evidence
          path: |
            ${{ env.PROJECT_DIR }}/qa/screenshots/wall_v24_browser.png
            ${{ env.PROJECT_DIR }}/data/qa/wall_v24_browser.json
          if-no-files-found: error

      - name: Assemble public site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R "$PROJECT_DIR"/. _site/
          rm -rf _site/references-private _site/release _site/.git _site/.github
          rm -f _site/assets/models/YN_TUANJIE_001_EDITABLE_HIGH.glb
          touch _site/.nojekyll
          printf '{"schemaVersion":"5.5.1","componentStudioVersion":"2.5.0","wallStudioVersion":"2.5.0","referenceLibraryVersion":"2.4.1","githubEvidenceBridgeVersion":"2.5.0","referenceViewerQuality":"2.0.0","browserQa":"wall-v25-github-bridge-passed","sha":"%s","ref":"%s","runId":"%s","runAttempt":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > _site/build.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify deployed component studio V2.5.0
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsSL "${base}build.json" -o "$tmp/build.json" \
              && grep -Fq "$EXPECTED_SHA" "$tmp/build.json"; then
              break
            fi
            sleep 5
          done

          grep -Fq "$EXPECTED_SHA" "$tmp/build.json"
          grep -Fq '"componentStudioVersion":"2.5.0"' "$tmp/build.json"
          grep -Fq '"wallStudioVersion":"2.5.0"' "$tmp/build.json"
          grep -Fq '"githubEvidenceBridgeVersion":"2.5.0"' "$tmp/build.json"
          grep -Fq '"browserQa":"wall-v25-github-bridge-passed"' "$tmp/build.json"

          fetch_and_require() {
            local url="$1"
            local target="$2"
            local marker="$3"
            curl -fsSL "$url" -o "$tmp/$target"
            grep -Fq "$marker" "$tmp/$target"
          }

          fetch_and_require "${base}component-studio/" "component-studio.html" "云南建筑组件工作台"
          fetch_and_require "${base}component-studio/wall-lab.html" "wall-entry.html" "wall-lab-v24.html"
          fetch_and_require "${base}component-studio/wall-lab-v24.html" "wall-v25.html" "GitHub 临时资料桥"
          grep -Fq 'githubPushButton' "$tmp/wall-v25.html"
          grep -Fq 'wall-lab-v25-github.js' "$tmp/wall-v25.html"
          fetch_and_require "${base}component-studio/assets/wall-lab-v24.css" "wall-v24.css" ".reference-library"
          fetch_and_require "${base}component-studio/assets/wall-lab-v25.css" "wall-v25.css" ".github-bridge"
          fetch_and_require "${base}component-studio/assets/wall-lab-v24.js" "wall-v24.js" "class Perlin3"
          grep -Fq 'class Simplex2' "$tmp/wall-v24.js"
          grep -Fq 'function worley2' "$tmp/wall-v24.js"
          node --check "$tmp/wall-v24.js"
          fetch_and_require "${base}component-studio/assets/wall-lab-v24-library.js" "wall-v24-library.js" "__YUNNAN_WALL_LIBRARY_V24__"
          node --check "$tmp/wall-v24-library.js"
          fetch_and_require "${base}component-studio/assets/wall-lab-v25-github.js" "wall-v25-github.js" "temporary-branch-exif-stripped-proxies"
          grep -Fq "version: '2.5.0'" "$tmp/wall-v25-github.js"
          grep -Fq '/git/blobs' "$tmp/wall-v25-github.js"
          node --check "$tmp/wall-v25-github.js"
          fetch_and_require "${base}component-studio/data/wall-knowledge-v2.json" "wall-knowledge.json" '"revisionId": "WULONG-STONE-ADOBE-LINTEL-2026-08-26"'
          fetch_and_require "${base}reference-model-showcase.html?mode=wulong" "reference-showcase.html" "云南建筑三模型高清证据查看器"
          fetch_and_require "${base}component-studio/data/modules.json" "modules.json" '"tilework"'
          grep -Fq '"openings"' "$tmp/modules.json"
          grep -Fq '"timber-surface"' "$tmp/modules.json"
