name: Tiles Mother V0.9.10 Performance Without Shape Loss
on:
  push:
    branches: [feature/tiles-mother-v0.1-workbench]
    paths:
      - 'tiles-mother/v0910/transport/**'
      - '.github/workflows/tiles-mother-v0910-performance.yml'
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild candidate with frozen shape, shader and timber blocks
        run: |
          python tiles-mother/v0910/transport/reassemble.py
          python tiles-mother/v0910/tools/build.py
          node --check tiles-mother/v0910/source/app.js
      - name: Same-machine old and new contact solver comparison
        run: node tiles-mother/v0910/qa/node_bench.cjs
      - name: Install pinned actual browser runtime
        run: |
          pip install playwright==1.57.0 pillow
          playwright install --with-deps chromium
      - name: Actual browser pixels, contacts, repeated visits, disposal, idle and motion
        run: python tiles-mother/v0910/qa/browser_compare.py
      - name: Record verified functional candidate on original feature branch only
        run: |
          remote=$(git ls-remote origin refs/heads/feature/tiles-mother-v0.1-workbench | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tiles-mother/v0910
          if ! git diff --cached --quiet; then
            git commit -m 'perf(tiles-mother): materialize V0.9.10 with same-shape browser comparison'
            git push origin HEAD:feature/tiles-mother-v0.1-workbench
          fi
      - name: Preserve all evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tiles_Mother_V0910_Performance
          path: tiles-mother/v0910
          retention-days: 30
