name: Tiles Mother Independent Field Core R1
on:
  push:
    branches: [feature/tiles-mother-v0.1-workbench]
    paths:
      - '.github/workflows/tiles-mother-field-core-r1.yml'
      - 'tiles-mother/field-core-r1/transport/**'
      - 'tiles-mother/field-core-r1/source/**'
      - 'tiles-mother/field-core-r1/qa/file_smoke.py'
permissions:
  contents: write
concurrency:
  group: tiles-field-core-r1
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore independent source and platform only
        run: |
          python tiles-mother/field-core-r1/transport/restore.py
          python tiles-mother/field-core-r1/tools/bootstrap_vendor.py
          python tiles-mother/field-core-r1/tools/build.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('tiles-mother/field-core-r1/START_HERE.html')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='6accf2390798c5b56864abfc5d76762a7e9989c5b67b59f685361b0bfb27378c'
          PY
      - name: Mathematical and independent solid-contact checks
        run: |
          node tiles-mother/field-core-r1/qa/math.cjs
          node tiles-mother/field-core-r1/qa/geometry.cjs
          node tiles-mother/field-core-r1/qa/contact.cjs
      - name: Install browser runtime
        run: |
          pip install playwright==1.57.0
          playwright install --with-deps chromium
      - name: Actual standalone file and mobile smoke checks
        run: python tiles-mother/field-core-r1/qa/file_smoke.py
      - name: Record canonical files on original feature branch only
        run: |
          set -eu
          test '${{ github.ref_name }}' = 'feature/tiles-mother-v0.1-workbench'
          python - <<'PY'
          from pathlib import Path
          import json,os
          r=Path('tiles-mother/field-core-r1')
          test=json.loads((r/'qa/file-smoke/REPORT.json').read_text())
          assert test['passed'] and test['idleFrames']==0
          status=json.loads((r/'FINAL_STATUS.json').read_text())
          status.update({'standaloneFileSmokePassed':True,'fileSmokeRun':int(os.environ['GITHUB_RUN_ID']),'inputCommit':os.environ['GITHUB_SHA']})
          (r/'FINAL_STATUS.json').write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n')
          for i in range(6):
              p=r/f'transport/source{i:02d}.b64'
              if p.exists():p.unlink()
          PY
          git fetch origin 'feature/tiles-mother-v0.1-workbench'
          test "$(git rev-parse FETCH_HEAD)" = '${{ github.sha }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- tiles-mother/field-core-r1
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --name-only | while read -r p; do case "$p" in tiles-mother/field-core-r1/*) ;; *) exit 1;; esac; done
          git commit -m 'feat(tiles-mother): preserve independent Macroscopic-inspired field core with file QA [skip ci]'
          git push origin HEAD:refs/heads/feature/tiles-mother-v0.1-workbench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tiles_Mother_Field_Core_R1
          path: tiles-mother/field-core-r1
          retention-days: 30
