name: V5.5.0 Surface Production QA

on:
  push:
    branches:
      - codex/yunnan-surface-production-v5.5.0
    paths:
      - "yunnan-courtyard-architecture-factory-v5.2.1-full-local/**"
      - ".github/workflows/surface-production-v550.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: surface-production-v550-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local
  QA_OUTPUT_DIR: ${{ github.workspace }}/.qa-output/surface-${{ github.sha }}-attempt-${{ github.run_attempt }}

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize clean evidence directory for this commit
        id: initialize
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_WORKSPACE/.qa-output/surface-$GITHUB_SHA-attempt-$GITHUB_RUN_ATTEMPT"
          test "$QA_OUTPUT_DIR" = "$expected"
          rm -rf -- "$QA_OUTPUT_DIR"
          mkdir -p "$QA_OUTPUT_DIR/screenshots/surface" "$QA_OUTPUT_DIR/screenshots/regression"
          printf '{"schemaVersion":"5.5.0","sha":"%s","ref":"%s","runId":"%s","runAttempt":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$QA_OUTPUT_DIR/run-metadata.json"

      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static validation
        id: static_validation
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -uo pipefail
          status=0
          run_check() {
            echo "+ $*"
            "$@" || status=1
          }
          run_check python -m py_compile tools/validate.py tools/surface_production_smoke.py tools/browser_smoke_test.py
          run_check node --check assets/js/surface-production-lab.js
          run_check node --check assets/js/tuanjie-glb-viewer.js
          run_check node --check threejs/YunnanBaselineV544.js
          run_check node --check threejs/v544/YunnanCourtyardProduction.js
          run_check node --check threejs/v544/YunnanMaterialFactory.js
          run_check node --check threejs/YunnanSurfaceProfiles.js
          run_check node --check threejs/YunnanWallSurfaceSystem.js
          run_check node --check threejs/YunnanRoofSurfaceSystem.js
          run_check node --check threejs/YunnanCourtyardProduction.js
          run_check node --check threejs/YunnanMaterialFactory.js
          run_check node --check vendor/three/three.module.js
          run_check node --check vendor/three/controls/OrbitControls.js
          run_check python tools/validate.py
          exit "$status"

      - name: Check complete changed-file whitespace
        id: whitespace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD

      - name: Build and validate release package
        id: release
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: python tools/make_release.py

      - name: Install Playwright Chromium
        id: playwright
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Run V5.5.0 surface browser QA
        id: surface_qa
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python tools/surface_production_smoke.py \
            --run-sha "$GITHUB_SHA" \
            --report "$QA_OUTPUT_DIR/surface-production-smoke.json" \
            --screenshots "$QA_OUTPUT_DIR/screenshots/surface"

      - name: Run complete production-line regression
        id: regression
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python tools/browser_smoke_test.py \
            --run-sha "$GITHUB_SHA" \
            --report "$QA_OUTPUT_DIR/production-line-regression.json" \
            --screenshots "$QA_OUTPUT_DIR/screenshots/regression"

      - name: Record workflow step outcomes
        id: record_outcomes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$QA_OUTPUT_DIR"
          printf '{"schemaVersion":"5.5.0","sha":"%s","staticValidation":"%s","whitespace":"%s","release":"%s","playwright":"%s","surfaceQa":"%s","regression":"%s"}\n' \
            "$GITHUB_SHA" \
            "${{ steps.static_validation.outcome }}" \
            "${{ steps.whitespace.outcome }}" \
            "${{ steps.release.outcome }}" \
            "${{ steps.playwright.outcome }}" \
            "${{ steps.surface_qa.outcome }}" \
            "${{ steps.regression.outcome }}" \
            > "$QA_OUTPUT_DIR/workflow-step-outcomes.json"

      - name: Upload browser QA evidence
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-production-v550-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ env.QA_OUTPUT_DIR }}/**
          if-no-files-found: error
          retention-days: 30

      - name: Require every validation and QA step to succeed
        if: always()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          INITIALIZE_OUTCOME: ${{ steps.initialize.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          STATIC_OUTCOME: ${{ steps.static_validation.outcome }}
          WHITESPACE_OUTCOME: ${{ steps.whitespace.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          PLAYWRIGHT_OUTCOME: ${{ steps.playwright.outcome }}
          SURFACE_QA_OUTCOME: ${{ steps.surface_qa.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          RECORD_OUTCOMES_OUTCOME: ${{ steps.record_outcomes.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for variable in \
            CHECKOUT_OUTCOME INITIALIZE_OUTCOME PYTHON_OUTCOME STATIC_OUTCOME \
            WHITESPACE_OUTCOME RELEASE_OUTCOME PLAYWRIGHT_OUTCOME \
            SURFACE_QA_OUTCOME REGRESSION_OUTCOME RECORD_OUTCOMES_OUTCOME \
            ARTIFACT_OUTCOME
          do
            outcome="${!variable}"
            if [[ "$outcome" != "success" ]]; then
              echo "::error::$variable was $outcome (expected success)"
              failed=1
            fi
          done
          exit "$failed"
