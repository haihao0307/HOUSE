name: V5.5.0 Surface Production QA

on:
  push:
    branches:
      - codex/yunnan-surface-production-v5.5.0
    paths:
      - "yunnan-courtyard-architecture-factory-v5.2.1-full-local/**"
      - ".github/workflows/surface-production-v550.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: surface-production-v550-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static validation
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python -m py_compile tools/validate.py tools/surface_production_smoke.py tools/browser_smoke_test.py
          node --check assets/js/surface-production-lab.js
          node --check threejs/YunnanSurfaceProfiles.js
          node --check threejs/YunnanWallSurfaceSystem.js
          node --check threejs/YunnanRoofSurfaceSystem.js
          node --check threejs/YunnanCourtyardProduction.js
          node --check threejs/YunnanMaterialFactory.js
          python tools/validate.py
          git diff --check origin/main...HEAD

      - name: Install Playwright Chromium
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Run V5.5.0 surface browser QA
        working-directory: ${{ env.PROJECT_DIR }}
        run: python tools/surface_production_smoke.py

      - name: Run complete production-line regression
        working-directory: ${{ env.PROJECT_DIR }}
        run: python tools/browser_smoke_test.py

      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-production-v550-${{ github.sha }}
          path: |
            ${{ env.PROJECT_DIR }}/data/qa/yunnan_surface_production_smoke_v5_5_0.json
            ${{ env.PROJECT_DIR }}/data/qa/local_browser_smoke_test.json
            ${{ env.PROJECT_DIR }}/qa/screenshots/v550_*.png
            ${{ env.PROJECT_DIR }}/qa/screenshots/local_browser_smoke_test.png
            ${{ env.PROJECT_DIR }}/qa/screenshots/v540_tuanjie_*.png
          if-no-files-found: warn
          retention-days: 30
