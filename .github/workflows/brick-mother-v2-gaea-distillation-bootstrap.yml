name: Brick Mother V2.1 Gaea Distillation Bootstrap

on:
  push:
    branches:
      - feature/brick-mother-v2.0-composite-material-dna
    paths:
      - ".github/workflows/brick-mother-v2-gaea-distillation-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feature/brick-mother-v2.0-composite-material-dna
          fetch-depth: 0

      - name: Apply deterministic Gaea distillation patch
        shell: bash
        run: |
          set -euo pipefail
          brick="yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother"
          python3 "$brick/tools/apply_gaea_distillation_v21.py"

      - name: Validate patched source contracts
        shell: bash
        run: |
          set -euo pipefail
          brick="yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother"
          git diff --check
          node --check "$brick/brick-mother-gaea-kernel-v1.js"
          node --check "$brick/brick-mother-geometry-v2.js"
          node --check "$brick/brick-mother-renderer-v2.js"
          node --check "$brick/brick-mother-app-v2.js"
          python3 -m json.tool "$brick/data/brick-material-profiles-v2.json" >/dev/null
          python3 -m json.tool "$brick/data/gaea-distilled-node-recipes-v1.json" >/dev/null
          python3 -m json.tool "$brick/qa/gaea-distillation-contract-v1.json" >/dev/null
          python3 -m json.tool "$brick/VERSION.json" >/dev/null
          grep -q '"version": "2.1.0-alpha.1"' "$brick/VERSION.json"
          grep -q 'brick-mother-gaea-kernel-v1.js' "$brick/index.html"
          grep -q 'data-control="rockDetail"' "$brick/index.html"
          grep -q 'data-control="maskSharpness"' "$brick/index.html"
          grep -q 'data-channel="8"' "$brick/index.html"
          grep -q 'GAEA.geometryDisplacement' "$brick/brick-mother-geometry-v2.js"
          grep -q 'BMGaeaFields gaea' "$brick/brick-mother-renderer-v2.js"

      - name: Start local production server
        shell: bash
        run: |
          set -euo pipefail
          src="yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local"
          cd "$src"
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/brick-mother-gaea-http.log 2>&1 &
          echo $! > /tmp/brick-mother-gaea-http.pid
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/brick-mother/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/brick-mother-gaea-http.log
          exit 1

      - name: Run real Chromium generation gate
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "No Chromium executable found" >&2
            exit 1
          fi
          timeout 360s "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --enable-unsafe-swiftshader \
            --use-gl=angle \
            --use-angle=swiftshader \
            --virtual-time-budget=180000 \
            --dump-dom \
            "http://127.0.0.1:4173/brick-mother/?qa=gaea-bootstrap" \
            > /tmp/brick-mother-gaea-dom.html \
            2> /tmp/brick-mother-gaea-chrome.log
          grep -q 'data-brick-mother-ready="true"' /tmp/brick-mother-gaea-dom.html
          grep -q 'data-brick-mother-version="2.1.0-alpha.1"' /tmp/brick-mother-gaea-dom.html
          grep -q 'data-gaea-kernel="1.0.0"' /tmp/brick-mother-gaea-dom.html
          grep -q 'data-debug-modes="9"' /tmp/brick-mother-gaea-dom.html
          grep -Eq 'data-deep-pores="[1-9][0-9]*"' /tmp/brick-mother-gaea-dom.html
          grep -q 'data-control="rockDetail"' /tmp/brick-mother-gaea-dom.html
          grep -q 'data-control="strata"' /tmp/brick-mother-gaea-dom.html
          grep -q 'data-control="microErosion"' /tmp/brick-mother-gaea-dom.html
          grep -q 'data-control="colorClarity"' /tmp/brick-mother-gaea-dom.html
          grep -q 'data-control="colorGamut"' /tmp/brick-mother-gaea-dom.html
          grep -q 'data-control="maskSharpness"' /tmp/brick-mother-gaea-dom.html
          grep -q 'data-channel="8"' /tmp/brick-mother-gaea-dom.html
          grep -q 'Gaea 蒸馏材料图谱生成完成' /tmp/brick-mother-gaea-dom.html

      - name: Capture tested browser evidence
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          timeout 360s "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --enable-unsafe-swiftshader \
            --use-gl=angle \
            --use-angle=swiftshader \
            --window-size=1800,1200 \
            --virtual-time-budget=180000 \
            --screenshot=/tmp/brick-mother-v21-gaea.png \
            "http://127.0.0.1:4173/brick-mother/?qa=gaea-bootstrap-evidence" \
            > /tmp/brick-mother-gaea-screenshot.log \
            2>&1
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          path = Path('/tmp/brick-mother-v21-gaea.png')
          data = path.read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          assert len(data) > 120000, len(data)
          result = {
              'version': '2.1.0-alpha.1',
              'gaeaKernel': '1.0.0',
              'screenshotBytes': len(data),
              'screenshotSha256': hashlib.sha256(data).hexdigest(),
              'browserQA': True
          }
          Path('/tmp/brick-mother-gaea-summary.json').write_text(
              json.dumps(result, indent=2) + '\n', encoding='utf-8'
          )
          print(result)
          PY

      - name: Commit exact browser-tested implementation
        shell: bash
        run: |
          set -euo pipefail
          brick="yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother"
          if git diff --quiet; then
            echo "Expected implementation changes are missing" >&2
            exit 1
          fi
          git config user.name "Brick Mother Gaea Distillation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            "$brick/index.html" \
            "$brick/brick-mother-geometry-v2.js" \
            "$brick/brick-mother-renderer-v2.js" \
            "$brick/brick-mother-app-v2.js" \
            "$brick/data/brick-material-profiles-v2.json" \
            "$brick/qa/gaea-distillation-contract-v1.json" \
            "$brick/VERSION.json"
          git commit -m "Integrate Gaea-distilled field graph into Brick Mother V2.1"
          git push origin HEAD:feature/brick-mother-v2.0-composite-material-dna

      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-mother-v21-gaea-bootstrap-evidence
          path: |
            /tmp/brick-mother-v21-gaea.png
            /tmp/brick-mother-gaea-dom.html
            /tmp/brick-mother-gaea-chrome.log
            /tmp/brick-mother-gaea-screenshot.log
            /tmp/brick-mother-gaea-http.log
            /tmp/brick-mother-gaea-summary.json
          if-no-files-found: ignore

      - name: Stop local server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/brick-mother-gaea-http.pid ]; then
            kill "$(cat /tmp/brick-mother-gaea-http.pid)" 2>/dev/null || true
          fi
