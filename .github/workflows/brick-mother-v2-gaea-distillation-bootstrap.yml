      - name: Validate patched source and data
        shell: bash
        run: |
          set -euo pipefail
          brick="yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother"
          git diff --check
          node --check "$brick/brick-mother-gaea-kernel-v1.js"
          node --check "$brick/brick-mother-geometry-v2.js"
          node --check "$brick/brick-mother-renderer-v2.js"
          node --check "$brick/brick-mother-app-v2.js"
          python3 -m json.tool "$brick/data/brick-material-profiles-v2.json" >/dev/null
          python3 -m json.tool "$brick/data/gaea-distilled-node-recipes-v1.json" >/dev/null
          python3 -m json.tool "$brick/qa/gaea-distillation-contract-v1.json" >/dev/null
          python3 -m json.tool "$brick/VERSION.json" >/dev/null
          grep -q 'brick-mother-gaea-kernel-v1.js' "$brick/index.html"
          grep -q 'data-control="rockDetail"' "$brick/index.html"
          grep -q 'data-control="maskSharpness"' "$brick/index.html"
          grep -q 'data-channel="8"' "$brick/index.html"
          grep -q 'BMGaeaFields gaea' "$brick/brick-mother-renderer-v2.js"
          grep -q 'GAEA.geometryDisplacement' "$brick/brick-mother-geometry-v2.js"
          grep -q '"version": "2.1.0-alpha.1"' "$brick/VERSION.json"

      - name: Start local server
        shell: bash
        run: |
          set -euo pipefail
          src="yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local"
          cd "$src"
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/brick-mother-gaea-bootstrap-http.log 2>&1 &
          echo $! > /tmp/brick-mother-gaea-bootstrap-http.pid
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/brick-mother/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/brick-mother-gaea-bootstrap-http.log
          exit 1

      - name: Run real Chromium before committing
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "No Chromium executable found" >&2
            exit 1
          fi
          timeout 360s "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --enable-unsafe-swiftshader \
            --use-gl=angle \
            --use-angle=swiftshader \
            --virtual-time-budget=180000 \
            --dump-dom \
            "http://127.0.0.1:4173/brick-mother/?qa=gaea-bootstrap" \
            > /tmp/brick-mother-gaea-bootstrap-dom.html \
            2> /tmp/brick-mother-gaea-bootstrap-chrome.log

          grep -q 'data-brick-mother-ready="true"' /tmp/brick-mother-gaea-bootstrap-dom.html
          grep -q 'data-brick-mother-version="2.1.0-alpha.1"' /tmp/brick-mother-gaea-bootstrap-dom.html
          grep -q 'data-gaea-kernel="1.0.0"' /tmp/brick-mother-gaea-bootstrap-dom.html
          grep -q 'data-debug-modes="9"' /tmp/brick-mother-gaea-bootstrap-dom.html
          grep -Eq 'data-deep-pores="[1-9][0-9]*"' /tmp/brick-mother-gaea-bootstrap-dom.html
          grep -q 'data-control="rockDetail"' /tmp/brick-mother-gaea-bootstrap-dom.html
          grep -q 'data-control="strata"' /tmp/brick-mother-gaea-bootstrap-dom.html
          grep -q 'data-control="microErosion"' /tmp/brick-mother-gaea-bootstrap-dom.html
          grep -q 'data-control="colorClarity"' /tmp/brick-mother-gaea-bootstrap-dom.html
          grep -q 'data-control="colorGamut"' /tmp/brick-mother-gaea-bootstrap-dom.html
          grep -q 'data-control="maskSharpness"' /tmp/brick-mother-gaea-bootstrap-dom.html
          grep -q 'data-channel="8"' /tmp/brick-mother-gaea-bootstrap-dom.html
          grep -q 'Gaea 蒸馏材料图谱生成完成' /tmp/brick-mother-gaea-bootstrap-dom.html

      - name: Capture tested Gaea-distilled evidence
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          timeout 360s "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --enable-unsafe-swiftshader \
            --use-gl=angle \
            --use-angle=swiftshader \
            --window-size=1800,1200 \
            --virtual-time-budget=180000 \
            --screenshot=/tmp/brick-mother-v21-gaea-bootstrap.png \
            "http://127.0.0.1:4173/brick-mother/?qa=gaea-bootstrap-evidence" \
            > /tmp/brick-mother-gaea-bootstrap-screenshot.log \
            2>&1
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          path = Path('/tmp/brick-mother-v21-gaea-bootstrap.png')
          data = path.read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          assert len(data) > 120000, len(data)
          result = {
              'screenshotBytes': len(data),
              'screenshotSha256': hashlib.sha256(data).hexdigest(),
              'version': '2.1.0-alpha.1',
              'gaeaKernel': '1.0.0',
              'browserQA': True
          }
          Path('/tmp/brick-mother-gaea-bootstrap-summary.json').write_text(
              json.dumps(result, indent=2) + '\n', encoding='utf-8'
          )
          print(result)
          PY

      - name: Commit exact tested implementation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Expected implementation changes are missing" >&2
            exit 1
          fi
          git config user.name "Brick Mother Gaea Distillation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/index.html \
            yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/brick-mother-geometry-v2.js \
            yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/brick-mother-renderer-v2.js \
            yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/brick-mother-app-v2.js \
            yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/data/brick-material-profiles-v2.json \
            yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/qa/gaea-distillation-contract-v1.json \
            yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/VERSION.json
          git commit -m "Integrate Gaea-distilled field graph into Brick Mother V2.1"
          git push origin HEAD:feature/brick-mother-v2.0-composite-material-dna

      - name: Write bootstrap summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Brick Mother V2.1 Gaea Distillation Bootstrap"
            echo
            echo "* Target version: 2.1.0-alpha.1"
            echo "* Gaea kernel: 1.0.0"
            echo "* Source patch: geometry, renderer, app, UI, profiles, version and QA contract"
            echo "* Real Chromium gate: required before commit"
            echo "* Visual approval remains pending"
            if [ -f /tmp/brick-mother-gaea-bootstrap-summary.json ]; then
              echo
              echo '```json'
              cat /tmp/brick-mother-gaea-bootstrap-summary.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-mother-v21-gaea-bootstrap-evidence
          path: |
            /tmp/brick-mother-v21-gaea-bootstrap.png
            /tmp/brick-mother-gaea-bootstrap-dom.html
            /tmp/brick-mother-gaea-bootstrap-chrome.log
            /tmp/brick-mother-gaea-bootstrap-screenshot.log
            /tmp/brick-mother-gaea-bootstrap-http.log
            /tmp/brick-mother-gaea-bootstrap-summary.json
          if-no-files-found: ignore

      - name: Stop local server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/brick-mother-gaea-bootstrap-http.pid ]; then
            kill "$(cat /tmp/brick-mother-gaea-bootstrap-http.pid)" 2>/dev/null || true
          fi
