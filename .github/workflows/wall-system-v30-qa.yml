name: Validate Yunnan Wall System V3.0

on:
  push:
    branches:
      - feature/yunnan-component-studio-v1
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_DIR: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local
  WALL_V30_QA_OUTPUT_DIR: ${{ github.workspace }}/.qa-output/wall-system-v30-${{ github.sha }}-attempt-${{ github.run_attempt }}

jobs:
  wall-system-v30:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize exact-head evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WALL_V30_QA_OUTPUT_DIR/screenshots"
          printf '{"schemaVersion":"2.0.0","sha":"%s","ref":"%s","runId":"%s","runAttempt":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$WALL_V30_QA_OUTPUT_DIR/run-metadata.json"

      - name: Validate static files and contracts
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f component-studio/wall-system-lab.html
          test -f component-studio/assets/wall-system-v30.css
          test -f component-studio/assets/wall-system-v30.js
          for part in $(seq -f '%02g' 1 9); do
            test -f "component-studio/assets/wall-system-v30-part-${part}.txt"
          done
          test -f component-studio/data/wall-system-v30-contract.json
          test -f component-studio/data/evidence/wall-system-v30-user-requirements-2026-08-27.json
          test -f tools/wall_system_v30_browser_smoke.py
          cp component-studio/assets/wall-system-v30.js /tmp/wall-system-v30-loader.mjs
          node --check /tmp/wall-system-v30-loader.mjs
          cat component-studio/assets/wall-system-v30-part-*.txt > /tmp/wall-system-v30-runtime.js
          node --check /tmp/wall-system-v30-runtime.js
          python3 -m json.tool component-studio/data/wall-system-v30-contract.json >/dev/null
          python3 -m json.tool component-studio/data/evidence/wall-system-v30-user-requirements-2026-08-27.json >/dev/null
          python3 -m py_compile tools/wall_system_v30_browser_smoke.py
          grep -Fq "const VERSION = '3.0.0'" /tmp/wall-system-v30-runtime.js
          grep -Fq "edgeRoundness" /tmp/wall-system-v30-runtime.js
          grep -Fq "stoneAdobeOverlap" /tmp/wall-system-v30-runtime.js
          grep -Fq "outerPlasterCoverage" /tmp/wall-system-v30-runtime.js
          grep -Fq "innerPlasterCoverage" /tmp/wall-system-v30-runtime.js
          grep -Fq "function erodedRoundedShape" /tmp/wall-system-v30-runtime.js
          grep -Fq "function surfaceField" /tmp/wall-system-v30-runtime.js
          grep -Fq "function boundaryEdgeCount" /tmp/wall-system-v30-runtime.js
          grep -Fq "function measureStoneAdobeJoint" /tmp/wall-system-v30-runtime.js
          grep -Fq "function projectedFaceArea" /tmp/wall-system-v30-runtime.js
          grep -Fq "surfaceFingerprint" /tmp/wall-system-v30-runtime.js
          ! grep -Fq "tranverse" /tmp/wall-system-v30-runtime.js

      - name: Install browser QA dependencies
        run: python3 -m pip install --disable-pip-version-check playwright==1.57.0 pillow==11.3.0

      - name: Run full wall browser QA
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 tools/wall_system_v30_browser_smoke.py \
            --run-sha "$GITHUB_SHA" \
            --run-ref "$GITHUB_REF_NAME" \
            --output-dir "$WALL_V30_QA_OUTPUT_DIR"

      - name: Upload wall system evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wall-system-v30-browser-evidence-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ env.WALL_V30_QA_OUTPUT_DIR }}/**
          if-no-files-found: error
          retention-days: 90
