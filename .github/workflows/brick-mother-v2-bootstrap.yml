name: Brick Mother V2 Materialize and Browser QA

on:
  push:
    branches:
      - feature/brick-mother-v2.0-composite-material-dna
    paths:
      - ".github/workflows/brick-mother-v2-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  TARGET_BRANCH: feature/brick-mother-v2.0-composite-material-dna
  BASE_SHA: 77ce0a1bc63d301829942c14e5708fc16a06cdcd
  STAGING_ISSUE: "14"
  EXPECTED_CHUNKS: "10"
  EXPECTED_BASE64_LENGTH: "51224"
  EXPECTED_PAYLOAD_BYTES: "38417"
  PAYLOAD_SHA256: f5f4339da5dea600f4b664c24adc17de261eac9e447fd6b84a47d09916a2ee5b

jobs:
  materialize-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Guard frozen V1 parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test -f .github/workflows/brick-mother-v2-bootstrap.yml

      - name: Reassemble deterministic V2 payload from staging evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPOSITORY/issues/$STAGING_ISSUE/comments?per_page=100" \
            -o /tmp/brick-mother-v2-comments.json

          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import re

          comments = json.loads(pathlib.Path('/tmp/brick-mother-v2-comments.json').read_text(encoding='utf-8'))
          total = int(os.environ['EXPECTED_CHUNKS'])
          pattern = re.compile(r'^BRICK_MOTHER_V2_CHUNK_(\d{3})_OF_(\d{3})\r?\n([A-Za-z0-9+/=\r\n]+)\s*$')
          chunks = {}
          provenance = {}
          for comment in comments:
              body = comment.get('body') or ''
              match = pattern.match(body)
              if not match:
                  continue
              index = int(match.group(1))
              declared_total = int(match.group(2))
              if declared_total != total or not 1 <= index <= total:
                  continue
              encoded = ''.join(match.group(3).split())
              chunks[index] = encoded
              provenance[index] = {
                  'commentId': comment.get('id'),
                  'createdAt': comment.get('created_at'),
                  'encodedLength': len(encoded),
                  'encodedSha256': hashlib.sha256(encoded.encode('ascii')).hexdigest(),
              }

          missing = [index for index in range(1, total + 1) if index not in chunks]
          joined = ''.join(chunks[index] for index in range(1, total + 1) if index in chunks)
          report = {
              'issue': int(os.environ['STAGING_ISSUE']),
              'expectedChunks': total,
              'foundChunks': len(chunks),
              'missingChunks': missing,
              'base64Length': len(joined),
              'expectedBase64Length': int(os.environ['EXPECTED_BASE64_LENGTH']),
              'chunks': provenance,
          }
          pathlib.Path('/tmp/brick-mother-v2-reassembly.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          if missing:
              raise SystemExit(f'missing payload chunks: {missing}')
          if len(joined) != int(os.environ['EXPECTED_BASE64_LENGTH']):
              raise SystemExit(f'unexpected base64 length: {len(joined)}')

          payload = base64.b64decode(joined, validate=True)
          digest = hashlib.sha256(payload).hexdigest()
          report['payloadBytes'] = len(payload)
          report['payloadSha256'] = digest
          pathlib.Path('/tmp/brick-mother-v2-reassembly.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          if len(payload) != int(os.environ['EXPECTED_PAYLOAD_BYTES']):
              raise SystemExit(f'unexpected payload size: {len(payload)}')
          if digest != os.environ['PAYLOAD_SHA256']:
              raise SystemExit(f'payload SHA256 mismatch: {digest}')
          pathlib.Path('/tmp/brick-mother-v2-alpha1.tar.gz').write_bytes(payload)
          PY

          python3 - <<'PY'
          import pathlib
          import tarfile

          archive = pathlib.Path('/tmp/brick-mother-v2-alpha1.tar.gz')
          with tarfile.open(archive, 'r:gz') as handle:
              members = handle.getmembers()
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive member: {member.name}')
              handle.extractall('.')
          PY

          rm .github/workflows/brick-mother-v2-bootstrap.yml

      - name: Validate V2 source contracts and generated geometry
        shell: bash
        run: |
          set -euo pipefail
          brick="yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother"
          node --check "$brick/brick-mother-geometry-v2.js"
          node --check "$brick/brick-mother-renderer-v2.js"
          node --check "$brick/brick-mother-app-v2.js"
          python3 -m json.tool "$brick/data/brick-material-profiles-v2.json" >/dev/null
          python3 -m json.tool "$brick/VERSION.json" >/dev/null
          grep -q '"version": "2.0.0-alpha.1"' "$brick/VERSION.json"
          grep -q '"independentSeedLayers": 8' "$brick/VERSION.json"
          grep -q 'geometryDeepPoreCount' "$brick/data/brick-material-profiles-v2.json"
          grep -q 'adobeInclusionFamilies' "$brick/data/brick-material-profiles-v2.json"

          BRICK_DIR="$brick" node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          global.window = {};
          const brick = process.env.BRICK_DIR;
          require(path.resolve(brick, 'brick-mother-geometry-v2.js'));
          const geometry = global.window.BrickMotherGeometryV2;
          if (!geometry || typeof geometry.buildMesh !== 'function') throw new Error('V2 geometry runtime unavailable');
          const profiles = JSON.parse(fs.readFileSync(path.resolve(brick, 'data/brick-material-profiles-v2.json'), 'utf8')).profiles;
          const rows = [];
          for (const profile of profiles) {
            const mesh = geometry.buildMesh(profile, profile.runtimeDNA.seedBase + 17, profile.compositeDefaults, 'qa', 0.58);
            if (!mesh.triangles || !mesh.vertices) throw new Error(`${profile.id}: empty mesh`);
            if (!mesh.damage.deepPores.length) throw new Error(`${profile.id}: missing deep pores`);
            if (!mesh.damage.erosionBites.length) throw new Error(`${profile.id}: missing erosion bites`);
            for (const value of mesh.positions) if (!Number.isFinite(value)) throw new Error(`${profile.id}: non-finite position`);
            for (const value of mesh.normals) if (!Number.isFinite(value)) throw new Error(`${profile.id}: non-finite normal`);
            rows.push({
              profile: profile.id,
              triangles: mesh.triangles,
              vertices: mesh.vertices,
              deepPores: mesh.damage.deepPores.length,
              erosionBites: mesh.damage.erosionBites.length,
              seedLayers: Object.keys(mesh.seedDNA).length - 1,
            });
          }
          fs.writeFileSync('/tmp/brick-mother-v2-geometry-runtime-qa.json', JSON.stringify(rows, null, 2) + '\n');
          console.log(JSON.stringify(rows));
          NODE

      - name: Start local production server
        shell: bash
        run: |
          set -euo pipefail
          src="yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local"
          cd "$src"
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/brick-mother-v2-http.log 2>&1 &
          echo $! > /tmp/brick-mother-v2-http.pid
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/brick-mother/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/brick-mother-v2-http.log
          exit 1

      - name: Run real Chromium WebGL2 V2 generation QA
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "No Chromium executable found" >&2
            exit 1
          fi

          timeout 360s "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --enable-unsafe-swiftshader \
            --use-gl=angle \
            --use-angle=swiftshader \
            --virtual-time-budget=150000 \
            --dump-dom \
            "http://127.0.0.1:4173/brick-mother/?qa=bootstrap-v2-alpha1" \
            > /tmp/brick-mother-v2-dom.html \
            2> /tmp/brick-mother-v2-chrome.log

          grep -q 'data-brick-mother-ready="true"' /tmp/brick-mother-v2-dom.html
          grep -q 'data-brick-mother-version="2.0.0-alpha.1"' /tmp/brick-mother-v2-dom.html
          grep -q 'data-seed-layers="8"' /tmp/brick-mother-v2-dom.html
          grep -Eq 'data-deep-pores="[1-9][0-9]*"' /tmp/brick-mother-v2-dom.html
          grep -q 'data-index="0"' /tmp/brick-mother-v2-dom.html
          grep -q 'data-index="1"' /tmp/brick-mother-v2-dom.html
          grep -q 'data-index="2"' /tmp/brick-mother-v2-dom.html
          grep -q 'data-control="colorRichness"' /tmp/brick-mother-v2-dom.html
          grep -q 'data-control="poreDepth"' /tmp/brick-mother-v2-dom.html
          grep -q 'data-seed="inclusion"' /tmp/brick-mother-v2-dom.html
          grep -q 'data-channel="7"' /tmp/brick-mother-v2-dom.html
          grep -q 'V2 复合材质 DNA 首轮生成完成' /tmp/brick-mother-v2-dom.html

      - name: Capture V2 browser evidence
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          timeout 360s "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --enable-unsafe-swiftshader \
            --use-gl=angle \
            --use-angle=swiftshader \
            --window-size=1600,1100 \
            --virtual-time-budget=150000 \
            --screenshot=/tmp/brick-mother-v2-alpha1.png \
            "http://127.0.0.1:4173/brick-mother/?qa=bootstrap-evidence-v2-alpha1" \
            > /tmp/brick-mother-v2-screenshot.log \
            2>&1
          test -s /tmp/brick-mother-v2-alpha1.png

      - name: Commit tested V2 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Brick Mother Production Bot"
          git config user.email "brick-mother-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Build Brick Mother V2 composite material DNA alpha 1"
          git push origin "HEAD:$TARGET_BRANCH"
          git rev-parse HEAD | tee /tmp/brick-mother-v2-commit.txt

      - name: Close temporary staging issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          commit="$(cat /tmp/brick-mother-v2-commit.txt)"
          gh issue close "$STAGING_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --comment "Payload reassembled with exact SHA256, V2 source and geometry validation passed, real Chromium WebGL2 generation QA passed, and tested commit $commit was pushed to $TARGET_BRANCH."

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Brick Mother V2 Composite Material DNA"
            echo
            echo "* Frozen V1 parent: $BASE_SHA"
            echo "* Payload SHA256: $PAYLOAD_SHA256"
            echo "* Version: 2.0.0-alpha.1"
            echo "* Independent seed layers: 8"
            echo "* Adjustable composite controls: 7"
            echo "* Adobe inclusion families: 5"
            if [ -f /tmp/brick-mother-v2-dom.html ]; then
              echo "* Browser DOM evidence: generated"
              grep -o 'data-deep-pores="[0-9]*"' /tmp/brick-mother-v2-dom.html | head -1 | sed 's/data-deep-pores=/Deep pore events: /'
            fi
            if [ -f /tmp/brick-mother-v2-commit.txt ]; then
              echo "* Tested commit: $(cat /tmp/brick-mother-v2-commit.txt)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bootstrap and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-mother-v2-alpha1-tested-evidence
          path: |
            /tmp/brick-mother-v2-reassembly.json
            /tmp/brick-mother-v2-geometry-runtime-qa.json
            /tmp/brick-mother-v2-alpha1.png
            /tmp/brick-mother-v2-dom.html
            /tmp/brick-mother-v2-chrome.log
            /tmp/brick-mother-v2-screenshot.log
            /tmp/brick-mother-v2-http.log
            /tmp/brick-mother-v2-commit.txt
          if-no-files-found: ignore

      - name: Stop local server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/brick-mother-v2-http.pid ]; then
            kill "$(cat /tmp/brick-mother-v2-http.pid)" 2>/dev/null || true
          fi
