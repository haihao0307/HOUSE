name: Brick Wall R1 Smoke

on:
  push:
    branches:
      - codex/brick-r2143-continuous-surface-20260914

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser QA
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify public 3D wall workbench
        shell: bash
        run: |
          cat > /tmp/qa.py <<'PY'
          from playwright.sync_api import sync_playwright
          URL='https://rawcdn.githack.com/haihao0307/HOUSE/697dbc6d41806e482cc7085bd4740255ec438b94/yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/experiments/wall-lab-r1/Brick_Wall_Plaster_Workbench_R1.html'
          errors=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist'])
              context=browser.new_context(viewport={'width':1440,'height':900},device_scale_factor=1,user_agent='Brick-Wall-R1-QA')
              context.add_cookies([{'name':'__Http-phish','value':'1','url':'https://rawcdn.githack.com/','secure':True,'httpOnly':True,'sameSite':'Lax'}])
              page=context.new_page(); page.set_default_timeout(120000)
              page.on('pageerror',lambda exc: errors.append('pageerror: '+str(exc)))
              page.on('console',lambda msg: errors.append('console: '+msg.text) if msg.type=='error' else None)
              resp=page.goto(URL,wait_until='networkidle',timeout=120000)
              assert resp and resp.ok, f'HTTP {resp.status if resp else None}'
              page.wait_for_timeout(3500)
              assert page.locator('#c').get_attribute('data-ready')=='true'
              status=page.locator('#status').inner_text(); print('STATUS',status)
              assert 'WebGL2' in status and 'tris' in status
              assert not errors, errors
              page.locator('#plaster').click(); page.wait_for_timeout(700)
              page.locator('#plaster').click(); page.locator('#regen').click(); page.wait_for_timeout(700)
              assert not errors, errors
              page.screenshot(path='/tmp/brick-wall-r1.png',full_page=True,timeout=120000)
              browser.close()
          PY
          python /tmp/qa.py
      - name: Upload QA frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-wall-r1-qa
          path: /tmp/brick-wall-r1.png
          if-no-files-found: ignore
