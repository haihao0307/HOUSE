name: Brick Mother Stone Form V2.9 Private Review

on:
  push:
    branches:
      - feature/brick-mother-v2.0-composite-material-dna
    paths:
      - ".github/workflows/brick-mother-stone-form-v29-review.yml"
      - "yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/review-v29/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  BRICK_ROOT: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother

jobs:
  visual-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4

      - name: Validate staged runtime
        shell: bash
        run: |
          set -euo pipefail
          page="$BRICK_ROOT/review-v29/brick-mother-stone-form-v2.9.0.html"
          test -s "$page"
          for i in 1 2 3 4 5 6; do
            test -s "$BRICK_ROOT/review-v29/stone-form-v29.part${i}.txt"
          done
          cat "$BRICK_ROOT/review-v29/stone-form-v29.part1.txt" \
              "$BRICK_ROOT/review-v29/stone-form-v29.part2.txt" \
              "$BRICK_ROOT/review-v29/stone-form-v29.part3.txt" \
              "$BRICK_ROOT/review-v29/stone-form-v29.part4.txt" \
              "$BRICK_ROOT/review-v29/stone-form-v29.part5.txt" \
              "$BRICK_ROOT/review-v29/stone-form-v29.part6.txt" \
              > /tmp/stone-form-v29.js
          node --check /tmp/stone-form-v29.js
          grep -q "2.9.0-alpha.1" /tmp/stone-form-v29.js
          grep -q "规则石材" "$page"
          grep -q "半规则毛石" "$page"
          grep -q "片石" "$page"
          grep -q "卵石" "$page"
          grep -q "四家族独立语法" "$page"

      - name: Capture four families in Chromium
        shell: bash
        run: |
          set -euo pipefail
          review="$BRICK_ROOT/review-v29"
          mkdir -p /tmp/stone-form-v29-review
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$review" >/tmp/stone-form-v29-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8765/brick-mother-stone-form-v2.9.0.html >/dev/null && break
            sleep 1
          done
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          for family in 0 1 2 3; do
            for view in all hero; do
              stem="family-${family}-${view}"
              url="http://127.0.0.1:8765/brick-mother-stone-form-v2.9.0.html?family=${family}&view=${view}&qa=private-review&head=${GITHUB_SHA}"
              timeout 180s "$chrome" \
                --headless=new \
                --no-sandbox \
                --disable-dev-shm-usage \
                --disable-background-networking \
                --enable-webgl \
                --ignore-gpu-blocklist \
                --enable-unsafe-swiftshader \
                --use-gl=angle \
                --use-angle=swiftshader \
                --hide-scrollbars \
                --window-size=1600,1000 \
                --virtual-time-budget=18000 \
                --screenshot="/tmp/stone-form-v29-review/${stem}.png" \
                --dump-dom \
                "$url" \
                > "/tmp/stone-form-v29-review/${stem}.dom.html" \
                2> "/tmp/stone-form-v29-review/${stem}.chrome.log"
              grep -q 'data-brick-mother-stone-form-ready="true"' "/tmp/stone-form-v29-review/${stem}.dom.html"
              grep -q 'data-visual-ready="true"' "/tmp/stone-form-v29-review/${stem}.dom.html"
              grep -q 'data-stone-form-version="2.9.0-alpha.1"' "/tmp/stone-form-v29-review/${stem}.dom.html"
              ! grep -q 'data-runtime-failure="true"' "/tmp/stone-form-v29-review/${stem}.dom.html"
              test -s "/tmp/stone-form-v29-review/${stem}.png"
              test "$(wc -c < "/tmp/stone-form-v29-review/${stem}.png")" -gt 100000
            done
          done
          python3 - <<'PY'
          from pathlib import Path
          import json, os, struct
          root=Path('/tmp/stone-form-v29-review')
          rows=[]
          for p in sorted(root.glob('*.png')):
              data=p.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n'
              width,height=struct.unpack('>II',data[16:24])
              assert (width,height)==(1600,1000),(p.name,width,height)
              rows.append({'file':p.name,'bytes':len(data),'width':width,'height':height})
          assert len(rows)==8, len(rows)
          manifest={'head':os.environ['GITHUB_SHA'],'candidate':'2.9.0-alpha.1','screenshots':rows,'humanVisualApproval':False,'productionApproved':False}
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY

      - name: Upload private review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-mother-stone-form-v29-review-${{ github.sha }}
          path: |
            /tmp/stone-form-v29-review
            /tmp/stone-form-v29-server.log
          compression-level: 1
          if-no-files-found: error
          retention-days: 7
