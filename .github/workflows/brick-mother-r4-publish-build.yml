name: Brick Mother R4 Public Candidate Build
on:
  push:
    branches: [feature/brick-mother-v2.0-composite-material-dna]
    paths: [.github/workflows/brick-mother-r4-publish-build.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: brick-mother-r4-public-candidate
  cancel-in-progress: false
jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      BRICK: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother
      EXPECTED_BRANCH: feature/brick-mother-v2.0-composite-material-dna
    steps:
      - uses: actions/checkout@v4
      - name: Check branch and frozen originals
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git hash-object "$BRICK/brick-mother-observation-studio.html")" = 7b2a18c6a886d0751ca2fc92530b7986d9e1a727
          test "$(git hash-object "$BRICK/brick-mother-standalone-v2.7.5.html")" = 7b10389cb9367f7423619262820883cc94b07a61
          test "$(git hash-object "$BRICK/brick-mother-standalone-v2.6.html")" = f64c65d87dc418bf1a923a4cf332b449efbe0eb9
      - name: Recover reviewed core and build public candidate
        run: python .github/brick-public-source-repair/build_accepted_r4.py "$RUNNER_TEMP/r4-site"
      - name: Install test browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Real HTTP and graphics verification
        run: xvfb-run -a python .github/brick-public-source-repair/check_browser.py
      - name: Save candidate only after browser checks
        run: |
          set -euo pipefail
          current=$(git ls-remote origin "refs/heads/$EXPECTED_BRANCH" | cut -f1)
          test "$current" = "$GITHUB_SHA"
          DEST="$BRICK/experiments/atelier-r4/web"
          mkdir -p "$DEST/generated-src"
          cp "$RUNNER_TEMP/r4-site/index.html" "$DEST/index.html"
          cp "$RUNNER_TEMP/r4-site/RELEASE.json" "$DEST/RELEASE.json"
          cp "$RUNNER_TEMP/r4-site/generated-src/"* "$DEST/generated-src/"
          cp "$RUNNER_TEMP/r4-evidence/browser-report.json" "$DEST/BUILD_QA.json"
          git config user.name 'Brick Mother publish verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$DEST"
          git diff --cached --name-only | while IFS= read -r f; do case "$f" in "$DEST"/*) ;; *) exit 1;; esac; done
          git commit -m 'build(brick): save browser-verified reviewed R4 public candidate [skip ci]'
          git push origin "HEAD:refs/heads/$EXPECTED_BRANCH"
          git rev-parse HEAD > "$RUNNER_TEMP/r4-evidence/materialized-commit.txt"
      - name: Retain source and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-mother-r4-public-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r4-site
            ${{ runner.temp }}/r4-evidence
          retention-days: 30
