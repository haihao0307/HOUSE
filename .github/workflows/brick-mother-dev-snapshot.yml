name: Brick Mother Development Source Snapshot

on:
  push:
    branches:
      - feature/brick-mother-v2.0-composite-material-dna
    paths:
      - ".github/workflows/brick-mother-dev-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  BRICK_ROOT: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother
  STONE_V31_ROOT: private-review/brick-mother-stone-form-v31
  STONE_REVIEW_ROOT: private-review/brick-mother-stone-form-v33
  STONE_V34_ROOT: private-review/brick-mother-stone-form-v34
  PBR_REVIEW_ROOT: private-review/brick-mother-weathering-pbr-v1

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Verify source roots
        shell: bash
        run: |
          set -euo pipefail
          test -d "$BRICK_ROOT"
          test -s "$BRICK_ROOT/brick-mother-standalone-v2.7.5.html"
          test -s "$BRICK_ROOT/workbench.html"
          test -s "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.0.0.html"
          test -s "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.css"
          test -s "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.js"
          test -s "$BRICK_ROOT/brick-mother-weathering-geometry-v1.js"
          node --check "$BRICK_ROOT/brick-mother-realtime-weathering-pbr-v1.js"
          node --check "$BRICK_ROOT/brick-mother-weathering-geometry-v1.js"
          test -d "$STONE_V31_ROOT"
          test -s "$STONE_V31_ROOT/stone-form-geometry-v31.js"
          test -s "$STONE_V31_ROOT/stone-form-runtime-v31.js"
          test -d "$STONE_REVIEW_ROOT"
          test -s "$STONE_REVIEW_ROOT/brick-mother-stone-form-v3.3.0.html"
          test -s "$STONE_REVIEW_ROOT/stone-form-geometry-v33.js"
          test -s "$STONE_REVIEW_ROOT/stone-form-runtime-v33.js"
          node --check "$STONE_REVIEW_ROOT/stone-form-geometry-v33.js"
          node --check "$STONE_REVIEW_ROOT/stone-form-runtime-v33.js"
          test -d "$STONE_V34_ROOT/payload"
          test -d "$PBR_REVIEW_ROOT/payload"
          test "$(git hash-object "$BRICK_ROOT/brick-mother-standalone-v2.7.5.html")" = "7b10389cb9367f7423619262820883cc94b07a61"

      - name: Upload complete Brick Mother development source
        uses: actions/upload-artifact@v4
        with:
          name: brick-mother-complete-current-source-${{ github.sha }}
          path: |
            ${{ env.BRICK_ROOT }}
            ${{ env.STONE_V31_ROOT }}
            ${{ env.STONE_REVIEW_ROOT }}
            ${{ env.STONE_V34_ROOT }}
            ${{ env.PBR_REVIEW_ROOT }}
            docs/brick-mother/BRICK_MOTHER_REALTIME_WEATHERING_PBR_DNA_V1.0.md
            docs/brick-mother/BRICK_MOTHER_REALTIME_WEATHERING_PBR_DNA_V1.0.json
            .github/workflows/brick-mother-pages-preview.yml
            .github/workflows/brick-mother-stone-form-v33-materialize-review.yml
            .github/workflows/brick-mother-weathering-pbr-v1-materialize.yml
            .github/workflows/brick-mother-dev-snapshot.yml
          compression-level: 1
          if-no-files-found: error
          retention-days: 3
