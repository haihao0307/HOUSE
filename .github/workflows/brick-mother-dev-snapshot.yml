name: Brick Mother Development Source Snapshot

on:
  push:
    branches:
      - feature/brick-mother-v2.0-composite-material-dna
    paths:
      - ".github/workflows/brick-mother-dev-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  BRICK_ROOT: yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother
  STONE_REVIEW_ROOT: private-review/brick-mother-stone-form-v31

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Verify source roots
        shell: bash
        run: |
          set -euo pipefail
          test -d "$BRICK_ROOT"
          test -s "$BRICK_ROOT/brick-mother-standalone-v2.7.5.html"
          test -s "$BRICK_ROOT/workbench.html"
          test -d "$STONE_REVIEW_ROOT"
          test -s "$STONE_REVIEW_ROOT/brick-mother-stone-form-v3.1.0.html"
          test -s "$STONE_REVIEW_ROOT/stone-form-geometry-v31.js"
          test -s "$STONE_REVIEW_ROOT/stone-form-runtime-v31.js"
          node --check "$STONE_REVIEW_ROOT/stone-form-geometry-v31.js"
          node --check "$STONE_REVIEW_ROOT/stone-form-runtime-v31.js"

      - name: Upload current Brick Mother development source
        uses: actions/upload-artifact@v4
        with:
          name: brick-mother-current-source-${{ github.sha }}
          path: |
            ${{ env.BRICK_ROOT }}
            ${{ env.STONE_REVIEW_ROOT }}
            .github/workflows/brick-mother-pages-preview.yml
            .github/workflows/brick-mother-stone-form-v32-materialize-review.yml
          compression-level: 1
          if-no-files-found: error
          retention-days: 3
