name: Tiles Microscope 08B verification
on:
  push:
    branches: [feature/tiles-mother-r2-closeout-08a-micro-tune]
    paths:
      - .github/workflows/tiles-microscope-08b.yml
      - tiles-mother/r2-closeout-08b-microscope/**
permissions:
  contents: write
concurrency:
  group: tiles-microscope-08b
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            tiles-mother/r2-closeout-07-detail
            tiles-mother/r2-closeout-08a-micro-tune
            tiles-mother/r2-closeout-08b-microscope
      - name: Preserve exact input bytes and build when integration is present
        shell: bash
        run: |
          mkdir -p tiles-qa-artifact
          cp tiles-mother/r2-closeout-07-detail/START_HERE.html tiles-qa-artifact/base07.html
          cp tiles-mother/r2-closeout-08a-micro-tune/START_HERE.html tiles-qa-artifact/loader08a.html
          if test -f tiles-mother/r2-closeout-08b-microscope/build.py; then
            python tiles-mother/r2-closeout-08b-microscope/build.py
            cp tiles-mother/r2-closeout-08b-microscope/START_HERE.html tiles-qa-artifact/
            cp tiles-mother/r2-closeout-08b-microscope/BUILD_QA.json tiles-qa-artifact/
          fi
      - name: Install browser QA dependencies
        if: hashFiles('tiles-mother/r2-closeout-08b-microscope/qa_browser.py') != ''
        run: |
          python -m pip install playwright Pillow
          python -m playwright install --with-deps chromium
      - name: Browser-check candidate before publishing
        if: hashFiles('tiles-mother/r2-closeout-08b-microscope/qa_browser.py') != ''
        run: python tiles-mother/r2-closeout-08b-microscope/qa_browser.py --local --output tiles-qa-artifact/local
      - name: Commit the assembled page on the same feature branch only
        if: hashFiles('tiles-mother/r2-closeout-08b-microscope/qa_browser.py') != ''
        shell: bash
        run: |
          set -eu
          test "$GITHUB_REF_NAME" = 'feature/tiles-mother-r2-closeout-08a-micro-tune'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tiles-mother/r2-closeout-08b-microscope/START_HERE.html tiles-mother/r2-closeout-08b-microscope/BUILD_QA.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(tiles): assemble verified 08B Microscope PBR into existing workbench'
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
          echo "PAGE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Open exact public version in browser
        if: hashFiles('tiles-mother/r2-closeout-08b-microscope/qa_browser.py') != ''
        run: python tiles-mother/r2-closeout-08b-microscope/qa_browser.py --public "$PAGE_SHA" --output tiles-qa-artifact/public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiles-microscope-08b-${{ github.run_id }}
          path: tiles-qa-artifact
          retention-days: 14
