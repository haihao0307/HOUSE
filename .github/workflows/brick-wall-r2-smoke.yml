name: Brick Wall R2 Smoke

on:
  push:
    branches:
      - codex/brick-r2143-continuous-surface-20260914

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser QA
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Verify frozen-brick wall R2
        shell: bash
        run: |
          cat > /tmp/qa.py <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image
          URL='https://rawcdn.githack.com/haihao0307/HOUSE/d465e710a6a4c11626068416fb2f633fc402f4c9/yunnan-courtyard-architecture-factory-v5.2.1-full-local/yunnan-courtyard-architecture-factory-v5.2.1-full-local/brick-mother/experiments/wall-lab-r2/Brick_Wall_Plaster_Workbench_R2.html'
          errors=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist'])
              ctx=browser.new_context(viewport={'width':1440,'height':900},device_scale_factor=1,user_agent='Brick-Wall-R2-QA')
              ctx.add_cookies([{'name':'__Http-phish','value':'1','url':'https://rawcdn.githack.com/','secure':True,'httpOnly':True,'sameSite':'Lax'}])
              page=ctx.new_page(); page.set_default_timeout(120000)
              page.on('pageerror',lambda e: errors.append('pageerror:'+str(e)))
              page.on('console',lambda m: errors.append('console:'+m.text) if m.type=='error' else None)
              resp=page.goto(URL,wait_until='networkidle',timeout=120000)
              assert resp and resp.ok
              page.wait_for_function("document.querySelector('#c')?.dataset.ready==='true'",timeout=120000)
              page.wait_for_timeout(1500)
              print('STATUS',page.locator('#status').inner_text())
              assert not errors, errors
              page.screenshot(path='/tmp/wall-r2-front.png',full_page=True,timeout=120000)
              page.locator('#side').click(); page.wait_for_timeout(900)
              page.screenshot(path='/tmp/wall-r2-side.png',full_page=True,timeout=120000)
              page.locator('#plaster').click(); page.wait_for_timeout(500); page.locator('#plaster').click(); page.locator('#regen').click(); page.wait_for_timeout(800)
              assert not errors, errors
              for fn in ['/tmp/wall-r2-front.png','/tmp/wall-r2-side.png']:
                  im=Image.open(fn).convert('RGB'); print(fn,im.size,im.getextrema()); assert im.size==(1440,900)
              browser.close()
          PY
          python /tmp/qa.py
      - name: Upload QA frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-wall-r2-qa
          path: /tmp/wall-r2-*.png
          if-no-files-found: ignore
